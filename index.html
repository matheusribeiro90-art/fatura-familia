<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fatura Família - Master</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fatura-familia';

        const { useState, useEffect, useMemo, Component } = React;
        let app, auth, db;

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return <div className="p-8 text-center mt-20 fade-in"><i data-lucide="alert-triangle" className="w-12 h-12 text-red-500 mx-auto mb-4"></i><h2 className="font-bold">Ops! Erro de tela.</h2><button onClick={() => window.location.reload()} className="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">Recarregar</button></div>;
                return this.props.children; 
            }
        }

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-3 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="text-[14px] font-black text-gray-800 uppercase">{title}</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-200/50 hover:bg-gray-200 rounded-lg text-gray-600"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-3 overflow-y-auto custom-scroll flex-1">{children}</div>
                    </div>
                </div>
            );
        };

        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(val) || 0);
        const generateCode = (len) => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let r = ''; for(let i=0;i<len;i++) r+=c.charAt(Math.floor(Math.random()*c.length)); return r; };
        const getCurrentMonthStr = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
        const safeExtractMonth = (dateString) => { if (!dateString) return ''; const match = dateString.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/); if (!match) return ''; let mStr = match[1]; if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`; return mStr; };
        const parseMonthStr = (str) => { if(!str || str === 'Todos') return new Date(9999, 11); const [m, y] = str.split('/'); return new Date(y, m - 1); };
        const normalizeString = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

        const parseCSV = (csvText) => {
            const lines = csvText.split('\n').filter(l => l.trim() !== ''); const results = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i]; let inQuotes = false; let currentVal = ""; const values = [];
                for (let char of line) { if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ""; } else currentVal += char; }
                values.push(currentVal.trim());
                if (values.length >= 4) {
                    const date = values[0]; const desc = values[1]; const amount = parseFloat(values[3].replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                    if (date && desc && !isNaN(amount)) results.push({ date, description: desc, amount });
                }
            } return results;
        };

        const readPDFContent = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result); const pdf = await pdfjsLib.getDocument(typedarray).promise; let transactions = [];
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i); const textContent = await page.getTextContent(); let lines = [];
                            textContent.items.forEach(item => {
                                const y = Math.round(item.transform[5]); const x = Math.round(item.transform[4]); const str = item.str.trim(); if(!str) return;
                                let foundLine = lines.find(l => Math.abs(l.y - y) <= 5);
                                if(foundLine) foundLine.items.push({x, str}); else lines.push({y, items: [{x, str}]});
                            });
                            lines.sort((a,b) => b.y - a.y);
                            lines.forEach(line => {
                                line.items.sort((a,b) => a.x - b.x); const fullString = line.items.map(it => it.str).join(' ');
                                const dateMatch = fullString.match(/^(\d{2}\s+(?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)|\d{2}\/\d{2})/i);
                                if(dateMatch) {
                                    const dateStr = dateMatch[1]; const valueMatch = fullString.match(/(?:R\$)?\s*(-?\d{1,3}(?:\.\d{3})*,\d{2})$/);
                                    if(valueMatch) {
                                        const amount = parseFloat(valueMatch[1].replace(/\./g, '').replace(',', '.'));
                                        const desc = fullString.substring(dateMatch[0].length, fullString.length - valueMatch[0].length).trim();
                                        let finalDate = dateStr;
                                        if(/[a-z]/i.test(dateStr)) {
                                            const months = {'jan':'01','fev':'02','mar':'03','abr':'04','mai':'05','jun':'06','jul':'07','ago':'08','set':'09','out':'10','nov':'11','dez':'12'};
                                            const parts = dateStr.split(' '); finalDate = `${parts[0]}/${months[parts[1].toLowerCase()] || '01'}`;
                                        }
                                        transactions.push({ date: finalDate, description: desc, amount });
                                    }
                                }
                            });
                        } resolve(transactions);
                    } catch(e) { reject(e); }
                }; reader.readAsArrayBuffer(file);
            });
        };

        const MemberDashboard = ({ group, memberId, onLogout }) => {
            const member = group.members?.find(m => m.id === memberId);
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const monthSummaries = useMemo(() => {
                if(!member) return []; const monthsData = {};
                (group.transactions || []).forEach(tx => {
                    const txMonth = safeExtractMonth(tx.date); if (!txMonth) return;
                    if (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId))) {
                        if (!monthsData[txMonth]) monthsData[txMonth] = { total: 0, paid: 0 };
                        monthsData[txMonth].total += tx.splits ? tx.splits.find(s=>s.memberId===memberId).amount : parseFloat(tx.amount || 0);
                    }
                });
                (group.payments || []).forEach(p => { if (p.memberId === memberId && monthsData[p.month]) monthsData[p.month].paid += parseFloat(p.amount || 0); });
                const currObj = parseMonthStr(getCurrentMonthStr());
                return Object.keys(monthsData).map(month => ({ month, rest: monthsData[month].total - monthsData[month].paid, dateObj: parseMonthStr(month) })).filter(m => !(m.dateObj < currObj && m.rest <= 0.05)).sort((a,b) => a.dateObj - b.dateObj);
            }, [group.transactions, group.payments, memberId]);
            useEffect(() => { lucide.createIcons(); });
            if (!member) return <div className="p-8 text-center font-bold text-gray-500">Familiar não encontrado.</div>;
            const monthTxs = (group.transactions || []).filter(tx => safeExtractMonth(tx.date) === selectedMonth && (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId)))).map(tx => ({ ...tx, displayAmount: tx.splits ? tx.splits.find(s => s.memberId === memberId).amount : parseFloat(tx.amount || 0) })).sort((a,b) => { const aLoan = a.bank === 'Empréstimo' || a.type === 'loan'; const bLoan = b.bank === 'Empréstimo' || b.type === 'loan'; if(aLoan && !bLoan) return -1; if(!aLoan && bLoan) return 1; return 0; });
            const { cardTotal, loanTotal } = monthTxs.reduce((acc, tx) => { if (tx.bank === 'Empréstimo' || tx.type === 'loan') acc.loanTotal += tx.displayAmount; else acc.cardTotal += tx.displayAmount; return acc; }, {cardTotal: 0, loanTotal: 0});
            const myPaidCard = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type !== 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            const myPaidLoan = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type === 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            const grandTotalRest = (cardTotal - myPaidCard) + (loanTotal - myPaidLoan);

            return (
                <div className="pb-16 min-h-screen bg-gray-50 fade-in w-full overflow-x-hidden">
                    <div className="bg-gray-900 pt-6 pb-5 rounded-b-[2rem] shadow-xl text-white px-5">
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-black text-lg">{member.name.charAt(0)}</div><div><h1 className="font-black text-[15px]">{member.name}</h1></div></div>
                            <button onClick={onLogout} className="text-gray-400 hover:text-white bg-white/10 p-2 rounded-xl"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                        </div>
                        <div className="mb-2">
                            <p className="text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-1">Total a Pagar ({selectedMonth})</p>
                            <div className={`text-4xl font-black tracking-tight ${grandTotalRest <= 0 ? 'text-green-400' : 'text-white'}`}>{formatMoney(grandTotalRest)}</div>
                            <div className="flex gap-4 mt-4 pt-3 border-t border-gray-700/50">
                                <div className="flex-1"><p className="text-[9px] text-gray-400 uppercase font-bold mb-0.5">💳 Cartões</p><p className="text-[12px] font-bold text-white">{formatMoney(cardTotal - myPaidCard)}</p></div>
                                <div className="flex-1 border-l border-gray-700 pl-4"><p className="text-[9px] text-gray-400 uppercase font-bold mb-0.5">🏦 Empréstimos</p><p className="text-[12px] font-bold text-white">{formatMoney(loanTotal - myPaidLoan)}</p></div>
                            </div>
                        </div>
                    </div>
                    {monthSummaries.length > 0 && (
                        <div className="mt-5 w-full">
                            <div className="flex gap-2 overflow-x-auto hide-scroll pb-2 px-5">
                                {monthSummaries.map(({ month, rest }) => (
                                    <button key={month} onClick={() => setSelectedMonth(month)} className={`flex flex-col items-center justify-center p-2 rounded-2xl shrink-0 border transition-all w-[72px] shadow-sm ${selectedMonth === month ? 'bg-indigo-600 border-indigo-500 text-white transform scale-105' : 'bg-white border-gray-200 text-gray-600'}`}>
                                        <span className={`text-[9px] font-black uppercase mb-1 ${selectedMonth === month ? 'text-indigo-200' : 'text-gray-400'}`}>{month}</span>
                                        <span className={`font-black text-[10px] truncate w-full ${rest <= 0 ? 'text-green-500' : ''}`}>{formatMoney(rest)}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="px-3 mt-4 space-y-2">
                        {monthTxs.length === 0 ? <p className="text-center text-gray-400 text-[11px] py-6 bg-white rounded-2xl border border-dashed">Nenhuma cobrança registrada neste mês.</p> : monthTxs.map(tx => {
                            const isLoan = tx.bank === 'Empréstimo' || tx.type === 'loan'; const safeDateDisplay = tx.date ? tx.date.substring(0,2) : '--';
                            return (
                                <div key={tx.id} className={`bg-white p-2.5 rounded-xl shadow-sm border flex justify-between items-center ${isLoan ? 'border-gray-800 border-l-4' : 'border-gray-200 border-l-4 border-l-indigo-400'}`}>
                                    <div className="flex gap-2.5 items-center truncate pr-2">
                                        <div className={`w-9 h-9 rounded-lg flex flex-col items-center justify-center shrink-0 border ${isLoan ? 'bg-gray-100 border-gray-300' : 'bg-indigo-50 border-indigo-100'}`}><span className={`text-[7px] font-bold uppercase leading-none mb-0.5 ${isLoan ? 'text-gray-500' : 'text-indigo-400'}`}>Dia</span><span className={`text-[12px] font-black leading-none ${isLoan ? 'text-gray-900' : 'text-indigo-900'}`}>{safeDateDisplay}</span></div>
                                        <div className="truncate"><p className="font-bold text-[11px] text-gray-900 truncate">{tx.description || 'Sem descrição'}</p><div className="flex gap-1 mt-0.5">{isLoan ? <span className="text-[8px] font-bold px-1.5 py-0.5 rounded bg-gray-800 text-white uppercase">🏦 Empréstimo</span> : <span className="text-[8px] font-bold px-1.5 py-0.5 rounded border bg-gray-50 text-gray-500 uppercase">{tx.bank || 'Cartão'}</span>}</div></div>
                                    </div>
                                    <div className="font-black text-[12px] shrink-0 text-gray-900">{formatMoney(tx.displayAmount)}</div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ group, updateGroupData }) => {
            const [activeTab, setActiveTab] = useState('transactions');
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const [banks, setBanks] = useState(group.banks || [{name: 'Nubank', color: 'purple'}, {name: 'Inter', color: 'orange'}]);
            
            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            const [importPreview, setImportPreview] = useState([]);
            const [selectedBank, setSelectedBank] = useState(banks[0]?.name || 'Cartão');
            const [replaceBank, setReplaceBank] = useState(false);

            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            
            const [bulkSelection, setBulkSelection] = useState([]);
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [paymentModal, setPaymentModal] = useState({ open: false, memberId: null, type: 'cartao', amount: '' });
            
            const [newMemberName, setNewMemberName] = useState('');
            const [newBankName, setNewBankName] = useState('');
            
            // O CAMPO MÁGICO PARA O CÓDIGO DO IRMÃO
            const [rescueCodeInput, setRescueCodeInput] = useState('');

            useEffect(() => { if (group && !group.shortCode) updateGroupData({ shortCode: generateCode(6) }); }, [group?.shortCode]);

            const availableMonths = useMemo(() => {
                const mSet = new Set(); (group.transactions || []).forEach(tx => { const m = safeExtractMonth(tx.date); if(m) mSet.add(m); });
                mSet.add(getCurrentMonthStr());
                return ['Todos', ...Array.from(mSet).sort((a,b) => parseMonthStr(a) - parseMonthStr(b))];
            }, [group.transactions]);

            const { cardTxs, loanTxs } = useMemo(() => {
                const c = []; const l = [];
                (group.transactions || []).forEach(tx => {
                    const m = safeExtractMonth(tx.date);
                    if (selectedMonth === 'Todos' || m === selectedMonth) {
                        if (tx.bank === 'Empréstimo' || tx.type === 'loan') l.push(tx); else c.push(tx);
                    }
                }); return { cardTxs: c, loanTxs: l };
            }, [group.transactions, selectedMonth]);

            useEffect(() => { lucide.createIcons(); });

            const handleFileUpload = async (e) => {
                const file = e.target.files[0]; if(!file) return;
                let txs = [];
                if(file.name.toLowerCase().endsWith('.pdf')) txs = await readPDFContent(file);
                else if(file.name.toLowerCase().endsWith('.csv')) txs = parseCSV(await file.text());
                
                const currentTxs = group.transactions || [];
                const marked = txs.map(tx => {
                    const normDesc = normalizeString(tx.description); const normVal = parseFloat(tx.amount).toFixed(2);
                    const isDup = currentTxs.some(ctx => normalizeString(ctx.description) === normDesc && parseFloat(ctx.amount).toFixed(2) === normVal);
                    let forward = []; const instMatch = tx.description.match(/(\d+)\/(\d+)/);
                    if(instMatch) {
                        const cur = parseInt(instMatch[1]); const tot = parseInt(instMatch[2]);
                        if(cur < tot) {
                            const dateParts = tx.date.split('/');
                            for(let i=1; i<=(tot-cur); i++) {
                                let newM = parseInt(dateParts[1]) + i; let newY = new Date().getFullYear();
                                if(newM > 12) { newM -= 12; newY++; }
                                forward.push({ id: crypto.randomUUID(), date: `${dateParts[0]}/${String(newM).padStart(2,'0')}/${newY}`, description: tx.description.replace(`${cur}/${tot}`, `${cur+i}/${tot}`), amount: tx.amount, bank: selectedBank, isFuture: true });
                            }
                        }
                    } return { ...tx, id: crypto.randomUUID(), selected: !isDup, isDup, forward };
                });
                setImportPreview(marked); setIsImportModalOpen(true); e.target.value = null;
            };

            const confirmImport = async () => {
                const toAdd = [];
                importPreview.forEach(tx => { if(tx.selected) { toAdd.push({ id: tx.id, date: tx.date, description: tx.description, amount: tx.amount, bank: selectedBank }); if(tx.forward) tx.forward.forEach(f => toAdd.push(f)); } });
                let updated = [...(group.transactions || [])];
                if(replaceBank) {
                    const selObj = parseMonthStr(selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth);
                    updated = updated.filter(tx => { if(tx.bank !== selectedBank) return true; return parseMonthStr(safeExtractMonth(tx.date)) < selObj; });
                }
                await updateGroupData({ transactions: [...updated, ...toAdd] }); setIsImportModalOpen(false);
            };

            const saveEdit = async () => {
                const assignedTo = assignSelections.length === 1 ? assignSelections[0] : null;
                const up = group.transactions.map(t => t.id === assignTx.id ? { ...t, date: assignTx.date, description: assignTx.description, amount: parseFloat(assignTx.amount), assignedTo } : t);
                await updateGroupData({ transactions: up }); setAssignTx(null);
            };

            const handleBulkDelete = async () => {
                if(!window.confirm(`Excluir ${bulkSelection.length} itens?`)) return;
                await updateGroupData({ transactions: group.transactions.filter(t => !bulkSelection.includes(t.id)) });
                setBulkSelection([]); setIsBulkMode(false);
            };

            const handleRollover = async (memberId, amount) => {
                if(!window.confirm(`Zerar e jogar R$ ${amount} pro próximo mês?`)) return;
                const paym = { id: crypto.randomUUID(), memberId, amount, type: 'cartao', month: selectedMonth, date: new Date().toLocaleDateString('pt-BR') };
                const currMObj = parseMonthStr(selectedMonth); let nextM = currMObj.getMonth() + 2; let nextY = currMObj.getFullYear();
                if(nextM > 12) { nextM -= 12; nextY++; }
                const loan = { id: crypto.randomUUID(), date: `01/${String(nextM).padStart(2,'0')}/${nextY}`, description: `Rolagem ${selectedMonth}`, amount, assignedTo: memberId, bank: 'Empréstimo', type: 'loan' };
                await updateGroupData({ payments: [...(group.payments || []), paym], transactions: [...(group.transactions || []), loan] });
            };

            // A CHAVE MESTRA: O RESGATE PELO CÓDIGO
            const handleExactRescue = async () => {
                const code = rescueCodeInput.trim().toUpperCase();
                if(!code) return alert("Digite o código primeiro!");
                
                try {
                    // O código dos seus irmãos É o nome da pasta antiga! Vamos direto nela.
                    const caminhos = ['fatura-familia', 'default-app-id'];
                    let oldData = null;
                    
                    for(const caminho of caminhos) {
                        const oldDocRef = window.firebaseModules.doc(db, 'artifacts', caminho, 'public', 'data', 'groups', code);
                        const oldSnap = await window.firebaseModules.getDoc(oldDocRef);
                        if(oldSnap.exists()) {
                            oldData = oldSnap.data();
                            break; // Achou! Para de procurar.
                        }
                    }

                    if(oldData) {
                        const numCompras = oldData.transactions?.length || 0;
                        if(window.confirm(`🎉 ACHAMOS O SEU COFRE! 🎉\n\nEssa conta tem ${numCompras} compras e seus irmãos cadastrados.\nPodemos copiar tudo para cá agora?`)) {
                            await updateGroupData({
                                members: oldData.members || [],
                                transactions: oldData.transactions || [],
                                payments: oldData.payments || [],
                                banks: oldData.banks || [{name:'Nubank', color:'purple'}, {name:'Inter', color:'orange'}]
                            });
                            alert("SUCESSO! Os dados foram restaurados! Vá na aba Extrato e mude a fatura para 'Todos' para ver tudo.");
                            setRescueCodeInput('');
                        }
                    } else {
                        alert(`Não encontramos nenhuma conta com o código "${code}". Certeza que está digitado certo? (Cuidado com espaços)`);
                    }
                } catch(e) {
                    alert("Erro ao buscar: " + e.message);
                }
            };

            const totals = {}; group.members?.forEach(m => totals[m.id] = { card:0, loan:0, pCard:0, pLoan:0 });
            (group.transactions || []).forEach(t => { const m = safeExtractMonth(t.date); if(selectedMonth === 'Todos' || m === selectedMonth) { const isL = t.bank === 'Empréstimo' || t.type === 'loan'; const key = isL ? 'loan' : 'card'; if(t.assignedTo && totals[t.assignedTo]) totals[t.assignedTo][key] += parseFloat(t.amount||0); } });
            (group.payments || []).forEach(p => { if(selectedMonth === 'Todos' || p.month === selectedMonth) { if(totals[p.memberId]) { if(p.type === 'emprestimo') totals[p.memberId].pLoan += parseFloat(p.amount||0); else totals[p.memberId].pCard += parseFloat(p.amount||0); } } });

            return (
                <div className="w-full max-w-lg mx-auto fade-in pb-20 overflow-x-hidden">
                    <div className="bg-gray-900 rounded-b-3xl p-4 text-white mb-4 shadow-xl mx-2 mt-2">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-black flex items-center gap-2"><i data-lucide="crown" className="text-yellow-400 w-5 h-5"></i> Admin</h1>
                            <div className="bg-white/10 px-3 py-1 rounded-lg text-center backdrop-blur-sm">
                                <p className="text-[9px] uppercase tracking-wider font-bold text-gray-400">Código</p>
                                <div className="text-sm font-mono font-black">{group.shortCode || 'GERANDO'}</div>
                            </div>
                        </div>
                        <div className="bg-gray-800 p-2 rounded-xl flex items-center justify-between border border-gray-700">
                            <span className="text-xs font-bold text-gray-300 ml-1">Fatura:</span>
                            <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-gray-900 text-white font-bold rounded-lg px-3 py-1 text-xs border border-gray-700 outline-none">
                                {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="flex px-2 space-x-2 mb-4 overflow-x-auto hide-scroll text-[11px] w-full">
                        <button onClick={()=>setActiveTab('transactions')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='transactions' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600'}`}>Extrato</button>
                        <button onClick={()=>setActiveTab('summary')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='summary' ? 'bg-green-600 text-white' : 'bg-white text-gray-600'}`}>Resumo</button>
                        <button onClick={()=>setActiveTab('loans')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='loans' ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}`}>Empréstimos</button>
                        <button onClick={()=>setActiveTab('config')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='config' ? 'bg-purple-600 text-white' : 'bg-white text-gray-600'}`}>Config</button>
                    </div>

                    <div className="px-2 w-full">
                        {activeTab === 'transactions' && (
                            <div className="space-y-4">
                                <div className="glass-card p-4 rounded-2xl flex justify-between items-center gap-2">
                                    <div className="flex-1">
                                        <h3 className="text-[10px] font-bold text-gray-500 uppercase">Importar</h3>
                                        <select value={selectedBank} onChange={e=>setSelectedBank(e.target.value)} className="text-[11px] font-bold p-1.5 bg-gray-100 rounded mt-1 outline-none w-full border">
                                            {banks.map(b => <option key={b.name} value={b.name}>{b.name}</option>)}
                                        </select>
                                    </div>
                                    <label className="bg-indigo-600 text-white p-3 rounded-xl cursor-pointer shadow-md shrink-0">
                                        <i data-lucide="upload" className="w-5 h-5"></i>
                                        <input type="file" className="hidden" accept=".pdf,.csv" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                <div className="flex justify-between items-center px-1">
                                    <h3 className="font-bold text-gray-700 text-[12px]">Lançamentos</h3>
                                    {isBulkMode ? <button onClick={handleBulkDelete} className="bg-red-500 text-white px-3 py-1 rounded text-[10px] font-bold shadow">Apagar ({bulkSelection.length})</button> : <button onClick={()=>setIsBulkMode(true)} className="bg-gray-200 text-gray-700 px-3 py-1 rounded text-[10px] font-bold">Sel. Vários</button>}
                                </div>
                                <div className="space-y-1.5">
                                    {cardTxs.map(t => (
                                        <div key={t.id} className="bg-white p-2.5 rounded-xl shadow-sm border flex items-center gap-2">
                                            {isBulkMode && <input type="checkbox" checked={bulkSelection.includes(t.id)} onChange={(e)=>{ if(e.target.checked) setBulkSelection([...bulkSelection, t.id]); else setBulkSelection(bulkSelection.filter(id=>id!==t.id)); }} className="w-4 h-4 rounded border-gray-300 shrink-0" />}
                                            <div className="flex-1 flex justify-between items-center overflow-hidden" onClick={() => { if(!isBulkMode) { setAssignTx({...t}); setAssignSelections(t.assignedTo ? [t.assignedTo] : []); }}}>
                                                <div className="truncate pr-2">
                                                    <p className="font-bold text-[11px] text-gray-900 truncate">{t.description}</p>
                                                    <p className="text-[9px] text-gray-500">{t.date} • {t.bank} {t.assignedTo ? `• ${group.members?.find(m=>m.id===t.assignedTo)?.name}` : ''}</p>
                                                </div>
                                                <div className="font-black text-[12px] shrink-0">{formatMoney(t.amount)}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'summary' && (
                            <div className="space-y-4">
                                {group.members?.map(m => {
                                    const mt = totals[m.id]; const cRest = mt.card - mt.pCard; const lRest = mt.loan - mt.pLoan; const tRest = cRest + lRest;
                                    return (
                                        <div key={m.id} className="bg-white p-3 rounded-2xl shadow-sm border">
                                            <div className="flex justify-between border-b pb-2 mb-2"><span className="font-black text-[13px]">{m.name}</span><span className={`font-black text-[14px] ${tRest<=0 ? 'text-green-500':'text-gray-900'}`}>{formatMoney(tRest)}</span></div>
                                            <div className="grid grid-cols-2 gap-2 mb-3">
                                                <div className="bg-indigo-50 p-2 rounded-xl"><p className="text-[9px] text-indigo-700 font-bold">💳 Cartão</p><p className="text-[12px] font-black">{formatMoney(cRest)}</p></div>
                                                <div className="bg-gray-50 p-2 rounded-xl"><p className="text-[9px] text-gray-600 font-bold">🏦 Empréstimo</p><p className="text-[12px] font-black">{formatMoney(lRest)}</p></div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>setPaymentModal({open:true, memberId:m.id, type:'cartao', amount: cRest > 0 ? cRest.toFixed(2) : ''})} className="flex-1 bg-green-50 text-green-700 py-2 rounded-lg text-[10px] font-bold border border-green-200">Receber</button>
                                                <button onClick={()=>handleRollover(m.id, tRest)} className="flex-1 bg-orange-50 text-orange-700 py-2 rounded-lg text-[10px] font-bold border border-orange-200">Jogar p/ Frente</button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        
                        {activeTab === 'config' && (
                            <div className="space-y-4">
                                <div className="glass-card p-4 rounded-xl border border-gray-200">
                                    <h3 className="font-bold text-[12px] mb-2 text-gray-800">Membros</h3>
                                    <form onSubmit={async (e)=>{e.preventDefault(); if(newMemberName) { await updateGroupData({members: [...(group.members||[]), {id:crypto.randomUUID(), name:newMemberName}]}); setNewMemberName(''); }}} className="flex gap-2 mb-3">
                                        <input value={newMemberName} onChange={e=>setNewMemberName(e.target.value)} placeholder="Nome" className="flex-1 border p-2 rounded-lg text-[11px] outline-none" />
                                        <button className="bg-indigo-600 text-white px-4 rounded-lg text-[11px] font-bold">Add</button>
                                    </form>
                                    <div className="flex flex-wrap gap-2">
                                        {group.members?.map(m => (
                                            <div key={m.id} className="bg-gray-50 px-3 py-1.5 rounded-lg border flex items-center gap-2"><span className="text-[11px] font-bold">{m.name}</span><button onClick={()=>window.confirm('Excluir?') && updateGroupData({members: group.members.filter(x=>x.id!==m.id)})} className="text-red-500"><i data-lucide="x" className="w-3 h-3"></i></button></div>
                                        ))}
                                    </div>
                                </div>
                                
                                {/* A FERRAMENTA DE RESGATE POR CÓDIGO */}
                                <div className="glass-card p-4 rounded-xl border-2 border-green-500 bg-green-50 shadow-sm text-center">
                                    <h3 className="font-black text-[13px] mb-1 text-green-800"><i data-lucide="key" className="inline w-4 h-4 mb-0.5"></i> Resgate por Código Antigo</h3>
                                    <p className="text-[10px] text-green-700 mb-3 font-bold leading-tight">Você sabe o código que o Leandro usava para acessar a fatura? Digite ele aqui para puxar todos os seus dados e extratos direto da fonte.</p>
                                    
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Ex: A4F8B2" 
                                            value={rescueCodeInput}
                                            onChange={e => setRescueCodeInput(e.target.value)}
                                            className="w-full text-center font-mono font-black text-sm uppercase p-3 rounded-xl border border-green-300 outline-none shadow-inner bg-white"
                                        />
                                    </div>
                                    <button onClick={handleExactRescue} className="w-full mt-2 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl text-[12px] font-black shadow-md">
                                        RESTAURAR MEUS DADOS
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <Modal isOpen={isImportModalOpen} onClose={()=>setIsImportModalOpen(false)} title="Analisar Fatura">
                        <div className="space-y-3">
                            <div className="bg-red-50 border border-red-200 p-2 rounded-lg">
                                <label className="flex items-center gap-2 text-[10px] font-bold text-red-700 cursor-pointer">
                                    <input type="checkbox" checked={replaceBank} onChange={e=>setReplaceBank(e.target.checked)} className="rounded" /> Substituir {selectedBank} no mês atual.
                                </label>
                            </div>
                            <div className="max-h-60 overflow-y-auto space-y-1">
                                {importPreview.map(t => (
                                    <div key={t.id} className="flex items-center gap-2 bg-gray-50 p-1.5 rounded border text-[10px]">
                                        <input type="checkbox" checked={t.selected} onChange={e=>{const n=[...importPreview]; n.find(x=>x.id===t.id).selected=e.target.checked; setImportPreview(n);}} className="shrink-0" />
                                        <span className="w-10 text-gray-500 shrink-0">{t.date}</span>
                                        <span className="flex-1 truncate font-bold">{t.description}</span>
                                        <span className="font-black shrink-0">{formatMoney(t.amount)}</span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={confirmImport} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-bold text-[12px]">Salvar Extrato</button>
                        </div>
                    </Modal>

                    <Modal isOpen={!!assignTx} onClose={()=>setAssignTx(null)} title="Editar Compra">
                        {assignTx && (
                            <div className="space-y-3">
                                <div className="flex gap-2"><button onClick={()=>{window.confirm("Excluir?") && updateGroupData({transactions: group.transactions.filter(t => t.id !== assignTx.id)}); setAssignTx(null);}} className="bg-red-50 text-red-600 px-3 py-2 rounded-lg text-[10px] font-bold border">Excluir</button><button onClick={saveEdit} className="flex-1 bg-indigo-600 text-white py-2 rounded-lg text-[11px] font-bold">Salvar</button></div>
                                <div className="flex gap-2"><input value={assignTx.date} onChange={e=>setAssignTx({...assignTx, date:e.target.value})} className="w-1/3 border p-2 rounded text-[11px]" /><input value={assignTx.amount} type="number" onChange={e=>setAssignTx({...assignTx, amount:e.target.value})} className="w-2/3 border p-2 rounded text-[11px] text-right font-black" /></div>
                                <input value={assignTx.description} onChange={e=>setAssignTx({...assignTx, description:e.target.value})} className="w-full border p-2 rounded text-[11px]" />
                                <div className="flex flex-wrap gap-1.5 mt-2">
                                    {group.members?.map(m => (
                                        <div key={m.id} onClick={()=>setAssignSelections(assignSelections.includes(m.id)?[]:[m.id])} className={`px-3 py-1.5 border rounded text-[10px] font-bold cursor-pointer ${assignSelections.includes(m.id) ? 'bg-indigo-100 border-indigo-500 text-indigo-800' : 'bg-white text-gray-500'}`}>{m.name}</div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </Modal>
                    <Modal isOpen={paymentModal.open} onClose={()=>setPaymentModal({...paymentModal, open:false})} title="Registrar Baixa">
                        <form onSubmit={async (e)=>{e.preventDefault(); const p={id:crypto.randomUUID(), memberId:paymentModal.memberId, amount:parseFloat(paymentModal.amount), type:paymentModal.type, month:selectedMonth, date:new Date().toLocaleDateString('pt-BR')}; await updateGroupData({payments:[...(group.payments||[]), p]}); setPaymentModal({...paymentModal, open:false});}} className="space-y-3">
                            <select value={paymentModal.type} onChange={e=>setPaymentModal({...paymentModal, type:e.target.value})} className="w-full border p-2 rounded-lg text-[11px] font-bold"><option value="cartao">Pagando Cartão</option><option value="emprestimo">Pagando Empréstimo</option></select>
                            <input type="number" step="0.01" value={paymentModal.amount} onChange={e=>setPaymentModal({...paymentModal, amount:e.target.value})} className="w-full border p-3 rounded-lg text-[16px] font-black text-center" placeholder="R$ 0,00" required />
                            <button className="w-full bg-green-600 text-white py-3 rounded-lg font-bold">Confirmar Pagamento</button>
                        </form>
                    </Modal>
                </div>
            );
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false); const [user, setUser] = useState(null); const [view, setView] = useState('landing');
            const [currentGroup, setCurrentGroup] = useState(null); const [currentMemberId, setCurrentMemberId] = useState(null);
            const [joinGroupCode, setJoinGroupCode] = useState(''); const [adminEmail, setAdminEmail] = useState(''); const [adminPass, setAdminPass] = useState('');

            useEffect(() => {
                const init = async () => {
                    if (window.firebaseModules) {
                        try {
                            app = window.firebaseModules.initializeApp(myFirebaseConfig); auth = window.firebaseModules.getAuth(app); db = window.firebaseModules.getFirestore(app);
                            window.firebaseModules.onAuthStateChanged(auth, async (u) => { 
                                setUser(u); 
                                if(u && !u.isAnonymous) {
                                    const fallbackRef = window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', u.uid);
                                    const fallbackSnap = await window.firebaseModules.getDoc(fallbackRef);
                                    if(fallbackSnap.exists()) { setCurrentGroup({id: fallbackSnap.id, ...fallbackSnap.data()}); setView('admin'); } 
                                    else { const newGroup = { id: u.uid, adminUid: u.uid, members: [], transactions: [], banks: [{name:'Nubank', color:'purple'}] }; await window.firebaseModules.setDoc(fallbackRef, newGroup); setCurrentGroup(newGroup); setView('admin'); }
                                }
                                setIsReady(true); 
                            });
                        } catch (e) { setIsReady(true); }
                    }
                }; init();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const docId = view === 'admin' ? user?.uid : currentGroup.id; if(!docId) return;
                const groupRef = window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', docId);
                const unsubscribe = window.firebaseModules.onSnapshot(groupRef, (docSnap) => { if (docSnap.exists()) setCurrentGroup({ id: docSnap.id, ...docSnap.data() }); });
                return () => unsubscribe();
            }, [currentGroup?.id, view, user]);

            const updateGroupData = async (updates) => {
                if (!db || !currentGroup) return;
                try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', currentGroup.id), updates); } catch (e) {}
            };

            const handleLoginAdmin = async (e) => {
                e.preventDefault();
                try {
                    const cred = await window.firebaseModules.signInWithEmailAndPassword(auth, adminEmail, adminPass);
                    const fallbackRef = window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', cred.user.uid);
                    const fallbackSnap = await window.firebaseModules.getDoc(fallbackRef);
                    if(fallbackSnap.exists()) { setCurrentGroup({id: fallbackSnap.id, ...fallbackSnap.data()}); setView('admin'); } 
                    else { const newGroup = { id: cred.user.uid, adminUid: cred.user.uid, members: [], transactions: [], banks: [{name:'Nubank', color:'purple'}] }; await window.firebaseModules.setDoc(fallbackRef, newGroup); setCurrentGroup(newGroup); setView('admin'); }
                } catch(err) {
                    if(window.confirm("Conta não encontrada ou senha incorreta. Deseja criar nova conta?")) {
                        try { const cred = await window.firebaseModules.createUserWithEmailAndPassword(auth, adminEmail, adminPass); const newGroup = { id: cred.user.uid, adminUid: cred.user.uid, members: [], transactions: [], banks: [{name:'Nubank', color:'purple'}] }; await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', cred.user.uid), newGroup); setCurrentGroup(newGroup); setView('admin'); } catch (ce) { alert(ce.message); }
                    }
                }
            };

            const handleLoginMember = async (e) => {
                e.preventDefault(); if (!db || !joinGroupCode.trim()) return;
                try {
                    const code = joinGroupCode.trim().toUpperCase();
                    let docSnap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', code));
                    if (!docSnap.exists()) docSnap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'artifacts', 'default-app-id', 'public', 'data', 'groups', code));
                    
                    if (docSnap.exists()) { setCurrentGroup({ id: docSnap.id, ...docSnap.data() }); setView('member-select'); } 
                    else { alert("Código não encontrado."); }
                } catch (e) { alert("Erro de acesso."); }
            };

            if (!isReady) return <div className="flex h-screen items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-gray-50 font-sans w-full overflow-x-hidden">
                        {view === 'landing' && (
                            <div className="w-full max-w-sm mx-auto pt-10 px-4 space-y-6 fade-in">
                                <div className="text-center space-y-2 mb-6"><h1 className="text-3xl font-black text-gray-900 tracking-tight">FaturaFamília</h1></div>
                                <div className="bg-white p-5 rounded-3xl border-t-4 border-t-indigo-500 shadow-sm">
                                    <h2 className="text-lg font-black text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="shield-check" className="w-5 h-5 text-indigo-600"></i> Dono</h2>
                                    <form onSubmit={handleLoginAdmin} className="space-y-3">
                                        <input type="email" placeholder="E-mail" className="w-full p-3 border rounded-xl bg-gray-50 outline-none text-sm font-bold" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} required />
                                        <input type="password" placeholder="Senha" className="w-full p-3 border rounded-xl bg-gray-50 outline-none text-sm font-bold" value={adminPass} onChange={e=>setAdminPass(e.target.value)} required />
                                        <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-md">Acessar</button>
                                    </form>
                                </div>
                                <div className="bg-white p-5 rounded-3xl border-t-4 border-t-gray-800 shadow-sm">
                                    <h2 className="text-lg font-black text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="users" className="w-5 h-5 text-gray-800"></i> Familiar</h2>
                                    <form onSubmit={handleLoginMember} className="space-y-3">
                                        <input type="text" placeholder="CÓDIGO" className="w-full p-3 border rounded-xl bg-gray-50 outline-none text-sm font-bold text-center tracking-widest uppercase" value={joinGroupCode} onChange={e=>setJoinGroupCode(e.target.value)} required />
                                        <button type="submit" className="w-full bg-gray-800 text-white py-3 rounded-xl font-bold shadow-md">Ver Minha Fatura</button>
                                    </form>
                                </div>
                            </div>
                        )}
                        
                        {view === 'member-select' && currentGroup && (
                            <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-6 fade-in">
                                <h2 className="text-white text-2xl font-black mb-10 tracking-tight">Quem é você?</h2>
                                <div className="flex flex-wrap justify-center gap-6 w-full max-w-sm">
                                    {currentGroup.members?.map(m => (
                                        <div key={m.id} onClick={() => { setCurrentMemberId(m.id); setView('member'); }} className="flex flex-col items-center cursor-pointer">
                                            <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-4xl font-black mb-3 shadow-xl">{m.name.charAt(0)}</div>
                                            <span className="text-gray-300 font-bold text-sm">{m.name}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => {setCurrentGroup(null); setView('landing');}} className="mt-16 text-gray-500 font-bold bg-gray-800 px-6 py-2 rounded-full">Voltar</button>
                            </div>
                        )}
                        
                        {view === 'admin' && currentGroup && (
                            <>
                                <nav className="bg-white border-b shadow-sm h-12 flex items-center px-4 justify-between sticky top-0 z-40">
                                    <span className="font-black text-indigo-700 text-[12px]"><i data-lucide="pie-chart" className="inline w-4 h-4"></i> FaturaFamília</span>
                                    <button onClick={()=>{window.firebaseModules.signOut(auth); setView('landing');}} className="text-[10px] font-bold text-gray-500">Sair</button>
                                </nav>
                                <AdminDashboard group={currentGroup} updateGroupData={updateGroupData} />
                            </>
                        )}
                        {view === 'member' && currentGroup && currentMemberId && <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={() => {setCurrentMemberId(null); setView('landing');}} />}
                    </div>
                </ErrorBoundary>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
