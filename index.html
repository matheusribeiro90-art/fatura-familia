    <script type="text/babel" data-type="module">

        const { useState, useEffect, useRef, useMemo } = React;

        // Utilitários
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        const generateCode = () => Math.random().toString(36).substring(2, 8).toUpperCase();
        
        // Icone Blindado (Previne tela branca)
        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => { if (spanRef.current && window.lucide) { spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`; window.lucide.createIcons({ root: spanRef.current }); } }, [name, className]);

        // Extrai "MM/YYYY" de uma data "DD/MM" ou "DD/MM/YYYY"
        const getMonthYear = (dateStr) => {
            if (!dateStr) return 'Desconhecido';
            const parts = dateStr.split('/');
            if (parts.length >= 2) return `${parts[1]}/${parts.length === 3 ? parts[2] : new Date().getFullYear()}`;
            return 'Desconhecido';
        };

        // Adiciona meses a uma data
        const addMonths = (dateStr, numMonths) => {
            const parts = dateStr.split('/');
            let month = parseInt(parts[1], 10) + numMonths;
            let year = parts.length === 3 ? parseInt(parts[2], 10) : new Date().getFullYear();
            while (month > 12) { month -= 12; year++; }
            const m = month.toString().padStart(2, '0');
            return `${parts[0]}/${m}/${year}`;
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b flex justify-between items-center bg-gray-50/80">
                            <h3 className="text-xl font-black text-gray-800">{title}</h3>
                            <button onClick={onClose} className="p-2 bg-gray-200/50 hover:bg-gray-200 rounded-full text-gray-600 transition-colors"><Icon name="x" className="w-5 h-5" /></button>
                        </div>
                        <div className="p-5 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD DO ADMIN ---
        const AdminDashboard = ({ group, updateGroupData, notify }) => {
            const [activeTab, setActiveTab] = useState('transactions'); // transactions, summary, reports
            const [selectedMonth, setSelectedMonth] = useState('Todos');
            
            // Controle de Modais
            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [pasteText, setPasteText] = useState('');
            const [parsedPreview, setParsedPreview] = useState(null);
            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            
            // Pagamentos
            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentData, setPaymentData] = useState({ memberId: '', amount: '' });

            // Prova Real
            const [bankTotal, setBankTotal] = useState('');

            // Filtro de meses (Ordenado do mais recente para o mais antigo)
            const availableMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => months.add(getMonthYear(tx.date)));
                return ['Todos', ...Array.from(months)].sort((a, b) => {
                    if(a === 'Todos') return -1; if(b === 'Todos') return 1;
                    const [mA, yA] = a.split('/'); const [mB, yB] = b.split('/');
                    return new Date(yB, mB - 1) - new Date(yA, mA - 1);
                });
            }, [group.transactions]);

            useEffect(() => { if (!availableMonths.includes(selectedMonth) && availableMonths.length > 0) setSelectedMonth(availableMonths[1] || 'Todos'); }, [availableMonths]);

            const filteredTransactions = useMemo(() => {
                if (selectedMonth === 'Todos') return group.transactions || [];
                return group.transactions?.filter(tx => getMonthYear(tx.date) === selectedMonth) || [];
            }, [group.transactions, selectedMonth]);

            // LEITOR DE PDF 
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                try {
                    notify("Lendo PDF... Aguarde.");
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        let lastY = -1;
                        for (let item of textContent.items) {
                            if (lastY !== item.transform[5] && lastY !== -1) fullText += '\n';
                            fullText += item.str + ' ';
                            lastY = item.transform[5];
                        }
                        fullText += '\n\n';
                    }
                    setPasteText(fullText);
                    notify("PDF lido com sucesso! Analisando os dados...");
                    
                    // Auto-analyze after a small delay so state updates
                    setTimeout(() => analyzeTextCore(fullText), 500);
                } catch (error) {
                    console.error(error);
                    notify("Erro no PDF (pode ter senha). Copie e cole o texto do app do banco.");
                }
                e.target.value = null;
            };

            // SUPER ANALISADOR UNIVERSAL (Nubank, Inter, MP)
            const analyzeTextCore = (textToAnalyze) => {
                let lines = textToAnalyze.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const newTransactions = [];
                const fullTextLower = textToAnalyze.toLowerCase();
                
                // Detecção de Banco
                let detectedBank = 'Outros';
                if (fullTextLower.includes('nubank') || fullTextLower.includes('กบ') || fullTextLower.includes('nu pagamentos')) detectedBank = 'Nubank';
                else if (fullTextLower.includes('banco inter') || fullTextLower.includes('inter')) detectedBank = 'Inter';
                else if (fullTextLower.includes('mercado pago') || fullTextLower.includes('mercadopago')) detectedBank = 'Mercado Pago';

                const normalizeDate = (raw) => {
                    const months = { jan: '01', fev: '02', mar: '03', abr: '04', mai: '05', jun: '06', jul: '07', ago: '08', set: '09', out: '10', nov: '11', dez: '12' };
                    let d = raw.toLowerCase().trim();
                    const inter = d.match(/^(\d{1,2})\s+de\s+([a-z]{3})\.?\s+(\d{4})$/); // Ex: 14 de jul. 2026
                    if (inter) return `${inter[1].padStart(2, '0')}/${months[inter[2]]}/${inter[3]}`;
                    const nu = d.match(/^(\d{1,2})\s+([a-z]{3})$/); // Ex: 03 SET
                    if (nu) return `${nu[1].padStart(2, '0')}/${months[nu[2]]}/${new Date().getFullYear()}`;
                    return raw.trim(); // Padrão DD/MM ou DD/MM/YYYY
                };

                const processMatch = (rawDate, rawDesc, rawVal) => {
                    const parsedDate = normalizeDate(rawDate);
                    let parsedDesc = rawDesc.replace(/^\d{4}\s+/, '').replace(/Π/g, '').replace(/กบ/g, '').trim(); 
                    
                    // Normaliza parcelas para o padrão X/Y
                    parsedDesc = parsedDesc.replace(/(?:-\s*)?\(?Parcela\s+(\d{1,2})\s+(?:de|\/)\s+(\d{1,2})\)?/i, '$1/$2');
                    
                    const amountStr = rawVal.replace(/\./g, '').replace(',', '.');
                    const parsedAmount = parseFloat(amountStr);
                    
                    if (isNaN(parsedAmount) || parsedAmount <= 0) return;
                    const descLower = parsedDesc.toLowerCase();
                    if (descLower.includes('pagamento recebido') || descLower.includes('juros') || descLower.includes('multa') || descLower.includes('iof') || descLower.includes('pagamento em')) return;

                    const isDuplicate = group.transactions?.some(tx => tx.date === parsedDate && tx.description === parsedDesc && tx.amount === parsedAmount);
                    
                    // Memória Histórica
                    let assignedTo = null, splits = null;
                    const baseDesc = parsedDesc.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                    const pastTx = group.transactions?.find(t => t.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDesc && (t.assignedTo || (t.splits && t.splits.length > 0)));
                    if (pastTx) { assignedTo = pastTx.assignedTo; splits = pastTx.splits ? [...pastTx.splits] : null; }

                    newTransactions.push({ 
                        id: crypto.randomUUID(), 
                        date: parsedDate, 
                        description: parsedDesc, 
                        amount: parsedAmount, 
                        assignedTo, splits, 
                        selected: !isDuplicate, 
                        isDuplicate, 
                        bank: detectedBank, 
                        isProjection: false 
                    });

                    // CÁLCULO DO FUTURO (PROJEÇÕES DE PARCELAS)
                    const instMatch = parsedDesc.match(/\b(\d{1,2})\/(\d{1,2})\b/);
                    if (instMatch && !isDuplicate) {
                        const currInst = parseInt(instMatch[1], 10);
                        const totInst = parseInt(instMatch[2], 10);
                        
                        if (totInst > currInst) {
                            for (let i = 1; i <= (totInst - currInst); i++) {
                                const nextInst = currInst + i;
                                const nextDate = addMonths(parsedDate, i);
                                const nextDesc = parsedDesc.replace(/\b\d{1,2}\/\d{1,2}\b/, `${nextInst}/${totInst}`);
                                
                                // Verifica se a projeção já não foi gerada antes
                                const projDupe = group.transactions?.some(tx => tx.date === nextDate && tx.description === nextDesc);
                                if(!projDupe) {
                                    newTransactions.push({
                                        id: crypto.randomUUID(),
                                        date: nextDate,
                                        description: nextDesc,
                                        amount: parsedAmount,
                                        assignedTo, splits,
                                        selected: true,
                                        isDuplicate: false,
                                        bank: detectedBank,
                                        isProjection: true // Flag importante
                                    });
                                }
                            }
                        }
                    }
                };

                // Lógica de Leitura Linha a Linha (Suporta Inter, MP, e Textos normais)
                let i = 0;
                while (i < lines.length) {
                    const line = lines[i];
                    // Formato Inter/MP (Tudo na mesma linha)
                    const matchSingle = line.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:de\s+)?[a-zA-Z]{3}\.?\s*(?:\d{4})?)\s+(.*?)\s+(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                    if (matchSingle) { processMatch(matchSingle[1], matchSingle[2], matchSingle[3]); i++; continue; }

                    // Formato Nubank (Quebrado em 3 linhas quando colado)
                    const dateOnly = /^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*)$/i;
                    if (dateOnly.test(line) && i + 1 < lines.length) {
                        const dateStr = line;
                        let descStr = lines[i+1];
                        let valStr = null, skip = 1;
                        
                        if (i + 2 < lines.length) {
                             const valMatch = lines[i+2].match(/^(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                             if (valMatch) { valStr = valMatch[1]; skip = 2; }
                        }
                        if (!valStr) {
                            const mixed = descStr.match(/(.*?)\s+(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                            if (mixed) { descStr = mixed[1]; valStr = mixed[2]; skip = 1; }
                        }
                        if (valStr) { processMatch(dateStr, descStr, valStr); i += (skip + 1); continue; }
                    }
                    i++;
                }

                if (newTransactions.length > 0) setParsedPreview(newTransactions);
                else notify("Não reconheci compras. O banco está diferente ou é um PDF com senha.");
            };

            const handleAnalyzeTextClick = () => analyzeTextCore(pasteText);

            const handleConfirmParse = async () => {
                const itemsToAdd = parsedPreview.filter(tx => tx.selected && !tx.isDuplicate).map(({ selected, isDuplicate, ...rest }) => rest);
                const updatedTransactions = [...(group.transactions || []), ...itemsToAdd];
                await updateGroupData({ transactions: updatedTransactions });
                notify(`${itemsToAdd.length} compras salvas (incluindo parcelas futuras)!`);
                setPasteText(''); setParsedPreview(null); setIsParseModalOpen(false);
            };

            const openAssign = (tx) => {
                setAssignTx(tx);
                setAssignSelections(tx.splits?.length > 0 ? tx.splits.map(s => s.memberId) : (tx.assignedTo ? [tx.assignedTo] : []));
                setIsAssignModalOpen(true);
            };

            const handleSaveAssign = async () => {
                let assignedTo = null, splits = null;
                if (assignSelections.length === 1) assignedTo = assignSelections[0];
                else if (assignSelections.length > 1) splits = assignSelections.map(memberId => ({ memberId, amount: assignTx.amount / assignSelections.length }));

                const baseDesc = assignTx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                const isInstallment = /\b\d{1,2}\/\d{1,2}\b/.test(assignTx.description);

                const updatedTransactions = group.transactions.map(tx => {
                    if (tx.id === assignTx.id) return { ...tx, assignedTo, splits };
                    // Efeito Cascata: Atualiza as parcelas futuras também!
                    if (isInstallment && tx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDesc && tx.amount === assignTx.amount) return { ...tx, assignedTo, splits };
                    return tx;
                });
                await updateGroupData({ transactions: updatedTransactions });
                setIsAssignModalOpen(false); notify("Dono atualizado para esta e parcelas futuras!");
            };

            const handleAddMember = async (e) => {
                e.preventDefault();
                const form = new FormData(e.target);
                const name = form.get('name').trim();
                if (!name) return;
                const newMember = { id: crypto.randomUUID(), name };
                await updateGroupData({ members: [...(group.members || []), newMember] });
                e.target.reset(); notify("Familiar adicionado!");
            };

            const handleDeleteTx = async (id) => {
                await updateGroupData({ transactions: group.transactions.filter(tx => tx.id !== id) });
            };

            const handleAddPayment = async (e) => {
                e.preventDefault();
                if (!paymentData.memberId || !paymentData.amount) return;
                const newPayment = { id: crypto.randomUUID(), memberId: paymentData.memberId, amount: parseFloat(paymentData.amount), month: selectedMonth, date: new Date().toLocaleDateString('pt-BR') };
                await updateGroupData({ payments: [...(group.payments || []), newPayment] });
                setIsPaymentModalOpen(false); setPaymentData({ memberId: '', amount: '' }); notify("Pagamento PIX registrado!");
            };

            // Cálculos
            const calculateTotals = () => {
                const totals = { unassigned: 0 }, paid = {};
                group.members?.forEach(m => { totals[m.id] = 0; paid[m.id] = 0; });
                
                filteredTransactions.forEach(tx => {
                    if (tx.splits && tx.splits.length > 0) {
                        let allocated = 0;
                        tx.splits.forEach(s => { if (totals[s.memberId] !== undefined) { totals[s.memberId] += s.amount; allocated += s.amount; } });
                        if (tx.amount - allocated > 0.02) totals.unassigned += (tx.amount - allocated);
                    } else if (tx.assignedTo && totals[tx.assignedTo] !== undefined) totals[tx.assignedTo] += tx.amount;
                    else totals.unassigned += tx.amount;
                });

                group.payments?.filter(p => p.month === selectedMonth || selectedMonth === 'Todos').forEach(p => { 
                    if (paid[p.memberId] !== undefined) paid[p.memberId] += p.amount; 
                });
                
                return { totals, paid, sumTotal: filteredTransactions.reduce((acc, curr) => acc + curr.amount, 0) };
            };

            const { totals, paid, sumTotal } = calculateTotals();

            // Lógica para aba Relatórios (Agrupamento por mês futuro e cartão)
            const getFutureProjections = () => {
                const projections = {};
                const now = new Date();
                const currentMonthStr = `${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getFullYear()}`;
                
                group.transactions?.forEach(tx => {
                    const txMonth = getMonthYear(tx.date);
                    // Pega meses futuros (simplificado pela string YYYY/MM para ordenação)
                    const [m, y] = txMonth.split('/');
                    const txSortable = `${y}${m}`;
                    const currSortable = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}`;
                    
                    if(txSortable >= currSortable) {
                        if(!projections[txMonth]) projections[txMonth] = { total: 0, byBank: {}, byPerson: {} };
                        projections[txMonth].total += tx.amount;
                        
                        const bank = tx.bank || 'Outros';
                        if(!projections[txMonth].byBank[bank]) projections[txMonth].byBank[bank] = 0;
                        projections[txMonth].byBank[bank] += tx.amount;
                        
                        const owner = tx.assignedTo ? (group.members?.find(mem => mem.id === tx.assignedTo)?.name || 'Desconhecido') : 'Sem Dono';
                        if(!projections[txMonth].byPerson[owner]) projections[txMonth].byPerson[owner] = 0;
                        projections[txMonth].byPerson[owner] += tx.amount;
                    }
                });
                
                // Ordena os meses
                return Object.entries(projections).sort((a,b) => {
                    const [mA, yA] = a[0].split('/'); const [mB, yB] = b[0].split('/');
                    return new Date(yA, mA - 1) - new Date(yB, mB - 1);
                });
            };

            const futureReports = getFutureProjections();

            return (
                <div className="pb-24">
                    {/* Header Admin */}
                    <div className="bg-indigo-600 p-6 rounded-b-[2rem] shadow-lg mb-6 text-white">
                        <div className="flex flex-col sm:flex-row justify-between items-center max-w-4xl mx-auto gap-4">
                            <div className="text-center sm:text-left">
                                <h1 className="text-2xl font-black">Painel do Administrador</h1>
                                <p className="text-indigo-200 text-sm mt-1">Gestão Completa da Família</p>
                            </div>
                            <div className="bg-white/20 px-6 py-3 rounded-2xl backdrop-blur-md border border-white/20 shadow-inner text-center">
                                <p className="text-xs uppercase font-bold text-indigo-100 mb-1">CÓDIGO DE ACESSO</p>
                                <div className="text-3xl font-mono font-black tracking-widest">{group.id}</div>
                                <p className="text-[10px] mt-1 opacity-80">Compartilhe só o código</p>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 space-y-6">
                        {/* Seletor de Mês e Abas */}
                        <div className="flex flex-col gap-4">
                            <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="w-full bg-white border border-gray-300 text-gray-900 font-bold rounded-2xl px-4 py-4 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none appearance-none text-center text-lg">
                                {availableMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Todas as Faturas' : `Fatura de ${m}`}</option>)}

        // --- DASHBOARD DO FAMILIAR (MOBILE FOCUSED) ---
        const MemberDashboard = ({ group, memberId, onLogout }) => {
            const member = group.members.find(m => m.id === memberId);
            const [selectedMonth, setSelectedMonth] = useState('Todos');

            const availableMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => months.add(getMonthYear(tx.date)));
                return ['Todos', ...Array.from(months)].sort((a, b) => {
                    if(a === 'Todos') return -1; if(b === 'Todos') return 1;
                    const [mA, yA] = a.split('/'); const [mB, yB] = b.split('/');
                    return new Date(yB, mB - 1) - new Date(yA, mA - 1);
                });
            }, [group.transactions]);

            useEffect(() => { if (!availableMonths.includes(selectedMonth) && availableMonths.length > 0) setSelectedMonth(availableMonths[1] || 'Todos'); }, [availableMonths]);

            const myTransactions = useMemo(() => {
                let txs = group.transactions?.filter(tx => tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId))) || [];
                if (selectedMonth !== 'Todos') txs = txs.filter(tx => getMonthYear(tx.date) === selectedMonth);
                return txs.map(tx => {
                    if (tx.splits && tx.splits.length > 0) return { ...tx, displayAmount: tx.splits.find(s => s.memberId === memberId).amount, isSplit: true };
                    return { ...tx, displayAmount: tx.amount, isSplit: false };
                });
            }, [group, memberId, selectedMonth]);

            const myPayments = group.payments?.filter(p => p.memberId === memberId && (selectedMonth === 'Todos' || p.month === selectedMonth)) || [];
            
            const totalPurchases = myTransactions.reduce((acc, curr) => acc + curr.displayAmount, 0);
            const totalPaid = myPayments.reduce((acc, curr) => acc + curr.amount, 0);
            const balance = totalPurchases - totalPaid;

            return (
                <div className="pb-24 bg-gray-50 min-h-screen">
                    <div className="bg-gray-900 p-6 rounded-b-[2.5rem] shadow-xl text-white">
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-14 h-14 bg-indigo-600 rounded-full flex items-center justify-center font-black text-2xl shadow-inner">{member?.name.charAt(0)}</div>
                                <div><p className="text-gray-400 text-[10px] font-black uppercase tracking-widest">Área do Familiar</p><h1 className="font-black text-2xl">{member?.name}</h1></div>
                            </div>
                            <button onClick={onLogout} className="p-3 bg-gray-800 rounded-2xl text-gray-400 hover:text-white"><Icon name="log-out" className="w-5 h-5" /></button>
                        </div>
                        
                        <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="w-full bg-gray-800 border border-gray-700 text-white font-bold rounded-2xl px-4 py-4 mb-6 focus:outline-none appearance-none text-center text-lg shadow-inner">
                            {availableMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Todas as Faturas' : `Fatura de ${m}`}</option>)}
                        </select>

                        <div className="text-center mb-4">
                            <p className="text-gray-400 text-xs font-black uppercase tracking-widest mb-1">Restante a Pagar</p>
                            <div className={`text-5xl font-black tracking-tighter ${balance <= 0 ? 'text-green-400' : 'text-white'}`}>{formatMoney(balance)}</div>
                        </div>
                        
                        <div className="flex gap-4 bg-gray-800/50 p-4 rounded-3xl mt-6 border border-gray-700/50">
                            <div className="flex-1 text-center border-r border-gray-700/50"><p className="text-[10px] text-gray-400 font-black uppercase tracking-wider mb-1">Total Compras</p><p className="font-bold text-lg">{formatMoney(totalPurchases)}</p></div>
                            <div className="flex-1 text-center"><p className="text-[10px] text-gray-400 font-black uppercase tracking-wider mb-1">Pix Realizado</p><p className="font-bold text-lg text-green-400">{formatMoney(totalPaid)}</p></div>
                        </div>
                    </div>

                    <div className="p-4 mt-4">
                        <h3 className="font-black text-gray-800 mb-4 px-2 uppercase text-xs tracking-widest">Extrato Detalhado</h3>
                        <div className="space-y-3">
                            {myTransactions.length === 0 && <div className="text-center p-10 bg-white rounded-3xl shadow-sm border border-gray-100 text-gray-400 font-medium">Nenhuma compra sua nesta fatura.</div>}
                            {myTransactions.map(tx => (
                                <div key={tx.id} className="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex items-center justify-between">
                                    <div className="flex items-center gap-4 overflow-hidden">
                                        <div className="w-14 h-14 bg-indigo-50 text-indigo-700 rounded-2xl flex flex-col items-center justify-center font-black shrink-0 shadow-inner">
                                            <span className="text-sm">{tx.date.split('/')[0]}</span>
                                            <span className="text-[10px] opacity-80">{tx.date.split('/')[1]}</span>
                                        </div>

                                            <p className="font-bold text-gray-900 truncate text-lg">{tx.description}</p>
                                            <div className="flex gap-1 mt-1">
                                                {tx.isSplit && <span className="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-md">DIVIDIDO</span>}
                                                <span className="text-[10px] bg-gray-100 text-gray-500 font-bold px-2 py-0.5 rounded-md uppercase">{tx.bank || 'Cartão'}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="font-black text-xl shrink-0">{formatMoney(tx.displayAmount)}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL E ROTEAMENTO ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('loading'); // loading, landing, admin_login, admin_register, member_code, member_select, member_dash
            const [currentGroup, setCurrentGroup] = useState(null);
            const [currentMemberId, setCurrentMemberId] = useState(null);
            const [notification, setNotification] = useState('');
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [groupCode, setGroupCode] = useState('');
            const [loading, setLoading] = useState(false);

            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 4000); };

            useEffect(() => {
                const init = async () => {
                    try {
                        app = window.firebaseModules.initializeApp(myFirebaseConfig);
                        auth = window.firebaseModules.getAuth(app);
                        db = window.firebaseModules.getFirestore(app);
                        
                        window.firebaseModules.onAuthStateChanged(auth, async (u) => {
                            setUser(u);
                            if (u) {
                                try {
                                    const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'groups'), window.firebaseModules.where('adminUid', '==', u.uid));
                                    const snap = await window.firebaseModules.getDocs(q);
                                    if (!snap.empty) {
                                        setCurrentGroup({ id: snap.docs[0].id, ...snap.docs[0].data() });
                                        setView('admin_dash');
                                    } else {
                                        setView('landing'); 
                                    }
                                } catch (err) {
                                    notify("Erro ao buscar grupo no banco.");
                                    setView('landing');
                                }
                            } else {
                                setView('landing');
                            }
                        });
                    } catch (e) { notify("Erro de inicialização do Firebase."); setView('landing'); }
                };
                init();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const unsub = window.firebaseModules.onSnapshot(window.firebaseModules.doc(db, 'groups', currentGroup.id), (doc) => {
                    if (doc.exists()) setCurrentGroup({ id: doc.id, ...doc.data() });
                });
                return () => unsub();
            }, [currentGroup?.id]);

            const updateGroup = async (updates) => {
                try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'groups', currentGroup.id), updates); } 
                catch (e) { notify("Erro ao salvar dados na nuvem."); }
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    await window.firebaseModules.signInWithEmailAndPassword(auth, email, password);
                } catch (e) { notify("Email ou senha incorretos."); setLoading(false); }
            };

            const handleAdminRegister = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const cred = await window.firebaseModules.createUserWithEmailAndPassword(auth, email, password);
                    const newGroupId = generateCode();
                    const groupData = { adminUid: cred.user.uid, members: [], transactions: [], payments: [] };
                    await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'groups', newGroupId), groupData);
                    setCurrentGroup({ id: newGroupId, ...groupData });
                    setView('admin_dash');
                } catch (e) { notify("Erro ao criar conta. Email já existe ou senha fraca."); setLoading(false); }
            };

            const handleMemberCode = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const code = groupCode.toUpperCase().trim();
                    const docSnap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'groups', code));
                    if (docSnap.exists()) {
                        setCurrentGroup({ id: docSnap.id, ...docSnap.data() });
                        setView('member_select');
                    } else notify("Código de grupo não encontrado.");
                } catch (e) { notify("Erro de conexão."); }
                setLoading(false);
            };

            const logout = async () => {
                if (user) await window.firebaseModules.signOut(auth);
                setCurrentGroup(null); setCurrentMemberId(null); setView('landing');
            };

            if (view === 'loading') return <div className="min-h-screen flex items-center justify-center bg-gray-50"><div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen bg-gray-50 relative font-sans">
                    {/* Notificação */}
                    {notification && (
                        <div className="fixed top-6 left-4 right-4 z-50 fade-in flex justify-center">
                            <div className="bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-2xl font-bold flex items-center gap-3 w-full max-w-sm text-sm">
                                <Icon name="info" className="w-5 h-5 text-indigo-400 shrink-0" /> 
                                <span className="flex-1">{notification}</span>
                            </div>
                        </div>
                    )}

                    {view === 'landing' && (
                        <div className="flex flex-col min-h-screen px-6 pb-12 fade-in">
                            <div className="flex-1 flex flex-col justify-center items-center text-center max-w-lg mx-auto w-full space-y-10 mt-6">
                                <div className="w-24 h-24 bg-indigo-600 text-white rounded-[2rem] flex items-center justify-center shadow-xl"><Icon name="pie-chart" className="w-12 h-12" /></div>
                                <div>
                                    <h1 className="text-4xl sm:text-5xl font-black text-gray-900 leading-tight mb-4">A Fatura da sua<br/><span className="text-indigo-600">Família</span></h1>
                                    <p className="text-gray-500 font-medium text-lg px-4">Divida o cartão e organize quem deve o que, de forma inteligente.</p>
                                </div>
                                
                                <div className="w-full space-y-4">
                                    <button onClick={() => setView('admin_login')} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg hover:bg-indigo-700 transition-transform active:scale-95">Sou o Dono do Cartão</button>
                                    <button onClick={() => setView('member_code')} className="w-full bg-white text-gray-900 border border-gray-200 py-5 rounded-2xl font-black text-lg hover:bg-gray-50 transition-transform active:scale-95 shadow-sm">Sou um Familiar (Tenho Código)</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin_login' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in bg-white">
                            <div className="w-full max-w-md mx-auto">
                                <button onClick={() => setView('landing')} className="mb-8 flex items-center gap-2 text-gray-400 font-bold hover:text-gray-900 transition-colors"><Icon name="arrow-left" /> Voltar</button>
                                <h2 className="text-3xl font-black mb-2">Entrar na Conta</h2>
                                <p className="text-gray-500 mb-8 font-medium">Use seu e-mail e senha para acessar os relatórios e faturas.</p>
                                
                                <form className="space-y-4" onSubmit={handleAdminLogin}>
                                    <input type="email" placeholder="Seu E-mail" className="w-full p-5 border-2 border-gray-200 rounded-2xl bg-gray-50 focus:bg-white focus:border-indigo-600 outline-none font-bold text-gray-900 transition-all" value={email} onChange={e=>setEmail(e.target.value)} required />
                                    <input type="password" placeholder="Sua Senha" className="w-full p-5 border-2 border-gray-200 rounded-2xl bg-gray-50 focus:bg-white focus:border-indigo-600 outline-none font-bold text-gray-900 transition-all" value={password} onChange={e=>setPassword(e.target.value)} required />
                                    <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg mt-2">Acessar meu Grupo</button>
                                </form>
                                <div className="mt-8 text-center">
                                    <p className="text-gray-500 font-medium">Primeira vez aqui?</p>
                                    <button onClick={() => setView('admin_register')} className="text-indigo-600 font-black mt-1">Criar um Grupo Novo</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'admin_register' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in bg-white">
                            <div className="w-full max-w-md mx-auto">
                                <button onClick={() => setView('admin_login')} className="mb-8 flex items-center gap-2 text-gray-400 font-bold hover:text-gray-900 transition-colors"><Icon name="arrow-left" /> Voltar para Login</button>
                                <h2 className="text-3xl font-black mb-2 text-indigo-600">Criar Nova Conta</h2>
                                <p className="text-gray-500 mb-8 font-medium">Seja o administrador do grupo e convide sua família.</p>
                                
                                <form className="space-y-4" onSubmit={handleAdminRegister}>
                                    <input type="email" placeholder="Crie um E-mail" className="w-full p-5 border-2 border-gray-200 rounded-2xl bg-gray-50 focus:bg-white focus:border-indigo-600 outline-none font-bold text-gray-900" value={email} onChange={e=>setEmail(e.target.value)} required />
                                    <input type="password" placeholder="Crie uma Senha (mín. 6 letras)" className="w-full p-5 border-2 border-gray-200 rounded-2xl bg-gray-50 focus:bg-white focus:border-indigo-600 outline-none font-bold text-gray-900" value={password} onChange={e=>setPassword(e.target.value)} minLength="6" required />
                                    <button type="submit" disabled={loading} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg mt-2">Finalizar Cadastro</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'member_code' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in bg-white">
                            <div className="w-full max-w-md mx-auto text-center">
                                <button onClick={() => setView('landing')} className="mb-8 flex items-center gap-2 text-gray-400 font-bold justify-center w-full"><Icon name="arrow-left" /> Voltar</button>
                                <div className="w-20 h-20 bg-gray-100 text-gray-400 rounded-3xl flex items-center justify-center mx-auto mb-6"><Icon name="users" className="w-10 h-10" /></div>
                                <h2 className="text-3xl font-black mb-3">Código do Grupo</h2>
                                <p className="text-gray-500 mb-10 font-medium px-4">Digite o código de 6 letras que o dono do cartão te enviou.</p>
                                <form onSubmit={handleMemberCode} className="space-y-4">
                                    <input type="text" placeholder="EX: A1B2C3" className="w-full p-6 border-2 border-gray-200 rounded-3xl bg-gray-50 focus:bg-white focus:border-indigo-600 outline-none font-black text-center text-4xl uppercase tracking-widest text-gray-900" value={groupCode} onChange={e=>setGroupCode(e.target.value)} maxLength={6} required />
                                    <button type="submit" disabled={loading} className="w-full bg-gray-900 text-white py-5 rounded-2xl font-black text-lg shadow-lg mt-4">Procurar Família</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {view === 'member_select' && (
                        <div className="min-h-screen flex flex-col items-center justify-center px-6 fade-in bg-white">
                            <h2 className="text-3xl font-black mb-2">Quem é você?</h2>
                            <p className="text-gray-500 mb-10 font-medium text-center">Selecione o seu perfil para ver sua fatura.</p>
                            <div className="grid grid-cols-2 gap-4 w-full max-w-sm">
                                {currentGroup?.members?.map(m => (
                                    <div key={m.id} onClick={() => { setCurrentMemberId(m.id); setView('member_dash'); }} className="bg-gray-50 border border-gray-100 p-6 rounded-[2rem] flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 hover:shadow-md transition-all active:scale-95">
                                        <div className="w-16 h-16 bg-indigo-100 text-indigo-700 rounded-2xl flex items-center justify-center font-black text-3xl mb-4">{m.name.charAt(0)}</div>
                                        <span className="font-bold text-gray-900 text-center line-clamp-1 text-lg">{m.name}</span>
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => setView('landing')} className="mt-10 text-gray-400 font-bold hover:text-gray-900">Sair / Trocar Grupo</button>
                        </div>
                    )}

                    {view === 'admin_dash' && <AdminDashboard group={currentGroup} updateGroupData={updateGroup} notify={notify} />}
                    {view === 'member_dash' && <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={() => setView('member_select')} />}

                    {/* Menu Inferior Admin */}
                    {view === 'admin_dash' && (
                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 p-4 pb-safe flex justify-between items-center z-40 px-6 sm:px-10">
                            <span className="font-black text-indigo-600 flex items-center gap-2"><Icon name="pie-chart" /> Fatura Família</span>
                            <button onClick={logout} className="text-sm font-bold text-gray-400 hover:text-red-500 flex items-center gap-1 bg-gray-50 px-4 py-2 rounded-xl transition-colors"><Icon name="log-out" className="w-4 h-4"/> Sair</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
```
