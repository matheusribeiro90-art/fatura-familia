                            <div className="flex justify-between items-center px-1">
                                <label className="flex items-center gap-2 text-[11px] font-bold text-red-700 bg-red-50 px-2.5 py-1.5 rounded-lg border border-red-100 cursor-pointer">
                                    <input type="checkbox" checked={replaceBank} onChange={e=>setReplaceBank(e.target.checked)} className="w-4 h-4 rounded text-red-600" /> Substituir fatura atual
                                </label>
                                <button onClick={() => { const allSel = importPreview.every(x=>x.selected); setImportPreview(importPreview.map(x=>({...x, selected: !allSel}))); }} className="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1.5 rounded-lg">Inverter Seleção</button>
                            </div>
                            <div className="max-h-60 overflow-y-auto space-y-1 pr-1 custom-scroll">
                                {importPreview.length === 0 ? (
                                    <div className="text-center py-6 bg-gray-50 rounded-xl border border-dashed p-3">
                                        <p className="text-[11px] font-bold text-gray-600">Nenhuma compra detalhada encontrada neste PDF.</p>
                                        <p className="text-[9px] text-gray-400 mt-1">Se este arquivo for apenas a folha do boleto bancário (sem extrato de compras), use o botão "Colar" ou "Novo Lançamento Manual".</p>
                                    </div>
                                ) : importPreview.map((t, idx) => (
                                    <div key={t.id} className={`p-2 border rounded-lg flex items-center gap-2 text-[11px] ${t.selected ? 'bg-white border-gray-200' : 'bg-gray-100 opacity-60 border-transparent'}`}>
                                        <input type="checkbox" checked={t.selected} onChange={e => { const up = [...importPreview]; up[idx].selected = e.target.checked; setImportPreview(up); }} className="w-5 h-5 rounded text-indigo-600 shrink-0" />
                                        <div className="truncate flex-1">
                                            <div className="flex items-center gap-1 flex-wrap">
                                                <p className={`font-bold truncate ${t.isDup ? 'line-through text-red-500' : 'text-gray-800'}`}>{t.description}</p>
                                                {t.isDup && <span className="bg-red-100 text-red-600 text-[8px] font-black px-1.5 py-0.5 rounded uppercase shrink-0">JÁ LANÇADO</span>}
                                                {t.isPayment && <span className="bg-amber-100 text-amber-800 text-[8px] font-black px-1.5 py-0.5 rounded uppercase shrink-0">PAGTO ANTERIOR (IGNORADO)</span>}
                                                {t.isRefund && <span className="bg-green-100 text-green-700 text-[8px] font-black px-1.5 py-0.5 rounded uppercase shrink-0">ESTORNO (-)</span>}
                                            </div>
                                            <div className="flex gap-1 items-center mt-0.5">
                                                <span className="text-[9px] text-gray-400">{t.date}</span>
                                                {t.assignedTo && <span className="text-[8px] bg-green-50 text-green-700 px-1 rounded font-bold">Auto: {group.members?.find(m=>m.id===t.assignedTo)?.name}</span>}
                                                {t.forward?.length > 0 && <span className="text-[8px] bg-indigo-50 text-indigo-600 px-1 rounded font-bold">+{t.forward.length} parc.</span>}
                                            </div>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const up = [...importPreview];
                                                const flipped = -parseFloat(up[idx].amount);
                                                up[idx].amount = flipped;
                                                up[idx].isRefund = flipped < 0;
                                                if (up[idx].forward) {
                                                    up[idx].forward = up[idx].forward.map(f => ({ ...f, amount: flipped }));
                                                }
                                                setImportPreview(up);
                                            }}
                                            className={`font-black shrink-0 px-1.5 py-0.5 rounded border text-[11px] ${t.amount < 0 ? 'text-green-700 bg-green-50 border-green-200' : 'text-gray-900 bg-gray-50 border-gray-200'}`}
                                            title="Toque se quiser inverter o sinal (+ / -)"
                                        >
                                            {formatMoney(t.amount)}
                                        </button>
                                    </div>
                                ))}
                            </div>
                            <button onClick={confirmImport} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-black text-[12px] uppercase shadow-md">Confirmar Importação em {importTargetMonth}</button>
                        </div>
                    </Modal>

                    {/* MODAL DE EDIÇÃO E RATEIO */}
                    <Modal isOpen={!!assignTx} onClose={()=>setAssignTx(null)} title="Editar Lançamento">
                        {assignTx && (
                            <div className="space-y-3">
                                <div className="flex gap-2">
                                    <button onClick={() => setConfirmAction({ message: "Excluir este lançamento permanentemente?", onConfirm: async () => { await updateGroupData({transactions: group.transactions.filter(x=>x.id!==assignTx.id)}); setAssignTx(null); setConfirmAction(null); } })} className="bg-red-50 text-red-600 p-2.5 rounded-xl border border-red-100 font-bold text-[11px] flex items-center gap-1"><i data-lucide="trash-2" className="w-4 h-4"></i> Excluir</button>
                                    <button onClick={saveEdit} className="flex-1 bg-green-600 text-white p-2.5 rounded-xl font-black text-[12px] shadow-md uppercase">Salvar Alterações</button>
                                </div>
                                <div className="bg-gray-50 p-2.5 rounded-xl border space-y-2">
                                    <div className="flex gap-2">
                                        <input value={assignTx.date} onChange={e=>setAssignTx({...assignTx, date:e.target.value})} className="w-1/3 p-2 border rounded-lg text-[13px] text-center font-bold bg-white" />
                                        <div className="w-2/3 flex gap-1">
                                            <button
                                                type="button"
                                                onClick={() => setAssignTx({...assignTx, amount: -parseFloat(assignTx.amount || 0)})}
                                                className="px-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg font-black text-[11px] shrink-0"
                                                title="Inverter sinal Positivo / Negativo"
                                            >
                                                +/-
                                            </button>
                                            <input type="number" step="0.01" value={assignTx.amount} onChange={e=>setAssignTx({...assignTx, amount:e.target.value})} className={`w-full p-2 border rounded-lg text-[13px] font-black text-right bg-white ${parseFloat(assignTx.amount) < 0 ? 'text-green-600' : 'text-indigo-700'}`} />
                                        </div>
                                    </div>
                                    <input value={assignTx.description} onChange={e=>setAssignTx({...assignTx, description:e.target.value})} className="w-full p-2 border rounded-lg text-[13px] font-bold bg-white" />
                                </div>
                                <p className="text-[10px] font-bold text-gray-500 uppercase text-center pt-1">Selecione o(s) Dono(s):</p>
                                <div className="flex flex-wrap gap-1.5 justify-center">
                                    {group.members?.map(m => {
                                        const sel = assignSelections.includes(m.id);
                                        return <button type="button" key={m.id} onClick={() => setAssignSelections(sel ? assignSelections.filter(x=>x!==m.id) : [...assignSelections, m.id])} className={`px-3 py-2 rounded-xl text-[11px] font-bold border-2 transition-all ${sel ? 'border-indigo-600 bg-indigo-50 text-indigo-900 shadow-sm' : 'border-gray-200 bg-white text-gray-500'}`}>{m.name}</button>
                                    })}
                                </div>
                                
                                {assignSelections.length > 1 && (
                                    <div className="p-3 bg-indigo-50/50 border border-indigo-100 rounded-xl mt-2 fade-in">
                                        <label className="flex items-center gap-2 text-[11px] font-bold text-indigo-900 cursor-pointer mb-2">
                                            <input type="checkbox" checked={isCustomSplit} onChange={e=>setIsCustomSplit(e.target.checked)} className="w-4 h-4 rounded text-indigo-600" /> 
                                            Ativar Valores Quebrados (Rateio Manual)
                                        </label>
                                        {isCustomSplit && (
                                            <div className="space-y-1.5 mt-2">
                                                {assignSelections.map(mId => (
                                                    <div key={mId} className="flex justify-between items-center bg-white p-2 border rounded-lg">
                                                        <span className="text-[11px] font-bold text-gray-700">{group.members.find(m=>m.id===mId)?.name}</span>
                                                        <div className="flex items-center gap-1">
                                                            <span className="text-[10px] text-gray-400 font-bold">R$</span>
                                                            <input type="number" step="0.01" value={customSplitsValues[mId]||''} onChange={e=>setCustomSplitsValues({...customSplitsValues, [mId]:e.target.value})} className="w-20 p-1 bg-gray-50 border rounded text-[13px] font-black text-right outline-none text-indigo-700" placeholder="0.00" />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </Modal>

                    {/* MODAL DE PAGAMENTO SIMPLES */}
                    <Modal isOpen={paymentModal.open} onClose={()=>setPaymentModal({open:false, memberId:null, type:'cartao', amount:''})} title="Receber Pagamento">
                        {paymentModal.memberId && (() => {
                            const mTot = totals[paymentModal.memberId] || { card: 0, loan: 0, pCard: 0, pLoan: 0 };
                            const cRest = Math.max(0, mTot.card - mTot.pCard);
                            const lRest = Math.max(0, mTot.loan - mTot.pLoan);
                            return (
                                <form onSubmit={async (e)=>{e.preventDefault(); if(paymentModal.amount) { await updateGroupData({payments: [...(group.payments||[]), {id:crypto.randomUUID(), memberId:paymentModal.memberId, amount:parseFloat(paymentModal.amount), type:paymentModal.type, month:selectedMonth==='Todos'?getCurrentMonthStr():selectedMonth, date:new Date().toLocaleDateString('pt-BR')}]}); setPaymentModal({open:false, memberId:null, type:'cartao', amount:''}); }}} className="space-y-3">
                                    <div className="flex gap-2">
                                        <label onClick={() => setPaymentModal({...paymentModal, type:'cartao', amount: cRest > 0 ? cRest.toFixed(2) : ''})} className={`flex-1 p-2.5 border-2 rounded-xl text-center text-[12px] font-bold cursor-pointer ${paymentModal.type==='cartao'?'border-indigo-600 bg-indigo-50 text-indigo-900':'border-gray-200 text-gray-500'}`}>
                                            💳 Cartão ({formatMoney(cRest)})
                                        </label>
                                        <label onClick={() => setPaymentModal({...paymentModal, type:'emprestimo', amount: lRest > 0 ? lRest.toFixed(2) : ''})} className={`flex-1 p-2.5 border-2 rounded-xl text-center text-[12px] font-bold cursor-pointer ${paymentModal.type==='emprestimo'?'border-gray-800 bg-gray-100 text-gray-900':'border-gray-200 text-gray-500'}`}>
                                            🏦 Empréstimo ({formatMoney(lRest)})
                                        </label>
                                    </div>
                                    <input type="number" step="0.01" placeholder="Valor R$" value={paymentModal.amount} onChange={e=>setPaymentModal({...paymentModal, amount:e.target.value})} className="w-full p-3 border rounded-xl font-black text-base text-center bg-gray-50 outline-none" required />
                                    <button type="submit" className="w-full bg-green-600 text-white py-3 rounded-xl font-black text-[12px] uppercase shadow-md">Confirmar Baixa</button>
                                </form>
                            );
                        })()}
                    </Modal>
                </div>
            );
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false); const [user, setUser] = useState(null);
            const [view, setView] = useState('landing'); const [currentGroup, setCurrentGroup] = useState(null);
            const [currentMemberId, setCurrentMemberId] = useState(null);
            const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
            const [code, setCode] = useState(''); const [err, setErr] = useState('');

            useEffect(() => {
                const init = async () => {
                    if (window.firebaseModules) {
                        try {
                            app = window.firebaseModules.initializeApp(myFirebaseConfig);
                            auth = window.firebaseModules.getAuth(app); db = window.firebaseModules.getFirestore(app);
                            window.firebaseModules.onAuthStateChanged(auth, async (u) => {
                                setUser(u);
                                if (u && !u.isAnonymous) {
                                    const snap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', u.uid));
                                    if (snap.exists()) { setCurrentGroup({ id: snap.id, ...snap.data() }); setView('admin'); }
                                }
                                setIsReady(true);
                            });
                        } catch (e) { setIsReady(true); }
                    }
                }; init();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                return window.firebaseModules.onSnapshot(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', currentGroup.id), (snap) => {
                    if (snap.exists()) setCurrentGroup({ id: snap.id, ...snap.data() });
                });
            }, [currentGroup?.id]);

            useEffect(() => { lucide.createIcons(); });

            const handleAdmin = async (e) => {
                e.preventDefault(); setErr('');
                try { await window.firebaseModules.signInWithEmailAndPassword(auth, email.trim(), password); } 
                catch (err) { setErr("Credenciais inválidas."); }
            };

            const handleFamilyCode = async (e) => {
                e.preventDefault(); setErr('');
                const clean = code.toUpperCase().trim();
                try {
                    const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'artifacts', envAppId, 'public', 'data', 'groups'));
                    const snap = await window.firebaseModules.getDocs(q);
                    let found = null;
                    snap.forEach(d => { const data = d.data(); if (d.id.startsWith(clean) || data.shortCode === clean) found = { id: d.id, ...data }; });
                    if (found) { setCurrentGroup(found); setView('select_member'); } else setErr("Código não encontrado.");
                } catch (e) { setErr("Erro de acesso."); }
            };

            const updateGroupData = async (up) => {
                if (!db || !currentGroup) return;
                await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', currentGroup.id), up);
            };

            if (!isReady) return <div className="h-screen flex items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-slate-50 font-sans w-full overflow-x-hidden">
                        {view !== 'landing' && view !== 'select_member' && (
                            <nav className="bg-white border-b sticky top-0 z-40 h-12 flex items-center px-4 justify-between shadow-sm">
                                <div className="font-black text-xs text-indigo-950 flex items-center gap-1.5"><div className="bg-indigo-600 text-white p-1 rounded"><i data-lucide="wallet" className="w-3.5 h-3.5"></i></div> FaturaFamília</div>
                                {view === 'admin' && <button onClick={()=>{window.firebaseModules.signOut(auth); setView('landing');}} className="text-[10px] font-bold text-red-500 bg-red-50 px-2.5 py-1 rounded">Sair</button>}
                            </nav>
                        )}
                        <main className={view === 'landing' ? "px-4 pt-4" : ""}>
                            {view === 'landing' && (
                                <div className="max-w-sm mx-auto space-y-3 fade-in">
                                    <div className="text-center mb-2">
                                        <div className="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center mx-auto mb-1.5 shadow-md"><i data-lucide="wallet" className="w-5 h-5"></i></div>
                                        <h1 className="text-xl font-black text-slate-900">Fatura Família</h1>
                                        <p className="text-[11px] text-slate-500">Divisão inteligente de contas</p>
                                    </div>
                                    {err && <div className="bg-red-50 text-red-600 p-2 rounded-xl text-[11px] font-bold text-center border border-red-100">{err}</div>}
                                    
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border">
                                        <h2 className="text-xs font-black text-slate-800 mb-2 flex items-center gap-1.5"><i data-lucide="shield" className="w-4 h-4 text-indigo-600"></i> Sou Administrador</h2>
                                        <form onSubmit={handleAdmin} className="space-y-2">
                                            <input type="email" placeholder="E-mail" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-2.5 border rounded-xl text-[13px] font-bold bg-slate-50 outline-none" required />
                                            <input type="password" placeholder="Senha" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-2.5 border rounded-xl text-[13px] font-bold bg-slate-50 outline-none" required />
                                            <button className="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-black text-[12px] uppercase shadow-md">Entrar</button>
                                        </form>
                                    </div>

                                    <div className="bg-slate-900 p-4 rounded-2xl shadow-md text-white">
                                        <h2 className="text-xs font-black mb-2 flex items-center gap-1.5"><i data-lucide="users" className="w-4 h-4 text-indigo-400"></i> Sou da Família</h2>
                                        <form onSubmit={handleFamilyCode} className="space-y-2">
                                            <input type="text" placeholder="CÓDIGO DO GRUPO" value={code} onChange={e=>setCode(e.target.value)} className="w-full p-2.5 border border-slate-700 rounded-xl font-mono text-center uppercase text-sm font-black bg-slate-800 text-white outline-none tracking-widest" required />
                                            <button className="w-full bg-indigo-500 text-white py-2.5 rounded-xl font-black text-[12px] uppercase shadow-md">Ver Minha Fatura</button>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {view === 'select_member' && currentGroup && (
                                <div className="max-w-sm mx-auto pt-8 px-4 fade-in text-center">
                                    <h2 className="text-lg font-black text-slate-800 mb-1">Quem é você?</h2>
                                    <p className="text-xs text-slate-500 mb-6 font-medium">Toque no seu nome para abrir sua fatura</p>
                                    <div className="grid grid-cols-2 gap-3">
                                        {currentGroup.members?.map(m => (
                                            <div key={m.id} onClick={() => { setCurrentMemberId(m.id); setView('member'); }} className="bg-white p-4 rounded-2xl border shadow-sm cursor-pointer hover:border-indigo-500 flex flex-col items-center">
                                                <div className="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 font-black text-lg flex items-center justify-center mb-2">{m.name.charAt(0)}</div>
                                                <span className="font-bold text-slate-800 text-xs truncate w-full">{m.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={()=>setView('landing')} className="mt-8 text-xs font-bold text-slate-400">Voltar</button>
                                </div>
                            )}

                            {view === 'admin' && currentGroup && <AdminDashboard group={currentGroup} updateGroupData={updateGroupData} />}
                            {view === 'member' && currentGroup && currentMemberId && <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={() => setView('select_member')} />}
                        </main>
                    </div>
                </ErrorBoundary>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
