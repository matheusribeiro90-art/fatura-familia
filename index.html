<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Fatura Família</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const manifest = {
            name: "Fatura Família", short_name: "Fatura", start_url: ".", display: "standalone",
            background_color: "#f8fafc", theme_color: "#4f46e5",
            icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.1-.96-2.17-1.92H8.01c.06 1.62 1.11 2.86 2.89 3.24V19h2.36v-1.67c1.73-.32 2.99-1.3 2.99-2.92 0-1.89-1.53-2.65-3.64-3.15z'/%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, query, collection, where, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const { useState, useEffect, useRef, useMemo } = React;
        let app, auth, db;

        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        const generateCode = () => Math.random().toString(36).substring(2, 8).toUpperCase(); // 6 chars
        
        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => { if (spanRef.current && window.lucide) { spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`; window.lucide.createIcons({ root: spanRef.current }); } }, [name, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        const getBankStyle = (bankName) => {
            if(bankName === 'Nubank') return 'bg-purple-100 text-purple-700 border-purple-200';
            if(bankName === 'Inter') return 'bg-orange-100 text-orange-700 border-orange-200';
            if(bankName === 'Mercado Pago') return 'bg-blue-100 text-blue-700 border-blue-200';
            return 'bg-gray-100 text-gray-600 border-gray-200';
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b flex justify-between items-center bg-gray-50/80">
                            <h3 className="text-xl font-black text-gray-800">{title}</h3>
                            <button onClick={onClose} className="p-2 bg-gray-200/50 hover:bg-gray-200 rounded-full text-gray-600 transition-colors"><Icon name="x" className="w-5 h-5" /></button>
                        </div>
                        <div className="p-5 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ group, updateGroupData, notify }) => {
            const [activeTab, setActiveTab] = useState('transactions'); 
            
            const availableInvoiceMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => { if(tx.invoiceMonth) months.add(tx.invoiceMonth); });
                return ['Todos', ...Array.from(months)].sort((a, b) => {
                    if(a === 'Todos') return -1; if(b === 'Todos') return 1;
                    const [mA, yA] = a.split('/'); const [mB, yB] = b.split('/');
                    return new Date(yB, mB - 1) - new Date(yA, mA - 1);
                });
            }, [group.transactions]);
            
            const [selectedInvoiceMonth, setSelectedInvoiceMonth] = useState('Todos');
            const [selectedBankFilter, setSelectedBankFilter] = useState('Todos');

            useEffect(() => { 
                if (!availableInvoiceMonths.includes(selectedInvoiceMonth) && availableInvoiceMonths.length > 0) {
                    setSelectedInvoiceMonth(availableInvoiceMonths[1] || 'Todos'); 
                }
            }, [availableInvoiceMonths]);

            const filteredTransactions = useMemo(() => {
                let txs = group.transactions || [];
                if (selectedInvoiceMonth !== 'Todos') txs = txs.filter(tx => tx.invoiceMonth === selectedInvoiceMonth);
                if (selectedBankFilter !== 'Todos') txs = txs.filter(tx => tx.bank === selectedBankFilter);
                return txs;
            }, [group.transactions, selectedInvoiceMonth, selectedBankFilter]);

            const totalFiltered = filteredTransactions.reduce((acc, curr) => acc + curr.amount, 0);

            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [pasteText, setPasteText] = useState('');
            const [parsedPreview, setParsedPreview] = useState(null);
            
            const currentDate = new Date();
            const defaultMonth = `${(currentDate.getMonth() + 1).toString().padStart(2, '0')}/${currentDate.getFullYear()}`;
            const [importInvoiceMonth, setImportInvoiceMonth] = useState(defaultMonth);

            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [applyToFuture, setApplyToFuture] = useState(true);

            const [isLoanModalOpen, setIsLoanModalOpen] = useState(false);
            const [loanData, setLoanData] = useState({ description: '', memberId: '', amount: '', installments: '', dueDate: '' });

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    notify("Lendo PDF... Aguarde.");
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        let lastY = -1;
                        for (let item of textContent.items) {
                            if (lastY !== item.transform[5] && lastY !== -1) fullText += '\n';
                            fullText += item.str + ' ';
                            lastY = item.transform[5];
                        }
                        fullText += '\n\n';
                    }
                    setPasteText(fullText);
                    notify("PDF lido com sucesso! Pressione 'Ler Extrato'.");
                } catch (error) {
                    notify("Erro! O PDF pode estar bloqueado. Cole o texto do extrato.");
                }
                e.target.value = null;
            };

            const analyzeTextCore = () => {
                let textToAnalyze = pasteText;
                let lines = textToAnalyze.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const newTransactions = [];
                const fullTextLower = textToAnalyze.toLowerCase();
                
                let detectedBank = 'Outros';
                if (fullTextLower.includes('nubank') || fullTextLower.includes('nu pagamentos') || fullTextLower.includes('กบ')) detectedBank = 'Nubank';
                else if (fullTextLower.includes('banco inter') || fullTextLower.includes('inter')) detectedBank = 'Inter';
                else if (fullTextLower.includes('mercado pago') || fullTextLower.includes('mercadopago')) detectedBank = 'Mercado Pago';

                const normalizeDate = (raw) => {
                    const months = { jan: '01', fev: '02', mar: '03', abr: '04', mai: '05', jun: '06', jul: '07', ago: '08', set: '09', out: '10', nov: '11', dez: '12' };
                    let d = raw.toLowerCase().trim();
                    const inter = d.match(/^(\d{1,2})\s+de\s+([a-z]{3})\.?\s+(\d{4})$/); 
                    if (inter) return `${inter[1].padStart(2, '0')}/${months[inter[2]]}/${inter[3]}`;
                    const nu = d.match(/^(\d{1,2})\s+([a-z]{3})$/); 
                    if (nu) return `${nu[1].padStart(2, '0')}/${months[nu[2]]}/${new Date().getFullYear()}`;
                    return raw.trim(); 
                };

                const processMatch = (rawDate, rawDesc, rawVal, originalLine) => {
                    const parsedDate = normalizeDate(rawDate);
                    let parsedDesc = rawDesc.replace(/^\d{4}\s+/, '').replace(/Π/g, '').replace(/กบ/g, '').trim(); 
                    parsedDesc = parsedDesc.replace(/(?:-\s*)?\(?Parcela\s+(\d{1,2})\s+(?:de|\/)\s+(\d{1,2})\)?/i, '$1/$2');
                    
                    const amountStr = rawVal.replace(/\./g, '').replace(',', '.');
                    const parsedAmount = parseFloat(amountStr);
                    
                    if (isNaN(parsedAmount) || parsedAmount <= 0) return;
                    const descLower = parsedDesc.toLowerCase();
                    
                    if (descLower.includes('pagamento recebido') || descLower.includes('pagamento em') || descLower.includes('estorno')) return;

                    const isDuplicate = group.transactions?.some(tx => tx.invoiceMonth === importInvoiceMonth && tx.description === parsedDesc && tx.amount === parsedAmount);
                    
                    let assignedTo = null, splits = null;
                    const baseDesc = parsedDesc.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                    
                    // 1. Tenta achar pela memória histórica
                    const pastTx = group.transactions?.find(t => t.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDesc && (t.assignedTo || (t.splits && t.splits.length > 0)));
                    if (pastTx) { 
                        assignedTo = pastTx.assignedTo; 
                        splits = pastTx.splits ? [...pastTx.splits] : null; 
                    }

                    // 2. Tenta achar pelo número do cartão virtual na linha ou descrição
                    if (!assignedTo && (!splits || splits.length === 0) && group.members) {
                        for (let member of group.members) {
                            if (member.virtualCards) {
                                const cards = member.virtualCards.split(',').map(c => c.trim());
                                if (cards.some(card => originalLine.includes(card) || rawDesc.includes(card))) {
                                    assignedTo = member.id;
                                    break;
                                }
                            }
                        }
                    }

                    newTransactions.push({ 
                        id: crypto.randomUUID(), 
                        date: parsedDate, 
                        invoiceMonth: importInvoiceMonth, 
                        description: parsedDesc, 
                        amount: parsedAmount, 
                        assignedTo, splits, 
                        selected: !isDuplicate, 
                        isDuplicate, 
                        bank: detectedBank 
                    });
                };

                let i = 0;
                while (i < lines.length) {
                    const line = lines[i];
                    
                    // Regex flexível: Data, Descrição, Valor numa mesma linha
                    const matchSingle = line.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:de\s+)?[a-zA-Z]{3}\.?\s*(?:\d{4})?)\s+(.*?)\s+(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                    if (matchSingle) { processMatch(matchSingle[1], matchSingle[2], matchSingle[3], line); i++; continue; }

                    // Regex de blocos Nubank (Padrão 1)
                    const dateOnly = /^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*)$/i;
                    if (dateOnly.test(line) && i + 1 < lines.length) {
                        const dateStr = line;
                        let descStr = lines[i+1];
                        let valStr = null, skip = 1;
                        
                        if (i + 2 < lines.length) {
                             const valMatch = lines[i+2].match(/^(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                             if (valMatch) { valStr = valMatch[1]; skip = 2; }
                        }
                        if (!valStr) {
                            const mixed = descStr.match(/(.*?)\s+(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                            if (mixed) { descStr = mixed[1]; valStr = mixed[2]; skip = 1; }
                        }
                        
                        if (valStr) { 
                            processMatch(dateStr, descStr, valStr, line + ' ' + descStr); 
                            i += (skip + 1); 
                            continue; 
                        }
                    }
                    i++;
                }

                if (newTransactions.length > 0) setParsedPreview(newTransactions);
                else notify("Não reconheci compras. O formato pode estar inválido.");
            };

            const handleConfirmParse = async () => {
                const itemsToAdd = parsedPreview.filter(tx => tx.selected && !tx.isDuplicate).map(({ selected, isDuplicate, ...rest }) => rest);
                await updateGroupData({ transactions: [...(group.transactions || []), ...itemsToAdd] });
                notify(`${itemsToAdd.length} lançamentos salvos para a Fatura ${importInvoiceMonth}!`);
                setPasteText(''); setParsedPreview(null); setIsParseModalOpen(false);
            };

            const applyCascadeUpdate = (txId, updates, shouldCascade) => {
                const targetTx = group.transactions.find(t => t.id === txId);
                if (!targetTx) return group.transactions;
                
                const baseDesc = targetTx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                const isInstallment = /\b\d{1,2}\/\d{1,2}\b/.test(targetTx.description);

                return group.transactions.map(tx => {
                    if (tx.id === txId) return { ...tx, ...updates };
                    
                    if (shouldCascade && isInstallment && tx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDesc && Math.abs(tx.amount - targetTx.amount) < 0.01) {
                        let newDesc = tx.description;
                        if (updates.description) {
                            const instMatch = tx.description.match(/\b(\d{1,2}\/\d{1,2})\b/);
                            newDesc = updates.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                            if (instMatch) newDesc += ` ${instMatch[1]}`;
                        }
                        return { ...tx, ...updates, description: newDesc };
                    }
                    return tx;
                });
            };

            const handleSaveAssign = async () => {
                let assignedTo = null, splits = null;
                if (assignSelections.length === 1) assignedTo = assignSelections[0];
                else if (assignSelections.length > 1) splits = assignSelections.map(memberId => ({ memberId, amount: assignTx.amount / assignSelections.length }));

                const updated = applyCascadeUpdate(assignTx.id, { 
                    assignedTo, 
                    splits, 
                    description: assignTx.description // Salva o nome se foi editado
                }, applyToFuture);
                
                await updateGroupData({ transactions: updated });
                setIsAssignModalOpen(false); 
                notify(applyToFuture ? "Alteração aplicada com Efeito Cascata!" : "Compra atualizada!");
            };

            const handleAddMember = async (e) => {
                e.preventDefault();
                const name = e.target.name.value.trim();
                const virtualCards = e.target.virtualCards.value.trim();
                if (!name) return;
                const accessCode = generateCode();
                await updateGroupData({ members: [...(group.members || []), { id: crypto.randomUUID(), name, virtualCards, accessCode }] });
                e.target.reset(); notify("Familiar adicionado!");
            };

            const handleDeleteMember = async (memberId) => {
                if(window.confirm("Apagar este familiar? As compras dele ficarão 'Sem Dono'.")) {
                    const updatedMembers = group.members.filter(m => m.id !== memberId);
                    let updatedTransactions = (group.transactions || []).map(tx => {
                        let newTx = { ...tx };
                        if (newTx.assignedTo === memberId) newTx.assignedTo = null;
                        if (newTx.splits) {
                            newTx.splits = newTx.splits.filter(s => s.memberId !== memberId);
                            if (newTx.splits.length === 0) newTx.splits = null;
                        }
                        return newTx;
                    });
                    const updatedLoans = (group.loans || []).filter(l => l.memberId !== memberId);
                    await updateGroupData({ members: updatedMembers, transactions: updatedTransactions, loans: updatedLoans });
                    notify("Familiar removido.");
                }
            };

            const handleClearAll = async () => {
                if(window.confirm("CUIDADO: Isso apagará TODAS as compras e empréstimos de TESTE. A família será mantida. Limpar?")) {
                    await updateGroupData({ transactions: [], payments: [], loans: [] });
                    notify("Tudo limpo! Pronto para novos testes.");
                }
            };

            const handleAddLoan = async (e) => {
                e.preventDefault();
                if(!loanData.memberId || !loanData.amount) return;
                const newLoan = { id: crypto.randomUUID(), ...loanData, amount: parseFloat(loanData.amount), installments: parseInt(loanData.installments) || 1 };
                await updateGroupData({ loans: [...(group.loans || []), newLoan] });
                setIsLoanModalOpen(false); setLoanData({ description: '', memberId: '', amount: '', installments: '', dueDate: '' });
                notify("Empréstimo registrado!");
            };

            const handleDeleteLoan = async (loanId) => {
                await updateGroupData({ loans: group.loans.filter(l => l.id !== loanId) });
                notify("Empréstimo removido.");
            };

            const { totals, paid, sumTotal } = useMemo(() => {
                const t = { unassigned: 0 }, p = {};
                group.members?.forEach(m => { t[m.id] = 0; p[m.id] = 0; });
                filteredTransactions.forEach(tx => {
                    if (tx.splits?.length > 0) {
                        let alloc = 0;
                        tx.splits.forEach(s => { if (t[s.memberId] !== undefined) { t[s.memberId] += s.amount; alloc += s.amount; } });
                        if (tx.amount - alloc > 0.02) t.unassigned += (tx.amount - alloc);
                    } else if (tx.assignedTo && t[tx.assignedTo] !== undefined) t[tx.assignedTo] += tx.amount;
                    else t.unassigned += tx.amount;
                });
                group.payments?.filter(x => x.month === selectedInvoiceMonth || selectedInvoiceMonth === 'Todos').forEach(x => { if (p[x.memberId] !== undefined) p[x.memberId] += x.amount; });
                return { totals: t, paid: p, sumTotal: filteredTransactions.reduce((acc, curr) => acc + curr.amount, 0) };
            }, [filteredTransactions, group]);

            return (
                <div className="pb-24">
                    {}
                    <div className="bg-indigo-600 p-6 rounded-b-[2rem] shadow-lg mb-6 text-white text-center">
                        <h1 className="text-2xl font-black">Painel do Administrador</h1>
                        <p className="text-indigo-200 text-sm mt-1">Gestão Completa da Família</p>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 space-y-6">
                        <div className="flex bg-gray-200/60 p-1.5 rounded-2xl overflow-x-auto hide-scroll">
                            <button onClick={() => setActiveTab('transactions')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'transactions' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Extrato & Compras</button>
                            <button onClick={() => setActiveTab('loans')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'loans' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Empréstimos</button>
                            <button onClick={() => setActiveTab('summary')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Resumo Geral</button>
                            <button onClick={() => setActiveTab('settings')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'settings' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Família & Config</button>
                        </div>

                        {(activeTab === 'transactions' || activeTab === 'summary') && (
                            <div className="flex gap-2">
                                <select value={selectedInvoiceMonth} onChange={e => setSelectedInvoiceMonth(e.target.value)} className="flex-1 bg-white border border-gray-300 text-indigo-900 font-black rounded-2xl px-4 py-3 shadow-sm outline-none text-center">
                                    {availableInvoiceMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Mês da Fatura (Todos)' : `Fatura ${m}`}</option>)}
                                </select>
                                <select value={selectedBankFilter} onChange={e => setSelectedBankFilter(e.target.value)} className="flex-1 bg-white border border-gray-300 text-gray-900 font-bold rounded-2xl px-4 py-3 shadow-sm outline-none text-center">
                                    <option value="Todos">Cartões (Todos)</option>
                                    <option value="Nubank">Nubank</option>
                                    <option value="Inter">Inter</option>
                                    <option value="Mercado Pago">Mercado Pago</option>
                                </select>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="fade-in space-y-4">
                                <div className="bg-indigo-50 border-2 border-indigo-200 p-4 rounded-3xl text-center">
                                    <span className="text-indigo-900 font-black text-sm uppercase block mb-1">Total Lançado no Filtro Acima</span>
                                    <span className="text-3xl font-black text-indigo-600">{formatMoney(totalFiltered)}</span>
                                </div>

                                <button onClick={() => setIsParseModalOpen(true)} className="w-full bg-gray-900 text-white p-4 rounded-2xl font-black shadow-md flex items-center justify-center gap-2">
                                    <Icon name="plus-circle" className="w-5 h-5" /> Importar Extrato (PDF ou Texto)
                                </button>
                                
                                <div className="space-y-3">

        const MemberDashboard = ({ group, memberCode, onLogout }) => {
            const member = group.members.find(m => m.accessCode === memberCode);
            const myTxs = group.transactions?.filter(tx => tx.assignedTo === member.id || tx.splits?.some(s=>s.memberId === member.id)) || [];
            const myLoans = group.loans?.filter(l => l.memberId === member.id) || [];
            
            const availableMonths = [...new Set(myTxs.map(t => t.invoiceMonth))].sort((a,b) => b.localeCompare(a));
            const [selectedMonth, setSelectedMonth] = useState(availableMonths[0] || '');

            const monthTxs = myTxs.filter(t => t.invoiceMonth === selectedMonth);
            const monthCardTotal = monthTxs.reduce((acc, curr) => acc + (curr.splits ? curr.splits.find(s=>s.memberId===member.id).amount : curr.amount), 0);
            const loansTotal = myLoans.reduce((acc, curr) => acc + curr.amount, 0);

            return (
                <div className="pb-24 min-h-screen bg-gray-50">
                    <div className="bg-gray-900 p-6 rounded-b-[2rem] shadow-xl text-white">

                        <p className="text-gray-400 text-xs font-black uppercase tracking-widest mb-1">Total Geral do Mês</p>

                        {availableMonths.length > 0 && (

                    <div className="p-4 space-y-6 mt-2">

                                        <div><p className="font-bold text-blue-900">{loan.description}</p><span className="text-xs font-bold text-blue-600">Vence dia {loan.dueDate}</span></div>

                                    </div>
                                ))}
                            </div>
                        )}

                        <div className="space-y-3">

                            {monthTxs.length === 0 && <p className="text-center text-gray-400 font-medium py-4">Nenhuma compra nesta fatura.</p>}
                            {monthTxs.map(tx => {
                                const val = tx.splits ? tx.splits.find(s=>s.memberId===member.id).amount : tx.amount;
                                return (
                                    <div key={tx.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                                        <div className="truncate pr-2">
                                            <p className="font-bold text-gray-900 truncate text-lg">{tx.description}</p>
                                            <div className="flex gap-1 mt-1"><span className="text-[10px] font-bold text-gray-400">{tx.date}</span><span className={`text-[10px] font-bold px-1.5 rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span></div>
                                        </div>
                                        <div className="font-black text-xl shrink-0">{formatMoney(val)}</div>

                        </div>
                    </div>

            );
        };

        const App = () => {
            const [view, setView] = useState('landing');
            const [currentGroup, setCurrentGroup] = useState(null);
            const [memberCode, setMemberCode] = useState('');
            const [adminData, setAdminData] = useState({ email: '', pass: '' });
            const [notification, setNotification] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.firebaseModules.initializeApp(myFirebaseConfig);
                auth = window.firebaseModules.getAuth(); 
                db = window.firebaseModules.getFirestore();
                
                const unsubscribe = window.firebaseModules.onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        try {
                            const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'groups'), window.firebaseModules.where('adminUid', '==', u.uid));
                            const snap = await window.firebaseModules.getDocs(q);
                            if (!snap.empty) { setCurrentGroup({ id: snap.docs[0].id, ...snap.docs[0].data() }); setView('admin_dash'); }
                        } catch(e) { notify("Erro ao buscar grupo do Admin."); }
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const unsub = window.firebaseModules.onSnapshot(window.firebaseModules.doc(db, 'groups', currentGroup.id), (doc) => {
                    if (doc.exists()) setCurrentGroup({ id: doc.id, ...doc.data() });
                });
                return () => unsub();
            }, [currentGroup?.id]);

            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 4000); };
            const updateGroup = async (updates) => { try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'groups', currentGroup.id), updates); } catch(e) { notify("Erro ao salvar dados!");} };

            const handleMemberLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const cleanCode = memberCode.toUpperCase().trim();
                    let foundGroup = null;
                    const querySnapshot = await window.firebaseModules.getDocs(window.firebaseModules.collection(db, 'groups'));
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if(data.members?.some(m => m.accessCode === cleanCode)) foundGroup = { id: doc.id, ...data };
                    });

                    if (foundGroup) { setCurrentGroup(foundGroup); setView('member_dash'); }
                    else notify("Código inválido! Peça o código novo ao Administrador.");
                } catch(e) { notify("Erro ao buscar código."); }
                setLoading(false);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try { await window.firebaseModules.signInWithEmailAndPassword(auth, adminData.email, adminData.pass); } 
                catch(e) { notify("Email ou senha errados!"); setLoading(false); }
            };

            const handleAdminRegister = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const cred = await window.firebaseModules.createUserWithEmailAndPassword(auth, adminData.email, adminData.pass);
                    const groupData = { adminUid: cred.user.uid, members: [], transactions: [], payments: [], loans: [] };
                    await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'groups', cred.user.uid), groupData);
                    setCurrentGroup({ id: cred.user.uid, ...groupData }); setView('admin_dash');
                } catch(e) { notify("Erro! Senha muito curta ou email já usado."); setLoading(false); }
            };

            if(loading) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen relative bg-gray-50 font-sans">
                    {notification && <div className="fixed top-6 left-4 right-4 z-50 fade-in flex justify-center"><div className="bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-2xl font-bold text-sm w-full max-w-sm text-center">{notification}</div></div>}

                    {view === 'landing' && (
                        <div className="flex flex-col min-h-screen px-6 fade-in max-w-md mx-auto justify-center">
                            <div className="w-24 h-24 bg-indigo-600 text-white rounded-3xl flex items-center justify-center shadow-xl mx-auto mb-8"><Icon name="pie-chart" className="w-12 h-12" /></div>
                            <h1 className="text-4xl font-black text-gray-900 text-center mb-8">Fatura Família</h1>
                            
                            <form onSubmit={handleMemberLogin} className="bg-white p-6 rounded-3xl shadow-sm border mb-6">
                                <h2 className="font-bold text-gray-500 text-sm uppercase tracking-widest mb-4">Sou Familiar</h2>
                                <input placeholder="Seu Código (Ex: A1B2C3)" className="w-full p-4 border rounded-2xl font-mono text-center uppercase text-xl font-black outline-none mb-3 bg-gray-50" value={memberCode} onChange={e=>setMemberCode(e.target.value)} required />
                                <button className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black shadow-md">Ver Minha Fatura</button>
                            </form>
                            
                            <button onClick={() => setView('admin_login')} className="text-indigo-600 font-bold hover:underline py-4">Sou o Dono do Cartão (Entrar)</button>
                        </div>
                    )}

                    {view === 'admin_login' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in max-w-md mx-auto">
                            <button onClick={()=>setView('landing')} className="mb-8 font-bold text-gray-400 flex items-center gap-2"><Icon name="arrow-left"/> Voltar</button>
                            <h2 className="text-3xl font-black mb-6">Acesso Admin</h2>
                            <form onSubmit={handleAdminLogin} className="space-y-3 mb-6">
                                <input type="email" placeholder="Seu E-mail" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.email} onChange={e=>setAdminData({...adminData, email:e.target.value})} required />
                                <input type="password" placeholder="Sua Senha" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.pass} onChange={e=>setAdminData({...adminData, pass:e.target.value})} required />
                                <button className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-md">Entrar no Painel</button>
                            </form>
                            <button onClick={()=>setView('admin_register')} className="text-gray-500 font-bold hover:underline">Primeira vez? Criar meu grupo</button>
                        </div>
                    )}

                    {view === 'admin_register' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in max-w-md mx-auto">
                            <button onClick={()=>setView('admin_login')} className="mb-8 font-bold text-gray-400 flex items-center gap-2"><Icon name="arrow-left"/> Voltar</button>
                            <h2 className="text-3xl font-black mb-6 text-indigo-600">Criar Conta</h2>
                            <form onSubmit={handleAdminRegister} className="space-y-3">
                                <input type="email" placeholder="Crie um E-mail" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.email} onChange={e=>setAdminData({...adminData, email:e.target.value})} required />
                                <input type="password" placeholder="Crie uma Senha (mín. 6)" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.pass} onChange={e=>setAdminData({...adminData, pass:e.target.value})} minLength="6" required />
                                <button className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-md">Finalizar Cadastro</button>
                            </form>
                        </div>
                    )}

                    {view === 'admin_dash' && <AdminDashboard group={currentGroup} updateGroupData={updateGroup} notify={notify} />}
                    {view === 'member_dash' && <MemberDashboard group={currentGroup} memberCode={memberCode} onLogout={()=>setView('landing')} />}

                    {view === 'admin_dash' && (
                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-between items-center z-40 px-6">
                            <span className="font-black text-indigo-600">Fatura Família</span>
                            <button onClick={async()=>{await window.firebaseModules.signOut(auth); setView('landing');}} className="font-bold text-gray-400 hover:text-red-500 text-sm">Sair da Conta</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
