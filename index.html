<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fatura Família - Master</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fatura-familia';

        const { useState, useEffect, useMemo, Component } = React;
        let app, auth, db;

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return <div className="p-8 text-center mt-20 fade-in"><i data-lucide="alert-triangle" className="w-12 h-12 text-red-500 mx-auto mb-4"></i><h2 className="font-bold">Ops! Erro de tela.</h2><button onClick={() => window.location.reload()} className="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">Recarregar</button></div>;
                return this.props.children; 
            }
        }

        const Modal = ({ isOpen, onClose, title, children }) => {
            useEffect(() => {
                if (isOpen) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = '';
                return () => { document.body.style.overflow = ''; };
            }, [isOpen]);

            if (!isOpen) return null;
            
            const modalContent = (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[85vh]">
                        <div className="p-3.5 border-b flex justify-between items-center bg-gray-50 shrink-0">
                            <h3 className="text-[13px] font-black text-gray-800 uppercase tracking-wide">{title}</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-200/60 hover:bg-gray-200 rounded-lg text-gray-600"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-4 overflow-y-auto custom-scroll flex-1">{children}</div>
                    </div>
                </div>
            );

            return ReactDOM.createPortal(modalContent, document.body);
        };

        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(val) || 0);
        const generateCode = (len) => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let r = ''; for(let i=0;i<len;i++) r+=c.charAt(Math.floor(Math.random()*c.length)); return r; };
        const getCurrentMonthStr = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
        const safeExtractMonth = (dateString) => { if (!dateString) return ''; const match = dateString.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/); if (!match) return ''; let mStr = match[1]; if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`; return mStr; };
        const parseMonthStr = (str) => { if(!str || str === 'Todos') return new Date(9999, 11); const [m, y] = str.split('/'); return new Date(y, m - 1); };
        const normalizeString = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
        
        const getTxMonth = (tx) => tx.invoiceMonth || safeExtractMonth(tx.date);

        const parseCSV = (csvText) => {
            const lines = csvText.split('\n').filter(l => l.trim() !== ''); const results = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i]; let inQuotes = false; let currentVal = ""; const values = [];
                for (let char of line) { if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ""; } else currentVal += char; }
                values.push(currentVal.trim());
                if (values.length >= 4) {
                    const date = values[0]; const desc = values[1]; const amount = parseFloat(values[3].replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                    if (date && desc && !isNaN(amount)) results.push({ date, description: desc, amount });
                }
            } return results;
        };

        const readPDFContent = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result); const pdf = await pdfjsLib.getDocument(typedarray).promise; let transactions = [];
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i); const textContent = await page.getTextContent(); let lines = [];
                            textContent.items.forEach(item => {
                                const y = Math.round(item.transform[5]); const x = Math.round(item.transform[4]); const str = item.str.trim(); if(!str) return;
                                let foundLine = lines.find(l => Math.abs(l.y - y) <= 5);
                                if(foundLine) foundLine.items.push({x, str}); else lines.push({y, items: [{x, str}]});
                            });
                            lines.sort((a,b) => b.y - a.y);
                            lines.forEach(line => {
                                line.items.sort((a,b) => a.x - b.x); const fullString = line.items.map(it => it.str).join(' ');
                                const dateMatch = fullString.match(/^(\d{2}\s+(?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)|\d{2}\/\d{2})/i);
                                if(dateMatch) {
                                    const dateStr = dateMatch[1]; const valueMatch = fullString.match(/(?:R\$)?\s*(-?\d{1,3}(?:\.\d{3})*,\d{2})$/);
                                    if(valueMatch) {
                                        const amount = parseFloat(valueMatch[1].replace(/\./g, '').replace(',', '.'));
                                        const desc = fullString.substring(dateMatch[0].length, fullString.length - valueMatch[0].length).trim();
                                        let finalDate = dateStr;
                                        if(/[a-z]/i.test(dateStr)) {
                                            const months = {'jan':'01','fev':'02','mar':'03','abr':'04','mai':'05','jun':'06','jul':'07','ago':'08','set':'09','out':'10','nov':'11','dez':'12'};
                                            const parts = dateStr.split(' '); finalDate = `${parts[0]}/${months[parts[1].toLowerCase()] || '01'}`;
                                        }
                                        transactions.push({ date: finalDate, description: desc, amount });
                                    }
                                }
                            });
                        } resolve(transactions);
                    } catch(e) { reject(e); }
                }; reader.readAsArrayBuffer(file);
            });
        };

        // PAINEL DO FAMILIAR (COM SIMULADOR/CALCULADORA DE PAGAMENTOS INTERATIVA)
        const MemberDashboard = ({ group, memberId, onLogout }) => {
            const member = group.members?.find(m => m.id === memberId);
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const [includeCardInCalc, setIncludeCardInCalc] = useState(true);
            const [selectedLoanIds, setSelectedLoanIds] = useState([]);
            
            const monthSummaries = useMemo(() => {
                if(!member) return []; const monthsData = {};
                (group.transactions || []).forEach(tx => {
                    const txMonth = getTxMonth(tx); if (!txMonth) return;
                    if (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId))) {
                        if (!monthsData[txMonth]) monthsData[txMonth] = { total: 0, paid: 0 };
                        monthsData[txMonth].total += tx.splits ? tx.splits.find(s=>s.memberId===memberId).amount : parseFloat(tx.amount || 0);
                    }
                });
                (group.payments || []).forEach(p => { if (p.memberId === memberId && monthsData[p.month]) monthsData[p.month].paid += parseFloat(p.amount || 0); });
                const currObj = parseMonthStr(getCurrentMonthStr());
                return Object.keys(monthsData).map(month => ({ month, rest: monthsData[month].total - monthsData[month].paid, dateObj: parseMonthStr(month) })).filter(m => !(m.dateObj < currObj && m.rest <= 0.05)).sort((a,b) => a.dateObj - b.dateObj);
            }, [group.transactions, group.payments, memberId]);
            
            const monthTxs = useMemo(() => {
                return (group.transactions || []).filter(tx => getTxMonth(tx) === selectedMonth && (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId)))).map(tx => ({ ...tx, displayAmount: tx.splits ? tx.splits.find(s => s.memberId === memberId).amount : parseFloat(tx.amount || 0) }));
            }, [group.transactions, selectedMonth, memberId]);
            
            const memberCardTxs = useMemo(() => monthTxs.filter(tx => tx.bank !== 'Empréstimo' && tx.type !== 'loan'), [monthTxs]);
            const memberLoanTxs = useMemo(() => monthTxs.filter(tx => tx.bank === 'Empréstimo' || tx.type === 'loan'), [monthTxs]);

            // Ao trocar de mês, seleciona o cartão e todos os empréstimos do mês por padrão
            useEffect(() => {
                setIncludeCardInCalc(true);
                setSelectedLoanIds(memberLoanTxs.map(l => l.id));
            }, [selectedMonth, memberLoanTxs.length]);

            useEffect(() => { lucide.createIcons(); });
            if (!member) return <div className="p-8 text-center font-bold text-gray-500">Familiar não encontrado.</div>;

            const cardTotal = memberCardTxs.reduce((acc, tx) => acc + tx.displayAmount, 0);
            const loanTotal = memberLoanTxs.reduce((acc, tx) => acc + tx.displayAmount, 0);
            
            const myPaidCard = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type !== 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            const myPaidLoan = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type === 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            
            const cardRest = cardTotal - myPaidCard;
            const loanRest = loanTotal - myPaidLoan;

            const isClosed = group.invoiceStatuses?.[selectedMonth] || false;

            const toggleLoanSelection = (loanId) => {
                setSelectedLoanIds(prev => prev.includes(loanId) ? prev.filter(id => id !== loanId) : [...prev, loanId]);
            };

            const selectedLoansSum = memberLoanTxs
                .filter(l => selectedLoanIds.includes(l.id))
                .reduce((acc, l) => acc + l.displayAmount, 0);

            const effectiveCardForCalc = includeCardInCalc ? Math.max(0, cardRest) : 0;
            // Se todos os empréstimos estiverem marcados e houver abatimento parcial, considera o abatimento
            const effectiveLoansForCalc = (selectedLoanIds.length === memberLoanTxs.length && myPaidLoan > 0)
                ? Math.max(0, selectedLoansSum - myPaidLoan)
                : selectedLoansSum;

            const calculatedTotalToPay = effectiveCardForCalc + effectiveLoansForCalc;
            const selectedCount = (includeCardInCalc && cardRest > 0 ? 1 : 0) + selectedLoanIds.length;

            return (
                <div className="pb-16 min-h-screen bg-gray-50 fade-in w-full overflow-x-hidden">
                    <div className="bg-gray-900 pt-6 pb-5 rounded-b-[2rem] shadow-xl text-white px-5">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-black text-lg">{member.name.charAt(0)}</div>
                                <div>
                                    <h1 className="font-black text-[15px]">{member.name}</h1>
                                    <p className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Mês de Referência: {selectedMonth}</p>
                                </div>
                            </div>
                            <button onClick={onLogout} className="text-gray-400 hover:text-white bg-white/10 p-2 rounded-xl"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                        </div>

                        {/* STATUS DA FATURA */}
                        <div className={`mb-3 p-2.5 rounded-xl flex items-center justify-between gap-2 text-[10px] font-bold border ${isClosed ? 'bg-red-500/15 text-red-300 border-red-500/30' : 'bg-green-500/15 text-green-300 border-green-500/30'}`}>
                            <div className="flex items-center gap-2">
                                <i data-lucide={isClosed ? 'lock' : 'unlock'} className="w-4 h-4 shrink-0"></i>
                                <span>{isClosed ? 'Fatura Fechada: O valor não sofrerá mais alterações.' : 'Fatura Aberta: O administrador ainda está lançando.'}</span>
                            </div>
                            <span className="text-[8px] font-black uppercase px-2 py-0.5 rounded bg-black/30 shrink-0">{isClosed ? 'Fechada' : 'Aberta'}</span>
                        </div>

                        {/* BLOCO SUPERIOR INTERATIVO: FATURA DO CARTÃO */}
                        <div className="mb-2">
                            <div 
                                onClick={() => setIncludeCardInCalc(!includeCardInCalc)}
                                className={`p-3 rounded-2xl border transition-all cursor-pointer flex justify-between items-center ${includeCardInCalc ? 'bg-indigo-950/80 border-indigo-500/60 shadow-md' : 'bg-gray-800/40 border-gray-800 opacity-60'}`}
                            >
                                <div className="flex items-center gap-3">
                                    <div className={`w-6 h-6 rounded-lg flex items-center justify-center border transition-colors shrink-0 ${includeCardInCalc ? 'bg-indigo-500 border-indigo-400 text-white' : 'border-gray-600 bg-gray-800 text-transparent'}`}>
                                        <i data-lucide="check" className="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p className="text-indigo-300 text-[10px] font-black uppercase tracking-widest mb-0.5">💳 Fatura dos Cartões ({selectedMonth})</p>
                                        <div className={`text-2xl font-black tracking-tight ${cardRest <= 0 ? 'text-green-400' : 'text-white'}`}>{formatMoney(cardRest)}</div>
                                    </div>
                                </div>
                                <span className="text-[9px] font-bold text-indigo-300 bg-indigo-500/20 px-2 py-1 rounded-lg border border-indigo-500/30">
                                    {includeCardInCalc ? 'Somando' : 'Ignorado'}
                                </span>
                            </div>

                            {/* BLOCO SEPARADO NO TOPO: EMPRÉSTIMOS MOSTRANDO O DIA E PERMITINDO SELECIONAR */}
                            <div className="mt-3 pt-3 border-t border-gray-800">
                                <div className="flex justify-between items-center mb-2">
                                    <p className="text-[10px] text-amber-400 uppercase font-black tracking-wider flex items-center gap-1.5">
                                        🏦 Empréstimos Separados ({memberLoanTxs.length})
                                    </p>
                                    {myPaidLoan > 0 && (
                                        <span className="text-[9px] bg-green-500/20 text-green-300 px-2 py-0.5 rounded font-bold">
                                            Abatido: {formatMoney(myPaidLoan)}
                                        </span>
                                    )}
                                </div>

                                {memberLoanTxs.length === 0 ? (
                                    <p className="text-[11px] text-gray-500 font-bold bg-gray-800/50 p-2.5 rounded-xl border border-gray-800">Nenhum empréstimo registrado para este mês.</p>
                                ) : (
                                    <div className="space-y-1.5">
                                        {memberLoanTxs.map(loan => {
                                            const loanDay = loan.date ? loan.date.substring(0,2) : '--';
                                            const isLoanSelected = selectedLoanIds.includes(loan.id);
                                            return (
                                                <div 
                                                    key={loan.id} 
                                                    onClick={() => toggleLoanSelection(loan.id)}
                                                    className={`p-2.5 rounded-xl flex justify-between items-center cursor-pointer border transition-all ${isLoanSelected ? 'bg-gray-800 border-amber-500/60 shadow-sm' : 'bg-gray-800/30 border-gray-800 opacity-55'}`}
                                                >
                                                    <div className="flex items-center gap-2.5 truncate pr-2">
                                                        <div className={`w-5 h-5 rounded-md flex items-center justify-center border transition-colors shrink-0 ${isLoanSelected ? 'bg-amber-500 border-amber-400 text-gray-950' : 'border-gray-600 bg-gray-900 text-transparent'}`}>
                                                            <i data-lucide="check" className="w-3.5 h-3.5"></i>
                                                        </div>
                                                        <div className="bg-amber-500 text-gray-950 font-black px-2 py-1 rounded-lg text-center shrink-0">
                                                            <span className="text-[8px] uppercase block leading-none">Dia</span>
                                                            <span className="text-[12px] leading-none">{loanDay}</span>
                                                        </div>
                                                        <div className="truncate">
                                                            <p className="text-[12px] font-bold text-white truncate">{loan.description}</p>
                                                            <p className="text-[9px] text-gray-400 font-bold uppercase">Vencimento dia {loan.date}</p>
                                                        </div>
                                                    </div>
                                                    <div className="text-[13px] font-black text-amber-400 shrink-0">
                                                        {formatMoney(loan.displayAmount)}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* CALCULADORA DE PAGAMENTO (SOMA DO QUE FOI SELECIONADO) */}
                            <div className="mt-3 bg-gradient-to-r from-emerald-950 to-teal-900 border border-emerald-500/40 p-3 rounded-2xl shadow-lg">
                                <div className="flex justify-between items-center mb-1">
                                    <span className="text-[9px] font-black uppercase tracking-wider text-emerald-300 flex items-center gap-1">
                                        <i data-lucide="calculator" className="w-3.5 h-3.5"></i> Soma para Pagamento ({selectedCount} {selectedCount === 1 ? 'item' : 'itens'})
                                    </span>
                                    <div className="flex gap-1.5">
                                        <button 
                                            onClick={() => { setIncludeCardInCalc(true); setSelectedLoanIds(memberLoanTxs.map(l => l.id)); }}
                                            className="text-[9px] font-bold bg-emerald-800/60 hover:bg-emerald-700/60 text-emerald-200 px-2 py-0.5 rounded border border-emerald-600/30"
                                        >
                                            Tudo
                                        </button>
                                        <button 
                                            onClick={() => { setIncludeCardInCalc(false); setSelectedLoanIds([]); }}
                                            className="text-[9px] font-bold bg-gray-900/50 hover:bg-gray-900/80 text-gray-300 px-2 py-0.5 rounded border border-white/10"
                                        >
                                            Limpar
                                        </button>
                                    </div>
                                </div>
                                <div className="flex justify-between items-baseline">
                                    <p className="text-[10px] text-emerald-200/80 font-medium">Toque nos itens acima p/ somar ou separar:</p>
                                    <span className="text-xl font-black text-emerald-400 tracking-tight">{formatMoney(calculatedTotalToPay)}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* CARROSSEL DE MESES */}
                    {monthSummaries.length > 0 && (
                        <div className="mt-4 w-full">
                            <div className="flex gap-2 overflow-x-auto hide-scroll pb-2 px-5">
                                {monthSummaries.map(({ month, rest }) => (
                                    <button key={month} onClick={() => setSelectedMonth(month)} className={`flex flex-col items-center justify-center p-2 rounded-2xl shrink-0 border transition-all w-[76px] shadow-sm ${selectedMonth === month ? 'bg-indigo-600 border-indigo-500 text-white transform scale-105' : 'bg-white border-gray-200 text-gray-600'}`}>
                                        <span className={`text-[9px] font-black uppercase mb-1 ${selectedMonth === month ? 'text-indigo-200' : 'text-gray-400'}`}>{month}</span>
                                        <span className={`font-black text-[10px] truncate w-full ${rest <= 0 ? 'text-green-500' : ''}`}>{formatMoney(rest)}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* LISTAGEM SEPARADA ABAIXO */}
                    <div className="px-3 mt-4 space-y-4">
                        {memberLoanTxs.length > 0 && (
                            <div className="space-y-1.5">
                                <h3 className="text-[10px] font-black uppercase text-gray-700 px-1 flex items-center gap-1.5">
                                    <i data-lucide="landmark" className="w-3.5 h-3.5 text-gray-800"></i> Empréstimos do Mês ({memberLoanTxs.length})
                                </h3>
                                {memberLoanTxs.map(tx => {
                                    const safeDateDisplay = tx.date ? tx.date.substring(0,2) : '--';
                                    const isLoanSelected = selectedLoanIds.includes(tx.id);
                                    return (
                                        <div 
                                            key={tx.id} 
                                            onClick={() => toggleLoanSelection(tx.id)}
                                            className={`bg-white p-2.5 rounded-xl shadow-sm border border-l-4 flex justify-between items-center cursor-pointer transition-opacity ${isLoanSelected ? 'border-gray-800' : 'border-gray-300 opacity-50'}`}
                                        >
                                            <div className="flex gap-2.5 items-center truncate pr-2">
                                                <div className="w-10 h-10 rounded-lg flex flex-col items-center justify-center shrink-0 border bg-gray-900 border-gray-800 text-white">
                                                    <span className="text-[7px] font-bold uppercase leading-none mb-0.5 text-amber-400">Dia</span>
                                                    <span className="text-[13px] font-black leading-none">{safeDateDisplay}</span>
                                                </div>
                                                <div className="truncate">
                                                    <p className="font-bold text-[11px] text-gray-900 truncate">{tx.description || 'Empréstimo'}</p>
                                                    <span className="text-[8px] font-bold px-1.5 py-0.5 rounded bg-gray-800 text-amber-400 uppercase inline-block mt-0.5">🏦 Vencimento Dia {safeDateDisplay}</span>
                                                </div>
                                            </div>
                                            <div className="font-black text-[12px] shrink-0 text-gray-900">{formatMoney(tx.displayAmount)}</div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        <div className="space-y-1.5">
                            <h3 className="text-[10px] font-black uppercase text-indigo-700 px-1 flex items-center gap-1.5">
                                <i data-lucide="credit-card" className="w-3.5 h-3.5 text-indigo-600"></i> Compras nos Cartões ({memberCardTxs.length})
                            </h3>
                            {memberCardTxs.length === 0 ? (
                                <p className="text-center text-gray-400 text-[11px] py-6 bg-white rounded-2xl border border-dashed">Nenhuma compra de cartão registrada neste mês.</p>
                            ) : memberCardTxs.map(tx => {
                                const safeDateDisplay = tx.date ? tx.date.substring(0,2) : '--';
                                return (
                                    <div key={tx.id} className="bg-white p-2.5 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-indigo-500 flex justify-between items-center">
                                        <div className="flex gap-2.5 items-center truncate pr-2">
                                            <div className="w-9 h-9 rounded-lg flex flex-col items-center justify-center shrink-0 border bg-indigo-50 border-indigo-100">
                                                <span className="text-[7px] font-bold uppercase leading-none mb-0.5 text-indigo-400">Dia</span>
                                                <span className="text-[12px] font-black leading-none text-indigo-900">{safeDateDisplay}</span>
                                            </div>
                                            <div className="truncate">
                                                <p className="font-bold text-[11px] text-gray-900 truncate">{tx.description || 'Sem descrição'}</p>
                                                <div className="flex gap-1 mt-0.5">
                                                    <span className="text-[8px] font-bold px-1.5 py-0.5 rounded border bg-gray-50 text-gray-500 uppercase">{tx.bank || 'Cartão'}</span>
                                                    {tx.splits && tx.splits.length > 0 && <span className="text-[8px] font-bold px-1.5 py-0.5 rounded bg-blue-50 text-blue-600 uppercase">Rateio</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="font-black text-[12px] shrink-0 text-gray-900">{formatMoney(tx.displayAmount)}</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ group, updateGroupData }) => {
            const [activeTab, setActiveTab] = useState('transactions');
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const [banks, setBanks] = useState(group.banks || [{name: 'Nubank', color: '#8b5cf6'}, {name: 'Inter', color: '#f97316'}]);
            
            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [importPreview, setImportPreview] = useState([]);
            const [selectedBank, setSelectedBank] = useState(banks[0]?.name || 'Cartão');
            const [replaceBank, setReplaceBank] = useState(false);

            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [isCustomSplit, setIsCustomSplit] = useState(false);
            const [customSplitsValues, setCustomSplitsValues] = useState({});
            
            const [bulkSelection, setBulkSelection] = useState([]);
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [paymentModal, setPaymentModal] = useState({ open: false, memberId: null, type: 'cartao', amount: '' });
            const [confirmAction, setConfirmAction] = useState(null);
            
            const [newMemberName, setNewMemberName] = useState('');
            const [newBankName, setNewBankName] = useState('');
            const [newBankColor, setNewBankColor] = useState('#8b5cf6');
            const [filterBank, setFilterBank] = useState('Todos');
            
            useEffect(() => { if (group && !group.shortCode) updateGroupData({ shortCode: generateCode(6) }); }, [group?.shortCode]);

            const availableMonths = useMemo(() => {
                const mSet = new Set(); (group.transactions || []).forEach(tx => { const m = getTxMonth(tx); if(m) mSet.add(m); });
                mSet.add(getCurrentMonthStr());
                return ['Todos', ...Array.from(mSet).sort((a,b) => parseMonthStr(a) - parseMonthStr(b))];
            }, [group.transactions]);

            const { cardTxs, loanTxs } = useMemo(() => {
                const c = []; const l = [];
                (group.transactions || []).forEach(tx => {
                    const m = getTxMonth(tx);
                    if (selectedMonth === 'Todos' || m === selectedMonth) {
                        if (tx.bank === 'Empréstimo' || tx.type === 'loan') l.push(tx); 
                        else if (filterBank === 'Todos' || tx.bank === filterBank) c.push(tx);
                    }
                }); return { cardTxs: c, loanTxs: l };
            }, [group.transactions, selectedMonth, filterBank]);

            const unassignedTxs = cardTxs.filter(t => !t.assignedTo && (!t.splits || t.splits.length === 0));
            const assignedTxs = cardTxs.filter(t => t.assignedTo || (t.splits && t.splits.length > 0));

            const isClosed = group.invoiceStatuses?.[selectedMonth] || false;
            const toggleInvoiceStatus = async () => {
                if (selectedMonth === 'Todos') return;
                const newStatus = !isClosed;
                await updateGroupData({
                    invoiceStatuses: { ...(group.invoiceStatuses || {}), [selectedMonth]: newStatus }
                });
            };

            useEffect(() => { lucide.createIcons(); });

            const handleFileUpload = async (e) => {
                const file = e.target.files[0]; if(!file) return;
                let txs = [];
                if(file.name.toLowerCase().endsWith('.pdf')) txs = await readPDFContent(file);
                else if(file.name.toLowerCase().endsWith('.csv')) txs = parseCSV(await file.text());
                
                const targetMonth = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;

                const currentTxs = group.transactions || [];
                const marked = txs.map(tx => {
                    const normDesc = normalizeString(tx.description); const normVal = parseFloat(tx.amount).toFixed(2);
                    
                    const isDup = currentTxs.some(ctx => {
                        const valMatch = parseFloat(ctx.amount).toFixed(2) === normVal;
                        if (!valMatch) return false;
                        if (normalizeString(ctx.description) === normDesc) return true;
                        
                        const mCtx = ctx.description.match(/(\d+)\/(\d+)/);
                        const mTx = tx.description.match(/(\d+)\/(\d+)/);
                        if (mCtx && mTx) {
                            if (parseInt(mCtx[1]) === parseInt(mTx[1]) && parseInt(mCtx[2]) === parseInt(mTx[2])) {
                                const baseCtx = normalizeString(ctx.description.replace(mCtx[0], ''));
                                const baseTx = normalizeString(tx.description.replace(mTx[0], ''));
                                if (baseCtx === baseTx) return true; 
                            }
                        }
                        return false;
                    });
                    
                    let autoAssignedTo = null;
                    if (group.members) {
                        for (const m of group.members) {
                            if (m.cardEndings) {
                                const endings = m.cardEndings.split(',').map(s => s.trim()).filter(s => s);
                                if (endings.some(end => tx.description.includes(end))) { autoAssignedTo = m.id; break; }
                            }
                        }
                    }

                    let forward = []; const instMatch = tx.description.match(/(\d+)\/(\d+)/);
                    if(instMatch && !isDup) { 
                        const cur = parseInt(instMatch[1]); const tot = parseInt(instMatch[2]);
                        if(cur < tot) {
                            const [tM, tY] = targetMonth.split('/');
                            for(let i=1; i<=(tot-cur); i++) {
                                let newM = parseInt(tM) + i; let newY = parseInt(tY);
                                if(newM > 12) { newM -= 12; newY++; }
                                forward.push({ 
                                    id: crypto.randomUUID(), 
                                    date: tx.date, 
                                    description: tx.description.replace(`${cur}/${tot}`, `${cur+i}/${tot}`), 
                                    amount: tx.amount, 
                                    bank: selectedBank, 
                                    isFuture: true, 
                                    assignedTo: autoAssignedTo,
                                    invoiceMonth: `${String(newM).padStart(2,'0')}/${newY}` 
                                });
                            }
                        }
                    } return { ...tx, id: crypto.randomUUID(), selected: !isDup, isDup, forward, assignedTo: autoAssignedTo, invoiceMonth: targetMonth };
                });
                setImportPreview(marked); setIsImportModalOpen(true); e.target.value = null;
            };

            const confirmImport = async () => {
                const toAdd = [];
                importPreview.forEach(tx => { 
                    if(tx.selected) { 
                        toAdd.push({ id: tx.id, date: tx.date, description: tx.description, amount: tx.amount, bank: selectedBank, assignedTo: tx.assignedTo, invoiceMonth: tx.invoiceMonth }); 
                        if(tx.forward) tx.forward.forEach(f => toAdd.push(f)); 
                    } 
                });
                let updated = [...(group.transactions || [])];
                if(replaceBank) {
                    const selObj = parseMonthStr(selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth);
                    updated = updated.filter(tx => { if(tx.bank !== selectedBank) return true; return parseMonthStr(getTxMonth(tx)) < selObj; });
                }
                await updateGroupData({ transactions: [...updated, ...toAdd] }); setIsImportModalOpen(false);
            };

            // LANÇAMENTO MANUAL DE CARTÃO (VIA MODAL)
            const handleAddManualCard = async (e) => {
                e.preventDefault();
                const form = e.target;
                const date = form.date.value;
                const desc = form.desc.value;
                const amount = parseFloat(form.amount.value);
                const bankChoice = form.bankChoice?.value || selectedBank;
                const memberChoice = form.memberChoice?.value || null;
                if(!date || !desc || !amount) return;
                
                const targetMonth = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;

                const newTx = {
                    id: crypto.randomUUID(),
                    date,
                    description: desc,
                    amount,
                    assignedTo: memberChoice || null,
                    splits: null,
                    bank: bankChoice,
                    type: 'card',
                    invoiceMonth: targetMonth
                };
                await updateGroupData({ transactions: [...(group.transactions || []), newTx] });
                form.reset();
                setIsManualModalOpen(false);
            };

            // LANÇAMENTO MANUAL DE EMPRÉSTIMO COM PARCELAMENTO AUTOMÁTICO
            const handleAddLoan = async (e) => {
                e.preventDefault();
                const form = e.target;
                const rawDay = form.date.value.trim();
                const desc = form.desc.value; 
                const totalAmount = parseFloat(form.amount.value);
                const installments = parseInt(form.installments.value) || 1;
                const memberId = form.memberId.value;
                if(!rawDay || !desc || !totalAmount || !memberId) return;

                const baseMStr = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;
                const [bM, bY] = baseMStr.split('/');
                let currentMonth = parseInt(bM);
                let currentYear = parseInt(bY);
                
                const installmentAmount = (totalAmount / installments).toFixed(2);
                const newTxs = [];
                const dayClean = rawDay.substring(0, 2).padStart(2, '0');

                for(let i=1; i<=installments; i++) {
                    let mStr = `${String(currentMonth).padStart(2,'0')}/${currentYear}`;
                    newTxs.push({
                        id: crypto.randomUUID(),
                        date: `${dayClean}/${String(currentMonth).padStart(2,'0')}`,
                        description: installments > 1 ? `${desc} ${i}/${installments}` : desc,
                        amount: parseFloat(installmentAmount),
                        assignedTo: memberId,
                        splits: null,
                        bank: 'Empréstimo',
                        type: 'loan',
                        invoiceMonth: mStr
                    });
                    
                    currentMonth++;
                    if (currentMonth > 12) {
                        currentMonth = 1;
                        currentYear++;
                    }
                }

                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                form.reset();
            };

            const openEditTransaction = (tx) => {
                setAssignTx({...tx});
                let initialSelections = []; let splitsVals = {};
                if (tx.splits && tx.splits.length > 0) {
                    initialSelections = tx.splits.map(s => s.memberId);
                    tx.splits.forEach(s => splitsVals[s.memberId] = s.amount);
                    setIsCustomSplit(true);
                } else if (tx.assignedTo) {
                    initialSelections = [tx.assignedTo];
                    setIsCustomSplit(false);
                } else {
                    setIsCustomSplit(false);
                }
                setAssignSelections(initialSelections);
                setCustomSplitsValues(splitsVals);
            };

            const saveEdit = async () => {
                let assignedTo = null; let splits = null;
                if (assignSelections.length === 1) {
                    assignedTo = assignSelections[0];
                } else if (assignSelections.length > 1) {
                    if (isCustomSplit) {
                        splits = assignSelections.map(memberId => ({ memberId, amount: parseFloat(customSplitsValues[memberId]) || 0 }));
                    } else {
                        const amount = parseFloat(assignTx.amount) / assignSelections.length;
                        splits = assignSelections.map(memberId => ({ memberId, amount }));
                    }
                }
                
                let up = group.transactions.map(t => t.id === assignTx.id ? { ...t, date: assignTx.date, description: assignTx.description, amount: parseFloat(assignTx.amount), assignedTo, splits } : t);
                
                const instMatch = assignTx.description.match(/(\d+)\/(\d+)/);
                if (instMatch) {
                    const totalInst = parseInt(instMatch[2]);
                    const baseDesc = normalizeString(assignTx.description.replace(instMatch[0], ''));
                    up = up.map(t => {
                        if (t.id === assignTx.id) return t;
                        const tMatch = t.description.match(/(\d+)\/(\d+)/);
                        if (tMatch && parseInt(tMatch[2]) === totalInst) {
                            const tBase = normalizeString(t.description.replace(tMatch[0], ''));
                            if (tBase === baseDesc) {
                                return { ...t, assignedTo, splits };
                            }
                        }
                        return t;
                    });
                }

                await updateGroupData({ transactions: up }); setAssignTx(null);
            };

            const handleBulkDelete = () => {
                if (bulkSelection.length === 0) return;
                setConfirmAction({
                    message: `Excluir permanentemente ${bulkSelection.length} compras selecionadas?`,
                    onConfirm: async () => {
                        await updateGroupData({ transactions: group.transactions.filter(t => !bulkSelection.includes(t.id)) });
                        setBulkSelection([]);
                        setIsBulkMode(false);
                        setConfirmAction(null);
                    }
                });
            };

            const handleRollover = (memberId, amount) => {
                if (amount <= 0) return;
                setConfirmAction({
                    message: `Zerar neste mês e jogar ${formatMoney(amount)} para o próximo mês?`,
                    onConfirm: async () => {
                        const paym = { id: crypto.randomUUID(), memberId, amount, type: 'cartao', month: selectedMonth, date: new Date().toLocaleDateString('pt-BR') };
                        const currMObj = parseMonthStr(selectedMonth); let nextM = currMObj.getMonth() + 2; let nextY = currMObj.getFullYear();
                        if(nextM > 12) { nextM -= 12; nextY++; }
                        const targetInvoice = `${String(nextM).padStart(2,'0')}/${nextY}`;
                        const loan = { id: crypto.randomUUID(), date: `01/${String(nextM).padStart(2,'0')}`, description: `Rolagem ${selectedMonth}`, amount, assignedTo: memberId, bank: 'Empréstimo', type: 'loan', invoiceMonth: targetInvoice };
                        await updateGroupData({ payments: [...(group.payments || []), paym], transactions: [...(group.transactions || []), loan] });
                        setConfirmAction(null);
                    }
                });
            };

            const totals = {}; group.members?.forEach(m => totals[m.id] = { card:0, loan:0, pCard:0, pLoan:0 });
            (group.transactions || []).forEach(t => { 
                const m = getTxMonth(t); 
                if(selectedMonth === 'Todos' || m === selectedMonth) { 
                    const isL = t.bank === 'Empréstimo' || t.type === 'loan'; 
                    const key = isL ? 'loan' : 'card'; 
                    if (t.splits && t.splits.length > 0) {
                        t.splits.forEach(s => { if (totals[s.memberId]) totals[s.memberId][key] += parseFloat(s.amount || 0); });
                    } else if(t.assignedTo && totals[t.assignedTo]) {
                        totals[t.assignedTo][key] += parseFloat(t.amount||0); 
                    }
                } 
            });
            (group.payments || []).forEach(p => { if(selectedMonth === 'Todos' || p.month === selectedMonth) { if(totals[p.memberId]) { if(p.type === 'emprestimo') totals[p.memberId].pLoan += parseFloat(p.amount||0); else totals[p.memberId].pCard += parseFloat(p.amount||0); } } });

            const totalImportSelected = importPreview.filter(t => t.selected).reduce((acc, t) => acc + parseFloat(t.amount || 0), 0);

            const bankTotals = {};
            cardTxs.forEach(t => {
                const b = t.bank || 'Cartão';
                if (!bankTotals[b]) bankTotals[b] = 0;
                bankTotals[b] += parseFloat(t.amount || 0);
            });

            return (
                <div className="w-full max-w-lg mx-auto fade-in pb-20 overflow-x-hidden">
                    <div className="bg-gray-900 rounded-b-3xl p-4 text-white mb-4 shadow-xl mx-2 mt-2">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-black flex items-center gap-2"><i data-lucide="crown" className="text-yellow-400 w-5 h-5"></i> Admin</h1>
                            <div className="bg-white/10 px-3 py-1 rounded-lg text-center backdrop-blur-sm">
                                <p className="text-[9px] uppercase tracking-wider font-bold text-gray-400">Código da Família</p>
                                <div className="text-sm font-mono font-black">{group.shortCode || 'GERANDO'}</div>
                            </div>
                        </div>
                        <div className="bg-gray-800 p-2 rounded-xl flex items-center justify-between border border-gray-700">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-gray-300 ml-1">Fatura:</span>
                                <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-gray-900 text-white font-bold rounded-lg px-3 py-1 text-[13px] border border-gray-700 outline-none">
                                    {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                                </select>
                            </div>
                            {selectedMonth !== 'Todos' && (
                                <button onClick={toggleInvoiceStatus} className={`px-3 py-1.5 rounded-lg flex items-center gap-1.5 text-[10px] font-bold uppercase transition-colors shadow-sm ${isClosed ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-green-500/20 text-green-400 border border-green-500/30'}`}>
                                    <i data-lucide={isClosed ? 'lock' : 'unlock'} className="w-3.5 h-3.5"></i> {isClosed ? 'Fechada' : 'Aberta'}
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="flex px-2 space-x-2 mb-4 overflow-x-auto hide-scroll text-[11px] w-full">
                        <button onClick={()=>setActiveTab('transactions')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='transactions' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600'}`}>Extrato</button>
                        <button onClick={()=>setActiveTab('summary')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='summary' ? 'bg-green-600 text-white' : 'bg-white text-gray-600'}`}>Resumo</button>
                        <button onClick={()=>setActiveTab('loans')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='loans' ? 'bg-gray-800 text-white' : 'bg-white text-gray-600'}`}>Empréstimos</button>
                        <button onClick={()=>setActiveTab('config')} className={`shrink-0 px-4 py-2 rounded-xl font-bold shadow-sm ${activeTab==='config' ? 'bg-purple-600 text-white' : 'bg-white text-gray-600'}`}>Config</button>
                    </div>

                    <div className="px-2 w-full">
                        {activeTab === 'transactions' && (
                            <div className="space-y-3">
                                <div className="glass-card p-3.5 rounded-2xl flex justify-between items-center gap-2 border border-gray-200">
                                    <div className="flex-1">
                                        <h3 className="text-[10px] font-bold text-gray-500 uppercase">Importar PDF/CSV p/ {selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth}</h3>
                                        <select value={selectedBank} onChange={e=>setSelectedBank(e.target.value)} className="text-[12px] font-bold p-2 bg-gray-100 rounded-lg mt-1 outline-none w-full border">
                                            {banks.map(b => <option key={b.name} value={b.name}>{b.name}</option>)}
                                        </select>
                                    </div>
                                    <label className="bg-indigo-600 text-white p-3 rounded-xl cursor-pointer shadow-md shrink-0 transition-transform active:scale-95 flex items-center gap-1.5 text-[11px] font-bold">
                                        <i data-lucide="upload" className="w-4 h-4"></i> PDF
                                        <input type="file" className="hidden" accept=".pdf,.csv" onChange={handleFileUpload} />
                                    </label>
                                </div>
                                
                                <button 
                                    onClick={() => setIsManualModalOpen(true)} 
                                    className="w-full bg-white hover:bg-indigo-50 text-indigo-700 border border-indigo-200 py-3 px-4 rounded-2xl font-black text-[11px] uppercase tracking-wider shadow-sm flex items-center justify-center gap-2 transition-all active:scale-95"
                                >
                                    <i data-lucide="plus-circle" className="w-4 h-4 text-indigo-600"></i>
                                    Novo Lançamento Manual
                                </button>

                                <div className="flex justify-between items-center px-1 pt-1">
                                    <div className="flex items-center gap-2">
                                        <h3 className="font-bold text-gray-700 text-[12px]">Lançamentos</h3>
                                        <select value={filterBank} onChange={e=>setFilterBank(e.target.value)} className="text-[10px] font-bold p-1.5 bg-white rounded outline-none border text-gray-600">
                                            <option value="Todos">Todos os Cartões</option>
                                            {banks.map(b => <option key={b.name} value={b.name}>{b.name}</option>)}
                                        </select>
                                    </div>
                                    {isBulkMode ? (
                                        <div className="flex gap-1">
                                            <button onClick={() => setBulkSelection(bulkSelection.length === cardTxs.length ? [] : cardTxs.map(t=>t.id))} className="bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-[10px] font-bold">Todos</button>
                                            <button onClick={handleBulkDelete} className="bg-red-500 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold shadow">Apagar ({bulkSelection.length})</button>
                                            <button onClick={()=>{setIsBulkMode(false); setBulkSelection([]);}} className="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-[10px] font-bold">X</button>
                                        </div>
                                    ) : <button onClick={()=>setIsBulkMode(true)} className="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-[10px] font-bold"><i data-lucide="check-square" className="w-3 h-3 inline mr-1"></i>Sel. Vários</button>}
                                </div>
                                
                                <div className="flex gap-2 overflow-x-auto hide-scroll mb-2 px-1">
                                    {Object.entries(bankTotals).map(([b, total]) => (
                                        <div key={b} className="bg-white px-2.5 py-1.5 rounded-lg border border-gray-200 shadow-sm shrink-0 flex items-center gap-1.5">
                                            <span className="text-[9px] font-bold text-gray-500 uppercase">{b}</span>
                                            <span className="text-[11px] font-black text-gray-900">{formatMoney(total)}</span>
                                        </div>
                                    ))}
                                </div>

                                <div className="mb-4">
                                    <h4 className="text-[10px] font-black text-orange-600 mb-2 uppercase flex items-center gap-1 bg-orange-50 p-2 rounded-lg border border-orange-100"><i data-lucide="alert-circle" className="w-3.5 h-3.5"></i> Pendentes ({unassignedTxs.length})</h4>
                                    <div className="space-y-1.5">
                                        {unassignedTxs.length === 0 ? <p className="text-center text-gray-400 text-[11px] py-2">Tudo identificado!</p> : unassignedTxs.map(t => (
                                            <div key={t.id} className="bg-white p-2.5 rounded-xl shadow-sm border border-l-4 border-l-orange-400 flex items-center gap-2">
                                                {isBulkMode && <input type="checkbox" checked={bulkSelection.includes(t.id)} onChange={(e)=>{ if(e.target.checked) setBulkSelection([...bulkSelection, t.id]); else setBulkSelection(bulkSelection.filter(id=>id!==t.id)); }} className="w-5 h-5 rounded border-gray-300 shrink-0 text-indigo-600 focus:ring-indigo-500" />}
                                                <div className="flex-1 flex justify-between items-center overflow-hidden cursor-pointer" onClick={() => { if(!isBulkMode) openEditTransaction(t); }}>
                                                    <div className="truncate pr-2">
                                                        <p className="font-bold text-[11px] text-gray-900 truncate">{t.description}</p>
                                                        <p className="text-[9px] text-gray-500">{t.date} • {t.bank} <span className="text-orange-500 font-bold ml-1">Sem Dono</span></p>
                                                    </div>
                                                    <div className="font-black text-[13px] shrink-0 text-gray-900">{formatMoney(t.amount)}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                setUser(u); 
                                if(u && !u.isAnonymous) {
                                    const fallbackRef = window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', u.uid);
                                    const fallbackSnap = await window.firebaseModules.getDoc(fallbackRef);
                                    if(fallbackSnap.exists()) { setCurrentGroup({id: fallbackSnap.id, ...fallbackSnap.data()}); setView('admin'); } 
                                    else { const newGroup = { id: u.uid, adminUid: u.uid, shortCode: generateCode(6), members: [], transactions: [], banks: [{name:'Nubank', color:'#8b5cf6'}, {name:'Inter', color:'#f97316'}] }; await window.firebaseModules.setDoc(fallbackRef, newGroup); setCurrentGroup(newGroup); setView('admin'); }
                                }
                                setIsReady(true); 
                            });
                        } catch (e) { setIsReady(true); }
                    }
                }; init();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const docId = view === 'admin' ? user?.uid : currentGroup.id; if(!docId) return;
                const groupRef = window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', docId);
                const unsubscribe = window.firebaseModules.onSnapshot(groupRef, (docSnap) => { if (docSnap.exists()) setCurrentGroup({ id: docSnap.id, ...docSnap.data() }); }, () => {});
                return () => unsubscribe();
            }, [currentGroup?.id, view, user]);

            const updateGroupData = async (updates) => {
                if (!db || !currentGroup) return;
                try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', currentGroup.id), updates); } catch (e) {}
            };

            const handleLoginAdmin = async (e) => {
                e.preventDefault();
                setAuthNotice('');
                try {
                    const cred = await window.firebaseModules.signInWithEmailAndPassword(auth, adminEmail, adminPass);
                    const fallbackRef = window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', cred.user.uid);
                    const fallbackSnap = await window.firebaseModules.getDoc(fallbackRef);
                    if(fallbackSnap.exists()) { setCurrentGroup({id: fallbackSnap.id, ...fallbackSnap.data()}); setView('admin'); } 
                    else { const newGroup = { id: cred.user.uid, adminUid: cred.user.uid, shortCode: generateCode(6), members: [], transactions: [], banks: [{name:'Nubank', color:'#8b5cf6'}, {name:'Inter', color:'#f97316'}] }; await window.firebaseModules.setDoc(fallbackRef, newGroup); setCurrentGroup(newGroup); setView('admin'); }
                } catch(err) {
                    try {
                        const cred = await window.firebaseModules.createUserWithEmailAndPassword(auth, adminEmail, adminPass);
                        const newGroup = { id: cred.user.uid, adminUid: cred.user.uid, shortCode: generateCode(6), members: [], transactions: [], banks: [{name:'Nubank', color:'#8b5cf6'}, {name:'Inter', color:'#f97316'}] };
                        await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', envAppId, 'public', 'data', 'groups', cred.user.uid), newGroup);
                        setCurrentGroup(newGroup);
                        setView('admin');
                    } catch (ce) {
                        setAuthNotice("E-mail ou senha incorretos.");
                    }
                }
            };

            const handleLoginMember = async (e) => {
                e.preventDefault(); if (!db || !joinGroupCode.trim()) return;
                setAuthNotice('');
                try {
                    const code = joinGroupCode.trim().toUpperCase();
                    const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'artifacts', envAppId, 'public', 'data', 'groups'));
                    const querySnapshot = await window.firebaseModules.getDocs(q);
                    let foundGroup = null;
                    querySnapshot.forEach((doc) => { if (doc.data().shortCode === code) foundGroup = { id: doc.id, ...doc.data() }; });
                    
                    if (foundGroup) { setCurrentGroup(foundGroup); setView('member-select'); } 
                    else { setAuthNotice("Código não encontrado. Verifique com o administrador."); }
                } catch (e) { setAuthNotice("Erro ao buscar código."); }
            };

            if (!isReady) return <div className="flex h-screen items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-gray-50 font-sans w-full overflow-x-hidden">
                        {view === 'landing' && (
                            <div className="w-full max-w-sm mx-auto pt-4 px-4 space-y-3 fade-in">
                                <div className="text-center mb-2">
                                    <h1 className="text-xl font-black text-gray-900 tracking-tight">FaturaFamília</h1>
                                </div>
                                {authNotice && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 text-[11px] font-bold p-2.5 rounded-xl text-center">
                                        {authNotice}
                                    </div>
                                )}
                                <div className="bg-white p-3.5 rounded-2xl border-t-4 border-t-indigo-500 shadow-sm">
                                    <h2 className="text-[13px] font-black text-gray-800 mb-2 flex items-center gap-1.5"><i data-lucide="shield-check" className="w-4 h-4 text-indigo-600"></i> Dono / Admin</h2>
                                    <form onSubmit={handleLoginAdmin} className="space-y-2">
                                        <input type="email" placeholder="E-mail" className="w-full p-2 border rounded-lg bg-gray-50 outline-none text-[12px] font-bold" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} required />
                                        <input type="password" placeholder="Senha" className="w-full p-2 border rounded-lg bg-gray-50 outline-none text-[12px] font-bold" value={adminPass} onChange={e=>setAdminPass(e.target.value)} required />
                                        <button type="submit" className="w-full bg-indigo-600 text-white py-2 rounded-lg font-black text-[11px] uppercase tracking-wide shadow-sm">Acessar</button>
                                    </form>
                                </div>
                                <div className="bg-white p-3.5 rounded-2xl border-t-4 border-t-gray-800 shadow-sm">
                                    <h2 className="text-[13px] font-black text-gray-800 mb-2 flex items-center gap-1.5"><i data-lucide="users" className="w-4 h-4 text-gray-800"></i> Familiar</h2>
                                    <form onSubmit={handleLoginMember} className="space-y-2">
                                        <input type="text" placeholder="Código da Família" className="w-full p-2 border rounded-lg bg-gray-50 outline-none text-[12px] font-bold text-center tracking-widest uppercase" value={joinGroupCode} onChange={e=>setJoinGroupCode(e.target.value)} required />
                                        <button type="submit" className="w-full bg-gray-800 text-white py-2 rounded-lg font-black text-[11px] uppercase tracking-wide shadow-sm">Ver Minha Fatura</button>
                                    </form>
                                </div>
                            </div>
                        )}
                        
                        {view === 'member-select' && currentGroup && (
                            <div className="w-full max-w-sm mx-auto pt-8 px-4 space-y-5 fade-in text-center">
                                <h1 className="text-xl font-black text-gray-900 mb-4">Quem está acessando?</h1>
                                <div className="grid grid-cols-2 gap-3">
                                    {currentGroup.members?.map(m => (
                                        <button key={m.id} onClick={() => { setCurrentMemberId(m.id); setView('member'); }} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-500 transition-colors flex flex-col items-center gap-2">
                                            <div className="w-12 h-12 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-black text-xl">{m.name.charAt(0)}</div>
                                            <span className="font-bold text-gray-800 text-[13px]">{m.name}</span>
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => {setCurrentGroup(null); setView('landing');}} className="mt-10 text-gray-600 font-bold bg-gray-200 hover:bg-gray-300 transition-colors px-8 py-2.5 rounded-full text-[12px] uppercase tracking-wide">Voltar</button>
                            </div>
                        )}
                        
                        {view === 'admin' && currentGroup && (
                            <>
                                <nav className="bg-white border-b shadow-sm h-12 flex items-center px-4 justify-between sticky top-0 z-40">
                                    <span className="font-black text-indigo-700 text-[12px]"><i data-lucide="pie-chart" className="inline w-4 h-4"></i> FaturaFamília</span>
                                    <button onClick={()=>{window.firebaseModules.signOut(auth); setView('landing');}} className="text-[10px] font-bold text-gray-500 uppercase tracking-widest bg-gray-100 px-3 py-1.5 rounded-lg">Sair</button>
                                </nav>
                                <AdminDashboard group={currentGroup} updateGroupData={updateGroupData} />
                            </>
                        )}
                        {view === 'member' && currentGroup && currentMemberId && <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={() => {setCurrentMemberId(null); setView('landing');}} />}
                    </div>
                </ErrorBoundary>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
