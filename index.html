<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatura Família</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase Imports via CDN -->
    <script type="module">
        // Import Firebase functions directly from Google's CDN for use in a simple HTML file
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Expose them to the global scope so our React app can use them
        window.firebaseModules = {
            initializeApp, getAnalytics, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection
        };
    </script>

    <script type="text/babel" data-type="module">
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        // YOUR Custom Firebase Configuration
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7",
            measurementId: "G-TSEHV40NG1"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, auth, db, analytics;
        const { useState, useEffect, useRef, useMemo, Component } = React;

        // Escudo anti-falhas para evitar a tela branca
        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 text-center mt-20">
                            <i data-lucide="alert-triangle" className="w-12 h-12 text-red-500 mx-auto mb-4"></i>
                            <h2 className="text-xl font-bold text-gray-800">Ops! Algo deu errado.</h2>
                            <p className="text-gray-500 mt-2 text-sm">Tivemos um problema ao carregar as informações.</p>
                            <button onClick={() => window.location.reload()} className="mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">Recarregar Página</button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        // Utilitários
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(value) || 0);
        const generateCode = (length) => { const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let r = ''; for (let i = 0; i < length; i++) r += chars.charAt(Math.floor(Math.random() * chars.length)); return r; };
        const getCurrentMonthStr = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
        const parseMonthStr = (str) => { const [m, y] = str.split('/'); return new Date(y, m - 1); };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-screen sm:max-h-[90vh]">
                        <div className="p-3 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="text-[14px] font-black text-gray-800 uppercase tracking-wider">{title}</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-200/50 hover:bg-gray-200 rounded-lg text-gray-600 transition-colors"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-3 overflow-y-auto custom-scroll flex-1">{children}</div>
                    </div>
                </div>
            );
        };

        const LoadingSpinner = () => (
            <div className="flex flex-col items-center justify-center h-screen space-y-4">
                <div className="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            </div>
        );

        const AdminDashboard = ({ group, updateGroupData }) => {
            const [activeTab, setActiveTab] = useState('transactions'); // transactions, loans, members, summary
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const [newMemberName, setNewMemberName] = useState('');
            
            // Meses Disponíveis
            const availableMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => {
                    const match = tx.date.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/);
                    if (match) {
                        let mStr = match[1];
                        if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`;
                        months.add(mStr);
                    }
                });
                months.add(getCurrentMonthStr());
                return Array.from(months).sort((a, b) => parseMonthStr(a) - parseMonthStr(b));
            }, [group.transactions]);

            // Filtragem de Transações
            const { cardTransactions, loanTransactions } = useMemo(() => {
                let cards = []; let loans = [];
                (group.transactions || []).forEach(tx => {
                    const isLoan = tx.bank === 'Empréstimo' || tx.type === 'loan';
                    const txMonthMatch = tx.date.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/);
                    let txMonth = txMonthMatch ? txMonthMatch[1] : '';
                    if (txMonth.length === 2) txMonth += `/${new Date().getFullYear()}`;
                    
                    if (txMonth === selectedMonth) {
                        if (isLoan) loans.push(tx); else cards.push(tx);
                    }
                });
                return { cardTransactions: cards, loanTransactions: loans };
            }, [group.transactions, selectedMonth]);

            // UI Estados
            const [pasteText, setPasteText] = useState('');
            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [parsedPreview, setParsedPreview] = useState(null);
            const [importBank, setImportBank] = useState('Outros');
            
            // Edição/Atribuição
            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [isCustomSplit, setIsCustomSplit] = useState(false);
            const [customSplitsValues, setCustomSplitsValues] = useState({});

            // Pagamentos
            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentData, setPaymentData] = useState({ memberId: '', amount: '', type: 'cartao' });

            useEffect(() => { lucide.createIcons(); });

            // Handlers Membros
            const handleAddMember = async (e) => {
                e.preventDefault(); if (!newMemberName.trim()) return;
                const newMember = { id: crypto.randomUUID(), name: newMemberName.trim(), pin: Math.floor(1000 + Math.random() * 9000).toString() };
                await updateGroupData({ members: [...(group.members || []), newMember] });
                setNewMemberName('');
            };
            const handleRemoveMember = async (memberId) => {
                if(!window.confirm("Deseja realmente excluir este familiar?")) return;
                const updatedMembers = group.members.filter(m => m.id !== memberId);
                await updateGroupData({ members: updatedMembers });
            };

            // Edição de Transação (O Segredo para Editar Empréstimos e Cartões)
            const openEditTransaction = (tx) => {
                setAssignTx({...tx}); // Clone para edição
                let initialSelections = []; let splitsVals = {};
                if (tx.splits && tx.splits.length > 0) {
                    initialSelections = tx.splits.map(s => s.memberId);
                    tx.splits.forEach(s => splitsVals[s.memberId] = s.amount);
                    setIsCustomSplit(true);
                } else if (tx.assignedTo) {
                    initialSelections = [tx.assignedTo];
                    setIsCustomSplit(false);
                } else {
                    setIsCustomSplit(false);
                }
                setAssignSelections(initialSelections);
                setCustomSplitsValues(splitsVals);
                setIsAssignModalOpen(true);
            };

            const handleSaveTransaction = async () => {
                let assignedTo = null; let splits = null;
                if (assignSelections.length === 1) {
                    assignedTo = assignSelections[0];
                } else if (assignSelections.length > 1) {
                    if (isCustomSplit) {
                        splits = assignSelections.map(memberId => ({ memberId, amount: parseFloat(customSplitsValues[memberId]) || 0 }));
                    } else {
                        const amount = assignTx.amount / assignSelections.length;
                        splits = assignSelections.map(memberId => ({ memberId, amount }));
                    }
                }

                const updatedTransactions = group.transactions.map(tx => {
                    if (tx.id === assignTx.id) {
                        return { ...tx, date: assignTx.date, description: assignTx.description, amount: parseFloat(assignTx.amount) || 0, assignedTo, splits };
                    }
                    return tx;
                });
                await updateGroupData({ transactions: updatedTransactions });
                setIsAssignModalOpen(false);
            };

            const handleDeleteTransaction = async () => {
                if(!window.confirm("Excluir este lançamento permanentemente?")) return;
                const updatedTransactions = group.transactions.filter(tx => tx.id !== assignTx.id);
                await updateGroupData({ transactions: updatedTransactions });
                setIsAssignModalOpen(false);
            };

            // Adição Manual (Cartão ou Empréstimo)
            const handleAddManual = async (e, type) => {
                e.preventDefault();
                const form = e.target;
                const date = form.date.value; const desc = form.desc.value; const amount = parseFloat(form.amount.value);
                if(!date || !desc || !amount) return;

                const newTx = {
                    id: crypto.randomUUID(), date, description: desc, amount, assignedTo: null, splits: null,
                    bank: type === 'loan' ? 'Empréstimo' : 'Manual', type
                };
                await updateGroupData({ transactions: [...(group.transactions || []), newTx] });
                form.reset();
            };

            // Sistema de Pagamentos e Baixas
            const handleAddPayment = async (e) => {
                e.preventDefault();
                const amt = parseFloat(paymentData.amount);
                if(!amt || amt <= 0) return;
                
                const newPayment = {
                    id: crypto.randomUUID(), memberId: paymentData.memberId, amount: amt,
                    type: paymentData.type, month: selectedMonth, date: new Date().toLocaleDateString('pt-BR')
                };
                await updateGroupData({ payments: [...(group.payments || []), newPayment] });
                setIsPaymentModalOpen(false); setPaymentData({ memberId: '', amount: '', type: 'cartao' });
            };

            const handleDeletePayment = async (paymentId) => {
                if(!window.confirm("Excluir este pagamento? O valor voltará para a dívida.")) return;
                await updateGroupData({ payments: (group.payments || []).filter(p => p.id !== paymentId) });
            };

            // Resumo do Mês
            const calculateTotals = () => {
                const sums = { unassigned: 0 };
                group.members?.forEach(m => sums[m.id] = { card: 0, loan: 0, paidCard: 0, paidLoan: 0 });
                
                // Soma Dívidas do Mês Selecionado
                group.transactions?.forEach(tx => {
                    const txMonthMatch = tx.date.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/);
                    let txMonth = txMonthMatch ? txMonthMatch[1] : '';
                    if (txMonth.length === 2) txMonth += `/${new Date().getFullYear()}`;
                    
                    if (txMonth === selectedMonth) {
                        const isLoan = tx.bank === 'Empréstimo' || tx.type === 'loan';
                        const typeKey = isLoan ? 'loan' : 'card';

                        if (tx.splits && tx.splits.length > 0) {
                            let alloc = 0;
                            tx.splits.forEach(s => {
                                if (sums[s.memberId]) { sums[s.memberId][typeKey] += s.amount; alloc += s.amount; }
                            });
                            if (Math.abs(tx.amount - alloc) > 0.02 && !isLoan) sums.unassigned += (tx.amount - alloc);
                        } else if (tx.assignedTo && sums[tx.assignedTo]) {
                            sums[tx.assignedTo][typeKey] += tx.amount;
                        } else if (!isLoan) {
                            sums.unassigned += tx.amount;
                        }
                    }
                });

                // Abate Pagamentos do Mês Selecionado
                (group.payments || []).forEach(p => {
                    if (p.month === selectedMonth && sums[p.memberId]) {
                        if (p.type === 'emprestimo') sums[p.memberId].paidLoan += p.amount;
                        else sums[p.memberId].paidCard += p.amount;
                    }
                });

                return sums;
            };

            const totals = calculateTotals();
            const grandTotalCard = cardTransactions.reduce((acc, curr) => acc + curr.amount, 0);

            return (
                <div className="max-w-4xl mx-auto fade-in">
                    {/* Header Admin */}
                    <div className="bg-gray-900 rounded-b-3xl p-4 text-white mb-4 shadow-xl">
                        <div className="flex justify-between items-center mb-3">
                            <h1 className="text-lg font-black tracking-tight">Painel Administrador</h1>
                            <div className="bg-white/10 px-3 py-1 rounded-lg text-center backdrop-blur-sm">
                                <p className="text-[9px] uppercase tracking-wider font-bold text-gray-400">Código de Acesso</p>
                                <div className="text-sm font-mono font-black tracking-widest">{group.id}</div>
                            </div>
                        </div>
                        {/* Seletor de Mês Global */}
                        <div className="bg-gray-800 p-2 rounded-xl flex items-center justify-between border border-gray-700">
                            <span className="text-xs font-bold text-gray-300 ml-1"><i data-lucide="calendar" className="w-4 h-4 inline mr-1"></i> Fatura Atual:</span>
                            <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="bg-gray-900 text-white font-bold rounded-lg px-3 py-1.5 text-xs outline-none border border-gray-700">
                                {availableMonths.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                    </div>

                    {/* Tabs de Navegação */}
                    <div className="flex px-2 space-x-2 mb-4 overflow-x-auto hide-scroll text-[11px]">
                        <button onClick={() => setActiveTab('transactions')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap transition-all shadow-sm ${activeTab === 'transactions' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-500 border border-gray-200'}`}>Extrato Cartão</button>
                        <button onClick={() => setActiveTab('loans')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap transition-all shadow-sm ${activeTab === 'loans' ? 'bg-gray-800 text-white' : 'bg-white text-gray-500 border border-gray-200'}`}>Empréstimos</button>
                        <button onClick={() => setActiveTab('summary')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap transition-all shadow-sm ${activeTab === 'summary' ? 'bg-green-600 text-white' : 'bg-white text-gray-500 border border-gray-200'}`}>Resumo & Baixas</button>
                        <button onClick={() => setActiveTab('members')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap transition-all shadow-sm ${activeTab === 'members' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-500 border border-gray-200'}`}>Familiares</button>
                    </div>

                    {/* CONTEÚDO DAS TABS */}
                    <div className="px-2 pb-10">
                        
                        {/* TAB: TRANSAÇÕES CARTÃO */}
                        {activeTab === 'transactions' && (
                            <div className="space-y-4 fade-in">
                                <div className="glass-card p-4 rounded-2xl flex items-center justify-between border-l-4 border-l-indigo-500">
                                    <div><h2 className="text-gray-500 text-[10px] font-bold uppercase tracking-wider">Total Cartão ({selectedMonth})</h2><p className="text-2xl font-black text-indigo-700">{formatMoney(grandTotalCard)}</p></div>
                                </div>
                                <div className="glass-card p-4 rounded-2xl">
                                    <h3 className="font-bold text-[11px] mb-3 text-gray-700 uppercase">Lançamento Rápido (Cartão)</h3>
                                    <form onSubmit={(e) => handleAddManual(e, 'card')} className="flex flex-col gap-2">
                                        <div className="flex gap-2"><input type="text" name="date" placeholder="DD/MM" className="w-1/3 p-2 border rounded-lg text-xs font-bold bg-gray-50 outline-none" required /><input type="number" name="amount" step="0.01" placeholder="Valor (R$)" className="w-2/3 p-2 border rounded-lg text-xs font-bold bg-gray-50 outline-none" required /></div>
                                        <input type="text" name="desc" placeholder="Descrição da compra..." className="p-2 border rounded-lg text-xs font-bold w-full bg-gray-50 outline-none" required />
                                        <button type="submit" className="bg-indigo-600 text-white py-2 rounded-lg text-xs font-bold shadow-sm">Lançar no Cartão</button>
                                    </form>
                                </div>
                                <div className="space-y-1.5">
                                    {cardTransactions.length === 0 && <p className="text-center text-gray-400 text-[11px] py-6 bg-white rounded-xl border">Nenhuma compra no cartão para este mês.</p>}
                                    {cardTransactions.map(tx => (
                                        <div key={tx.id} onClick={() => openEditTransaction(tx)} className="bg-white p-2.5 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center cursor-pointer hover:border-indigo-300">
                                            <div className="flex items-center gap-2 overflow-hidden">
                                                <div className="w-9 h-9 bg-gray-50 rounded-lg flex flex-col items-center justify-center border shrink-0"><span className="text-[7px] text-gray-400 font-bold leading-none uppercase">Dia</span><span className="text-[11px] font-black text-gray-800 leading-none">{tx.date.substring(0,2)}</span></div>
                                                <div className="truncate"><p className="font-bold text-gray-800 text-[11px] truncate">{tx.description}</p>
                                                <div className="flex mt-1">
                                                    {tx.splits?.length > 0 ? <span className="bg-blue-100 text-blue-700 text-[8px] font-bold px-1.5 py-0.5 rounded">Rateio ({tx.splits.length})</span> : tx.assignedTo ? <span className="bg-indigo-50 text-indigo-700 text-[8px] font-bold px-1.5 py-0.5 rounded border border-indigo-100">{group.members?.find(m => m.id === tx.assignedTo)?.name || 'Desconhecido'}</span> : <span className="bg-yellow-100 text-yellow-700 text-[8px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1"><i data-lucide="alert-circle" className="w-2.5 h-2.5"></i> Sem Dono</span>}
                                                </div>
                                                </div>
                                            </div>
                                            <div className="font-black text-gray-900 text-[11px] shrink-0 ml-2">{formatMoney(tx.amount)}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: EMPRÉSTIMOS */}
                        {activeTab === 'loans' && (
                            <div className="space-y-4 fade-in">
                                <div className="bg-gray-100 border border-gray-200 p-3 rounded-2xl"><p className="text-gray-600 text-[10px] font-bold text-center leading-relaxed">Empréstimos não se misturam com a fatura do seu cartão de crédito.<br/>Eles são adicionados diretamente na dívida final do familiar.</p></div>
                                <div className="glass-card p-4 rounded-2xl border-t-4 border-t-gray-800">
                                    <h3 className="font-bold text-[11px] mb-3 text-gray-700 uppercase"><i data-lucide="hand-coins" className="w-3 h-3 inline"></i> Novo Empréstimo</h3>
                                    <form onSubmit={(e) => handleAddManual(e, 'loan')} className="flex flex-col gap-2">
                                        <div className="flex gap-2"><input type="text" name="date" placeholder="DD/MM" className="w-1/3 p-2 border rounded-lg text-xs font-bold bg-gray-50 outline-none" required /><input type="number" name="amount" step="0.01" placeholder="Valor (R$)" className="w-2/3 p-2 border rounded-lg text-xs font-bold bg-gray-50 outline-none" required /></div>
                                        <input type="text" name="desc" placeholder="Motivo do empréstimo..." className="p-2 border rounded-lg text-xs font-bold w-full bg-gray-50 outline-none" required />
                                        <button type="submit" className="bg-gray-800 text-white py-2 rounded-lg text-xs font-bold shadow-sm">Salvar Empréstimo</button>
                                    </form>
                                </div>
                                <div className="space-y-1.5">
                                    {loanTransactions.length === 0 && <p className="text-center text-gray-400 text-[11px] py-6 bg-white rounded-xl border">Nenhum empréstimo ativo neste mês.</p>}
                                    {loanTransactions.map(tx => (
                                        <div key={tx.id} onClick={() => openEditTransaction(tx)} className="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center cursor-pointer hover:border-gray-400">
                                            <div className="flex items-center gap-3 overflow-hidden">
                                                <div className="w-9 h-9 bg-gray-100 rounded-lg flex flex-col items-center justify-center border shrink-0"><span className="text-[7px] text-gray-500 font-bold leading-none uppercase">Dia</span><span className="text-[11px] font-black text-gray-900 leading-none">{tx.date.substring(0,2)}</span></div>
                                                <div className="truncate"><p className="font-bold text-gray-900 text-[12px] truncate">{tx.description}</p>
                                                <div className="flex mt-1">
                                                    {tx.assignedTo ? <span className="bg-gray-200 text-gray-700 text-[9px] font-bold px-1.5 py-0.5 rounded">{group.members?.find(m => m.id === tx.assignedTo)?.name}</span> : <span className="text-red-500 text-[9px] font-bold">Atribua um dono!</span>}
                                                </div>
                                                </div>
                                            </div>
                                            <div className="font-black text-gray-900 text-[12px] shrink-0 ml-2">{formatMoney(tx.amount)}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: RESUMO & BAIXAS */}
                        {activeTab === 'summary' && (
                            <div className="space-y-4 fade-in">
                                {totals.unassigned > 0.05 && ( <div className="p-3 bg-red-50 border border-red-200 rounded-2xl flex justify-between items-center"><div className="text-[10px] font-bold text-red-700 uppercase"><i data-lucide="alert-triangle" className="w-4 h-4 inline mb-0.5"/> Valores Sem Dono</div><div className="text-[14px] font-black text-red-700">{formatMoney(totals.unassigned)}</div></div> )}
                                
                                {group.members?.map(m => {
                                    const mTotals = totals[m.id];
                                    const cardRest = mTotals.card - mTotals.paidCard;

                                            <div className="grid grid-cols-2 gap-2 mb-3">
                                                <div className="bg-indigo-50/50 p-2 rounded-xl border border-indigo-50"><p className="text-[9px] text-indigo-700 font-bold uppercase mb-0.5">💳 Cartões</p><p className="text-[12px] font-black text-indigo-900">{formatMoney(cardRest)}</p></div>
                                                <div className="bg-gray-50 p-2 rounded-xl border border-gray-100"><p className="text-[9px] text-gray-600 font-bold uppercase mb-0.5">🏦 Empréstimos</p><p className="text-[12px] font-black text-gray-800">{formatMoney(loanRest)}</p></div>
                                            </div>

                                            {/* Botão de Receber */}
                                            <button onClick={() => { setPaymentData({ memberId: m.id, amount: '', type: 'cartao' }); setIsPaymentModalOpen(true); }} className="w-full bg-green-50 text-green-700 border border-green-200 py-2 rounded-xl font-bold text-[11px] flex items-center justify-center gap-1 hover:bg-green-100 transition-colors"><i data-lucide="check-circle" className="w-3.5 h-3.5"></i> Receber Pagamento</button>

                                            {/* Histórico de Baixas */}
                                            {mPayments.length > 0 && (
                                                <div className="mt-3 bg-green-50/30 rounded-xl p-2 border border-green-100">
                                                    <p className="text-[9px] font-bold text-green-800 uppercase mb-1.5 ml-1">Histórico de Baixas ({selectedMonth})</p>
                                                    <div className="space-y-1">
                                                        {mPayments.map(p => (
                                                            <div key={p.id} className="flex justify-between items-center bg-white p-1.5 rounded-lg border border-green-100 shadow-sm">

                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* TAB: FAMILIARES */}
                        {activeTab === 'members' && (

                                    <form onSubmit={handleAddMember} className="flex gap-2">

                                        <button type="submit" className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs">Adicionar</button>
                                    </form>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    {group.members?.sort((a,b)=>a.name.localeCompare(b.name)).map(m => (

                                            <div className="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-[11px] mx-auto mb-2">{m.name.charAt(0)}</div>
                                            <p className="font-bold text-gray-800 text-[11px] truncate">{m.name}</p>
                                            <div className="mt-1 bg-gray-100 text-gray-500 text-[9px] font-mono font-bold py-1 px-2 rounded">PIN: {m.pin}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* MODAL: EDITAR TRANSAÇÃO & RATEIO */}
                    <Modal isOpen={isAssignModalOpen} onClose={() => setIsAssignModalOpen(false)} title="Editar Lançamento">
                        {assignTx && (
                            <div className="space-y-3">
                                {/* Botões Topo */}
                                <div className="flex gap-2 mb-2">
                                    <button onClick={handleDeleteTransaction} className="bg-red-50 text-red-600 border border-red-200 py-2 px-3 rounded-xl font-bold text-[10px] flex items-center gap-1 shadow-sm"><i data-lucide="trash-2" className="w-3 h-3"/> Excluir</button>
                                    <button onClick={handleSaveTransaction} className="flex-1 bg-green-600 text-white py-2 px-3 rounded-xl font-black text-[10px] flex items-center justify-center gap-1 shadow-sm"><i data-lucide="check-circle" className="w-3 h-3"/> SALVAR ALTERAÇÕES</button>
                                </div>
                                
                                {/* Campos Editáveis */}
                                <div className="bg-gray-50 p-2 rounded-xl border border-gray-200 space-y-2">
                                    <div className="flex gap-2"><input type="text" value={assignTx.date} onChange={(e) => setAssignTx({...assignTx, date: e.target.value})} className="w-1/3 font-bold text-gray-800 bg-white border rounded-lg p-1.5 outline-none text-[10px] text-center" placeholder="Data" /><input type="number" step="0.01" value={assignTx.amount} onChange={(e) => setAssignTx({...assignTx, amount: e.target.value})} className="w-2/3 font-black text-indigo-700 bg-white border rounded-lg p-1.5 outline-none text-[12px] text-right" placeholder="Valor" /></div>
                                    <input type="text" value={assignTx.description} onChange={(e) => setAssignTx({...assignTx, description: e.target.value})} className="w-full font-bold text-gray-800 bg-white border rounded-lg p-1.5 outline-none text-[11px]" placeholder="Descrição da compra" />
                                </div>

                                <p className="text-[10px] font-bold text-gray-600 text-center uppercase tracking-wider mt-2">De quem é a conta?</p>
                                <div className="flex flex-wrap gap-1.5 justify-center">
                                    {group.members?.map(m => {
                                        const isSel = assignSelections.includes(m.id);
                                        return <div key={m.id} onClick={() => setAssignSelections(isSel ? assignSelections.filter(id=>id!==m.id) : [...assignSelections, m.id])} className={`px-2.5 py-1.5 border-2 rounded-lg cursor-pointer text-[9px] font-bold transition-all ${isSel ? 'border-indigo-600 bg-indigo-50 text-indigo-900 shadow-sm' : 'border-gray-200 text-gray-500 bg-white'}`}>{m.name}</div>

                                {/* Rateio Manual */}
                                {assignSelections.length > 1 && (
                                    <div className="p-2 bg-indigo-50/50 border border-indigo-100 rounded-xl mt-2 fade-in">
                                        <label className="flex items-center gap-1.5 text-[10px] font-bold text-indigo-900 cursor-pointer mb-2"><input type="checkbox" checked={isCustomSplit} onChange={e=>setIsCustomSplit(e.target.checked)} className="w-3 h-3 rounded text-indigo-600" /> Ativar Valores Quebrados Manuais</label>
                                        {isCustomSplit && assignSelections.map(mId => (
                                            <div key={mId} className="flex justify-between items-center bg-white p-1.5 border rounded-lg mb-1"><span className="text-[10px] font-bold text-gray-700">{group.members.find(m=>m.id===mId)?.name}</span><div className="flex items-center gap-1"><span className="text-[9px] text-gray-400 font-bold">R$</span><input type="number" step="0.01" value={customSplitsValues[mId]||''} onChange={e=>setCustomSplitsValues({...customSplitsValues, [mId]:e.target.value})} className="w-16 p-1 bg-gray-50 border rounded text-[11px] font-black text-right outline-none text-indigo-700" placeholder="0.00" /></div></div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </Modal>

                    {/* MODAL: REGISTRAR BAIXA (PAGAMENTO) */}
                    <Modal isOpen={isPaymentModalOpen} onClose={() => setIsPaymentModalOpen(false)} title="Registrar Pagamento">
                        <form onSubmit={handleAddPayment} className="space-y-3">
                            <div className="p-2 bg-gray-50 border border-gray-200 rounded-xl text-center"><p className="text-[10px] text-gray-500 font-bold uppercase mb-0.5">Pagamento de:</p><p className="text-[14px] font-black text-gray-900">{group.members?.find(m => m.id === paymentData.memberId)?.name}</p></div>
                            <div className="flex gap-2">
                                <label className={`flex-1 p-2 rounded-xl border-2 cursor-pointer text-center flex flex-col items-center gap-1 transition-all ${paymentData.type === 'cartao' ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 bg-white'}`}><input type="radio" name="payType" className="hidden" checked={paymentData.type === 'cartao'} onChange={() => setPaymentData({...paymentData, type: 'cartao'})}/><span className="text-[16px]">💳</span><span className={`text-[9px] font-bold ${paymentData.type === 'cartao' ? 'text-indigo-800' : 'text-gray-500'}`}>Fatura Cartão</span></label>
                                <label className={`flex-1 p-2 rounded-xl border-2 cursor-pointer text-center flex flex-col items-center gap-1 transition-all ${paymentData.type === 'emprestimo' ? 'border-gray-800 bg-gray-100' : 'border-gray-200 bg-white'}`}><input type="radio" name="payType" className="hidden" checked={paymentData.type === 'emprestimo'} onChange={() => setPaymentData({...paymentData, type: 'emprestimo'})}/><span className="text-[16px]">🏦</span><span className={`text-[9px] font-bold ${paymentData.type === 'emprestimo' ? 'text-gray-900' : 'text-gray-500'}`}>Empréstimo</span></label>
                            </div>
                            
                            {/* Botão Quitar Restante Inteligente */}
                            {(() => {
                                const mTotal = totals[paymentData.memberId] || {card:0, loan:0, paidCard:0, paidLoan:0};
                                const pending = paymentData.type === 'cartao' ? mTotal.card - mTotal.paidCard : mTotal.loan - mTotal.paidLoan;
                                if (pending > 0.02) {
                                    return <button type="button" onClick={() => setPaymentData({...paymentData, amount: pending.toFixed(2)})} className="w-full bg-purple-100 text-purple-700 py-2 rounded-xl text-[10px] font-bold flex items-center justify-center gap-1 border border-purple-200 shadow-sm"><i data-lucide="check-circle" className="w-3 h-3"></i> Quitar Restante ({formatMoney(pending)})</button>
                                } return null;
                            })()}

                            <div className="flex items-center gap-2 bg-gray-50 p-2 border rounded-xl"><span className="text-[12px] font-bold text-gray-400">R$</span><input type="number" step="0.01" className="w-full bg-transparent outline-none font-black text-[16px] text-gray-900" placeholder="0.00" value={paymentData.amount} onChange={e=>setPaymentData({...paymentData, amount:e.target.value})} required /></div>
                            <button type="submit" className="w-full bg-green-600 text-white py-3 rounded-xl font-black text-[11px] uppercase tracking-wider shadow-md">Confirmar Baixa</button>
                        </form>
                    </Modal>

                </div>
            );
        };

        const MemberDashboard = ({ group, memberId, onLogout }) => {
            const member = group.members?.find(m => m.id === memberId);
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            
            // Faxina de Meses e Timeline
            const monthSummaries = useMemo(() => {
                if(!member) return [];
                const monthsData = {};
                (group.transactions || []).forEach(tx => {
                    if (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId))) {
                        const mMatch = tx.date.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/);
                        let mStr = mMatch ? mMatch[1] : ''; if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`;
                        if (!monthsData[mStr]) monthsData[mStr] = { total: 0, paid: 0 };
                        monthsData[mStr].total += tx.splits ? tx.splits.find(s=>s.memberId===memberId).amount : tx.amount;
                    }
                });
                (group.payments || []).forEach(p => { if (p.memberId === memberId && monthsData[p.month]) { monthsData[p.month].paid += p.amount; } });
                
                const currentMonthDate = parseMonthStr(getCurrentMonthStr());
                const allMonths = Object.keys(monthsData).map(month => ({ month, rest: monthsData[month].total - monthsData[month].paid, dateObj: parseMonthStr(month) }));
                
                // Oculta meses passados que já estão pagos (Faxina)
                return allMonths.filter(m => !(m.dateObj < currentMonthDate && m.rest <= 0.05)).sort((a,b) => a.dateObj - b.dateObj);
            }, [group.transactions, group.payments, memberId]);

            useEffect(() => { if (monthSummaries.length > 0 && !monthSummaries.find(m => m.month === selectedMonth)) { const curr = getCurrentMonthStr(); setSelectedMonth(monthSummaries.find(m => m.month === curr)?.month || monthSummaries[0].month); } }, [monthSummaries]);
            useEffect(() => { lucide.createIcons(); });

            if (!member) return <div className="p-8 text-center">Familiar não encontrado.</div>;

            // Filtra e separa Cartões e Empréstimos do Mês Selecionado
            const monthTxs = (group.transactions || []).filter(tx => {
                const mMatch = tx.date.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/); let mStr = mMatch ? mMatch[1] : ''; if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`;
                return mStr === selectedMonth && (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId)));
            }).map(tx => ({ ...tx, displayAmount: tx.splits ? tx.splits.find(s => s.memberId === memberId).amount : tx.amount })).sort((a,b) => {
                const isALoan = a.bank === 'Empréstimo' || a.type === 'loan'; const isBLoan = b.bank === 'Empréstimo' || b.type === 'loan';
                if (isALoan && !isBLoan) return -1; if (!isALoan && isBLoan) return 1; return 0;
            });

            const { cardTotal, loanTotal } = monthTxs.reduce((acc, tx) => { if (tx.bank === 'Empréstimo' || tx.type === 'loan') acc.loanTotal += tx.displayAmount; else acc.cardTotal += tx.displayAmount; return acc; }, {cardTotal: 0, loanTotal: 0});
            
            const myPaidCard = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type !== 'emprestimo').reduce((a,c)=>a+c.amount,0);
            const myPaidLoan = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type === 'emprestimo').reduce((a,c)=>a+c.amount,0);
            
            const finalCard = cardTotal - myPaidCard; const finalLoan = loanTotal - myPaidLoan;
            const grandTotalRest = finalCard + finalLoan;

            return (
                <ErrorBoundary>
                    <div className="pb-16 min-h-screen bg-gray-50">
                        {/* HEADER */}
                        <div className="bg-gray-900 pt-6 pb-5 rounded-b-[2rem] shadow-xl text-white px-5">
                            <div className="flex justify-between items-center mb-6">
                                <div className="flex items-center gap-3"><div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-black text-lg">{member.name.charAt(0)}</div><div><h1 className="font-black text-[15px]">{member.name}</h1><p className="text-gray-400 text-[9px] font-bold uppercase tracking-widest">Seu Painel</p></div></div>
                                <button onClick={onLogout} className="text-gray-400 hover:text-white bg-white/10 p-2 rounded-xl"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                            </div>
                            
                            <div className="mb-2">
                                <p className="text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-1">Total da Fatura ({selectedMonth})</p>
                                <div className={`text-4xl font-black tracking-tight ${grandTotalRest <= 0 ? 'text-green-400' : 'text-white'}`}>{formatMoney(grandTotalRest)}</div>
                                
                                {/* Divisão Visual Paga x Devida */}
                                <div className="flex gap-4 mt-4 pt-3 border-t border-gray-700/50">
                                    <div className="flex-1"><p className="text-[9px] text-gray-400 uppercase font-bold mb-0.5">💳 Cartões</p><p className="text-[12px] font-bold text-white">{formatMoney(finalCard)}</p></div>
                                    <div className="flex-1 border-l border-gray-700 pl-4"><p className="text-[9px] text-gray-400 uppercase font-bold mb-0.5">🏦 Empréstimos</p><p className="text-[12px] font-bold text-white">{formatMoney(finalLoan)}</p></div>
                                </div>
                            </div>
                        </div>

                        {/* CARROSSEL DE FATURAS (LINHA DO TEMPO) */}
                        {monthSummaries.length > 0 && (
                            <div className="mt-5">
                                <p className="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-2 px-5">Linha do Tempo (Previsão)</p>
                                <div className="flex gap-2 overflow-x-auto hide-scroll pb-2 px-5 custom-scroll">
                                    {monthSummaries.map(({ month, rest }) => (
                                        <button key={month} onClick={() => setSelectedMonth(month)} className={`flex flex-col items-center justify-center p-2 rounded-2xl shrink-0 border transition-all w-[72px] shadow-sm ${selectedMonth === month ? 'bg-indigo-600 border-indigo-500 text-white transform scale-105' : 'bg-white border-gray-200 text-gray-600'}`}>
                                            <span className={`text-[9px] font-black uppercase mb-1 ${selectedMonth === month ? 'text-indigo-200' : 'text-gray-400'}`}>{month}</span>
                                            <span className={`font-black text-[10px] truncate w-full ${rest <= 0 && selectedMonth !== month ? 'text-green-500' : ''}`}>{formatMoney(rest)}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* LISTA DE COMPRAS COMPACTA */}
                        <div className="px-3 mt-4 space-y-2">
                            <h3 className="font-bold text-gray-700 text-[11px] flex items-center gap-1.5 mb-2 px-2 uppercase"><i data-lucide="receipt" className="text-indigo-600 w-3.5 h-3.5"/> Detalhes de {selectedMonth}</h3>
                            {monthTxs.length === 0 && <p className="text-center text-gray-400 text-[11px] py-6 bg-white rounded-2xl border border-dashed shadow-sm">Ufa! Nenhuma cobrança neste mês.</p>}
                            <div className="space-y-1.5">
                                {monthTxs.map(tx => {
                                    const isLoan = tx.bank === 'Empréstimo' || tx.type === 'loan';
                                    return (
                                        <div key={tx.id} className={`bg-white p-2.5 rounded-xl shadow-sm border flex justify-between items-center ${isLoan ? 'border-gray-800 border-l-4' : 'border-gray-200 border-l-4 border-l-indigo-400'}`}>
                                            <div className="flex gap-2.5 items-center truncate pr-2">
                                                <div className={`w-9 h-9 rounded-lg flex flex-col items-center justify-center shrink-0 border ${isLoan ? 'bg-gray-100 border-gray-300' : 'bg-indigo-50 border-indigo-100'}`}><span className={`text-[7px] font-bold uppercase leading-none mb-0.5 ${isLoan ? 'text-gray-500' : 'text-indigo-400'}`}>Dia</span><span className={`text-[12px] font-black leading-none ${isLoan ? 'text-gray-900' : 'text-indigo-900'}`}>{tx.date.substring(0,2)}</span></div>
                                                <div className="truncate"><p className="font-bold text-[11px] text-gray-900 truncate">{tx.description}</p><div className="flex gap-1 mt-0.5">
                                                    {isLoan ? <span className="text-[8px] font-bold px-1.5 py-0.5 rounded bg-gray-800 text-white uppercase tracking-wider">🏦 Empréstimo</span> : <span className="text-[8px] font-bold px-1.5 py-0.5 rounded border bg-gray-50 text-gray-500 border-gray-200 uppercase">{tx.bank || 'Cartão'}</span>}
                                                    {tx.splits && tx.splits.length > 0 && <span className="text-[8px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">Sua parte</span>}
                                                </div></div>
                                            </div>
                                            <div className={`font-black text-[12px] shrink-0 ${tx.displayAmount < 0 ? 'text-green-600' : 'text-gray-900'}`}>{formatMoney(tx.displayAmount)}</div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                </ErrorBoundary>
            );
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('landing');
            const [currentGroup, setCurrentGroup] = useState(null);
            const [currentMemberId, setCurrentMemberId] = useState(null);
            const [joinGroupCode, setJoinGroupCode] = useState('');
            const [joinPin, setJoinPin] = useState('');
            const [loadingAction, setLoadingAction] = useState(false);

            useEffect(() => {
                const init = async () => {
                    if (firebaseConfig && window.firebaseModules) {
                        try {
                            app = window.firebaseModules.initializeApp(firebaseConfig);
                            auth = window.firebaseModules.getAuth(app); db = window.firebaseModules.getFirestore(app);
                            window.firebaseModules.onAuthStateChanged(auth, (u) => { setUser(u); setIsReady(true); });
                            if (initialAuthToken) await window.firebaseModules.signInWithCustomToken(auth, initialAuthToken);
                            else await window.firebaseModules.signInAnonymously(auth);
                        } catch (e) { setIsReady(true); }
                    } else setIsReady(true);
                }; init();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const groupRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', currentGroup.id);
                const unsubscribe = window.firebaseModules.onSnapshot(groupRef, (docSnap) => { if (docSnap.exists()) setCurrentGroup({ id: docSnap.id, ...docSnap.data() }); });
                return () => unsubscribe();
            }, [currentGroup?.id]);

            useEffect(() => { lucide.createIcons(); });

            const handleCreateGroup = async () => {
                if (!user || !db) return alert("Erro de conexão."); setLoadingAction(true);
                const newGroupId = generateCode(6);
                const groupData = { adminUid: user.uid, createdAt: new Date().toISOString(), members: [], transactions: [], payments: [] };
                try {
                    await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', newGroupId), groupData);
                    setCurrentGroup({ id: newGroupId, ...groupData }); setView('admin');
                } catch (e) { alert("Erro ao criar."); }
                setLoadingAction(false);
            };

            const handleLoginMember = async (e) => {
                e.preventDefault(); if (!db) return; setLoadingAction(true);
                try {
                    const docSnap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', joinGroupCode.toUpperCase().trim()));
                    if (docSnap.exists()) {
                        const data = docSnap.data(); const member = data.members?.find(m => m.pin === joinPin.trim());
                        if (member) { setCurrentGroup({ id: docSnap.id, ...data }); setCurrentMemberId(member.id); setView('member'); }
                        else if (data.adminUid === user.uid) { setCurrentGroup({ id: docSnap.id, ...data }); setView('admin'); }
                        else alert("PIN incorreto!");
                    } else alert("Grupo não encontrado.");
                } catch (e) { alert("Erro ao acessar."); } setLoadingAction(false);
            };

            const updateGroupData = async (updates) => {
                if (!db || !currentGroup) return;
                try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', currentGroup.id), updates); } 
                catch (e) { alert("Erro ao salvar."); }
            };

            if (!isReady) return <LoadingSpinner />;

            return (
                <div className="min-h-screen bg-gray-50 pb-12 font-sans">
                    {/* Header Landing */}
                    {view !== 'landing' && (
                        <nav className="bg-white border-b sticky top-0 z-40 shadow-sm h-14 flex items-center px-4 justify-between">
                            <div className="flex items-center gap-2 text-indigo-700 font-black text-[13px] cursor-pointer" onClick={() => {setCurrentGroup(null); setCurrentMemberId(null); setView('landing');}}><div className="bg-indigo-600 text-white p-1.5 rounded-lg"><i data-lucide="pie-chart" className="w-4 h-4"></i></div> FaturaFamília</div>
                        </nav>
                    )}
                    <main className={view === 'landing' ? "px-4 pt-10" : ""}>
                        {view === 'landing' && (
                            <div className="max-w-md mx-auto space-y-6 fade-in">
                                <div className="text-center space-y-2 mb-8"><h1 className="text-3xl font-black text-gray-900 tracking-tight">Fatura Família</h1><p className="text-sm text-gray-500">O fim das planilhas confusas.</p></div>
                                <div className="bg-white p-6 rounded-3xl border-t-4 border-t-indigo-500 shadow-sm">
                                    <h2 className="text-lg font-black text-gray-800 mb-1 flex items-center gap-2"><i data-lucide="settings" className="w-5 h-5 text-indigo-600"></i> Admin</h2>
                                    <p className="text-gray-500 mb-4 text-xs font-medium">Crie o grupo e gerencie as faturas.</p>
                                    <button onClick={handleCreateGroup} disabled={loadingAction} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-md">Criar Meu Grupo</button>
                                </div>
                                <div className="bg-white p-6 rounded-3xl border-t-4 border-t-gray-800 shadow-sm">
                                    <h2 className="text-lg font-black text-gray-800 mb-1 flex items-center gap-2"><i data-lucide="user-check" className="w-5 h-5 text-gray-800"></i> Familiar</h2>
                                    <p className="text-gray-500 mb-4 text-xs font-medium">Acesse com o PIN para ver o que você deve.</p>
                                    <form onSubmit={handleLoginMember} className="space-y-2">
                                        <input type="text" placeholder="Código (ex: XYZ789)" className="w-full p-3 border rounded-xl font-mono text-center uppercase text-sm font-bold bg-gray-50 outline-none" value={joinGroupCode} onChange={e => setJoinGroupCode(e.target.value)} required />
                                        <input type="text" placeholder="PIN de 4 dígitos" className="w-full p-3 border rounded-xl font-mono text-center tracking-widest text-sm font-bold bg-gray-50 outline-none" value={joinPin} onChange={e => setJoinPin(e.target.value)} required />
                                        <button type="submit" disabled={loadingAction} className="w-full bg-gray-800 text-white py-3 rounded-xl font-bold text-sm shadow-md">Acessar Minha Fatura</button>
                                    </form>
                                </div>
                            </div>
                        )}
                        {view === 'admin' && currentGroup && <AdminDashboard group={currentGroup} updateGroupData={updateGroupData} />}
                        {view === 'member' && currentGroup && currentMemberId && <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={() => {setCurrentGroup(null); setCurrentMemberId(null); setView('landing');}} />}
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
