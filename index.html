<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fatura Família - Master</title>
    
    <!-- Bibliotecas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'fatura-familia';

        const { useState, useEffect, useMemo, Component } = React;
        let app, auth, db;

        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) return <div className="p-8 text-center mt-20 fade-in"><i data-lucide="alert-triangle" className="w-12 h-12 text-red-500 mx-auto mb-4"></i><h2 className="font-bold">Ops! Erro de tela.</h2><button onClick={() => window.location.reload()} className="mt-4 bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold">Recarregar</button></div>;
                return this.props.children; 
            }
        }

        const Modal = ({ isOpen, onClose, title, children }) => {
            useEffect(() => {
                if (isOpen) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = '';
                return () => { document.body.style.overflow = ''; };
            }, [isOpen]);

            if (!isOpen) return null;
            
            const modalContent = (
                <div className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[88vh]">
                        <div className="p-3.5 border-b flex justify-between items-center bg-gray-50 shrink-0">
                            <h3 className="text-[13px] font-black text-gray-800 uppercase tracking-wide">{title}</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-200/60 hover:bg-gray-200 rounded-lg text-gray-600"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-4 overflow-y-auto custom-scroll flex-1">{children}</div>
                    </div>
                </div>
            );

            return ReactDOM.createPortal(modalContent, document.body);
        };

        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(val) || 0);
        const generateCode = (len) => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let r = ''; for(let i=0;i<len;i++) r+=c.charAt(Math.floor(Math.random()*c.length)); return r; };
        const getCurrentMonthStr = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
        const getNextMonthStr = (monthStr) => {
            if (!monthStr || monthStr === 'Todos') return getCurrentMonthStr();
            const [m, y] = monthStr.split('/');
            let nextM = parseInt(m) + 1;
            let nextY = parseInt(y);
            if (nextM > 12) { nextM = 1; nextY++; }
            return `${String(nextM).padStart(2, '0')}/${nextY}`;
        };
        const safeExtractMonth = (dateString) => { if (!dateString) return ''; const match = dateString.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/); if (!match) return ''; let mStr = match[1]; if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`; return mStr; };
        const parseMonthStr = (str) => { if(!str || str === 'Todos') return new Date(9999, 11); const [m, y] = str.split('/'); return new Date(y, m - 1); };
        const normalizeString = (str) => (str || '').normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
        
        const getTxMonth = (tx) => tx.invoiceMonth || safeExtractMonth(tx.date);

        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const normalizeTransactionSign = (desc, rawAmount, forceIsPayment = false) => {
            const cleanDesc = (desc || '').trim();
            const isPay = forceIsPayment || /^(?:pagamento\s+(?:da\s+fatura|em\s+\d|recebido)|pgto\s+fatura|pagamento\s+fatura|pgto\s+debito)/i.test(cleanDesc);
            const isRef = !isPay && /\b(?:estorno|devolu[çc][ãa]o|cr[ée]dito\s+de|desconto\s+na\s+fatura|cashback)\b/i.test(cleanDesc);

            const absVal = Math.abs(parseFloat(rawAmount) || 0);
            const finalAmount = isRef ? -absVal : absVal;
            return { amount: finalAmount, isPayment: isPay, isRefund: isRef };
        };

        const parseCSV = (csvText) => {
            const lines = csvText.split('\n').filter(l => l.trim() !== ''); const results = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i]; let inQuotes = false; let currentVal = ""; const values = [];
                for (let char of line) { if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ""; } else currentVal += char; }
                values.push(currentVal.trim());
                if (values.length >= 3) {
                    const date = values[0];
                    const desc = values[1];
                    const rawVal = values[values.length - 1];
                    const parsedNum = parseFloat(rawVal.replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                    if (date && desc && !isNaN(parsedNum)) {
                        const norm = normalizeTransactionSign(desc, parsedNum, false);
                        results.push({ date, description: desc, amount: norm.amount, isPayment: norm.isPayment, isRefund: norm.isRefund });
                    }
                }
            } return results;
        };

        const parseInvoiceLines = (rawLines) => {
            const monthsMap = {'jan':'01','fev':'02','mar':'03','abr':'04','mai':'05','mal':'05','jun':'06','jul':'07','ago':'08','set':'09','out':'10','nov':'11','dez':'12'};
            const transactions = [];
            let currentCardEnding = '';
            let inFutureSection = false;
            let addedPrevBalance = false;
            let lastOrphanDesc = '';
            let pendingDateDesc = null;

            const cleanAndFormatDesc = (rawDesc, cardEnd) => {
                let d = (rawDesc || '')
                    .replace(/Principal\s*\(R\$[\s\d.,]+\)\s*\+\s*Juros\s*\(R\$[\s\d.,]+\)/gi, '')
                    .replace(/Total a pagar:\s*R\$.*$/i, '')
                    .replace(/[-–•+]+\s*$/, '')
                    .replace(/\s+/g, ' ')
                    .trim();

                d = d.replace(/\(?\b(?:parcela|parc\.?)\s*(\d{1,2})\s*(?:de|\/)\s*(\d{1,2})\)?/gi, (_, c, t) => `${String(c).padStart(2, '0')}/${String(t).padStart(2, '0')}`);

                if (cardEnd && !d.includes(cardEnd)) {
                    d = `${d} [Cartão ${cardEnd}]`;
                }
                return d.trim();
            };

            const pushTransaction = (dateStr, rawDesc, numericVal, forceIsPayment = false) => {
                const desc = cleanAndFormatDesc(rawDesc, currentCardEnding);
                if (!desc || isNaN(numericVal)) return;
                if (!/[a-zA-ZÀ-ÿ]{2,}/.test(desc.replace(/\[Cartão \d+\]/g, ''))) return;

                const norm = normalizeTransactionSign(desc, numericVal, forceIsPayment);

                transactions.push({
                    date: dateStr,
                    description: desc,
                    amount: norm.amount,
                    isPayment: norm.isPayment,
                    isRefund: norm.isRefund
                });
            };

            const expandedLines = [];

            rawLines.forEach(line => {
                const clean = line.replace(/\s+/g, ' ').trim();
                if (!clean) return;
                const withoutSub = clean.replace(/Principal\s*\(R\$[\s\d.,]+\)\s*\+\s*Juros\s*\(R\$[\s\d.,]+\)/gi, '').trim();
                if (!withoutSub) return;

                const segRegex = /(\d{2}[\s.\-\/]*(?:de[\s.\-\/]+)?(?:jan|fev|mar|abr|mai|mal|jun|jul|ago|set|out|nov|dez|0[1-9]|1[0-2])\.?(?:[\s.\-\/]+(?:de[\s.\-\/]+)?\d{2,4})?\b.+?[+-]?\s*R\$\s*[+-]?\s*\d{1,3}(?:\.\d{3})*,\d{2})/gi;
                const segMatches = withoutSub.match(segRegex);
                if (segMatches && segMatches.length > 1) {
                    segMatches.forEach(s => expandedLines.push(s.trim()));
                } else {
                    expandedLines.push(withoutSub);
                }
            });

            const dateRegex = /^(\d{2})[\s.\-\/]*(?:de[\s.\-\/]+)?(jan|fev|mar|abr|mai|mal|jun|jul|ago|set|out|nov|dez|0[1-9]|1[0-2])\.?(?:[\s.\-\/]+(?:de[\s.\-\/]+)?(\d{2,4}))?\b/i;
            const valueEndRegex = /([+-])?\s*(?:R\$)\s*([+-])?\s*(\d{1,3}(?:\.\d{3})*,\d{2})\s*[DC]?\s*$/i;

            for (let i = 0; i < expandedLines.length; i++) {
                const fullString = expandedLines[i];

                if (/^(?:pr[óo]xima\s+fatura|pr[óo]ximas\s+faturas|lan[çc]amentos\s+futuros)\b/i.test(fullString)) {
                    inFutureSection = true;
                    pendingDateDesc = null;
                    lastOrphanDesc = '';
                    continue;
                }
                if (/^(?:despesas\s+da\s+fatura|transa[çc][õo]es\s+de|detalhes\s+de\s+consumo|movimenta[çc][õo]es\s+na\s+fatura)\b/i.test(fullString)) {
                    inFutureSection = false;
                }
                if (inFutureSection) continue;

                const prevBalMatch = fullString.match(/^valor\s+pendente\s+do\s+m[êe]s\s+anterior\s+R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})$/i);
                if (prevBalMatch && !addedPrevBalance) {
                    addedPrevBalance = true;
                    const val = parseFloat(prevBalMatch[1].replace(/\./g, '').replace(',', '.'));
                    if (val > 0) {
                        transactions.push({
                            date: '01/10',
                            description: 'Valor Pendente do Mês Anterior (Rotativo/Atraso)',
                            amount: Math.abs(val),
                            isPayment: false,
                            isRefund: false
                        });
                    }
                    continue;
                }

                if (/^(?:total\b|pagamento\s+m[ií]nimo|vencimento|saldo\s+anterior|limite\s+total|limite\s+utilizado|limite\s+dispon[ií]vel|melhor\s+dia|fechamento\s+da\s+fatura|pr[óo]ximo\s+fechamento|consumos\s+de|fatura\s+anterior|pagamentos\s+e\s+financiamentos|data\s+movimenta)/i.test(fullString)) {
                    pendingDateDesc = null;
                    lastOrphanDesc = '';
                    continue;
                }

                const cardHeaderMatch = fullString.match(/^(?:cart[ãa]o|final)\b[^0-9]*?(?:\d{4}\s*)?[\*\•X\s\[(\-]*(\d{4})\b/i);
                if (cardHeaderMatch && !fullString.match(/R\$\s*\d+,\d{2}/i)) {
                    currentCardEnding = cardHeaderMatch[1];
                    pendingDateDesc = null;
                    lastOrphanDesc = '';
                    continue;
                }

                const dateMatch = fullString.match(dateRegex);
                if (dateMatch) {
                    const day = dateMatch[1];
                    const rawMonth = dateMatch[2].toLowerCase();
                    const month = monthsMap[rawMonth] || rawMonth.padStart(2, '0');
                    const yearPart = dateMatch[3] || '';
                    const finalDate = `${day}/${month}`;

                    const restAfterDate = fullString.substring(dateMatch[0].length).trim();

                    if (yearPart.length === 4 && /^\d{2}$/.test(dateMatch[2]) && !/[a-zA-ZÀ-ÿ]{4,}/.test(restAfterDate.replace(/R\$/g, ''))) {
                        continue;
                    }

                    const valueMatch = restAfterDate.match(valueEndRegex);
                    if (valueMatch) {
                        const hasPlus = valueMatch[1] === '+' || valueMatch[2] === '+';
                        const numericVal = parseFloat(valueMatch[3].replace(/\./g, '').replace(',', '.'));
                        let desc = restAfterDate.substring(0, restAfterDate.length - valueMatch[0].length).trim();

                        if (!desc && lastOrphanDesc) {
                            desc = lastOrphanDesc;
                        }
                        lastOrphanDesc = '';
                        pendingDateDesc = null;

                        const isInterCreditPayment = hasPlus && /pgto|pagamento|cr[ée]dito/i.test(desc);
                        pushTransaction(finalDate, desc, numericVal, isInterCreditPayment);
                    } else {
                        pendingDateDesc = {
                            date: finalDate,
                            desc: restAfterDate || lastOrphanDesc
                        };
                        lastOrphanDesc = '';
                    }
                    continue;
                }

                if (pendingDateDesc) {
                    const nubankInstMatch = fullString.match(/(?:divididos\s+em\s+\d+\s+parcelas\s+de|parcelado\s+em\s+\d+\s+vezes\s+de)\s*R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})/i);
                    if (nubankInstMatch) {
                        const numericVal = parseFloat(nubankInstMatch[1].replace(/\./g, '').replace(',', '.'));
                        pushTransaction(pendingDateDesc.date, pendingDateDesc.desc, numericVal, false);
                        pendingDateDesc = null;
                        continue;
                    }

                    const standaloneValMatch = fullString.match(valueEndRegex);
                    if (standaloneValMatch && !/^total\s+a\s+pagar/i.test(fullString)) {
                        const hasPlus = standaloneValMatch[1] === '+' || standaloneValMatch[2] === '+';
                        const numericVal = parseFloat(standaloneValMatch[3].replace(/\./g, '').replace(',', '.'));
                        const extraDesc = fullString.substring(0, fullString.length - standaloneValMatch[0].length).trim();
                        const combinedDesc = [pendingDateDesc.desc, extraDesc].filter(Boolean).join(' ');
                        const isInterCreditPayment = hasPlus && /pgto|pagamento|cr[ée]dito/i.test(combinedDesc);
                        pushTransaction(pendingDateDesc.date, combinedDesc, numericVal, isInterCreditPayment);
                        pendingDateDesc = null;
                        continue;
                    }

                    if (!/^total\s+a\s+pagar|^•|^saldo\s+parcelado|^valor\s+original/i.test(fullString)) {
                        pendingDateDesc.desc = [pendingDateDesc.desc, fullString].filter(Boolean).join(' ');
                    }
                    continue;
                }

                if (!fullString.includes('R$') && /[a-zA-ZÀ-ÿ]{3,}/.test(fullString) && fullString.length < 70) {
                    lastOrphanDesc = fullString;
                } else {
                    lastOrphanDesc = '';
                }
            }

            return transactions;
        };

        const readPDFContent = async (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let allRawLines = [];
                        let fullRawText = '';

                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            
                            const rawItems = textContent.items
                                .map(it => ({
                                    str: (it.str || '').trim(),
                                    x: it.transform[4],
                                    y: it.transform[5]
                                }))
                                .filter(it => it.str.length > 0);

                            rawItems.sort((a, b) => (Math.abs(b.y - a.y) > 2.2 ? b.y - a.y : a.x - b.x));

                            let lines = [];
                            rawItems.forEach(item => {
                                let foundLine = lines.find(l => Math.abs(l.y - item.y) <= 2.2);
                                if (foundLine) {
                                    foundLine.items.push(item);
                                } else {
                                    lines.push({ y: item.y, items: [item] });
                                }
                            });

                            lines.sort((a, b) => b.y - a.y);
                            lines.forEach(line => {
                                line.items.sort((a, b) => a.x - b.x);
                                const lineStr = line.items.map(it => it.str).join(' ');
                                allRawLines.push(lineStr);
                                fullRawText += lineStr + '\n';
                            });
                        }

                        let detectedBank = null;
                        if (/mercado\s*pago/i.test(fullRawText)) detectedBank = 'Mercado Pago';
                        else if (/banco\s*inter|077-9|super\s*app/i.test(fullRawText)) detectedBank = 'Inter';
                        else if (/nubank|nu\s*pagamentos|nupay/i.test(fullRawText)) detectedBank = 'Nubank';

                        const parsed = parseInvoiceLines(allRawLines);
                        resolve({ transactions: parsed, detectedBank });
                    } catch (e) { reject(e); }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        // PAINEL DO FAMILIAR
        const MemberDashboard = ({ group, memberId, onLogout }) => {
            const member = group.members?.find(m => m.id === memberId);
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const [includeCardInCalc, setIncludeCardInCalc] = useState(true);
            const [selectedLoanIds, setSelectedLoanIds] = useState([]);
            
            const monthSummaries = useMemo(() => {
                if(!member) return []; const monthsData = {};
                (group.transactions || []).forEach(tx => {
                    const txMonth = getTxMonth(tx); if (!txMonth) return;
                    if (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId))) {
                        if (!monthsData[txMonth]) monthsData[txMonth] = { total: 0, paid: 0 };
                        monthsData[txMonth].total += tx.splits ? tx.splits.find(s=>s.memberId===memberId).amount : parseFloat(tx.amount || 0);
                    }
                });
                (group.payments || []).forEach(p => { if (p.memberId === memberId && monthsData[p.month]) monthsData[p.month].paid += parseFloat(p.amount || 0); });
                const currObj = parseMonthStr(getCurrentMonthStr());
                return Object.keys(monthsData).map(month => ({ month, rest: monthsData[month].total - monthsData[month].paid, dateObj: parseMonthStr(month) })).filter(m => !(m.dateObj < currObj && m.rest <= 0.05)).sort((a,b) => a.dateObj - b.dateObj);
            }, [group.transactions, group.payments, memberId]);
            
            const monthTxs = useMemo(() => {
                return (group.transactions || []).filter(tx => getTxMonth(tx) === selectedMonth && (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId)))).map(tx => ({ ...tx, displayAmount: tx.splits ? tx.splits.find(s => s.memberId === memberId).amount : parseFloat(tx.amount || 0) }));
            }, [group.transactions, selectedMonth, memberId]);
            
            const memberCardTxs = useMemo(() => monthTxs.filter(tx => tx.bank !== 'Empréstimo' && tx.type !== 'loan'), [monthTxs]);
            const memberLoanTxs = useMemo(() => monthTxs.filter(tx => tx.bank === 'Empréstimo' || tx.type === 'loan'), [monthTxs]);

            useEffect(() => {
                setIncludeCardInCalc(true);
                setSelectedLoanIds(memberLoanTxs.map(l => l.id));
            }, [selectedMonth, memberLoanTxs.length]);

            useEffect(() => { lucide.createIcons(); });
            if (!member) return <div className="p-8 text-center font-bold text-gray-500">Familiar não encontrado.</div>;

            const cardTotal = memberCardTxs.reduce((acc, tx) => acc + tx.displayAmount, 0);
            const loanTotal = memberLoanTxs.reduce((acc, tx) => acc + tx.displayAmount, 0);
            
            const myPaidCard = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type !== 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            const myPaidLoan = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type === 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            
            const cardRest = cardTotal - myPaidCard;
            const loanRest = loanTotal - myPaidLoan;

            const isClosed = group.invoiceStatuses?.[selectedMonth] || false;

            const toggleLoanSelection = (loanId) => {
                setSelectedLoanIds(prev => prev.includes(loanId) ? prev.filter(id => id !== loanId) : [...prev, loanId]);
            };

            const selectedLoansSum = memberLoanTxs
                .filter(l => selectedLoanIds.includes(l.id))
                .reduce((acc, l) => acc + l.displayAmount, 0);

            const effectiveCardForCalc = includeCardInCalc ? Math.max(0, cardRest) : 0;
            const effectiveLoansForCalc = (selectedLoanIds.length === memberLoanTxs.length && myPaidLoan > 0)
                ? Math.max(0, selectedLoansSum - myPaidLoan)
                : selectedLoansSum;

            const calculatedTotalToPay = effectiveCardForCalc + effectiveLoansForCalc;
            const selectedCount = (includeCardInCalc && cardRest > 0 ? 1 : 0) + selectedLoanIds.length;

            return (
                <div className="pb-16 min-h-screen bg-gray-50 fade-in w-full overflow-x-hidden">
                    <div className="bg-gray-900 pt-6 pb-5 rounded-b-[2rem] shadow-xl text-white px-5">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-black text-lg">{member.name.charAt(0)}</div>
                                <div>
                                    <h1 className="font-black text-[15px]">{member.name}</h1>
                                    <p className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Mês de Referência: {selectedMonth}</p>
                                </div>
                            </div>
                            <button onClick={onLogout} className="text-gray-400 hover:text-white bg-white/10 p-2 rounded-xl"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                        </div>

                        <div className={`mb-3 p-2.5 rounded-xl flex items-center justify-between gap-2 text-[10px] font-bold border ${isClosed ? 'bg-red-500/15 text-red-300 border-red-500/30' : 'bg-green-500/15 text-green-300 border-green-500/30'}`}>

            );
        };

        const AdminDashboard = ({ group, updateGroupData }) => {
            const [activeTab, setActiveTab] = useState('transactions');
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const defaultBanksList = [{name: 'Nubank', color: '#8b5cf6'}, {name: 'Inter', color: '#f97316'}, {name: 'Mercado Pago', color: '#009ee3'}];
            const [banks, setBanks] = useState(() => {
                const existing = group.banks || defaultBanksList;
                const hasMP = existing.some(b => b.name.toLowerCase() === 'mercado pago');
                return hasMP ? existing : [...existing, {name: 'Mercado Pago', color: '#009ee3'}];
            });
            
            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            const [isPasteModalOpen, setIsPasteModalOpen] = useState(false);
            const [pasteRawText, setPasteRawText] = useState('');
            const [importTargetMonth, setImportTargetMonth] = useState(getCurrentMonthStr());

            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [isRenegotiateModalOpen, setIsRenegotiateModalOpen] = useState(false);
            const [importPreview, setImportPreview] = useState([]);
            const [selectedBank, setSelectedBank] = useState(banks[0]?.name || 'Cartão');
            const [replaceBank, setReplaceBank] = useState(false);

            // Estados da Renegociação Automática de Cartão
            const [renegBank, setRenegBank] = useState(banks[0]?.name || 'Inter');
            const [renegStartMonth, setRenegStartMonth] = useState(getCurrentMonthStr());
            const [renegFirstInstallmentMonth, setRenegFirstInstallmentMonth] = useState(getNextMonthStr(getCurrentMonthStr()));
            const [renegDueDay, setRenegDueDay] = useState('10');
            const [renegInstallments, setRenegInstallments] = useState(12);
            const [renegMonthlyValue, setRenegMonthlyValue] = useState('');
            const [renegParticipants, setRenegParticipants] = useState([]);
            const [renegCulprits, setRenegCulprits] = useState([]);
            const [renegSplitInterestMode, setRenegSplitInterestMode] = useState('proportional');
            const [renegDeductPaidInStartMonth, setRenegDeductPaidInStartMonth] = useState(true);
            const [renegManualOverrides, setRenegManualOverrides] = useState({});
            const [renegDownPayments, setRenegDownPayments] = useState({});
            const [copiedRenegSummary, setCopiedRenegSummary] = useState(false);

            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [isCustomSplit, setIsCustomSplit] = useState(false);
            const [customSplitsValues, setCustomSplitsValues] = useState({});
            
            const [bulkSelection, setBulkSelection] = useState([]);
            const [isBulkMode, setIsBulkMode] = useState(false);
            const [paymentModal, setPaymentModal] = useState({ open: false, memberId: null, type: 'cartao', amount: '' });
            const [confirmAction, setConfirmAction] = useState(null);
            
            const [newMemberName, setNewMemberName] = useState('');
            const [newBankName, setNewBankName] = useState('');
            const [newBankColor, setNewBankColor] = useState('#8b5cf6');
            const [filterBank, setFilterBank] = useState('Todos');
            
            useEffect(() => { if (group && !group.shortCode) updateGroupData({ shortCode: generateCode(6) }); }, [group?.shortCode]);

            const availableMonths = useMemo(() => {
                const mSet = new Set();
                (group.transactions || []).forEach(tx => { const m = getTxMonth(tx); if(m) mSet.add(m); });
                (group.payments || []).forEach(p => { if(p.month) mSet.add(p.month); });
                const now = new Date();
                for (let offset = -12; offset <= 12; offset++) {
                    const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
                    mSet.add(`${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`);
                }
                return ['Todos', ...Array.from(mSet).sort((a,b) => parseMonthStr(a) - parseMonthStr(b))];
            }, [group.transactions, group.payments]);

            const selectableInvoiceMonths = useMemo(() => availableMonths.filter(m => m !== 'Todos'), [availableMonths]);

            const { cardTxs, loanTxs } = useMemo(() => {
                const c = []; const l = [];
                (group.transactions || []).forEach(tx => {
                    const m = getTxMonth(tx);
                    if (selectedMonth === 'Todos' || m === selectedMonth) {
                        if (tx.bank === 'Empréstimo' || tx.type === 'loan') l.push(tx); 
                        else if (filterBank === 'Todos' || tx.bank === filterBank) c.push(tx);
                    }
                }); return { cardTxs: c, loanTxs: l };
            }, [group.transactions, selectedMonth, filterBank]);

            const negativeNonRefundTxs = useMemo(() => {
                return cardTxs.filter(t => parseFloat(t.amount) < 0 && !/\b(?:estorno|devolu[çc][ãa]o|cr[ée]dito|desconto)\b/i.test(t.description || ''));
            }, [cardTxs]);

            const fixNegativePurchases = async () => {
                const negIds = new Set(negativeNonRefundTxs.map(t => t.id));
                const updated = (group.transactions || []).map(tx => {
                    if (negIds.has(tx.id)) {
                        return {
                            ...tx,
                            amount: Math.abs(parseFloat(tx.amount) || 0),
                            splits: tx.splits ? tx.splits.map(s => ({ ...s, amount: Math.abs(parseFloat(s.amount) || 0) })) : null
                        };
                    }
                    return tx;
                });
                await updateGroupData({ transactions: updated });
            };

            const unassignedTxs = cardTxs.filter(t => !t.assignedTo && (!t.splits || t.splits.length === 0));
            const assignedTxs = cardTxs.filter(t => t.assignedTo || (t.splits && t.splits.length > 0));

            const isClosed = group.invoiceStatuses?.[selectedMonth] || false;
            const toggleInvoiceStatus = async () => {
                if (selectedMonth === 'Todos') return;
                const newStatus = !isClosed;
                await updateGroupData({
                    invoiceStatuses: { ...(group.invoiceStatuses || {}), [selectedMonth]: newStatus }
                });
            };

            useEffect(() => { lucide.createIcons(); });

            const buildImportPreview = (rawTxs, targetMonth, bankForPreview = selectedBank) => {
                const currentTxs = group.transactions || [];
                return rawTxs.map(tx => {
                    const normDesc = normalizeString(tx.description);
                    const normVal = Math.abs(parseFloat(tx.amount)).toFixed(2);
                    
                    const isDup = currentTxs.some(ctx => {
                        const valMatch = Math.abs(parseFloat(ctx.amount)).toFixed(2) === normVal;
                        if (!valMatch) return false;
                        if (normalizeString(ctx.description) === normDesc && getTxMonth(ctx) === targetMonth) return true;
                        
                        const mCtx = ctx.description.match(/(\d+)\/(\d+)/);
                        const mTx = tx.description.match(/(\d+)\/(\d+)/);
                        if (mCtx && mTx) {
                            if (parseInt(mCtx[1]) === parseInt(mTx[1]) && parseInt(mCtx[2]) === parseInt(mTx[2])) {
                                const baseCtx = normalizeString(ctx.description.replace(mCtx[0], ''));
                                const baseTx = normalizeString(tx.description.replace(mTx[0], ''));
                                if (baseCtx === baseTx) return true; 
                            }
                        }
                        return false;
                    });
                    
                    let autoAssignedTo = null;
                    if (group.members) {
                        for (const m of group.members) {
                            if (m.cardEndings) {
                                const endings = m.cardEndings.split(',').map(s => s.trim()).filter(s => s);
                                if (endings.some(end => tx.description.includes(end))) { autoAssignedTo = m.id; break; }
                            }
                        }
                    }

                    const shouldSelect = !isDup && !tx.isPayment;

                    let forward = [];
                    const instMatch = tx.description.match(/(\d+)\/(\d+)/);
                    if (instMatch && shouldSelect) { 
                        const cur = parseInt(instMatch[1]);
                        const tot = parseInt(instMatch[2]);
                        if (cur < tot) {
                            const [tM, tY] = targetMonth.split('/');
                            for (let i = 1; i <= (tot - cur); i++) {
                                let newM = parseInt(tM) + i;
                                let newY = parseInt(tY);
                                while (newM > 12) { newM -= 12; newY++; }
                                forward.push({ 
                                    id: crypto.randomUUID(), 
                                    date: tx.date, 
                                    description: tx.description.replace(instMatch[0], `${String(cur+i).padStart(2,'0')}/${String(tot).padStart(2,'0')}`), 
                                    amount: tx.amount, 
                                    bank: bankForPreview, 
                                    isFuture: true, 
                                    assignedTo: autoAssignedTo,
                                    invoiceMonth: `${String(newM).padStart(2,'0')}/${newY}` 
                                });
                            }
                        }
                    }
                    return { ...tx, id: crypto.randomUUID(), selected: shouldSelect, isDup, forward, assignedTo: autoAssignedTo, invoiceMonth: targetMonth };
                });
            };

            const handleFileUpload = async (e) => {
                const file = e.target.files[0]; if(!file) return;
                let txs = [];
                let bankToUse = selectedBank;

                if(file.name.toLowerCase().endsWith('.pdf')) {
                    const pdfResult = await readPDFContent(file);
                    txs = pdfResult.transactions || [];
                    if (pdfResult.detectedBank) {
                        bankToUse = pdfResult.detectedBank;
                        setSelectedBank(pdfResult.detectedBank);
                    }
                } else if(file.name.toLowerCase().endsWith('.csv')) {
                    txs = parseCSV(await file.text());
                }
                
                const targetMonth = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;
                setImportTargetMonth(targetMonth);
                const marked = buildImportPreview(txs, targetMonth, bankToUse);
                setImportPreview(marked);
                setIsImportModalOpen(true);
                e.target.value = null;
            };

            const handleChangeImportTargetMonth = (newMonth) => {
                setImportTargetMonth(newMonth);
                const rawList = importPreview.map(item => ({
                    date: item.date,
                    description: item.description,
                    amount: item.amount,
                    isPayment: item.isPayment,
                    isRefund: item.isRefund
                }));
                setImportPreview(buildImportPreview(rawList, newMonth, selectedBank));
            };

            const handleProcessPastedText = (e) => {
                e.preventDefault();
                if (!pasteRawText.trim()) return;
                const lines = pasteRawText.split('\n');
                const txs = parseInvoiceLines(lines);
                const targetMonth = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;
                setImportTargetMonth(targetMonth);
                setImportPreview(buildImportPreview(txs, targetMonth, selectedBank));
                setIsPasteModalOpen(false);
                setPasteRawText('');
                setIsImportModalOpen(true);
            };

            const confirmImport = async () => {
                const toAdd = [];
                importPreview.forEach(tx => { 
                    if(tx.selected) { 
                        toAdd.push({ id: tx.id, date: tx.date, description: tx.description, amount: tx.amount, bank: selectedBank, assignedTo: tx.assignedTo, invoiceMonth: importTargetMonth }); 
                        if(tx.forward) tx.forward.forEach(f => toAdd.push(f)); 
                    } 
                });
                let updated = [...(group.transactions || [])];
                if(replaceBank) {
                    const selObj = parseMonthStr(importTargetMonth);
                    updated = updated.filter(tx => { if(tx.bank !== selectedBank) return true; return parseMonthStr(getTxMonth(tx)) < selObj; });
                }
                await updateGroupData({ transactions: [...updated, ...toAdd] });
                setSelectedMonth(importTargetMonth);
                setIsImportModalOpen(false);
            };

            const handleAddManualCard = async (e) => {
                e.preventDefault();
                const form = e.target;
                const date = form.date.value;
                const desc = form.desc.value;
                const amount = parseFloat(form.amount.value);
                const installments = parseInt(form.installments?.value) || 1;
                const bankChoice = form.bankChoice?.value || selectedBank;
                const memberChoice = form.memberChoice?.value || null;
                const targetMonth = form.targetMonth?.value || (selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth);
                if(!date || !desc || !amount) return;
                
                const [tM, tY] = targetMonth.split('/');
                const newTxs = [];

                for (let i = 0; i < installments; i++) {
                    let curM = parseInt(tM) + i;
                    let curY = parseInt(tY);
                    while (curM > 12) { curM -= 12; curY++; }
                    const mStr = `${String(curM).padStart(2, '0')}/${curY}`;
                    const finalDesc = installments > 1 ? `${desc} ${String(i + 1).padStart(2, '0')}/${String(installments).padStart(2, '0')}` : desc;

                    newTxs.push({
                        id: crypto.randomUUID(),
                        date,
                        description: finalDesc,
                        amount,
                        assignedTo: memberChoice || null,
                        splits: null,
                        bank: bankChoice,
                        type: 'card',
                        invoiceMonth: mStr
                    });
                }

                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                setSelectedMonth(targetMonth);
                form.reset();
                setIsManualModalOpen(false);
            };

            const handleAddLoan = async (e) => {
                e.preventDefault();
                const form = e.target;
                const rawDay = form.date.value.trim();
                const desc = form.desc.value; 
                const totalAmount = parseFloat(form.amount.value);
                const installments = parseInt(form.installments.value) || 1;
                const memberId = form.memberId.value;
                if(!rawDay || !desc || !totalAmount || !memberId) return;

                const baseMStr = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;
                const [bM, bY] = baseMStr.split('/');
                let currentMonth = parseInt(bM);
                let currentYear = parseInt(bY);
                
                const installmentAmount = (totalAmount / installments).toFixed(2);
                const newTxs = [];
                const dayClean = rawDay.substring(0, 2).padStart(2, '0');

                for(let i=1; i<=installments; i++) {
                    let mStr = `${String(currentMonth).padStart(2,'0')}/${currentYear}`;
                    newTxs.push({
                        id: crypto.randomUUID(),
                        date: `${dayClean}/${String(currentMonth).padStart(2,'0')}`,
                        description: installments > 1 ? `${desc} ${i}/${installments}` : desc,
                        amount: parseFloat(installmentAmount),
                        assignedTo: memberId,
                        splits: null,
                        bank: 'Empréstimo',
                        type: 'loan',
                        invoiceMonth: mStr
                    });
                    
                    currentMonth++;
                    if (currentMonth > 12) {
                        currentMonth = 1;
                        currentYear++;
                    }
                }

                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                form.reset();
            };

            const openEditTransaction = (tx) => {
                setAssignTx({...tx});
                let initialSelections = []; let splitsVals = {};
                if (tx.splits && tx.splits.length > 0) {
                    initialSelections = tx.splits.map(s => s.memberId);
                    tx.splits.forEach(s => splitsVals[s.memberId] = s.amount);
                    setIsCustomSplit(true);
                } else if (tx.assignedTo) {
                    initialSelections = [tx.assignedTo];
                    setIsCustomSplit(false);
                } else {
                    setIsCustomSplit(false);
                }
                setAssignSelections(initialSelections);
                setCustomSplitsValues(splitsVals);
            };

            const saveEdit = async () => {
                let assignedTo = null; let splits = null;
                if (assignSelections.length === 1) {
                    assignedTo = assignSelections[0];
                } else if (assignSelections.length > 1) {
                    if (isCustomSplit) {
                        splits = assignSelections.map(memberId => ({ memberId, amount: parseFloat(customSplitsValues[memberId]) || 0 }));
                    } else {
                        const amount = parseFloat(assignTx.amount) / assignSelections.length;
                        splits = assignSelections.map(memberId => ({ memberId, amount }));
                    }
                }
                
                let up = group.transactions.map(t => t.id === assignTx.id ? { ...t, date: assignTx.date, description: assignTx.description, amount: parseFloat(assignTx.amount), assignedTo, splits } : t);
                
                const instMatch = assignTx.description.match(/(\d+)\/(\d+)/);
                if (instMatch) {
                    const totalInst = parseInt(instMatch[2]);
                    const baseDesc = normalizeString(assignTx.description.replace(instMatch[0], ''));
                    up = up.map(t => {
                        if (t.id === assignTx.id) return t;
                        const tMatch = t.description.match(/(\d+)\/(\d+)/);
                        if (tMatch && parseInt(tMatch[2]) === totalInst) {
                            const tBase = normalizeString(t.description.replace(tMatch[0], ''));
                            if (tBase === baseDesc) {
                                return { ...t, assignedTo, splits };
                            }
                        }
                        return t;
                    });
                }

                await updateGroupData({ transactions: up }); setAssignTx(null);
            };

            const handleBulkDelete = () => {
                if (bulkSelection.length === 0) return;
                setConfirmAction({
                    message: `Excluir permanentemente ${bulkSelection.length} compras selecionadas?`,
                    onConfirm: async () => {
                        await updateGroupData({ transactions: group.transactions.filter(t => !bulkSelection.includes(t.id)) });
                        setBulkSelection([]);
                        setIsBulkMode(false);
                        setConfirmAction(null);
                    }
                });
            };

            const handleRollover = (memberId, amount) => {
                if (amount <= 0) return;
                setConfirmAction({
                    message: `Zerar neste mês e jogar ${formatMoney(amount)} para o próximo mês?`,
                    onConfirm: async () => {
                        const paym = { id: crypto.randomUUID(), memberId, amount, type: 'cartao', month: selectedMonth, date: new Date().toLocaleDateString('pt-BR') };
                        const currMObj = parseMonthStr(selectedMonth); let nextM = currMObj.getMonth() + 2; let nextY = currMObj.getFullYear();
                        if(nextM > 12) { nextM -= 12; nextY++; }
                        const targetInvoice = `${String(nextM).padStart(2,'0')}/${nextY}`;
                        const loan = { id: crypto.randomUUID(), date: `01/${String(nextM).padStart(2,'0')}`, description: `Restante Fatura ${selectedMonth}`, amount, assignedTo: memberId, bank: 'Empréstimo', type: 'loan', invoiceMonth: targetInvoice };
                        await updateGroupData({ payments: [...(group.payments || []), paym], transactions: [...(group.transactions || []), loan] });
                        setConfirmAction(null);
                    }
                });
            };

            const totals = {};
            group.members?.forEach(m => totals[m.id] = { card:0, loan:0, pCard:0, pLoan:0 });
            (group.transactions || []).forEach(t => { 
                const m = getTxMonth(t); 
                if(selectedMonth === 'Todos' || m === selectedMonth) { 
                    const isL = t.bank === 'Empréstimo' || t.type === 'loan'; 
                    const key = isL ? 'loan' : 'card'; 
                    if (t.splits && t.splits.length > 0) {
                        t.splits.forEach(s => { if (totals[s.memberId]) totals[s.memberId][key] += parseFloat(s.amount || 0); });
                    } else if(t.assignedTo && totals[t.assignedTo]) {
                        totals[t.assignedTo][key] += parseFloat(t.amount||0); 
                    }
                } 
            });
            (group.payments || []).forEach(p => { if(selectedMonth === 'Todos' || p.month === selectedMonth) { if(totals[p.memberId]) { if(p.type === 'emprestimo') totals[p.memberId].pLoan += parseFloat(p.amount||0); else totals[p.memberId].pCard += parseFloat(p.amount||0); } } });

            const handleInstantFullPayoff = async (memberId) => {
                const mTot = totals[memberId] || { card: 0, loan: 0, pCard: 0, pLoan: 0 };
                const cRest = Math.max(0, mTot.card - mTot.pCard);
                const lRest = Math.max(0, mTot.loan - mTot.pLoan);
                if (cRest <= 0.01 && lRest <= 0.01) return;

                const targetM = selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth;
                const todayStr = new Date().toLocaleDateString('pt-BR');
                const newPayments = [];

                if (cRest > 0.01) {
                    newPayments.push({ id: crypto.randomUUID(), memberId, amount: parseFloat(cRest.toFixed(2)), type: 'cartao', month: targetM, date: todayStr });
                }
                if (lRest > 0.01) {
                    newPayments.push({ id: crypto.randomUUID(), memberId, amount: parseFloat(lRest.toFixed(2)), type: 'emprestimo', month: targetM, date: todayStr });
                }
                await updateGroupData({ payments: [...(group.payments || []), ...newPayments] });
            };

            const handleDeletePayment = async (paymentId) => {
                await updateGroupData({ payments: (group.payments || []).filter(p => p.id !== paymentId) });
            };

            // DETECÇÃO AUTOMÁTICA DE QUEM FAZ PARTE DO CARTÃO E VALORES NA RENEGOCIAÇÃO
            const detectedCardData = useMemo(() => {
                const refMonth = renegStartMonth || (selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth);
                const refDateObj = parseMonthStr(refMonth);

                // Soma tudo de cartão no mês inicial para saber quanto cada um já pagou
                const allCardsInRefMonth = {};
                const paidCardInRefMonth = {};
                (group.members || []).forEach(m => {
                    allCardsInRefMonth[m.id] = 0;
                    paidCardInRefMonth[m.id] = 0;
                });

                (group.transactions || []).forEach(tx => {
                    if (tx.bank === 'Empréstimo' || tx.type === 'loan') return;
                    if (getTxMonth(tx) === refMonth) {
                        if (tx.splits && tx.splits.length > 0) {
                            tx.splits.forEach(s => { if (allCardsInRefMonth[s.memberId] !== undefined) allCardsInRefMonth[s.memberId] += parseFloat(s.amount || 0); });
                        } else if (tx.assignedTo && allCardsInRefMonth[tx.assignedTo] !== undefined) {
                            allCardsInRefMonth[tx.assignedTo] += parseFloat(tx.amount || 0);
                        }
                    }
                });

                (group.payments || []).forEach(p => {
                    if (p.month === refMonth && p.type !== 'emprestimo' && paidCardInRefMonth[p.memberId] !== undefined) {
                        paidCardInRefMonth[p.memberId] += parseFloat(p.amount || 0);
                    }
                });

                const memberRaw = {};
                (group.members || []).forEach(m => {
                    memberRaw[m.id] = { currentGross: 0, currentNet: 0, future: 0, autoTotal: 0, txCount: 0 };
                });

                let unassignedSum = 0;
                let affectedTxIds = [];

                (group.transactions || []).forEach(tx => {
                    if (tx.bank !== renegBank || tx.type === 'loan') return;
                    const txM = getTxMonth(tx);
                    if (!txM) return;
                    const txDateObj = parseMonthStr(txM);

                    const isCurrent = txM === refMonth;
                    const isFuture = txDateObj > refDateObj;

                    if (isCurrent || isFuture) {
                        affectedTxIds.push(tx.id);
                        if (tx.splits && tx.splits.length > 0) {
                            tx.splits.forEach(s => {
                                if (memberRaw[s.memberId]) {
                                    const val = parseFloat(s.amount || 0);
                                    if (isCurrent) memberRaw[s.memberId].currentGross += val;
                                    else memberRaw[s.memberId].future += val;
                                    memberRaw[s.memberId].txCount += 1;
                                }
                            });
                        } else if (tx.assignedTo && memberRaw[tx.assignedTo]) {
                            const val = parseFloat(tx.amount || 0);
                            if (isCurrent) memberRaw[tx.assignedTo].currentGross += val;
                            else memberRaw[tx.assignedTo].future += val;
                            memberRaw[tx.assignedTo].txCount += 1;
                        } else {
                            unassignedSum += parseFloat(tx.amount || 0);
                        }
                    }
                });

                (group.members || []).forEach(m => {
                    const info = memberRaw[m.id];
                    const totalUnpaidAllCards = Math.max(0, allCardsInRefMonth[m.id] - paidCardInRefMonth[m.id]);
                    info.currentNet = renegDeductPaidInStartMonth
                        ? Math.min(info.currentGross, totalUnpaidAllCards)
                        : info.currentGross;
                    info.autoTotal = Math.max(0, info.currentNet + info.future);
                });

                return { memberRaw, unassignedSum, affectedTxIds, refMonth };
            }, [group.transactions, group.payments, group.members, renegBank, renegStartMonth, selectedMonth, renegDeductPaidInStartMonth]);

            // Sempre que trocar o Cartão ou o Mês da Renegociação, inclui automaticamente quem tem compras naquele cartão!
            useEffect(() => {
                if (!isRenegotiateModalOpen) return;
                const autoDetectedMembers = (group.members || [])
                    .filter(m => {
                        const info = detectedCardData.memberRaw[m.id];
                        return info && (info.autoTotal > 0.01 || info.currentGross > 0.01 || info.future > 0.01);
                    })
                    .map(m => m.id);

                setRenegParticipants(autoDetectedMembers);
                setRenegManualOverrides({});
                setCopiedRenegSummary(false);

                // Se apenas 1 pessoa ainda estiver com saldo em aberto no mês atual naquele cartão, já pré-seleciona ela nos juros
                const unpaidCurrentMembers = autoDetectedMembers.filter(mId => (detectedCardData.memberRaw[mId]?.currentNet || 0) > 0.01);
                const initialCulprits = unpaidCurrentMembers.length === 1
                    ? unpaidCurrentMembers
                    : renegCulprits.filter(id => autoDetectedMembers.includes(id));

                setRenegCulprits(initialCulprits);

                // Por padrão, já preenche a Entrada de cada pessoa que está em dia com a fatura normal dela deste mês,
                // deixando R$ 0,00 para quem vai assumir os juros (ou você edita quanto ele puder dar).
                const defaultDowns = {};
                autoDetectedMembers.forEach(mId => {
                    const info = detectedCardData.memberRaw[mId];
                    const isCulp = initialCulprits.includes(mId);
                    if (!isCulp && info && info.currentNet > 0) {
                        defaultDowns[mId] = Math.min(info.autoTotal, info.currentNet).toFixed(2);
                    } else {
                        defaultDowns[mId] = '';
                    }
                });
                setRenegDownPayments(defaultDowns);
            }, [renegBank, renegStartMonth, isRenegotiateModalOpen]);

            // Botão rápido: Cada um paga sua fatura normal deste mês (exceto quem atrasou / paga juros)
            const handleFillNormalBillAsDownPayment = (excludeCulprits = true) => {
                const nextDowns = {};
                renegParticipants.forEach(mId => {
                    const info = detectedCardData.memberRaw[mId];
                    const overrideVal = renegManualOverrides[mId];
                    const maxDebt = (overrideVal !== undefined && overrideVal !== '') ? (parseFloat(overrideVal) || 0) : (info?.autoTotal || 0);
                    const isCulp = renegCulprits.includes(mId);

                    if (excludeCulprits && isCulp) {
                        nextDowns[mId] = '';
                    } else {
                        const normalMonthBill = Math.min(maxDebt, info?.currentNet || 0);
                        nextDowns[mId] = normalMonthBill > 0 ? normalMonthBill.toFixed(2) : '';
                    }
                });
                setRenegDownPayments(nextDowns);
            };

            // Cálculo final da Entrada (Mês Atual) + Parcelas Restantes (Próximos Meses) com TRAVA DE TETO INDIVIDUAL
            const renegotiationCalc = useMemo(() => {
                const nInst = Math.max(1, parseInt(renegInstallments) || 1);
                const monthlyBank = parseFloat(renegMonthlyValue) || 0;
                const totalBankWithInterest = monthlyBank * nInst;

                const effectiveDebts = {};
                const memberDownPayments = {};
                const remainingDebts = {};
                let totalOriginalAssigned = 0;
                let totalDownPayment = 0;
                let totalRemainingOriginal = 0;

                renegParticipants.forEach(mId => {
                    const overrideVal = renegManualOverrides[mId];
                    const autoVal = detectedCardData.memberRaw[mId]?.autoTotal || 0;
                    const finalDebt = Math.max(0, (overrideVal !== undefined && overrideVal !== '') ? (parseFloat(overrideVal) || 0) : autoVal);
                    // TRAVA DE SEGURANÇA: A entrada de uma pessoa NUNCA pode passar do valor total que ela deve no cartão!
                    const rawDownVal = Math.max(0, parseFloat(renegDownPayments[mId]) || 0);
                    const downVal = Math.min(finalDebt, rawDownVal);
                    const remDebt = Math.max(0, finalDebt - downVal);

                    effectiveDebts[mId] = finalDebt;
                    memberDownPayments[mId] = downVal;
                    remainingDebts[mId] = remDebt;

                    totalOriginalAssigned += finalDebt;
                    totalDownPayment += downVal;
                    totalRemainingOriginal += remDebt;
                });

                // Os juros do banco incidem sobre o RESTANTE que foi parcelado para os próximos meses
                const totalInterest = monthlyBank > 0 ? Math.max(0, totalBankWithInterest - totalRemainingOriginal) : 0;
                const activeCulprits = renegCulprits.filter(cId => renegParticipants.includes(cId) && (remainingDebts[cId] || 0) > 0.01);
                const culpritsTotalRemaining = activeCulprits.reduce((acc, cId) => acc + (remainingDebts[cId] || 0), 0);

                const memberPlan = {};
                renegParticipants.forEach(mId => {
                    const debt = effectiveDebts[mId] || 0;
                    const downPayment = memberDownPayments[mId] || 0;
                    const remainingDebt = remainingDebts[mId] || 0;
                    const isFullyPaidInDownPayment = debt > 0 && remainingDebt <= 0.01;
                    const isCulprit = activeCulprits.includes(mId);
                    const baseMonthly = remainingDebt / nInst;

                    let interestShareTotal = 0;
                    if (isCulprit && monthlyBank > 0 && activeCulprits.length > 0 && remainingDebt > 0.01) {
                        if (renegSplitInterestMode === 'proportional' && culpritsTotalRemaining > 0) {
                            const weight = remainingDebt / culpritsTotalRemaining;
                            interestShareTotal = totalInterest * weight;
                        } else {
                            interestShareTotal = totalInterest / activeCulprits.length;
                        }
                    }

                    const interestMonthly = interestShareTotal / nInst;
                    const finalMonthly = baseMonthly + interestMonthly;

                    memberPlan[mId] = {
                        debt,
                        downPayment,
                        remainingDebt,
                        isFullyPaidInDownPayment,
                        isCulprit,
                        baseMonthly,
                        interestMonthly,
                        finalMonthly
                    };
                });

                return {
                    nInst,
                    monthlyBank,
                    totalBankWithInterest,
                    totalOriginalAssigned,
                    totalDownPayment,
                    totalRemainingOriginal,
                    totalInterest,
                    activeCulprits,
                    memberPlan
                };
            }, [renegParticipants, renegManualOverrides, renegDownPayments, detectedCardData, renegInstallments, renegMonthlyValue, renegCulprits, renegSplitInterestMode]);

            // Rateio Inteligente com Trava (Waterfall): se digitar R$ 1.000 de Entrada Total e alguém só deve R$ 50,
            // trava essa pessoa em R$ 50 e redistribui os outros R$ 150 automaticamente entre os demais!
            const handleTotalDownPaymentInput = (valStr) => {
                const nextDowns = {};
                renegParticipants.forEach(id => { nextDowns[id] = ''; });
                if (valStr === '' || parseFloat(valStr) <= 0) {
                    setRenegDownPayments(nextDowns);
                    return;
                }

                let remainingToDistribute = parseFloat(valStr) || 0;
                const caps = {};
                renegParticipants.forEach(mId => {
                    const overrideVal = renegManualOverrides[mId];
                    const autoVal = detectedCardData.memberRaw[mId]?.autoTotal || 0;
                    caps[mId] = Math.max(0, (overrideVal !== undefined && overrideVal !== '') ? (parseFloat(overrideVal) || 0) : autoVal);
                    nextDowns[mId] = 0;
                });

                let eligible = renegParticipants.filter(mId => caps[mId] > 0.001);
                while (remainingToDistribute > 0.005 && eligible.length > 0) {
                    const share = remainingToDistribute / eligible.length;
                    let cappedSomeone = false;
                    const nextEligible = [];

                    for (const mId of eligible) {
                        const roomLeft = caps[mId] - nextDowns[mId];
                        if (roomLeft <= share + 0.001) {
                            nextDowns[mId] = caps[mId];
                            remainingToDistribute -= roomLeft;
                            cappedSomeone = true;
                        } else {
                            nextEligible.push(mId);
                        }
                    }

                    if (!cappedSomeone) {
                        for (const mId of nextEligible) {
                            nextDowns[mId] += share;
                        }
                        remainingToDistribute = 0;
                        break;
                    }
                    eligible = nextEligible;
                }

                const formattedDowns = {};
                renegParticipants.forEach(mId => {
                    formattedDowns[mId] = nextDowns[mId] > 0 ? Number(nextDowns[mId].toFixed(2)).toString() : '';
                });
                setRenegDownPayments(formattedDowns);
            };

            const handleCopyRenegotiationSummary = () => {
                const lines = [];
                lines.push(`*📋 ACORDO CARTÃO ${renegBank.toUpperCase()}*`);
                lines.push(`• Entrada Total (${renegStartMonth}): *${formatMoney(renegotiationCalc.totalDownPayment)}*`);
                if (renegotiationCalc.monthlyBank > 0) {
                    lines.push(`• Parcelamento Restante (${renegFirstInstallmentMonth} em diante): *${renegotiationCalc.nInst}x de ${formatMoney(renegotiationCalc.monthlyBank)}*`);
                }
                lines.push(`------------------------`);
                renegParticipants.forEach(mId => {
                    const m = group.members?.find(x => x.id === mId);
                    const plan = renegotiationCalc.memberPlan[mId];
                    if (!m || !plan) return;
                    lines.push(`👤 *${m.name}*:`);
                    lines.push(`   - Entrada neste mês (${renegStartMonth}): *${formatMoney(plan.downPayment)}*`);
                    if (plan.remainingDebt <= 0.01) {
                        lines.push(`   - Próximos meses: *R$ 0,00 (Quitado na entrada!)*`);
                    } else {
                        lines.push(`   - Próximos meses (${renegotiationCalc.nInst}x): *${formatMoney(plan.finalMonthly)}/mês* ${plan.isCulprit && plan.interestMonthly > 0 ? '(c/ juros)' : '(s/ juros)'}`);
                    }
                });

                const textArea = document.createElement("textarea");
                textArea.value = lines.join('\n');
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setCopiedRenegSummary(true);
                setTimeout(() => setCopiedRenegSummary(false), 2500);
            };

            const toggleRenegParticipant = (mId) => {
                setRenegParticipants(prev => prev.includes(mId) ? prev.filter(id => id !== mId) : [...prev, mId]);
            };

            const toggleRenegCulprit = (mId) => {
                if (!renegParticipants.includes(mId)) {
                    setRenegParticipants(prev => [...prev, mId]);
                }
                setRenegCulprits(prev => prev.includes(mId) ? prev.filter(id => id !== mId) : [...prev, mId]);
            };

            // Botão OK: Lança a Entrada no mês atual (renegStartMonth) e as Parcelas a partir do próximo mês (renegFirstInstallmentMonth)
            const handleApplyRenegotiation = () => {
                const activeMembers = renegParticipants.filter(mId => {
                    const p = renegotiationCalc.memberPlan[mId];
                    return p && (p.downPayment > 0.01 || p.finalMonthly > 0.01);
                });
                if (activeMembers.length === 0) return;

                const startCleanDateObj = parseMonthStr(renegStartMonth);
                const [startM] = renegStartMonth.split('/');
                const [firstM, firstY] = renegFirstInstallmentMonth.split('/');
                const nInst = renegotiationCalc.nInst;
                const dayClean = (renegDueDay || '10').padStart(2, '0').substring(0, 2);

                setConfirmAction({
                    message: `Confirmar Renegociação do ${renegBank}? O app vai lançar a Entrada em ${renegStartMonth} (${formatMoney(renegotiationCalc.totalDownPayment)}) e as ${nInst} parcelas do restante a partir de ${renegFirstInstallmentMonth}, substituindo os lançamentos antigos deste cartão.`,
                    onConfirm: async () => {
                        // 1. Remove todas as transações antigas daquele cartão do mês inicial para frente
                        const remainingTxs = (group.transactions || []).filter(tx => {
                            if (tx.bank !== renegBank || tx.type === 'loan') return true;
                            const txM = getTxMonth(tx);
                            if (!txM) return true;
                            return parseMonthStr(txM) < startCleanDateObj;
                        });

                        const newAgreementTxs = [];

                        // 2. Cria o lançamento da ENTRADA no mês atual (renegStartMonth) para quem vai dar entrada
                        activeMembers.forEach(mId => {
                            const plan = renegotiationCalc.memberPlan[mId];
                            if (plan.downPayment > 0.01) {
                                const mName = group.members?.find(x => x.id === mId)?.name || 'Familiar';
                                newAgreementTxs.push({
                                    id: crypto.randomUUID(),
                                    date: `${dayClean}/${String(startM).padStart(2, '0')}`,
                                    description: `Entrada Renegociação ${renegBank} - ${mName}`,
                                    amount: parseFloat(plan.downPayment.toFixed(2)),
                                    assignedTo: mId,
                                    splits: null,
                                    bank: renegBank,
                                    type: 'card',
                                    invoiceMonth: renegStartMonth
                                });
                            }
                        });

                        // 3. Cria as novas parcelas mensais do RESTANTE a partir do próximo mês (renegFirstInstallmentMonth)
                        for (let i = 0; i < nInst; i++) {
                            let curM = parseInt(firstM) + i;
                            let curY = parseInt(firstY);
                            while (curM > 12) { curM -= 12; curY++; }
                            const mStr = `${String(curM).padStart(2, '0')}/${curY}`;
                            const instLabel = `${String(i + 1).padStart(2, '0')}/${String(nInst).padStart(2, '0')}`;

                            activeMembers.forEach(mId => {
                                const plan = renegotiationCalc.memberPlan[mId];
                                if (plan.finalMonthly <= 0.01) return;
                                const mName = group.members?.find(x => x.id === mId)?.name || 'Familiar';
                                const tag = plan.isCulprit && renegotiationCalc.totalInterest > 0 ? 'c/ Juros' : 's/ Juros';

                                newAgreementTxs.push({
                                    id: crypto.randomUUID(),
                                    date: `${dayClean}/${String(curM).padStart(2, '0')}`,
                                    description: `Renegociação ${renegBank} (${tag}) - ${mName} ${instLabel}`,
                                    amount: parseFloat(plan.finalMonthly.toFixed(2)),
                                    assignedTo: mId,
                                    splits: null,
                                    bank: renegBank,
                                    type: 'card',
                                    invoiceMonth: mStr
                                });
                            });
                        }

                        await updateGroupData({ transactions: [...remainingTxs, ...newAgreementTxs] });
                        setConfirmAction(null);
                        setIsRenegotiateModalOpen(false);
                        setSelectedMonth(renegStartMonth);
                    }
                });
            };

            const totalImportSelected = importPreview.filter(t => t.selected).reduce((acc, t) => acc + parseFloat(t.amount || 0), 0);

            const bankTotals = {};
