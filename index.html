    <style>

<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut, createUserWithEmailAndPassword, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const { useState, useEffect, useMemo, Component, useRef } = React;
        let app, auth, db;

        // --- COMPONENTES BASE ---
        
        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 text-center mt-20 fade-in">
                            <i data-lucide="alert-triangle" className="w-12 h-12 text-red-500 mx-auto mb-4"></i>
                            <h2 className="text-xl font-bold text-gray-800">Ops! Algo saiu do trilho.</h2>
                            <p className="text-gray-500 mt-2 text-sm mb-6">Bloqueamos a tela branca. Recarregue para continuar.</p>
                            <button onClick={() => window.location.reload()} className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-md">Recarregar Página</button>
                        </div>
                    );
                }
                return this.props.children; 
            }
        }

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-screen sm:max-h-[90vh]">
                        <div className="p-3 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="text-[14px] font-black text-gray-800 uppercase tracking-wider">{title}</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-200/50 hover:bg-gray-200 rounded-lg text-gray-600"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-3 overflow-y-auto custom-scroll flex-1">{children}</div>
                    </div>
                </div>
            );
        };

        // --- UTILITÁRIOS ---
        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(val) || 0);
        const generateCode = (len) => { const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let r = ''; for(let i=0;i<len;i++) r+=c.charAt(Math.floor(Math.random()*c.length)); return r; };
        const getCurrentMonthStr = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
        
        const safeExtractMonth = (dateString) => {
            if (!dateString || typeof dateString !== 'string') return '';
            const match = dateString.match(/\d{2}\/(\d{2}(?:\/\d{4})?)/);
            if (!match) return '';
            let mStr = match[1];
            if (mStr.length === 2) mStr += `/${new Date().getFullYear()}`;
            return mStr;
        };

        const parseMonthStr = (str) => { if(!str || str === 'Todos') return new Date(9999, 11); const [m, y] = str.split('/'); return new Date(y, m - 1); };

        const normalizeString = (str) => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

        // --- PARSERS AVANÇADOS (CSV e PDF) ---
        
        const parseCSV = (csvText) => {
            // Leitor CSV Blindado (Inter) - Ignora vírgulas dentro de aspas
            const lines = csvText.split('\n').filter(l => l.trim() !== '');
            const results = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                let inQuotes = false; let currentVal = ""; const values = [];
                for (let char of line) {
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ""; }
                    else { currentVal += char; }
                }
                values.push(currentVal.trim());
                
                if (values.length >= 4) {
                    const date = values[0]; const desc = values[1];
                    const amountStr = values[3].replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
                    const amount = parseFloat(amountStr);
                    if (date && desc && !isNaN(amount)) {
                        results.push({ date, description: desc, amount });
                    }
                }
            }
            return results;
        };

        const readPDFContent = async (file) => {
            // Leitor PDF Nubank (Tolerância de 5 pixels de altura + Espaços)
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let transactions = [];
                        
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            
                            // Agrupamento com tolerância Y (5px)
                            let lines = [];
                            textContent.items.forEach(item => {
                                const y = Math.round(item.transform[5]);
                                const x = Math.round(item.transform[4]);
                                const str = item.str.trim();
                                if(!str) return;
                                
                                let foundLine = lines.find(l => Math.abs(l.y - y) <= 5);
                                if(foundLine) {
                                    foundLine.items.push({x, str});
                                } else {
                                    lines.push({y, items: [{x, str}]});
                                }
                            });
                            
                            lines.sort((a,b) => b.y - a.y);
                            
                            lines.forEach(line => {
                                line.items.sort((a,b) => a.x - b.x);
                                const fullString = line.items.map(it => it.str).join(' ');
                                
                                // Captura padrão Nubank: "02 OUT Netflix 39,90" ou Data Parcela Valor
                                const dateMatch = fullString.match(/^(\d{2}\s+(?:JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)|\d{2}\/\d{2})/i);
                                if(dateMatch) {
                                    const dateStr = dateMatch[1];
                                    const valueMatch = fullString.match(/(?:R\$)?\s*(-?\d{1,3}(?:\.\d{3})*,\d{2})$/);
                                    if(valueMatch) {
                                        const valStr = valueMatch[1].replace(/\./g, '').replace(',', '.');
                                        const amount = parseFloat(valStr);
                                        const desc = fullString.substring(dateMatch[0].length, fullString.length - valueMatch[0].length).trim();
                                        
                                        // Formata Data
                                        let finalDate = dateStr;
                                        if(/[a-z]/i.test(dateStr)) {
                                            const months = {'jan':'01','fev':'02','mar':'03','abr':'04','mai':'05','jun':'06','jul':'07','ago':'08','set':'09','out':'10','nov':'11','dez':'12'};
                                            const parts = dateStr.split(' ');
                                            const m = months[parts[1].toLowerCase()] || '01';
                                            finalDate = `${parts[0]}/${m}`;
                                        }
                                        
                                        transactions.push({ date: finalDate, description: desc, amount });
                                    }
                                }
                            });
                        }
                        resolve(transactions);
                    } catch(e) { reject(e); }
                };
                reader.readAsArrayBuffer(file);
            });
        };

        // --- DASHBOARD FAMILIAR ---
        const MemberDashboard = ({ group, memberId, onLogout }) => {
            const member = group.members?.find(m => m.id === memberId);
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            
            const monthSummaries = useMemo(() => {
                if(!member) return [];
                const monthsData = {};
                (group.transactions || []).forEach(tx => {
                    const txMonth = safeExtractMonth(tx.date);
                    if (!txMonth) return;
                    if (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId))) {
                        if (!monthsData[txMonth]) monthsData[txMonth] = { total: 0, paid: 0 };
                        monthsData[txMonth].total += tx.splits ? tx.splits.find(s=>s.memberId===memberId).amount : parseFloat(tx.amount || 0);
                    }
                });
                
                (group.payments || []).forEach(p => { 
                    if (p.memberId === memberId && monthsData[p.month]) { 
                        monthsData[p.month].paid += parseFloat(p.amount || 0); 
                    } 
                });
                
                const currObj = parseMonthStr(getCurrentMonthStr());
                
                return Object.keys(monthsData)
                    .map(month => ({ month, rest: monthsData[month].total - monthsData[month].paid, dateObj: parseMonthStr(month) }))
                    .filter(m => !(m.dateObj < currObj && m.rest <= 0.05)) // Faxina: oculta passado zerado
                    .sort((a,b) => a.dateObj - b.dateObj);
            }, [group.transactions, group.payments, memberId]);

            useEffect(() => { lucide.createIcons(); });

            if (!member) return <div className="p-8 text-center font-bold text-gray-500">Familiar não encontrado.</div>;

            const monthTxs = (group.transactions || []).filter(tx => {
                return safeExtractMonth(tx.date) === selectedMonth && (tx.assignedTo === memberId || (tx.splits && tx.splits.some(s => s.memberId === memberId)));
            }).map(tx => ({ ...tx, displayAmount: tx.splits ? tx.splits.find(s => s.memberId === memberId).amount : parseFloat(tx.amount || 0) }))
            .sort((a,b) => {
                const aLoan = a.bank === 'Empréstimo' || a.type === 'loan';
                const bLoan = b.bank === 'Empréstimo' || b.type === 'loan';
                if(aLoan && !bLoan) return -1; if(!aLoan && bLoan) return 1; return 0;
            });

            const { cardTotal, loanTotal } = monthTxs.reduce((acc, tx) => { 
                if (tx.bank === 'Empréstimo' || tx.type === 'loan') acc.loanTotal += tx.displayAmount; 
                else acc.cardTotal += tx.displayAmount; 
                return acc; 
            }, {cardTotal: 0, loanTotal: 0});
            
            const myPaidCard = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type !== 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            const myPaidLoan = (group.payments || []).filter(p => p.memberId === memberId && p.month === selectedMonth && p.type === 'emprestimo').reduce((a,c)=>a+parseFloat(c.amount||0),0);
            
            const grandTotalRest = (cardTotal - myPaidCard) + (loanTotal - myPaidLoan);

            const handleShare = () => {
                const text = `Fatura ${selectedMonth} - ${member.name}\nTotal a Pagar: ${formatMoney(grandTotalRest)}\n(Cartões: ${formatMoney(cardTotal - myPaidCard)} | Empréstimos: ${formatMoney(loanTotal - myPaidLoan)})\n\nPor favor, envie o Pix!`;
                if(navigator.share) {
                    navigator.share({ title: 'Resumo da Fatura', text: text });
                } else {
                    navigator.clipboard.writeText(text);
                    alert("Resumo copiado para a área de transferência!");
                }
            };

            return (
                <div className="pb-16 min-h-screen bg-gray-50 fade-in">
                    <div className="bg-gray-900 pt-6 pb-5 rounded-b-[2rem] shadow-xl text-white px-5">
                        <div className="flex justify-between items-center mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center font-black text-lg">{member.name.charAt(0)}</div>
                                <div><h1 className="font-black text-[15px]">{member.name}</h1><button onClick={handleShare} className="text-indigo-300 text-[9px] font-bold uppercase tracking-widest flex items-center gap-1 hover:text-white"><i data-lucide="share-2" className="w-3 h-3"></i> Copiar Resumo</button></div>
                            </div>
                            <button onClick={onLogout} className="text-gray-400 hover:text-white bg-white/10 p-2 rounded-xl"><i data-lucide="log-out" className="w-4 h-4"></i></button>
                        </div>
                        <div className="mb-2">
                            <p className="text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-1">Total a Pagar ({selectedMonth})</p>
                            <div className={`text-4xl font-black tracking-tight ${grandTotalRest <= 0 ? 'text-green-400' : 'text-white'}`}>{formatMoney(grandTotalRest)}</div>
                            <div className="flex gap-4 mt-4 pt-3 border-t border-gray-700/50">
                                <div className="flex-1"><p className="text-[9px] text-gray-400 uppercase font-bold mb-0.5">💳 Cartões</p><p className="text-[12px] font-bold text-white">{formatMoney(cardTotal - myPaidCard)}</p></div>
                                <div className="flex-1 border-l border-gray-700 pl-4"><p className="text-[9px] text-gray-400 uppercase font-bold mb-0.5">🏦 Empréstimos</p><p className="text-[12px] font-bold text-white">{formatMoney(loanTotal - myPaidLoan)}</p></div>
                            </div>
                        </div>
                    </div>

                    {monthSummaries.length > 0 && (
                        <div className="mt-5">
                            <div className="flex gap-2 overflow-x-auto hide-scroll pb-2 px-5 custom-scroll">
                                {monthSummaries.map(({ month, rest }) => (
                                    <button key={month} onClick={() => setSelectedMonth(month)} className={`flex flex-col items-center justify-center p-2 rounded-2xl shrink-0 border transition-all w-[72px] shadow-sm ${selectedMonth === month ? 'bg-indigo-600 border-indigo-500 text-white transform scale-105' : 'bg-white border-gray-200 text-gray-600'}`}>
                                        <span className={`text-[9px] font-black uppercase mb-1 ${selectedMonth === month ? 'text-indigo-200' : 'text-gray-400'}`}>{month}</span>
                                        <span className={`font-black text-[10px] truncate w-full ${rest <= 0 ? 'text-green-500' : ''}`}>{formatMoney(rest)}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="px-3 mt-4 space-y-2">
                        {monthTxs.length === 0 ? (
                            <p className="text-center text-gray-400 text-[11px] py-6 bg-white rounded-2xl border border-dashed">Nenhuma cobrança registrada neste mês.</p>
                        ) : (
                            monthTxs.map(tx => {
                                const isLoan = tx.bank === 'Empréstimo' || tx.type === 'loan';
                                const safeDateDisplay = tx.date ? tx.date.substring(0,2) : '--';
                                return (
                                    <div key={tx.id} className={`bg-white p-2.5 rounded-xl shadow-sm border flex justify-between items-center ${isLoan ? 'border-gray-800 border-l-4' : 'border-gray-200 border-l-4 border-l-indigo-400'}`}>
                                        <div className="flex gap-2.5 items-center truncate pr-2">
                                            <div className={`w-9 h-9 rounded-lg flex flex-col items-center justify-center shrink-0 border ${isLoan ? 'bg-gray-100 border-gray-300' : 'bg-indigo-50 border-indigo-100'}`}>
                                                <span className={`text-[7px] font-bold uppercase leading-none mb-0.5 ${isLoan ? 'text-gray-500' : 'text-indigo-400'}`}>Dia</span>
                                                <span className={`text-[12px] font-black leading-none ${isLoan ? 'text-gray-900' : 'text-indigo-900'}`}>{safeDateDisplay}</span>
                                            </div>
                                            <div className="truncate">
                                                <p className="font-bold text-[11px] text-gray-900 truncate">{tx.description || 'Sem descrição'}</p>
                                                <div className="flex gap-1 mt-0.5">
                                                    {isLoan ? <span className="text-[8px] font-bold px-1.5 py-0.5 rounded bg-gray-800 text-white uppercase">🏦 Empréstimo</span> : <span className="text-[8px] font-bold px-1.5 py-0.5 rounded border bg-gray-50 text-gray-500 uppercase">{tx.bank || 'Cartão'}</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="font-black text-[12px] shrink-0 text-gray-900">{formatMoney(tx.displayAmount)}</div>
                                    </div>
                                )
                            })
                        )}
                    </div>
                </div>
            );
        };

        // --- DASHBOARD ADMIN ---
        const AdminDashboard = ({ group, updateGroupData }) => {
            const [activeTab, setActiveTab] = useState('transactions');
            const [selectedMonth, setSelectedMonth] = useState(getCurrentMonthStr());
            const [banks, setBanks] = useState(group.banks || [{name: 'Nubank', color: 'purple'}, {name: 'Inter', color: 'orange'}]);
            
            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            const [importPreview, setImportPreview] = useState([]);
            const [selectedBank, setSelectedBank] = useState(banks[0]?.name || 'Cartão');
            const [replaceBank, setReplaceBank] = useState(false);

            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [customSplits, setCustomSplits] = useState({});
            
            const [bulkSelection, setBulkSelection] = useState([]);
            const [isBulkMode, setIsBulkMode] = useState(false);
            
            const [paymentModal, setPaymentModal] = useState({ open: false, memberId: null, type: 'cartao', amount: '' });
            
            const [newMemberName, setNewMemberName] = useState('');
            const [newBankName, setNewBankName] = useState('');
            const [rescueCode, setRescueCode] = useState(''); // Estado para o resgate de dados

            useEffect(() => {
                if (group && !group.shortCode) {
                    updateGroupData({ shortCode: generateCode(6) });
                }
            }, [group?.shortCode]);

            const availableMonths = useMemo(() => {
                const mSet = new Set();
                (group.transactions || []).forEach(tx => { const m = safeExtractMonth(tx.date); if(m) mSet.add(m); });
                mSet.add(getCurrentMonthStr());
                return ['Todos', ...Array.from(mSet).sort((a,b) => parseMonthStr(a) - parseMonthStr(b))];
            }, [group.transactions]);

            const { cardTxs, loanTxs } = useMemo(() => {
                const c = []; const l = [];
                (group.transactions || []).forEach(tx => {
                    const m = safeExtractMonth(tx.date);
                    if (selectedMonth === 'Todos' || m === selectedMonth) {
                        if (tx.bank === 'Empréstimo' || tx.type === 'loan') l.push(tx);
                        else c.push(tx);
                    }
                });
                return { cardTxs: c, loanTxs: l };
            }, [group.transactions, selectedMonth]);

            useEffect(() => { lucide.createIcons(); });

            // File Import
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                
                let txs = [];
                if(file.name.toLowerCase().endsWith('.pdf')) {
                    txs = await readPDFContent(file);
                } else if(file.name.toLowerCase().endsWith('.csv')) {
                    const text = await file.text();
                    txs = parseCSV(text);
                }
                
                // Trata duplicatas ignorando espaços e zeros (ex: 02/05 vs 2/5)
                const currentTxs = group.transactions || [];
                const marked = txs.map(tx => {
                    const normDesc = normalizeString(tx.description);
                    const normVal = parseFloat(tx.amount).toFixed(2);
                    
                    const isDup = currentTxs.some(ctx => {
                        return normalizeString(ctx.description) === normDesc && 
                               parseFloat(ctx.amount).toFixed(2) === normVal;
                    });
                    
                    // Adiciona parcelas futuras se houver "X/Y"
                    let forward = [];
                    const instMatch = tx.description.match(/(\d+)\/(\d+)/);
                    if(instMatch) {
                        const cur = parseInt(instMatch[1]); const tot = parseInt(instMatch[2]);
                        if(cur < tot) {
                            const dateParts = tx.date.split('/');
                            for(let i=1; i<=(tot-cur); i++) {
                                let newM = parseInt(dateParts[1]) + i;
                                let newY = new Date().getFullYear();
                                if(newM > 12) { newM -= 12; newY++; }
                                forward.push({
                                    id: crypto.randomUUID(),
                                    date: `${dateParts[0]}/${String(newM).padStart(2,'0')}/${newY}`,
                                    description: tx.description.replace(`${cur}/${tot}`, `${cur+i}/${tot}`),
                                    amount: tx.amount, bank: selectedBank, isFuture: true
                                });
                            }
                        }
                    }
                    return { ...tx, id: crypto.randomUUID(), selected: !isDup, isDup, forward };
                });
                
                setImportPreview(marked);
                setIsImportModalOpen(true);
                e.target.value = null;
            };

            const confirmImport = async () => {
                const toAdd = [];
                importPreview.forEach(tx => {
                    if(tx.selected) {
                        toAdd.push({ id: tx.id, date: tx.date, description: tx.description, amount: tx.amount, bank: selectedBank });
                        if(tx.forward) tx.forward.forEach(f => toAdd.push(f));
                    }
                });

                let updated = [...(group.transactions || [])];
                
                // Substituição Nuclear
                if(replaceBank) {
                    const selObj = parseMonthStr(selectedMonth === 'Todos' ? getCurrentMonthStr() : selectedMonth);
                    updated = updated.filter(tx => {
                        if(tx.bank !== selectedBank) return true;
                        const txM = parseMonthStr(safeExtractMonth(tx.date));
                        return txM < selObj; // Mantém só os antigos desse banco
                    });
                }
                
                await updateGroupData({ transactions: [...updated, ...toAdd] });
                setIsImportModalOpen(false);
            };

            // Manual Add
            const addManual = async (e, isLoan) => {
                e.preventDefault();
                const d = e.target.date.value; const desc = e.target.desc.value; const v = parseFloat(e.target.amount.value);
                const n = { id: crypto.randomUUID(), date: d, description: desc, amount: v, bank: isLoan ? 'Empréstimo' : selectedBank, type: isLoan ? 'loan' : 'card' };
                await updateGroupData({ transactions: [...(group.transactions || []), n] });
                e.target.reset();
            };

            // Edit
            const saveEdit = async () => {

                e.preventDefault();
                const code = rescueCode.trim();
                if(!code) return;
                try {
                    let oldGroupSnap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', code));
                    
                    if (!oldGroupSnap.exists()) {
                        const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups'), window.firebaseModules.where('shortCode', '==', code));
                        const querySnapshot = await window.firebaseModules.getDocs(q);
                        if (!querySnapshot.empty) oldGroupSnap = querySnapshot.docs[0];
                    }

                    if (oldGroupSnap && oldGroupSnap.exists()) {
                        const oldData = oldGroupSnap.data();

                                members: oldData.members || [],
                                transactions: oldData.transactions || [],
                                payments: oldData.payments || [],

            };

                        {activeTab === 'summary' && (

                                                <div className="bg-gray-50 p-2 rounded-xl"><p className="text-[9px] text-gray-600 font-bold">🏦 Empréstimo</p><p className="text-[12px] font-black">{formatMoney(lRest)}</p></div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>setPaymentModal({open:true, memberId:m.id, type:'cartao', amount: cRest > 0 ? cRest.toFixed(2) : ''})} className="flex-1 bg-green-50 text-green-700 py-1.5 rounded-lg text-[10px] font-bold border border-green-200">Receber</button>
                                                <button onClick={()=>handleRollover(m.id, tRest)} className="flex-1 bg-orange-50 text-orange-700 py-1.5 rounded-lg text-[10px] font-bold border border-orange-200">Jogar p/ Frente</button>
                                            </div>
                                        </div>

                                })}
                            </div>
                        )}
                        
                        {activeTab === 'loans' && (
                            <div className="space-y-4">

                                    <div className="flex gap-2"><input name="date" placeholder="Data DD/MM" className="w-1/3 border p-2 rounded text-[11px] outline-none" required/><input name="amount" type="number" step="0.01" placeholder="R$" className="w-2/3 border p-2 rounded text-[11px] outline-none" required/></div>
                                    <input name="desc" placeholder="Motivo" className="w-full border p-2 rounded text-[11px] outline-none" required/>

                                </form>
                                {loanTxs.map(t => (

                                        <div><p className="font-bold text-[11px]">{t.description}</p><p className="text-[9px] text-gray-500">{t.date}</p></div>
                                        <div className="font-black text-[12px]">{formatMoney(t.amount)}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                        
                        {activeTab === 'config' && (
                            <div className="space-y-4">
                                <div className="glass-card p-3 rounded-xl">
                                    <h3 className="font-bold text-[12px] mb-2">Familiares</h3>
                                    <form onSubmit={async (e)=>{e.preventDefault(); if(newMemberName) { await updateGroupData({members: [...(group.members||[]), {id:crypto.randomUUID(), name:newMemberName, pin: Math.floor(1000 + Math.random() * 9000).toString()}]}); setNewMemberName(''); }}} className="flex gap-2 mb-3">
                                        <input value={newMemberName} onChange={e=>setNewMemberName(e.target.value)} placeholder="Nome" className="flex-1 border p-2 rounded text-[11px] outline-none" />
                                        <button className="bg-indigo-600 text-white px-3 rounded text-[11px] font-bold">Add</button>

                                                    <span className="text-[11px] font-bold block">{m.name}</span>
                                                    <span className="text-[9px] font-mono text-gray-500">PIN: {m.pin || '1234'}</span>
                                                </div>
                                                <button onClick={()=>window.confirm('Excluir?') && updateGroupData({members: group.members.filter(x=>x.id!==m.id)})} className="text-red-500 text-[10px]"><i data-lucide="trash-2" className="w-3 h-3"></i></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-card p-3 rounded-xl">
                                    <h3 className="font-bold text-[12px] mb-2">Bancos</h3>
                                    <form onSubmit={async (e)=>{e.preventDefault(); if(newBankName) { const nb = [...banks, {name:newBankName, color:'gray'}]; setBanks(nb); await updateGroupData({banks: nb}); setNewBankName(''); }}} className="flex gap-2 mb-3">
                                        <input value={newBankName} onChange={e=>setNewBankName(e.target.value)} placeholder="Novo Banco" className="flex-1 border p-2 rounded text-[11px] outline-none" />
                                        <button className="bg-indigo-600 text-white px-3 rounded text-[11px] font-bold">Add</button>
                                    </form>

                                {/* FERRAMENTA DE RESGATE */}

                                        <button className="bg-orange-600 text-white px-3 rounded text-[11px] font-bold">Resgatar</button>
                                    </form>
                                </div>

                            </div>
                        )}
                    </div>

                    {/* MODAL: Importação & Substituição Nuclear */}
                    <Modal isOpen={isImportModalOpen} onClose={()=>setIsImportModalOpen(false)} title="Analisar Fatura">
                        <div className="space-y-3">
                            <div className="bg-red-50 border border-red-200 p-2 rounded-lg">
                                <label className="flex items-center gap-2 text-[10px] font-bold text-red-700 cursor-pointer">
                                    <input type="checkbox" checked={replaceBank} onChange={e=>setReplaceBank(e.target.checked)} className="rounded" />
                                    Substituir TODA a fatura do {selectedBank} neste mês e limpar parcelas futuras.
                                </label>

                            <select value={paymentModal.type} onChange={e=>setPaymentModal({...paymentModal, type:e.target.value})} className="w-full border p-2 rounded-lg text-[11px] font-bold">

        // --- APP MAIN (Controle de Login) ---
        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('landing'); // landing, admin, member
            const [currentGroup, setCurrentGroup] = useState(null);
            const [currentMemberId, setCurrentMemberId] = useState(null);

            // Campos de Form
            const [joinGroupCode, setJoinGroupCode] = useState('');
            const [joinPin, setJoinPin] = useState('');
            const [adminEmail, setAdminEmail] = useState('');
            const [adminPass, setAdminPass] = useState('');

            useEffect(() => {
                const init = async () => {
                    if (window.firebaseModules) {
                        try {
                            app = window.firebaseModules.initializeApp(myFirebaseConfig);
                            auth = window.firebaseModules.getAuth(app); 
                            db = window.firebaseModules.getFirestore(app);
                            
                            window.firebaseModules.onAuthStateChanged(auth, async (u) => { 
                                setUser(u); 
                                if(u && !u.isAnonymous) {
                                    // NOVO RADAR: Procura a pasta original onde você é o Dono (adminUid)
                                    const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups'), window.firebaseModules.where('adminUid', '==', u.uid));
                                    const snap = await window.firebaseModules.getDocs(q);
                                    
                                    if(!snap.empty) { 
                                        const docSnap = snap.docs[0];
                                        setCurrentGroup({id: docSnap.id, ...docSnap.data()}); 
                                        setView('admin'); 
                                    } else {
                                        // Recupera ou recria se não achar de jeito nenhum
                                        const fallbackRef = window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', u.uid);
                                        const fallbackSnap = await window.firebaseModules.getDoc(fallbackRef);
                                        if(fallbackSnap.exists()) {
                                            setCurrentGroup({id: fallbackSnap.id, ...fallbackSnap.data()});
                                            setView('admin');
                                        } else {
                                            const newGroup = { id: u.uid, adminUid: u.uid, members: [], transactions: [], banks: [{name:'Nubank', color:'purple'}] };
                                            await window.firebaseModules.setDoc(fallbackRef, newGroup);
                                            setCurrentGroup(newGroup);
                                            setView('admin');
                                        }
                                    }
                                }
                                setIsReady(true); 
                            });
                        } catch (e) { console.error(e); setIsReady(true); }
                    }
                }; 
                init();
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const docId = view === 'admin' ? user?.uid : currentGroup.id;
                if(!docId) return;
                const groupRef = window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', docId);
                const unsubscribe = window.firebaseModules.onSnapshot(groupRef, (docSnap) => { 
                    if (docSnap.exists()) setCurrentGroup({ id: docSnap.id, ...docSnap.data() }); 
                });
                return () => unsubscribe();
            }, [currentGroup?.id, view, user]);

            const updateGroupData = async (updates) => {
                if (!db || !currentGroup) return;
                try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', currentGroup.id), updates); } 
                catch (e) { alert("Erro ao salvar."); }
            };

            const handleLoginAdmin = async (e) => {
                e.preventDefault();
                try {
                    const cred = await window.firebaseModules.signInWithEmailAndPassword(auth, adminEmail, adminPass);
                    
                    // NOVO RADAR NO LOGIN
                    const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups'), window.firebaseModules.where('adminUid', '==', cred.user.uid));
                    const snap = await window.firebaseModules.getDocs(q);
                    
                    if(!snap.empty) { 
                        const docSnap = snap.docs[0];
                        setCurrentGroup({id: docSnap.id, ...docSnap.data()}); 
                        setView('admin'); 
                    } else {
                        const fallbackRef = window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', cred.user.uid);
                        const fallbackSnap = await window.firebaseModules.getDoc(fallbackRef);
                        if(fallbackSnap.exists()) {
                            setCurrentGroup({id: fallbackSnap.id, ...fallbackSnap.data()});
                            setView('admin');
                        } else {
                            const newGroup = { id: cred.user.uid, adminUid: cred.user.uid, members: [], transactions: [], banks: [{name:'Nubank', color:'purple'}] };
                            await window.firebaseModules.setDoc(fallbackRef, newGroup);
                            setCurrentGroup(newGroup); setView('admin');
                        }
                    }
                } catch(err) {
                    if(err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials') {
                        if(window.confirm("Conta não encontrada ou senha incorreta. Deseja criar uma nova conta com este e-mail?")) {
                            try {
                                const cred = await window.firebaseModules.createUserWithEmailAndPassword(auth, adminEmail, adminPass);
                                const newGroup = { id: cred.user.uid, adminUid: cred.user.uid, members: [], transactions: [], banks: [{name:'Nubank', color:'purple'}] };
                                await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', cred.user.uid), newGroup);
                                setCurrentGroup(newGroup); setView('admin');
                            } catch (createErr) {
                                alert("Erro ao criar conta: " + createErr.message);
                            }
                        }
                    } else {
                        alert("Erro no login: " + err.message);
                    }
                }
            };

            const handleLoginMember = async (e) => {
                e.preventDefault(); 
                if (!db || !joinGroupCode.trim()) return;
                try {
                    const code = joinGroupCode.trim();
                    // Busca o grupo direto pelo Código (Sem exigir PIN)
                    const docRef = window.firebaseModules.doc(db, 'artifacts', 'fatura-familia', 'public', 'data', 'groups', code);
                    const docSnap = await window.firebaseModules.getDoc(docRef);
                    
                    if (docSnap.exists()) {
                        setCurrentGroup({ id: docSnap.id, ...docSnap.data() });
                        setView('member-select'); // Manda para a tela Estilo Netflix
                    } else {
                        alert("Código não encontrado. Peça o código correto ao Administrador.");
                    }
                } catch (e) { 
                    console.error(e); 
                    alert("Erro ao acessar.");
                }
            };

            // Hack para testar o membro diretamente se o admin quiser
            const loginAsMemberTest = (memberId) => {
                setCurrentMemberId(memberId);
                setView('member');
            };

            if (!isReady) return <div className="flex h-screen items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <ErrorBoundary>
                    <div className="min-h-screen bg-gray-50 font-sans">
                        {view === 'landing' && (
                            <div className="max-w-md mx-auto pt-16 px-4 space-y-6 fade-in">
                                <div className="text-center space-y-2 mb-8">
                                    <h1 className="text-3xl font-black text-gray-900 tracking-tight">Fatura Família</h1>
                                </div>
                                <div className="bg-white p-6 rounded-3xl border-t-4 border-t-indigo-500 shadow-sm">
                                    <h2 className="text-lg font-black text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="shield-check" className="w-5 h-5 text-indigo-600"></i> Admin (E-mail/Senha)</h2>
                                    <form onSubmit={handleLoginAdmin} className="space-y-3">
                                        <input type="email" placeholder="Seu E-mail" className="w-full p-3 border rounded-xl bg-gray-50 outline-none text-sm font-bold" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} required />
                                        <input type="password" placeholder="Senha" className="w-full p-3 border rounded-xl bg-gray-50 outline-none text-sm font-bold" value={adminPass} onChange={e=>setAdminPass(e.target.value)} required />
                                        <button type="submit" className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-md">Entrar / Criar Conta</button>
                                    </form>
                                </div>

                                <div className="bg-white p-6 rounded-3xl border-t-4 border-t-gray-800 shadow-sm mt-6">
                                    <h2 className="text-lg font-black text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="users" className="w-5 h-5 text-gray-800"></i> Acesso Familiar</h2>
                                    <form onSubmit={handleLoginMember} className="space-y-3">
                                        <input type="text" placeholder="Código do Grupo" className="w-full p-3 border rounded-xl bg-gray-50 outline-none text-sm font-bold text-center tracking-widest" value={joinGroupCode} onChange={e=>setJoinGroupCode(e.target.value)} required />
                                        <button type="submit" className="w-full bg-gray-800 text-white py-3 rounded-xl font-bold text-sm shadow-md">Acessar Fatura</button>
                                    </form>
                                </div>
                            </div>
                        )}
                        
                        {view === 'member-select' && currentGroup && (
                            <div className="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-6 fade-in">
                                <h2 className="text-white text-2xl font-black mb-10 tracking-tight">Quem está acessando?</h2>
                                <div className="flex flex-wrap justify-center gap-6 max-w-lg">
                                    {currentGroup.members?.map(m => (
                                        <div key={m.id} onClick={() => { setCurrentMemberId(m.id); setView('member'); }} className="flex flex-col items-center cursor-pointer group hover:scale-105 transition-all">
                                            <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-4xl font-black mb-3 group-hover:ring-4 ring-indigo-400 shadow-xl">{m.name.charAt(0)}</div>
                                            <span className="text-gray-300 font-bold text-sm">{m.name}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => {setCurrentGroup(null); setView('landing');}} className="mt-16 text-gray-500 font-bold hover:text-white bg-gray-800 px-6 py-2 rounded-full text-sm transition-colors">Voltar</button>
                            </div>
                        )}
                        
                        {view === 'admin' && currentGroup && (
                            <>
                                <nav className="bg-white border-b shadow-sm h-12 flex items-center px-4 justify-between sticky top-0 z-40">
                                    <span className="font-black text-indigo-700 text-[12px]"><i data-lucide="pie-chart" className="inline w-4 h-4"></i> FaturaFamília</span>
                                    <button onClick={()=>{window.firebaseModules.signOut(auth); setView('landing');}} className="text-[10px] font-bold text-gray-500">Sair</button>
                                </nav>
                                <AdminDashboard group={currentGroup} updateGroupData={updateGroupData} />
                                {/* Botões rápidos de teste para o dev no final da tela Admin */}
                                <div className="p-4 text-center border-t mt-8">
                                    <p className="text-[9px] text-gray-400 mb-2 uppercase font-bold">Testar Visão do Familiar</p>
                                    <div className="flex justify-center gap-2 flex-wrap">
                                        {currentGroup.members?.map(m => <button key={m.id} onClick={()=>loginAsMemberTest(m.id)} className="bg-gray-200 text-gray-700 px-2 py-1 rounded text-[10px] font-bold shadow-sm">{m.name}</button>)}
                                    </div>
                                </div>
                            </>
                        )}

                        {view === 'member' && currentGroup && currentMemberId && (
                            <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={() => {setCurrentMemberId(null); setView('admin');}} />
                        )}
                    </div>
                </ErrorBoundary>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root')); 
        root.render(<App />);
    </script>
</body>
</html>
