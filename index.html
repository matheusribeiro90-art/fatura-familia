                  className="text-[10px] text-white font-black px-2 py-0.5 rounded uppercase shadow-sm"
                >
                  {tx.bank || 'CARTÃO'}
                </span>
                <span className="text-[10px] text-slate-500 font-bold">{tx.date}</span>
              </div>
              <div
                style={{ color: bankColor }}
                className="text-xs font-black mt-1 break-words"
              >
                {tx.description}
              </div>
            </div>

            <div className="text-right flex items-center gap-2">
              <span className={`text-xs font-black ${tx.amount < 0 ? 'text-emerald-600' : 'text-slate-900'}`}>
                {formatBRL(tx.amount)}
              </span>
              <button
                onClick={() => onDelete(tx.id)}
                className="text-slate-400 hover:text-red-600 text-xs font-bold px-1"
                title="Excluir"
              >
                🗑️
              </button>
            </div>
          </div>

          <div className="flex flex-wrap gap-1">
            {members.map(m => {
              const active = tx.ownerId === m.id;
              return (
                <button
                  key={m.id}
                  onClick={() => onAssign(tx, m.id, [])}
                  className={`text-[11px] font-bold px-2.5 py-1 rounded-lg transition ${
                    active
                      ? 'bg-slate-900 text-white shadow'
                      : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100'
                  }`}
                >
                  {m.name}
                </button>
              );
            })}
            <button
              onClick={() => setShowSplit(!showSplit)}
              className={`text-[11px] font-bold px-2.5 py-1 rounded-lg ${
                tx.ownerId === 'SPLIT'
                  ? 'bg-purple-700 text-white'
                  : 'bg-purple-50 text-purple-800 border border-purple-200'
              }`}
            >
              ➗ Rateio
            </button>
          </div>

          {showSplit && (
            <div className="bg-white p-2 rounded-lg border border-purple-200 flex flex-wrap items-center gap-2">
              {members.map(m => (
                <label key={m.id} className="flex items-center gap-1 text-xs font-semibold">
                  <input
                    type="checkbox"
                    checked={splitSelection.includes(m.id)}
                    onChange={e => {
                      const next = e.target.checked
                        ? [...splitSelection, m.id]
                        : splitSelection.filter(id => id !== m.id);
                      setSplitSelection(next);
                    }}
                  />
                  {m.name}
                </label>
              ))}
              <button
                onClick={() => {
                  if (splitSelection.length > 0) {
                    onAssign(tx, 'SPLIT', splitSelection);
                    setShowSplit(false);
                  }
                }}
                className="ml-auto bg-purple-600 text-white text-[11px] font-bold px-2.5 py-1 rounded"
              >
                Confirmar Rateio
              </button>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MODAL DE RENEGOCIAÇÃO COMPLETO (ENTRADA LIVRE SEM TETO + PARCELAS C/ JUROS + QUEM PAGA OS JUROS)
    // =========================================================================
    function RenegotiationModal({
      currentGroup, selectedMonth, banksList, getBankColor, saveGroupData, onClose
    }) {
      const [selectedBank, setSelectedBank] = useState(banksList[0] || 'INTER');
      const [customTotalDebt, setCustomTotalDebt] = useState({});
      const [entryByMember, setEntryByMember] = useState({});
      const [numInstallments, setNumInstallments] = useState('6');
      const [bankInstallmentValue, setBankInstallmentValue] = useState('');
      const [interestBearers, setInterestBearers] = useState([]);
      const [interestSplitMode, setInterestSplitMode] = useState('proporcional');

      const nextMonth = useMemo(() => addMonthsToMMYYYY(selectedMonth, 1), [selectedMonth]);

      const memberDebtsOnBank = useMemo(() => {
        const members = currentGroup.members || [];
        const allTxs = (currentGroup.transactions || []).filter(t =>
          !t.paid &&
          String(t.bank || '').toUpperCase() === selectedBank.toUpperCase() &&
          compareMMYYYY(t.month, selectedMonth) >= 0
        );

        return members.map(m => {
          let currentMonthVal = 0;
          let futureMonthsVal = 0;

          allTxs.forEach(t => {
            let share = 0;
            if (t.ownerId === m.id) share = Number(t.amount) || 0;
            else if (t.ownerId === 'SPLIT' && (t.splitIds || []).includes(m.id)) {
              share = (Number(t.amount) || 0) / Math.max(1, t.splitIds.length);
            }
            if (share !== 0) {
              if (t.month === selectedMonth) currentMonthVal += share;
              else futureMonthsVal += share;
            }
          });

          const autoTotal = Number((currentMonthVal + futureMonthsVal).toFixed(2));
          return {
            memberId: m.id,
            name: m.name,
            currentMonthVal: Number(currentMonthVal.toFixed(2)),
            futureMonthsVal: Number(futureMonthsVal.toFixed(2)),
            autoTotal
          };
        });
      }, [currentGroup.members, currentGroup.transactions, selectedBank, selectedMonth]);

      useEffect(() => {
        const initEntries = {};
        const initTotals = {};
        let maxDebtorId = null;
        let maxVal = -1;

        memberDebtsOnBank.forEach(d => {
          initTotals[d.memberId] = d.autoTotal;
          initEntries[d.memberId] = 0;
          if (d.autoTotal > maxVal) {
            maxVal = d.autoTotal;
            maxDebtorId = d.memberId;
          }
        });

        setCustomTotalDebt(initTotals);
        setEntryByMember(initEntries);
        setInterestBearers(maxDebtorId && maxVal > 0 ? [maxDebtorId] : []);
      }, [selectedBank]);

      const toggleInterestBearer = (memberId) => {
        setInterestBearers(prev =>
          prev.includes(memberId) ? prev.filter(x => x !== memberId) : [...prev, memberId]
        );
      };

      const calc = useMemo(() => {
        const nInst = Math.max(1, parseInt(numInstallments, 10) || 1);
        const bankInstVal = parseNum(bankInstallmentValue);

        const rows = memberDebtsOnBank.map(d => {
          const totalDebt = customTotalDebt[d.memberId] !== undefined
            ? parseNum(customTotalDebt[d.memberId])
            : d.autoTotal;
          const entry = parseNum(entryByMember[d.memberId]);
          const principalForward = Number((totalDebt - entry).toFixed(2));
          return {
            ...d,
            totalDebt,
            entry,
            principalForward
          };
        });

        const totalCardDebtAll = rows.reduce((a, r) => a + r.totalDebt, 0);
        const totalEntryAll = rows.reduce((a, r) => a + r.entry, 0);
        const totalPrincipalForwardAll = rows.reduce((a, r) => a + r.principalForward, 0);

        const totalBankFutureWithInterest = bankInstVal > 0
          ? Number((bankInstVal * nInst).toFixed(2))
          : totalPrincipalForwardAll;

        const totalBankInterest = Number((totalBankFutureWithInterest - totalPrincipalForwardAll).toFixed(2));

        const bearersRows = rows.filter(r => interestBearers.includes(r.memberId));
        const bearersForwardSum = bearersRows.reduce((a, r) => a + Math.max(0, r.principalForward), 0);

        const finalRows = rows.map(r => {
          let interestShare = 0;
          if (interestBearers.includes(r.memberId) && totalBankInterest !== 0) {
            if (interestSplitMode === 'proporcional' && bearersForwardSum > 0) {
              interestShare = totalBankInterest * (Math.max(0, r.principalForward) / bearersForwardSum);
            } else {
              interestShare = totalBankInterest / Math.max(1, interestBearers.length);
            }
          }
          const finalFutureTotal = Number((r.principalForward + interestShare).toFixed(2));
          const monthlyInstallment = Number((finalFutureTotal / nInst).toFixed(2));

          return {
            ...r,
            interestShare: Number(interestShare.toFixed(2)),
            finalFutureTotal,
            monthlyInstallment
          };
        });

        return {
          nInst,
          bankInstVal,
          totalCardDebtAll,
          totalEntryAll,
          totalPrincipalForwardAll,
          totalBankFutureWithInterest,
          totalBankInterest,
          finalRows
        };
      }, [memberDebtsOnBank, customTotalDebt, entryByMember, numInstallments, bankInstallmentValue, interestBearers, interestSplitMode]);

      const handleCopyWhatsApp = () => {
        const lines = [
          `📊 *RENEGOCIAÇÃO CARTÃO ${selectedBank}*`,
          `📅 *Entrada (${selectedMonth}):* ${formatBRL(calc.totalEntryAll)}`,
          `📆 *Parcelas Futuras (${calc.nInst}x a partir de ${nextMonth}):* ${formatBRL(calc.totalBankFutureWithInterest / calc.nInst)}/mês`,
          `────────────────────`
        ];
        calc.finalRows.forEach(r => {
          if (Math.abs(r.totalDebt) < 0.01 && Math.abs(r.entry) < 0.01) return;
          lines.push(
            `👤 *${r.name}:*\n` +
            `   • Dívida Total no Cartão: ${formatBRL(r.totalDebt)}\n` +
            `   • Entrada neste mês (${selectedMonth}): *${formatBRL(r.entry)}*\n` +
            `   • Saldo p/ frente (s/ juros): ${formatBRL(r.principalForward)}` +
            (r.interestShare > 0 ? ` (+ Juros: ${formatBRL(r.interestShare)})` : '') + `\n` +
            `   • Parcelas a partir de ${nextMonth}: *${calc.nInst}x de ${formatBRL(r.monthlyInstallment)}*`
          );
        });
        navigator.clipboard.writeText(lines.join('\n'));
        alert('Resumo copiado para colar no WhatsApp!');
      };

      const handleApplyRenegotiation = async () => {
        if (!confirm(`Aplicar renegociação no cartão ${selectedBank}? Isso deixará as Entradas em ${selectedMonth} e lançará as ${calc.nInst} parcelas a partir de ${nextMonth}.`)) {
          return;
        }

        const remainingTxs = (currentGroup.transactions || []).filter(t => {
          const sameBank = String(t.bank || '').toUpperCase() === selectedBank.toUpperCase();
          const isCurrentOrFuture = compareMMYYYY(t.month, selectedMonth) >= 0;
          if (sameBank && isCurrentOrFuture && !t.paid) return false;
          return true;
        });

        const generatedTxs = [];

        calc.finalRows.forEach(r => {
          if (Math.abs(r.entry) >= 0.01) {
            generatedTxs.push({
              id: 'reneg_ent_' + Date.now() + '_' + r.memberId,
              date: 'ENTRADA',
              description: `ENTRADA RENEGOCIAÇÃO ${selectedBank}`,
              amount: Number(r.entry.toFixed(2)),
              bank: selectedBank.toUpperCase(),
              month: selectedMonth,
              ownerId: r.memberId,
              splitIds: [],
              paid: false
            });
          }

          if (Math.abs(r.monthlyInstallment) >= 0.01) {
            for (let i = 1; i <= calc.nInst; i++) {
              const targetM = addMonthsToMMYYYY(selectedMonth, i);
              const padI = String(i).padStart(2, '0');
              const padTot = String(calc.nInst).padStart(2, '0');
              generatedTxs.push({
                id: `reneg_parc_${Date.now()}_${r.memberId}_${i}`,
                date: 'RENEG',
                description: `RENEGOCIAÇÃO ${selectedBank} - Parcela ${padI}/${padTot}`,
                amount: r.monthlyInstallment,
                bank: selectedBank.toUpperCase(),
                month: targetM,
                ownerId: r.memberId,
                splitIds: [],
                paid: false
              });
            }
          }
        });

        await saveGroupData({ transactions: [...remainingTxs, ...generatedTxs] });
        onClose();
      };

      const bankColor = getBankColor(selectedBank);

      return (
        <div className="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-2 sm:p-4">
          <div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl max-h-[94vh] flex flex-col overflow-hidden">
            <div
              style={{ backgroundColor: bankColor }}
              className="p-3.5 text-white flex items-center justify-between"
            >
              <div>
                <h2 className="text-sm sm:text-base font-black uppercase">
                  🧮 Renegociação de Cartão ({selectedBank})
                </h2>
                <p className="text-[11px] text-white/85">
                  Entrada livre em {selectedMonth} + Parcelas futuras com juros a partir de {nextMonth}
                </p>
              </div>
              <button
                onClick={onClose}
                className="bg-black/25 hover:bg-black/40 text-white text-xs font-bold px-3 py-1.5 rounded-lg"
              >
                ✕ Fechar
              </button>
            </div>

            <div className="p-3 sm:p-4 overflow-y-auto space-y-4 flex-1">
              <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-2.5 rounded-xl">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-black uppercase text-slate-700">1. Qual Cartão?</span>
                  <select
                    value={selectedBank}
                    onChange={e => setSelectedBank(e.target.value)}
                    className="px-3 py-1.5 text-xs font-black rounded-lg border border-slate-300 bg-white"
                  >
                    {banksList.map(b => <option key={b} value={b}>{b}</option>)}
                  </select>
                </div>
                <div className="text-xs font-bold text-slate-700">
                  Dívida Total no Cartão (Atual + Futuro): <strong className="text-slate-950">{formatBRL(calc.totalCardDebtAll)}</strong>
                </div>
              </div>

              <div className="border border-slate-200 rounded-2xl p-3 space-y-2.5">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h3 className="text-xs font-black uppercase text-slate-800">
                      2. Valor de Entrada em {selectedMonth} (Livre — Sem trava de teto)
                    </h3>
                    <p className="text-[11px] text-slate-500">
                      Digite quanto cada pessoa vai dar de entrada neste mês. O restante de cada um vai para as parcelas de {nextMonth}.
                    </p>
                  </div>
                  <div className="flex gap-1.5">
                    <button
                      type="button"
                      onClick={() => {
                        const next = {};
                        memberDebtsOnBank.forEach(d => { next[d.memberId] = d.currentMonthVal; });
                        setEntryByMember(next);
                      }}
                      className="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold px-2 py-1 rounded-lg"
                    >
                      Preencher c/ Fatura do Mês
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const next = {};
                        memberDebtsOnBank.forEach(d => { next[d.memberId] = 0; });
                        setEntryByMember(next);
                      }}
                      className="text-[10px] bg-slate-100 text-slate-700 font-bold px-2 py-1 rounded-lg"
                    >
                      Zerar Entradas
                    </button>
                  </div>
                </div>

                <div className="space-y-2">
                  {calc.finalRows.map(r => (
                    <div
                      key={r.memberId}
                      className="grid grid-cols-1 sm:grid-cols-12 items-center gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"
                    >
                      <div className="sm:col-span-3">
                        <div className="font-black text-slate-900">{r.name}</div>
                        <div className="text-[10px] text-slate-500">
                          Mês: {formatBRL(r.currentMonthVal)} | Futuro: {formatBRL(r.futureMonthsVal)}
                        </div>
                      </div>

                      <div className="sm:col-span-3">
                        <label className="text-[10px] font-bold text-slate-500 block">Dívida Total no Cartão (R$)</label>
                        <input
                          type="number"
                          step="0.01"
                          value={customTotalDebt[r.memberId] ?? r.autoTotal}
                          onChange={e => setCustomTotalDebt(prev => ({ ...prev, [r.memberId]: e.target.value }))}
                          className="w-full px-2 py-1 border rounded-lg font-bold bg-white"
                        />
                      </div>

                      <div className="sm:col-span-3">
                        <label className="text-[10px] font-black text-emerald-700 block">
                          Entrada em {selectedMonth} (R$)
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          placeholder="0,00"
                          value={entryByMember[r.memberId] ?? ''}
                          onChange={e => setEntryByMember(prev => ({ ...prev, [r.memberId]: e.target.value }))}
                          className="w-full px-2 py-1 border-2 border-emerald-400 rounded-lg font-black bg-emerald-50/40 text-emerald-950"
                        />
                      </div>

                      <div className="sm:col-span-3 text-right">
                        <div className="text-[10px] font-bold text-slate-500">Vai p/ Frente (Sem Juros)</div>
                        <div className="text-xs font-black text-slate-900">{formatBRL(r.principalForward)}</div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-2 pt-1">
                  <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
                    <div className="text-[10px] font-bold uppercase text-emerald-800">
                      Soma da Entrada (Fica em {selectedMonth})
                    </div>
                    <div className="text-base font-black text-emerald-700">{formatBRL(calc.totalEntryAll)}</div>
                  </div>
                  <div className="bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
                    <div className="text-[10px] font-bold uppercase text-amber-900">
                      Restante p/ {nextMonth} (Sem Juros)
                    </div>
                    <div className="text-base font-black text-amber-800">{formatBRL(calc.totalPrincipalForwardAll)}</div>
                  </div>
                </div>
              </div>

              <div className="border-2 border-orange-300 bg-orange-50/40 rounded-2xl p-3 space-y-3">
                <h3 className="text-xs font-black uppercase text-orange-900">
                  3. Parcelas Futuras no Banco (Com Juros) & Quem Assume os Juros
                </h3>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                  <div>
                    <label className="text-[10px] font-bold text-slate-600 uppercase block">
                      Nº de Parcelas (a partir de {nextMonth})
                    </label>
                    <input
                      type="number"
                      min="1"
                      max="72"
                      value={numInstallments}
                      onChange={e => setNumInstallments(e.target.value)}
                      className="w-full px-3 py-2 text-xs font-black border border-orange-300 rounded-xl bg-white"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-slate-600 uppercase block">
                      Valor da Parcela c/ Juros no Banco (R$)
                    </label>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="Ex: 557.76"
                      value={bankInstallmentValue}
                      onChange={e => setBankInstallmentValue(e.target.value)}
                      className="w-full px-3 py-2 text-xs font-black border-2 border-orange-400 rounded-xl bg-white"
                    />
                  </div>

                  <div className="bg-white p-2 rounded-xl border border-orange-200 flex flex-col justify-center">
                    <div className="text-[10px] text-slate-500 font-bold">
                      Total c/ Juros: <strong>{formatBRL(calc.totalBankFutureWithInterest)}</strong>
                    </div>
                    <div className="text-xs font-black text-orange-700">
                      Juros do Banco: {formatBRL(calc.totalBankInterest)}
                    </div>
                  </div>
                </div>

                <div className="space-y-1.5">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="text-[11px] font-black text-slate-800">
                      Quem vai assumir os {formatBRL(calc.totalBankInterest)} de juros do banco? (Pode marcar 1 ou mais)
                    </span>
                    {interestBearers.length > 1 && (
                      <select
                        value={interestSplitMode}
                        onChange={e => setInterestSplitMode(e.target.value)}
                        className="text-[11px] font-bold px-2 py-1 border rounded-lg bg-white"
                      >
                        <option value="proporcional">Dividir Juros Proporcional ao Saldo</option>
                        <option value="igual">Dividir Juros em Partes Iguais</option>
                      </select>
                    )}
                  </div>

                  <div className="flex flex-wrap gap-1.5">
                    {calc.finalRows.map(r => {
                      const active = interestBearers.includes(r.memberId);
                      return (
                        <button
                          key={r.memberId}
                          type="button"
                          onClick={() => toggleInterestBearer(r.memberId)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border transition ${
                            active
                              ? 'bg-orange-600 text-white border-orange-700 shadow'
                              : 'bg-white text-slate-700 border-slate-300'
                          }`}
                        >
                          {active ? '🔥 ' : ''}{r.name}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="bg-slate-900 text-white rounded-2xl p-3 space-y-2">
                <h3 className="text-xs font-black uppercase text-amber-400">
                  4. Resultado Final: Entrada ({selectedMonth}) + Parcelas a partir de {nextMonth}
                </h3>

                <div className="space-y-1.5">
                  {calc.finalRows.map(r => (
                    <div
                      key={r.memberId}
                      className="p-2.5 rounded-xl bg-slate-800 flex flex-wrap items-center justify-between gap-2 text-xs"
                    >
                      <div>
                        <span className="font-black text-white text-sm">{r.name}</span>
                        <div className="text-[11px] text-slate-400">
                          Saldo p/ frente s/ juros: {formatBRL(r.principalForward)}
                          {r.interestShare !== 0 && (
                            <span className="text-orange-400 font-bold"> + Juros: {formatBRL(r.interestShare)}</span>
                          )}
                        </div>
                      </div>

                      <div className="flex items-center gap-4">
                        <div className="text-right">
                          <div className="text-[10px] text-emerald-400 font-bold uppercase">Entrada ({selectedMonth})</div>
                          <div className="text-xs font-black text-emerald-300">{formatBRL(r.entry)}</div>
                        </div>

                        <div className="text-right">
                          <div className="text-[10px] text-amber-400 font-bold uppercase">
                            Parcelas ({nextMonth} em diante)
                          </div>
                          <div className="text-sm font-black text-amber-300">
                            {calc.nInst}x de {formatBRL(r.monthlyInstallment)}
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="p-3 bg-slate-100 border-t flex flex-wrap gap-2 justify-end">
              <button
                type="button"
                onClick={handleCopyWhatsApp}
                className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black px-4 py-2.5 rounded-xl"
              >
                📲 Copiar Resumo p/ WhatsApp
              </button>
              <button
                type="button"
                onClick={handleApplyRenegotiation}
                className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-black px-5 py-2.5 rounded-xl shadow"
              >
                ✅ OK (Aplicar Renegociação no Cartão)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // GERENCIADOR DE FAMILIARES E FINAIS DE CARTÃO
    // =========================================================================
    function MembersManager({ currentGroup, saveGroupData }) {
      const [newName, setNewName] = useState('');
      const [newCards, setNewCards] = useState('');

      const addMember = async (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        const cardsArr = newCards.split(',').map(s => s.trim()).filter(Boolean);
        const next = [
          ...(currentGroup.members || []),
          { id: 'm_' + Date.now(), name: newName.trim(), cards: cardsArr }
        ];
        await saveGroupData({ members: next });
        setNewName('');
        setNewCards('');
      };

      const updateMemberCards = async (memberId, cardsStr) => {
        const cardsArr = cardsStr.split(',').map(s => s.trim()).filter(Boolean);
        const next = (currentGroup.members || []).map(m =>
          m.id === memberId ? { ...m, cards: cardsArr } : m
        );
        await saveGroupData({ members: next });
      };

      return (
        <div className="space-y-4">
          <form onSubmit={addMember} className="bg-white p-4 rounded-2xl shadow-sm border space-y-2.5">
            <h3 className="text-xs font-black uppercase text-slate-800">👥 Adicionar Familiar</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <input
                type="text"
                placeholder="Nome (Ex: Leonardo)"
                value={newName}
                onChange={e => setNewName(e.target.value)}
                className="px-3 py-2 text-xs border rounded-xl font-bold"
                required
              />
              <input
                type="text"
                placeholder="Finais de Cartão separados por vírgula (Ex: 3163, 7258)"
                value={newCards}
                onChange={e => setNewCards(e.target.value)}
                className="px-3 py-2 text-xs border rounded-xl"
              />
            </div>
            <button type="submit" className="bg-indigo-600 text-white text-xs font-extrabold px-4 py-2 rounded-xl">
              Salvar Familiar
            </button>
          </form>

          <div className="bg-white p-4 rounded-2xl shadow-sm border space-y-2">
            <h4 className="text-xs font-black uppercase text-slate-700">Familiares Cadastrados</h4>
            {(currentGroup.members || []).map(m => (
              <div key={m.id} className="p-2.5 border rounded-xl flex flex-wrap items-center justify-between gap-2">
                <span className="text-xs font-black text-slate-900">{m.name}</span>
                <div className="flex items-center gap-2 flex-1 max-w-xs">
                  <input
                    type="text"
                    defaultValue={(m.cards || []).join(', ')}
                    placeholder="Finais cartão (ex: 3163, 9663)"
                    onBlur={e => updateMemberCards(m.id, e.target.value)}
                    className="flex-1 px-2 py-1 text-xs border rounded-lg"
                  />
                  <button
                    onClick={async () => {
                      if (!confirm(`Remover ${m.name}?`)) return;
                      await saveGroupData({
                        members: (currentGroup.members || []).filter(x => x.id !== m.id)
                      });
                    }}
                    className="text-xs text-red-600 font-bold"
                  >
                    Excluir
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
