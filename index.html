<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Fatura Família</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const manifest = {
            name: "Fatura Família", short_name: "Fatura", start_url: ".", display: "standalone",
            background_color: "#f8fafc", theme_color: "#4f46e5",
            icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.1-.96-2.17-1.92H8.01c.06 1.62 1.11 2.86 2.89 3.24V19h2.36v-1.67c1.73-.32 2.99-1.3 2.99-2.92 0-1.89-1.53-2.65-3.64-3.15z'/%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, updateDoc, onSnapshot, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, getFirestore, doc, updateDoc, onSnapshot, query, collection, where, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const { useState, useEffect, useRef, useMemo } = React;
        let app, auth, db;

        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        const generateCode = () => Math.random().toString(36).substring(2, 6).toUpperCase() + '-' + Math.random().toString(36).substring(2, 4).toUpperCase();
        
        const getCurrentMonthStr = () => {
            const d = new Date();
            return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        };

        const addInvoiceMonth = (monthStr, add) => {
            if (!monthStr || monthStr === 'Todos') return monthStr;
            const [m, y] = monthStr.split('/');
            let month = parseInt(m, 10) + add;
            let year = parseInt(y, 10);
            while (month > 12) { month -= 12; year++; }
            while (month < 1) { month += 12; year--; }
            return `${month.toString().padStart(2, '0')}/${year}`;
        };

        const parseMonthStr = (str) => {
            if (str === 'Todos') return new Date(9999, 11);
            const [m, y] = str.split('/');
            return new Date(y, m - 1);
        };

        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => { if (spanRef.current && window.lucide) { spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`; window.lucide.createIcons({ root: spanRef.current }); } }, [name, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        const getBankStyle = (bankName) => {
            if(bankName === 'Nubank') return 'bg-purple-100 text-purple-700 border-purple-200';
            if(bankName === 'Inter') return 'bg-orange-100 text-orange-700 border-orange-200';
            if(bankName === 'Mercado Pago') return 'bg-blue-100 text-blue-700 border-blue-200';
            if(bankName === 'Empréstimo') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
            return 'bg-gray-100 text-gray-600 border-gray-200';
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-3 border-b flex justify-between items-center bg-gray-50/80">
                            <h3 className="text-sm font-black text-gray-800">{title}</h3>
                            <button onClick={onClose} className="p-1.5 bg-gray-200/50 hover:bg-gray-200 rounded-full text-gray-600 transition-colors"><Icon name="x" className="w-4 h-4" /></button>
                        </div>
                        <div className="p-3 overflow-y-auto custom-scroll">{children}</div>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ group, updateGroupData, notify }) => {
            const [activeTab, setActiveTab] = useState('transactions'); 
            const [isSelectionMode, setIsSelectionMode] = useState(false);
            
            const sortedMembers = useMemo(() => {
                if (!group.members) return [];
                return [...group.members].sort((a, b) => a.name.localeCompare(b.name));
            }, [group.members]);

            const availableInvoiceMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => { if(tx.invoiceMonth) months.add(tx.invoiceMonth); });
                const currentMonth = getCurrentMonthStr();
                months.add(currentMonth);
                const sorted = Array.from(months).sort((a, b) => parseMonthStr(a) - parseMonthStr(b));
                return [...sorted, 'Todos'];
            }, [group.transactions]);
            
            const [selectedInvoiceMonth, setSelectedInvoiceMonth] = useState(getCurrentMonthStr());
            const [selectedBankFilter, setSelectedBankFilter] = useState('Todos');
            const [bulkSelections, setBulkSelections] = useState([]);

            const isMonthClosed = group.invoiceStatus && group.invoiceStatus[selectedInvoiceMonth];
            const toggleMonthStatus = async () => {
                if(selectedInvoiceMonth === 'Todos') return;
                const newStatus = { ...(group.invoiceStatus || {}) };
                newStatus[selectedInvoiceMonth] = !isMonthClosed;
                await updateGroupData({ invoiceStatus: newStatus });
                notify(!isMonthClosed ? "Fatura Fechada! Familiares avisados." : "Fatura reaberta para edições!");
            };

            const filteredTransactions = useMemo(() => {
                let txs = group.transactions || [];
                if (selectedInvoiceMonth !== 'Todos') {
                    txs = txs.filter(tx => tx.invoiceMonth === selectedInvoiceMonth);
                }
                if (selectedBankFilter !== 'Todos') txs = txs.filter(tx => tx.bank === selectedBankFilter);
                
                // Empréstimos nunca aparecem no Extrato para não sujar a conferência com o Banco
                if (activeTab === 'transactions') {
                    txs = txs.filter(tx => tx.bank !== 'Empréstimo'); 
                }

                return txs.sort((a, b) => {
                    if (a.bank === 'Empréstimo' && b.bank !== 'Empréstimo') return -1;
                    if (a.bank !== 'Empréstimo' && b.bank === 'Empréstimo') return 1;
                    return 0;
                });
            }, [group.transactions, selectedInvoiceMonth, selectedBankFilter, activeTab]);

            const pendingTxs = filteredTransactions.filter(tx => !tx.assignedTo && (!tx.splits || tx.splits.length === 0));
            const completedTxs = filteredTransactions.filter(tx => tx.assignedTo || (tx.splits && tx.splits.length > 0));
            const totalFiltered = filteredTransactions.reduce((acc, curr) => acc + curr.amount, 0);

            // Importação
            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [pasteText, setPasteText] = useState('');
            const [parsedPreview, setParsedPreview] = useState(null);
            const [importInvoiceMonth, setImportInvoiceMonth] = useState(getCurrentMonthStr());
            const [importBank, setImportBank] = useState('Nubank'); 

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    if (file.name.toLowerCase().endsWith('.csv')) {
                        notify("Lendo arquivo CSV... Aguarde.");
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const text = event.target.result;
                            let formattedText = '';
                            const lines = text.split('\n');
                            
                            // CSV Inteligente: Respeita vírgulas dentro de aspas duplas (Ex: "154,64")
                            const splitCSV = (line) => {
                                let parts = [];
                                let inQuotes = false;
                                let current = '';
                                let separator = line.includes(';') ? ';' : ',';
                                for (let i = 0; i < line.length; i++) {
                                    let char = line[i];
                                    if (char === '"') inQuotes = !inQuotes;
                                    else if (char === separator && !inQuotes) { parts.push(current); current = ''; } 
                                    else current += char;
                                }
                                parts.push(current);
                                return parts.map(p => p.trim());
                            };

                            for (let line of lines) {
                                if (!line.trim()) continue;
                                let parts = splitCSV(line);
                                
                                let dateIdx = parts.findIndex(p => p.match(/^(\d{2}\/\d{2})/));
                                if (dateIdx !== -1) {
                                    let date = parts[dateIdx];
                                    let val = '';
                                    let valIdx = -1;
                                    // Pega o valor lá do final e preserva a vírgula do centavo
                                    for(let j = parts.length - 1; j > dateIdx; j--) {
                                        let cleanPart = parts[j].replace(/[^\d,-]/g, ''); 
                                        if (cleanPart.match(/\d/) && parts[j].match(/\d/)) { 
                                            val = parts[j];
                                            valIdx = j;
                                            break;
                                        }
                                    }
                                    if (valIdx !== -1) {
                                        // O que sobrou no meio é a descrição inteira, garantindo que nada se perca!
                                        let desc = parts.slice(dateIdx + 1, valIdx).join(' ').replace(/"/g, '').trim();
                                        formattedText += `${date} ${desc} ${val}\n`;
                                    }
                                }
                            }
                            setPasteText(formattedText || text);
                            notify("CSV carregado! Pressione 'Analisar Dados'.");
                        };
                        reader.readAsText(file, 'ISO-8859-1');
                    } else if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        notify("Lendo PDF... Aguarde.");
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            let lastY = -1;
                            for (let item of textContent.items) {
                                if (lastY !== item.transform[5] && lastY !== -1) fullText += '\n';
                                fullText += item.str + ' ';
                                lastY = item.transform[5];
                            }
                            fullText += '\n\n';
                        }
                        setPasteText(fullText);
                        notify("PDF lido com sucesso! Pressione 'Analisar Dados'.");
                    } else {
                        notify("Formato não suportado. Use apenas PDF ou CSV.");
                    }
                } catch (error) {
                    notify("Erro na leitura! Cole o texto manualmente.");
                }
                e.target.value = null;
            };

            const analyzeTextCore = () => {
                let textToAnalyze = pasteText;
                let lines = textToAnalyze.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const newTransactions = [];
                
                const processMatch = (rawDate, rawDesc, rawVal, originalLine) => {
                    let dMatch = rawDate.match(/^(\d{2})\/(\d{2})/);
                    let parsedDate = dMatch ? `${dMatch[1]}/${dMatch[2]}` : rawDate.trim();
                    let parsedDesc = rawDesc.replace(/^\d{4}\s+/, '').trim(); 
                    
                    let s = rawVal.replace(/[R$\s]/ig, '');
                    let isNegative = s.startsWith('-');
                    if(isNegative) s = s.substring(1);
                    
                    let parsedAmount = 0;
                    if (s.includes(',')) {
                        parsedAmount = parseFloat(s.replace(/\./g, '').replace(',', '.'));
                    } else {
                        parsedAmount = parseFloat(s);
                    }
                    if (isNegative) parsedAmount = -parsedAmount;
                    
                    if (isNaN(parsedAmount) || parsedAmount === 0) return;

                    let assignedTo = null, splits = null;
                    const baseDesc = parsedDesc.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                    
                    const pastTx = group.transactions?.find(t => t.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim() === baseDesc && (t.assignedTo || (t.splits && t.splits.length > 0)));
                    if (pastTx) { assignedTo = pastTx.assignedTo; splits = pastTx.splits ? [...pastTx.splits] : null; }

                    if (!assignedTo && (!splits || splits.length === 0) && sortedMembers) {
                        for (let member of sortedMembers) {
                            if (member.virtualCards) {
                                const cards = member.virtualCards.split(',').map(c => c.trim());
                                if (cards.some(card => originalLine.includes(card) || rawDesc.includes(card))) { assignedTo = member.id; break; }
                            }
                        }
                    }

                    // Acha padrões de parcela como: "07/12", "7/12", "Parcela 7 de 12"
                    const instMatch = parsedDesc.match(/\b(?:parcela\s+)?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\b/i);
                    if (instMatch) {
                        const curr = parseInt(instMatch[1], 10);
                        const total = parseInt(instMatch[2], 10);
                        
                        const isDuplicate = group.transactions?.some(tx => tx.invoiceMonth === importInvoiceMonth && tx.description === parsedDesc && tx.amount === parsedAmount);
                        newTransactions.push({ id: crypto.randomUUID(), date: parsedDate, invoiceMonth: importInvoiceMonth, description: parsedDesc, amount: parsedAmount, assignedTo, splits, selected: !isDuplicate, isDuplicate, bank: importBank });

                        if (total > curr) {
                            for (let step = 1; step <= (total - curr); step++) {
                                const futureMonth = addInvoiceMonth(importInvoiceMonth, step);
                                const futureDesc = parsedDesc.replace(instMatch[0], `${curr + step}/${total}`);
                                const isFutureDupe = group.transactions?.some(tx => tx.invoiceMonth === futureMonth && tx.description === futureDesc && tx.amount === parsedAmount);
                                
                                newTransactions.push({
                                    id: crypto.randomUUID(), date: parsedDate, invoiceMonth: futureMonth,
                                    description: futureDesc, amount: parsedAmount, assignedTo, splits,
                                    selected: !isFutureDupe, isDuplicate: isFutureDupe, bank: importBank, isProjection: true
                                });
                            }
                        }
                    } else {
                        const isDuplicate = group.transactions?.some(tx => tx.invoiceMonth === importInvoiceMonth && tx.description === parsedDesc && tx.amount === parsedAmount);
                        newTransactions.push({ id: crypto.randomUUID(), date: parsedDate, invoiceMonth: importInvoiceMonth, description: parsedDesc, amount: parsedAmount, assignedTo, splits, selected: !isDuplicate, isDuplicate, bank: importBank });
                    }
                };

                let i = 0;
                while (i < lines.length) {
                    const line = lines[i];
                    const matchSingle = line.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:de\s+)?[a-zA-Z]{3}\.?\s*(?:\d{4})?)\s+(.*?)\s+(-?(?:R\$)?\s*[\d.,]+)$/i);
                    if (matchSingle) { processMatch(matchSingle[1], matchSingle[2], matchSingle[3], line); i++; continue; }

                    const tokens = line.trim().split(/\s+/);
                    if (tokens.length >= 3) {
                        const dateStr = tokens[0];
                        if (dateStr.match(/^\d{2}\/\d{2}/) || dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
                            const valStr = tokens[tokens.length - 1];
                            const descStr = tokens.slice(1, tokens.length - 1).join(' ');
                            if (/^[-R$\s]*[\d.,]+$/.test(valStr)) { processMatch(dateStr, descStr, valStr, line); i++; continue; }
                        }
                    }
                    i++;
                }

                if (newTransactions.length > 0) setParsedPreview(newTransactions);
                else notify("Não reconheci compras. O formato pode estar inválido.");
            };

            const handleConfirmParse = async () => {
                const itemsToAdd = parsedPreview.filter(tx => tx.selected && !tx.isDuplicate).map(({ selected, isDuplicate, ...rest }) => rest);
                await updateGroupData({ transactions: [...(group.transactions || []), ...itemsToAdd] });
                notify(`${itemsToAdd.length} lançamentos salvos!`);
                setPasteText(''); setParsedPreview(null); setIsParseModalOpen(false);
            };
            
            const previewCalculatedTotal = parsedPreview ? parsedPreview.filter(t => t.selected && !t.isProjection).reduce((acc, curr) => acc + curr.amount, 0) : 0;

            const handleToggleBulk = (id) => {
                setBulkSelections(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };

            const handleSelectAll = () => {
                setBulkSelections(filteredTransactions.map(tx => tx.id));
            };

            const handleBulkDelete = async () => {
                if(!window.confirm(`Excluir os ${bulkSelections.length} lançamentos selecionados?`)) return;
                const updated = group.transactions.filter(tx => !bulkSelections.includes(tx.id));
                await updateGroupData({ transactions: updated });
                setBulkSelections([]);
                setIsSelectionMode(false);
                notify("Lançamentos excluídos!");
            };

            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [applyToFuture, setApplyToFuture] = useState(true);
            const [isCustomSplit, setIsCustomSplit] = useState(false);
            const [customSplitsValues, setCustomSplitsValues] = useState({});

            const applyCascadeUpdate = (txId, updates, shouldCascade) => {
                const targetTx = group.transactions.find(t => t.id === txId);
                if (!targetTx) return group.transactions;
                
                const baseDesc = targetTx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                const isInstallment = /\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(targetTx.description);

                return group.transactions.map(tx => {
                    if (tx.id === txId) return { ...tx, ...updates };
                    
                    if (shouldCascade && isInstallment && tx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim() === baseDesc && Math.abs(Math.abs(tx.amount) - Math.abs(targetTx.amount)) < 0.01) {
                        let newDesc = tx.description;
                        if (updates.description) {
                            const instMatch = tx.description.match(/\b(\d{1,2}\/\d{1,2})\b/);
                            newDesc = updates.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                            if (instMatch) newDesc += ` ${instMatch[1]}`;
                        }
                        return { ...tx, ...updates, description: newDesc };
                    }
                    return tx;
                });
            };

            const handleSaveAssign = async () => {
                let assignedTo = null, splits = null;
                
                if (assignSelections.length === 1) {
                    assignedTo = assignSelections[0];
                } else if (assignSelections.length > 1) {
                    if (isCustomSplit) {
                        splits = assignSelections.map(memberId => ({ memberId, amount: parseFloat(customSplitsValues[memberId]) || 0 }));
                    } else {
                        splits = assignSelections.map(memberId => ({ memberId, amount: assignTx.amount / assignSelections.length }));
                    }
                }

                const updated = applyCascadeUpdate(assignTx.id, { assignedTo, splits, description: assignTx.description, bank: assignTx.bank }, applyToFuture);
                await updateGroupData({ transactions: updated });
                setIsAssignModalOpen(false); 
                notify(applyToFuture ? "Salvo em todas as parcelas!" : "Compra salva!");
            };

            const handleDeleteTransaction = async () => {
                if(!window.confirm("Deseja EXCLUIR esta compra?")) return;
                let updatedTransactions = group.transactions.filter(tx => tx.id !== assignTx.id);
                
                if (applyToFuture && /\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(assignTx.description)) {
                    const baseDesc = assignTx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                    updatedTransactions = updatedTransactions.filter(tx => {
                        const isInstallment = /\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(tx.description);
                        if (isInstallment && tx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim() === baseDesc && Math.abs(Math.abs(tx.amount) - Math.abs(assignTx.amount)) < 0.01) return false; 
                        return true;
                    });
                }
                await updateGroupData({ transactions: updatedTransactions });
                setIsAssignModalOpen(false);
                notify("Excluído com sucesso!");
            };

            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [manualData, setManualData] = useState({ date: '', description: '', amount: '', installments: '1', bank: 'Outros' });
            const [manualSelections, setManualSelections] = useState([]);
            const [isManualCustomSplit, setIsManualCustomSplit] = useState(false);
            const [manualCustomSplitsValues, setManualCustomSplitsValues] = useState({});

            const handleAddManualTransaction = async (e) => {
                e.preventDefault();
                if(!manualData.description || !manualData.amount) return;
                
                let assignedTo = null, splits = null;
                if (manualSelections.length === 1) { assignedTo = manualSelections[0]; } 
                else if (manualSelections.length > 1) {
                    if (isManualCustomSplit) { splits = manualSelections.map(mId => ({ memberId: mId, amount: parseFloat(manualCustomSplitsValues[mId]) || 0 })); } 
                    else { splits = manualSelections.map(mId => ({ memberId: mId, amount: parseFloat(manualData.amount) / manualSelections.length })); }
                }

                const baseDate = manualData.date || new Date().toLocaleDateString('pt-BR').substring(0,5);
                const startMonth = selectedInvoiceMonth !== 'Todos' ? selectedInvoiceMonth : getCurrentMonthStr();
                const installments = parseInt(manualData.installments) || 1;
                
                const newTxs = [];
                for (let i = 0; i < installments; i++) {
                    let desc = manualData.description;
                    if (installments > 1) desc = `${desc} ${i+1}/${installments}`;
                    newTxs.push({
                        id: crypto.randomUUID(), date: baseDate, invoiceMonth: addInvoiceMonth(startMonth, i),
                        description: desc, amount: parseFloat(manualData.amount),
                        assignedTo: assignedTo, splits: splits, bank: manualData.bank
                    });
                }

                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                setIsManualModalOpen(false);
                setManualData({ date: '', description: '', amount: '', installments: '1', bank: 'Outros' });
                setManualSelections([]); setIsManualCustomSplit(false); setManualCustomSplitsValues({});
                notify("Lançamento salvo!");
            };

            const [isLoanModalOpen, setIsLoanModalOpen] = useState(false);
            const [loanData, setLoanData] = useState({ description: '', memberId: '', amount: '', installments: '', dueDate: '' });
            
            const handleAddLoan = async (e) => {
                e.preventDefault();
                if(!loanData.memberId || !loanData.amount) return;
                const startMonth = selectedInvoiceMonth !== 'Todos' ? selectedInvoiceMonth : getCurrentMonthStr();
                const installments = parseInt(loanData.installments) || 1;
                const dateStr = `${loanData.dueDate.padStart(2, '0')}/${startMonth.split('/')[0]}`;

                const newTxs = [];
                for (let i = 0; i < installments; i++) {
                    let desc = loanData.description;
                    if (installments > 1) desc += ` ${i+1}/${installments}`;
                    newTxs.push({ id: crypto.randomUUID(), date: dateStr, invoiceMonth: addInvoiceMonth(startMonth, i), description: desc, amount: parseFloat(loanData.amount), assignedTo: loanData.memberId, splits: null, bank: 'Empréstimo' });
                }

                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                setIsLoanModalOpen(false); setLoanData({ description: '', memberId: '', amount: '', installments: '', dueDate: '' });
                notify("Empréstimo salvo com sucesso!");
            };

            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentData, setPaymentData] = useState({ memberId: '', amount: '', date: '', totalToPay: 0 });
            
            const handleAddPayment = async (e) => {
                e.preventDefault();
                if(!paymentData.memberId || !paymentData.amount) return;
                const newPayment = { id: crypto.randomUUID(), memberId: paymentData.memberId, amount: parseFloat(paymentData.amount), date: new Date().toLocaleDateString('pt-BR'), month: selectedInvoiceMonth !== 'Todos' ? selectedInvoiceMonth : getCurrentMonthStr() };
                await updateGroupData({ payments: [...(group.payments || []), newPayment] });
                setIsPaymentModalOpen(false); setPaymentData({ memberId: '', amount: '', date: '', totalToPay: 0 });
                notify("Pagamento registrado!");
            };

            const handleDeletePayment = async (paymentId) => {
                if(!window.confirm("Deseja apagar este pagamento? O valor voltará a ser cobrado do familiar.")) return;
                const updatedPayments = group.payments.filter(p => p.id !== paymentId);
                await updateGroupData({ payments: updatedPayments });
                notify("Pagamento excluído!");
            };

            const { totals, paid } = useMemo(() => {
                const t = { unassigned: 0 }, p = {};
                sortedMembers.forEach(m => { t[m.id] = 0; p[m.id] = 0; });
                const allMonthTxs = group.transactions?.filter(tx => tx.invoiceMonth === selectedInvoiceMonth) || [];

                allMonthTxs.forEach(tx => {
                    if (tx.splits?.length > 0) {
                        let alloc = 0;
                        tx.splits.forEach(s => { if (t[s.memberId] !== undefined) { t[s.memberId] += s.amount; alloc += s.amount; } });
                        if (Math.abs(tx.amount - alloc) > 0.02) t.unassigned += (tx.amount - alloc);
                    } else if (tx.assignedTo && t[tx.assignedTo] !== undefined) t[tx.assignedTo] += tx.amount;
                    else t.unassigned += tx.amount;
                });
                group.payments?.filter(x => x.month === selectedInvoiceMonth).forEach(x => { if (p[x.memberId] !== undefined) p[x.memberId] += x.amount; });
                return { totals: t, paid: p };
            }, [group, sortedMembers, selectedInvoiceMonth]);

            const handleAnticipate = async (txsToAnticipate) => {
                if(!window.confirm(`Tem certeza que deseja puxar estas ${txsToAnticipate.length} parcelas para a fatura atual?`)) return;
                const ids = txsToAnticipate.map(t => t.id);
                const updated = group.transactions.map(tx => ids.includes(tx.id) ? { ...tx, invoiceMonth: selectedInvoiceMonth } : tx);
                await updateGroupData({ transactions: updated });
                notify("Parcelas antecipadas com sucesso!");
            };
            
            const groupedAnticipations = useMemo(() => {
                const targetDate = parseMonthStr(selectedInvoiceMonth);
                const futureTxs = (group.transactions || []).filter(tx => {
                    if (!tx.assignedTo && (!tx.splits || tx.splits.length === 0)) return false;
                    if (!/\b\d{1,2}\/\d{1,2}\b/.test(tx.description)) return false;
                    return parseMonthStr(tx.invoiceMonth) > targetDate;
                });

                const groups = {};
                futureTxs.forEach(tx => {
                    const baseDesc = tx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                    const key = `${baseDesc}_${tx.assignedTo || 'split'}_${tx.amount}`;
                    if (!groups[key]) {
                        let memberName = "Rateio";
                        if (tx.assignedTo) memberName = sortedMembers.find(m => m.id === tx.assignedTo)?.name || "Desconhecido";
                        groups[key] = { baseDesc, amount: tx.amount, memberName, txs: [], totalValue: 0 };
                    }
                    groups[key].txs.push(tx);
                    groups[key].totalValue += tx.amount;
                });
                return groups;
            }, [group.transactions, selectedInvoiceMonth, sortedMembers]);

            return (
                <div className="pb-24">
                    <div className="bg-indigo-600 p-5 rounded-b-3xl shadow-lg mb-6 text-white text-center">
                        <h1 className="text-xl font-black">Painel do Administrador</h1>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 space-y-6">
                        <div className="flex bg-gray-200/60 p-1.5 rounded-2xl overflow-x-auto hide-scroll text-sm">
                            <button onClick={() => setActiveTab('transactions')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap ${activeTab === 'transactions' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Extrato</button>
                            <button onClick={() => setActiveTab('loans')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap ${activeTab === 'loans' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Empréstimos</button>
                            <button onClick={() => setActiveTab('anticipations')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap ${activeTab === 'anticipations' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Antecipações</button>
                            <button onClick={() => setActiveTab('summary')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap ${activeTab === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Resumo</button>
                            <button onClick={() => setActiveTab('settings')} className={`flex-1 px-3 py-2.5 rounded-xl font-bold whitespace-nowrap ${activeTab === 'settings' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Config</button>
                        </div>

                        {(activeTab === 'transactions' || activeTab === 'summary' || activeTab === 'anticipations') && (
                            <div className="flex gap-2 flex-col sm:flex-row">
                                <div className="flex gap-2 flex-1">
                                    <select value={selectedInvoiceMonth} onChange={e => setSelectedInvoiceMonth(e.target.value)} className="flex-1 bg-white border border-gray-300 text-indigo-900 font-black rounded-xl px-3 py-2.5 text-sm shadow-sm outline-none text-center">
                                        {availableInvoiceMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Todos os Meses' : `Mês ${m}`}</option>)}
                                    </select>
                                    <select value={selectedBankFilter} onChange={e => setSelectedBankFilter(e.target.value)} className="flex-1 bg-white border border-gray-300 text-gray-900 font-bold rounded-xl px-3 py-2.5 text-sm shadow-sm outline-none text-center">
                                        <option value="Todos">Cartões (Todos)</option>
                                        <option value="Nubank">Nubank</option>
                                        <option value="Inter">Inter</option>
                                        <option value="Mercado Pago">Mercado Pago</option>
                                    </select>
                                </div>
                                <button onClick={toggleMonthStatus} disabled={selectedInvoiceMonth === 'Todos'} className={`sm:w-auto w-full py-2.5 px-3 rounded-xl font-black text-xs flex items-center justify-center gap-1.5 transition-colors ${selectedInvoiceMonth === 'Todos' ? 'opacity-50 cursor-not-allowed bg-gray-100 text-gray-400 border-gray-200 shadow-sm' : isMonthClosed ? 'bg-green-100 text-green-700 border-2 border-green-200 shadow-sm' : 'bg-yellow-100 text-yellow-700 border-2 border-yellow-200 shadow-sm'}`}>
                                    {selectedInvoiceMonth === 'Todos' ? <><Icon name="minus" className="w-4 h-4"/> Indisponível</> : isMonthClosed ? <><Icon name="lock" className="w-4 h-4"/> Fechada</> : <><Icon name="unlock" className="w-4 h-4"/> Fatura Aberta</>}
                                </button>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="fade-in space-y-4">
                                <div className="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl flex justify-between items-center">
                                    <span className="text-indigo-900 font-bold text-xs uppercase">Total no Cartão:</span>
                                    <span className={`text-2xl font-black ${totalFiltered < 0 ? 'text-green-600' : 'text-indigo-600'}`}>{formatMoney(totalFiltered)}</span>
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => setIsParseModalOpen(true)} className="flex-[2] bg-gray-900 text-white py-3 px-2 rounded-xl font-black shadow-md flex items-center justify-center gap-1.5 text-xs hover:bg-black">
                                        <Icon name="file-text" className="w-4 h-4" /> Importar PDF ou CSV
                                    </button>
                                    <button onClick={() => setIsManualModalOpen(true)} className="flex-1 bg-indigo-100 text-indigo-700 border border-indigo-200 py-3 px-2 rounded-xl font-black shadow-sm flex items-center justify-center gap-1.5 text-xs hover:bg-indigo-200">
                                        <Icon name="plus" className="w-4 h-4" /> Manual
                                    </button>
                                </div>
                                
                                <div className="flex justify-between items-center mt-4 px-1">
                                    <button onClick={() => { setIsSelectionMode(!isSelectionMode); setBulkSelections([]); }} className="text-[10px] font-bold text-gray-500 hover:text-indigo-600 flex items-center gap-1 bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg transition-colors">
                                        <Icon name="check-square" className="w-3.5 h-3.5" /> {isSelectionMode ? 'Ocultar Seleção' : 'Selecionar Vários'}
                                    </button>
                                    {isSelectionMode && (
                                        <button onClick={handleSelectAll} className="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 transition-colors">
                                            Selecionar Tudo
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4 mt-2">
                                    {isSelectionMode && bulkSelections.length > 0 && (
                                        <div className="bg-red-50 border border-red-200 p-2 rounded-xl flex justify-between items-center fade-in sticky top-4 z-10 shadow-sm">
                                            <span className="text-red-700 text-xs font-bold px-2">{bulkSelections.length} selecionados</span>
                                            <button onClick={handleBulkDelete} className="bg-red-600 text-white text-[10px] font-bold py-1.5 px-3 rounded-lg shadow-sm hover:bg-red-700 flex gap-1 items-center"><Icon name="trash-2" className="w-3 h-3"/> Excluir</button>
                                        </div>
                                    )}

                                    {pendingTxs.length > 0 && (
                                        <div className="mb-6">
                                            <div className="flex items-center gap-1.5 mb-1.5 px-1">
                                                <div className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
                                                <h3 className="font-black text-gray-800 text-xs uppercase tracking-wider">Falta Resolver ({pendingTxs.length})</h3>
                                            </div>
                                            <div className="space-y-1">
                                                {pendingTxs.map(tx => (
                                                    <div key={tx.id} onClick={() => { setAssignTx(tx); setAssignSelections([]); setIsCustomSplit(false); setCustomSplitsValues({}); setIsAssignModalOpen(true); }} className="bg-white p-2 rounded-xl shadow-sm border border-transparent hover:border-indigo-300 cursor-pointer flex justify-between items-center transition-all group">
                                                        <div className="flex gap-2 overflow-hidden items-center">
                                                            {isSelectionMode && <input type="checkbox" checked={bulkSelections.includes(tx.id)} onChange={() => handleToggleBulk(tx.id)} onClick={e=>e.stopPropagation()} className="w-4 h-4 ml-1 text-indigo-600 rounded shrink-0" />}
                                                            <div className="w-7 h-7 bg-gray-50 border rounded-lg flex items-center justify-center text-gray-600 text-[9px] font-black shrink-0">{tx.date.substring(0,5)}</div>
                                                            <div className="truncate pr-1">
                                                                <p className="font-bold text-gray-900 truncate text-[10px] leading-tight">{tx.description}</p>
                                                                <div className="flex gap-1 mt-0.5">
                                                                    <span className={`text-[8px] font-bold px-1.5 py-0.5 rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <span className={`font-black text-[10px] shrink-0 ml-1 ${tx.amount < 0 ? 'text-green-500' : 'text-indigo-600'}`}>{formatMoney(tx.amount)}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {completedTxs.length > 0 && (
                                        <div>
                                            <div className="flex items-center gap-1.5 mb-1.5 px-1 border-t pt-3">
                                                <div className="w-1.5 h-1.5 rounded-full bg-green-500"></div>
                                                <h3 className="font-black text-gray-800 text-xs uppercase tracking-wider">Prontos ({completedTxs.length})</h3>
                                            </div>
                                            <div className="space-y-1 opacity-90">
                                                {completedTxs.map(tx => (
                                                    <div key={tx.id} className="bg-gray-50 p-2 rounded-xl border border-gray-200 flex justify-between items-center cursor-pointer hover:border-gray-300" onClick={() => { 
                                                        setAssignTx(tx); setAssignSelections(tx.splits ? tx.splits.map(s=>s.memberId) : [tx.assignedTo]); setIsCustomSplit(tx.splits ? true : false);
                                                        const vals = {}; if(tx.splits) tx.splits.forEach(s => vals[s.memberId] = s.amount); setCustomSplitsValues(vals);
                                                        setIsAssignModalOpen(true); 
                                                    }}>
                                                        <div className="flex gap-2 overflow-hidden items-center">
                                                            {isSelectionMode && <input type="checkbox" checked={bulkSelections.includes(tx.id)} onChange={() => handleToggleBulk(tx.id)} onClick={e=>e.stopPropagation()} className="w-4 h-4 ml-1 text-indigo-600 rounded shrink-0" />}
                                                            <div className="w-6 h-6 bg-white border rounded-lg flex items-center justify-center text-gray-500 text-[8px] font-black shrink-0">{tx.date.substring(0,5)}</div>
                                                            <div className="truncate pr-1">
                                                                <p className="font-bold text-gray-700 truncate text-[9px] leading-tight">{tx.description}</p>
                                                                <div className="flex items-center gap-1 flex-wrap mt-0.5">
                                                                    <span className={`text-[8px] font-bold px-1 py-0.5 rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span>
                                                                    <Icon name="check-circle" className="w-2 h-2 text-green-500 shrink-0 ml-1" />
                                                                    <span className="text-[8px] text-gray-600 font-bold truncate">{tx.splits?.length > 0 ? `Rateio (${tx.splits.length})` : sortedMembers?.find(m => m.id === tx.assignedTo)?.name}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2 shrink-0 ml-1">
                                                            <span className={`font-black text-[10px] ${tx.amount < 0 ? 'text-green-600' : 'text-gray-900'}`}>{formatMoney(tx.amount)}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'loans' && (
                            <div className="fade-in space-y-3">
                                <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl mb-2">
                                    <p className="text-emerald-800 text-xs font-bold text-center">Empréstimos somam automaticamente na aba "Resumo" e escondem do "Extrato".</p>
                                </div>
                                <button onClick={() => setIsLoanModalOpen(true)} className="w-full bg-emerald-600 text-white p-3 rounded-xl flex items-center justify-center gap-2 font-black shadow-sm hover:bg-emerald-700 transition-colors text-sm">
                                    <Icon name="plus-circle" className="w-4 h-4" /> Adicionar Empréstimo Extra
                                </button>
                                {group.transactions?.filter(tx => tx.bank === 'Empréstimo' && tx.invoiceMonth === selectedInvoiceMonth).map(tx => {
                                    const member = sortedMembers?.find(m => m.id === tx.assignedTo);
                                    return (
                                        <div key={tx.id} className="bg-white p-3 rounded-xl border border-emerald-100 shadow-sm flex flex-col gap-1 relative">
                                            <button onClick={(e) => { e.stopPropagation(); if(window.confirm("Apagar empréstimo?")) updateGroupData({transactions: group.transactions.filter(t => t.id !== tx.id)}); }} className="absolute top-2 right-2 p-1.5 bg-gray-50 rounded-md text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                                            <div className="flex gap-2 items-center">
                                                <div className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-black text-[10px] shadow-sm">{member?.name.charAt(0)}</div>
                                                <span className="font-bold text-gray-800 text-xs">{member?.name}</span>
                                            </div>
                                            <h3 className="font-black text-xs text-gray-900 mt-1">{tx.description}</h3>
                                            <span className="font-black text-emerald-600 text-sm">{formatMoney(tx.amount)}</span>
                                        </div>
                                    )
                                })}
                            </div>
                        )}

                        {activeTab === 'anticipations' && (
                            <div className="fade-in space-y-3">
                                {Object.keys(groupedAnticipations).length === 0 ? <p className="text-center text-gray-400 font-medium py-8 text-xs">Nenhuma parcela pro futuro encontrada.</p> : (
                                    Object.values(groupedAnticipations).map((item, idx) => (
                                        <div key={idx} className="bg-white p-3 rounded-xl border shadow-sm">
                                            <div className="flex justify-between items-start mb-2">
                                                <div><h3 className="font-black text-gray-800 text-xs">{item.baseDesc}</h3><span className="text-[9px] font-bold text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full mt-1 inline-block">{item.memberName}</span></div>
                                                <span className="font-black text-indigo-600 text-sm">{formatMoney(item.totalValue)}</span>
                                            </div>
                                            <p className="text-[10px] text-gray-500 font-medium mb-3">Faltam {item.txs.length} parcelas para puxar.</p>
                                            <button onClick={() => handleAnticipate(item.txs)} className="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 py-2 rounded-xl font-bold text-[10px] hover:bg-indigo-100"><Icon name="fast-forward" className="w-3 h-3 inline"/> Antecipar para Hoje</button>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {activeTab === 'summary' && (
                            <div className="fade-in space-y-3">
                                {(totals.unassigned > 0.05 || totals.unassigned < -0.05) && (
                                    <div className="p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-center shadow-sm">
                                        <span className="font-bold text-red-700 text-[9px] tracking-widest block mb-0.5">VALOR SEM DONO</span>
                                        <span className="font-black text-lg text-red-600">{formatMoney(totals.unassigned)}</span>
                                    </div>
                                )}
                                {sortedMembers?.map(m => {
                                    const grandTotal = totals[m.id] - paid[m.id];
                                    const zapUrl = `https://wa.me/?text=${encodeURIComponent(`Na fatura de ${selectedInvoiceMonth} seu total deu ${formatMoney(totals[m.id])}. Falta pagar: *${formatMoney(grandTotal)}*.`)}`;
                                    return (
                                        <div key={m.id} className="bg-white p-3 rounded-2xl shadow-sm border hover:shadow-md">
                                            <div className="flex justify-between items-center mb-2 border-b pb-2">
                                                <div className="flex gap-2 items-center"><div className="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-black text-[10px]">{m.name.charAt(0)}</div><h3 className="font-black text-sm">{m.name}</h3></div>
                                                <div className="flex gap-1">
                                                    <button onClick={() => { setPaymentData({memberId: m.id, amount: '', date: '', totalToPay: grandTotal}); setIsPaymentModalOpen(true); }} className="px-2 py-1.5 bg-green-50 text-green-700 rounded-lg font-bold text-[9px] flex gap-1 border border-green-200"><Icon name="dollar-sign" className="w-2.5 h-2.5"/> Receber</button>
                                                    <a href={zapUrl} target="_blank" className="px-2 py-1.5 bg-gray-100 text-gray-700 rounded-lg font-bold text-[9px] flex gap-1 border"><Icon name="message-circle" className="w-2.5 h-2.5"/> Cobrar</a>
                                                </div>
                                            </div>
                                            <div className="flex justify-between text-[10px] font-medium text-gray-500 mb-1"><span>Total no Mês (Cartão+Emp):</span> <span>{formatMoney(totals[m.id])}</span></div>
                                            {paid[m.id] > 0 && <div className="flex justify-between text-[10px] font-medium text-gray-500 mb-1"><span>Já Recebido:</span> <span className="text-green-600 font-bold">-{formatMoney(paid[m.id])}</span></div>}
                                            <div className="bg-gray-50 p-2 rounded-xl flex justify-between items-center mt-2 border shadow-inner"><span className="text-[9px] font-black uppercase text-gray-500">Falta Pagar</span><span className={`text-base font-black ${grandTotal <= 0 ? 'text-green-600' : 'text-gray-900'}`}>{formatMoney(grandTotal)}</span></div>
                                            
                                            {/* Histórico de Pagamentos com botão de Excluir */}
                                            {paid[m.id] > 0 && (
                                                <div className="mt-2 pt-2 border-t border-gray-100">
                                                    <span className="text-[9px] font-bold text-gray-400 uppercase block mb-1">Pagamentos Recebidos:</span>
                                                    {group.payments?.filter(x => x.memberId === m.id && x.month === selectedInvoiceMonth).map(p => (
                                                        <div key={p.id} className="flex justify-between items-center bg-green-50 px-2 py-1.5 rounded-lg mb-1 border border-green-100">
                                                            <span className="text-[9px] text-green-700 font-bold">{p.date}</span>
                                                            <div className="flex items-center gap-2">
                                                                <span className="text-[10px] text-green-800 font-black">{formatMoney(p.amount)}</span>
                                                                <button onClick={() => handleDeletePayment(p.id)} className="text-red-400 hover:text-red-600 p-1"><Icon name="trash-2" className="w-3 h-3"/></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
