<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Fatura Família</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- PWA Setup Invisível (Para instalar no celular) -->
    <script>
        const manifest = {
            name: "Fatura Família", short_name: "Fatura", start_url: ".", display: "standalone",
            background_color: "#f8fafc", theme_color: "#4f46e5",
            icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.1-.96-2.17-1.92H8.01c.06 1.62 1.11 2.86 2.89 3.24V19h2.36v-1.67c1.73-.32 2.99-1.3 2.99-2.92 0-1.89-1.53-2.65-3.64-3.15z'/%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }]
        };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
        if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, query, collection, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, query, collection, where, getDocs };
    </script>

    <script type="text/babel" data-type="module">
        const myFirebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7"
        };

        const { useState, useEffect, useRef, useMemo } = React;
        let app, auth, db;

        // Utilitários
        const formatMoney = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        const generatePin = () => Math.random().toString(36).substring(2, 6).toUpperCase();
        
        // Ícone Blindado
        const Icon = ({ name, className }) => {
            const spanRef = useRef(null);
            useEffect(() => { if (spanRef.current && window.lucide) { spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`; window.lucide.createIcons({ root: spanRef.current }); } }, [name, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0"></span>;
        };

        const getMonthYear = (dateStr) => {
            if (!dateStr) return 'Desconhecido';
            const parts = dateStr.split('/');
            if (parts.length >= 2) return `${parts[1]}/${parts.length === 3 ? parts[2] : new Date().getFullYear()}`;
            return 'Desconhecido';
        };

        const addMonths = (dateStr, numMonths) => {
            const parts = dateStr.split('/');
            let month = parseInt(parts[1], 10) + numMonths;
            let year = parts.length === 3 ? parseInt(parts[2], 10) : new Date().getFullYear();
            while (month > 12) { month -= 12; year++; }
            return `${parts[0]}/${month.toString().padStart(2, '0')}/${year}`;
        };

        // Cores dos Bancos
        const getBankStyle = (bankName) => {
            if(bankName === 'Nubank') return 'bg-purple-100 text-purple-700 border-purple-200';
            if(bankName === 'Inter') return 'bg-orange-100 text-orange-700 border-orange-200';
            if(bankName === 'Mercado Pago') return 'bg-blue-100 text-blue-700 border-blue-200';
            return 'bg-gray-100 text-gray-600 border-gray-200';
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 p-0 sm:p-4 fade-in backdrop-blur-sm">
                    <div className="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-5 border-b flex justify-between items-center bg-gray-50/80">
                            <h3 className="text-xl font-black text-gray-800">{title}</h3>
                            <button onClick={onClose} className="p-2 bg-gray-200/50 hover:bg-gray-200 rounded-full text-gray-600 transition-colors"><Icon name="x" className="w-5 h-5" /></button>
                        </div>
                        <div className="p-5 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD DO ADMIN ---
        const AdminDashboard = ({ group, updateGroupData, notify }) => {
            const [activeTab, setActiveTab] = useState('transactions'); 
            const [selectedMonth, setSelectedMonth] = useState('Todos');
            const [selectedBankFilter, setSelectedBankFilter] = useState('Todos');
            
            // Controle de Modais
            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [pasteText, setPasteText] = useState('');
            const [parsedPreview, setParsedPreview] = useState(null);
            
            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [applyToFuture, setApplyToFuture] = useState(true);

            const [isEditModalOpen, setIsEditModalOpen] = useState(false);
            const [editTxData, setEditTxData] = useState({ description: '', bank: '', amount: '' });

            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentData, setPaymentData] = useState({ memberId: '', amount: '' });

            const [bankTotal, setBankTotal] = useState('');

            const availableMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => months.add(getMonthYear(tx.date)));
                return ['Todos', ...Array.from(months)].sort((a, b) => {
                    if(a === 'Todos') return -1; if(b === 'Todos') return 1;
                    const [mA, yA] = a.split('/'); const [mB, yB] = b.split('/');
                    return new Date(yB, mB - 1) - new Date(yA, mA - 1);
                });
            }, [group.transactions]);

            useEffect(() => { if (!availableMonths.includes(selectedMonth) && availableMonths.length > 0) setSelectedMonth(availableMonths[1] || 'Todos'); }, [availableMonths]);

            const filteredTransactions = useMemo(() => {
                let txs = group.transactions || [];
                if (selectedMonth !== 'Todos') txs = txs.filter(tx => getMonthYear(tx.date) === selectedMonth);
                if (selectedBankFilter !== 'Todos') txs = txs.filter(tx => tx.bank === selectedBankFilter);
                return txs;
            }, [group.transactions, selectedMonth, selectedBankFilter]);

            // LEITOR DE PDF 
            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    notify("Lendo PDF... Aguarde.");
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        let lastY = -1;
                        for (let item of textContent.items) {
                            if (lastY !== item.transform[5] && lastY !== -1) fullText += '\n';
                            fullText += item.str + ' ';
                            lastY = item.transform[5];
                        }
                        fullText += '\n\n';
                    }
                    setPasteText(fullText);
                    notify("PDF lido com sucesso!");
                    setTimeout(() => analyzeTextCore(fullText), 500);
                } catch (error) {
                    notify("Erro no PDF (pode ter senha). Copie e cole o texto do extrato.");
                }
                e.target.value = null;
            };

            // SUPER ANALISADOR UNIVERSAL
            const analyzeTextCore = (textToAnalyze) => {
                let lines = textToAnalyze.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const newTransactions = [];
                const fullTextLower = textToAnalyze.toLowerCase();
                
                let detectedBank = 'Outros';
                if (fullTextLower.includes('nubank') || fullTextLower.includes('nu pagamentos') || fullTextLower.includes('กบ')) detectedBank = 'Nubank';
                else if (fullTextLower.includes('banco inter') || fullTextLower.includes('inter')) detectedBank = 'Inter';
                else if (fullTextLower.includes('mercado pago') || fullTextLower.includes('mercadopago')) detectedBank = 'Mercado Pago';

                const normalizeDate = (raw) => {
                    const months = { jan: '01', fev: '02', mar: '03', abr: '04', mai: '05', jun: '06', jul: '07', ago: '08', set: '09', out: '10', nov: '11', dez: '12' };
                    let d = raw.toLowerCase().trim();
                    const inter = d.match(/^(\d{1,2})\s+de\s+([a-z]{3})\.?\s+(\d{4})$/); 
                    if (inter) return `${inter[1].padStart(2, '0')}/${months[inter[2]]}/${inter[3]}`;
                    const nu = d.match(/^(\d{1,2})\s+([a-z]{3})$/); 
                    if (nu) return `${nu[1].padStart(2, '0')}/${months[nu[2]]}/${new Date().getFullYear()}`;
                    return raw.trim(); 
                };

                const processMatch = (rawDate, rawDesc, rawVal) => {
                    const parsedDate = normalizeDate(rawDate);
                    let parsedDesc = rawDesc.replace(/^\d{4}\s+/, '').replace(/Π/g, '').replace(/กบ/g, '').trim(); 
                    parsedDesc = parsedDesc.replace(/(?:-\s*)?\(?Parcela\s+(\d{1,2})\s+(?:de|\/)\s+(\d{1,2})\)?/i, '$1/$2');
                    
                    const amountStr = rawVal.replace(/\./g, '').replace(',', '.');
                    const parsedAmount = parseFloat(amountStr);
                    
                    if (isNaN(parsedAmount) || parsedAmount <= 0) return;
                    const descLower = parsedDesc.toLowerCase();
                    if (descLower.includes('pagamento recebido') || descLower.includes('juros') || descLower.includes('multa') || descLower.includes('iof') || descLower.includes('pagamento em') || descLower.includes('estorno')) return;

                    const isDuplicate = group.transactions?.some(tx => tx.date === parsedDate && tx.description === parsedDesc && tx.amount === parsedAmount);
                    
                    let assignedTo = null, splits = null;
                    const baseDesc = parsedDesc.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                    const pastTx = group.transactions?.find(t => t.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDesc && (t.assignedTo || (t.splits && t.splits.length > 0)));
                    if (pastTx) { assignedTo = pastTx.assignedTo; splits = pastTx.splits ? [...pastTx.splits] : null; }

                    newTransactions.push({ id: crypto.randomUUID(), date: parsedDate, description: parsedDesc, amount: parsedAmount, assignedTo, splits, selected: !isDuplicate, isDuplicate, bank: detectedBank, isProjection: false });

                    const instMatch = parsedDesc.match(/\b(\d{1,2})\/(\d{1,2})\b/);
                    if (instMatch && !isDuplicate) {
                        const currInst = parseInt(instMatch[1], 10);
                        const totInst = parseInt(instMatch[2], 10);
                        if (totInst > currInst) {
                            for (let i = 1; i <= (totInst - currInst); i++) {
                                const nextInst = currInst + i;
                                const nextDate = addMonths(parsedDate, i);
                                const nextDesc = parsedDesc.replace(/\b\d{1,2}\/\d{1,2}\b/, `${nextInst}/${totInst}`);
                                const projDupe = group.transactions?.some(tx => tx.date === nextDate && tx.description === nextDesc);
                                if(!projDupe) {
                                    newTransactions.push({ id: crypto.randomUUID(), date: nextDate, description: nextDesc, amount: parsedAmount, assignedTo, splits, selected: true, isDuplicate: false, bank: detectedBank, isProjection: true });
                                }
                            }
                        }
                    }
                };

                let i = 0;
                while (i < lines.length) {
                    const line = lines[i];
                    const matchSingle = line.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:de\s+)?[a-zA-Z]{3}\.?\s*(?:\d{4})?)\s+(.*?)\s+(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                    if (matchSingle) { processMatch(matchSingle[1], matchSingle[2], matchSingle[3]); i++; continue; }

                    const dateOnly = /^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*)$/i;
                    if (dateOnly.test(line) && i + 1 < lines.length) {
                        const dateStr = line;
                        let descStr = lines[i+1];
                        let valStr = null, skip = 1;
                        if (i + 2 < lines.length) {
                             const valMatch = lines[i+2].match(/^(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                             if (valMatch) { valStr = valMatch[1]; skip = 2; }
                        }
                        if (!valStr) {
                            const mixed = descStr.match(/(.*?)\s+(?:R\$)?\s*(?:-)?\s*([\d.,]+)$/i);
                            if (mixed) { descStr = mixed[1]; valStr = mixed[2]; skip = 1; }
                        }
                        if (valStr) { processMatch(dateStr, descStr, valStr); i += (skip + 1); continue; }
                    }
                    i++;
                }

                if (newTransactions.length > 0) setParsedPreview(newTransactions);
                else notify("Não reconheci compras. O banco está diferente ou é um PDF com senha.");
            };

            const handleConfirmParse = async () => {
                const itemsToAdd = parsedPreview.filter(tx => tx.selected && !tx.isDuplicate).map(({ selected, isDuplicate, ...rest }) => rest);
                await updateGroupData({ transactions: [...(group.transactions || []), ...itemsToAdd] });
                notify(`${itemsToAdd.length} compras salvas!`);
                setPasteText(''); setParsedPreview(null); setIsParseModalOpen(false);
            };

            // O Efeito Cascata
            const applyCascadeUpdate = (txId, updates, shouldCascade) => {
                const targetTx = group.transactions.find(t => t.id === txId);
                if (!targetTx) return group.transactions;
                
                const baseDesc = targetTx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                const isInstallment = /\b\d{1,2}\/\d{1,2}\b/.test(targetTx.description);

                return group.transactions.map(tx => {
                    if (tx.id === txId) return { ...tx, ...updates };
                    if (shouldCascade && isInstallment && tx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDesc && Math.abs(tx.amount - targetTx.amount) < 0.01) {
                        return { ...tx, ...updates };
                    }
                    return tx;
                });
            };

            const handleSaveAssign = async () => {
                let assignedTo = null, splits = null;
                if (assignSelections.length === 1) assignedTo = assignSelections[0];
                else if (assignSelections.length > 1) splits = assignSelections.map(memberId => ({ memberId, amount: assignTx.amount / assignSelections.length }));

                const updated = applyCascadeUpdate(assignTx.id, { assignedTo, splits }, applyToFuture);
                await updateGroupData({ transactions: updated });
                setIsAssignModalOpen(false); notify(applyToFuture ? "Atualizado para esta e parcelas futuras!" : "Dono atualizado!");
            };

            const handleSaveEdit = async () => {
                const updated = applyCascadeUpdate(editTxData.id, { description: editTxData.description, bank: editTxData.bank, amount: parseFloat(editTxData.amount) }, applyToFuture);
                await updateGroupData({ transactions: updated });
                setIsEditModalOpen(false); notify("Compra editada com sucesso!");
            };

            const handleAddMember = async (e) => {
                e.preventDefault();
                const name = e.target.name.value.trim();
                if (!name) return;
                const accessCode = `${group.id}-${generatePin()}`;
                await updateGroupData({ members: [...(group.members || []), { id: crypto.randomUUID(), name, accessCode }] });
                e.target.reset(); notify("Familiar adicionado!");
            };

            const handleClearAll = async () => {
                if(window.confirm("CUIDADO: Isso apagará TODAS as compras e pagamentos do extrato. Os familiares serão mantidos. Tem certeza?")) {
                    await updateGroupData({ transactions: [], payments: [] });
                    notify("Extrato limpo com sucesso! Pronto para testes.");
                }
            };

            const handleAddPayment = async (e) => {
                e.preventDefault();
                if (!paymentData.memberId || !paymentData.amount) return;
                await updateGroupData({ payments: [...(group.payments || []), { id: crypto.randomUUID(), memberId: paymentData.memberId, amount: parseFloat(paymentData.amount), month: selectedMonth }] });
                setIsPaymentModalOpen(false); setPaymentData({ memberId: '', amount: '' }); notify("Pagamento PIX registrado!");
            };

            const { totals, paid, sumTotal } = useMemo(() => {
                const t = { unassigned: 0 }, p = {};
                group.members?.forEach(m => { t[m.id] = 0; p[m.id] = 0; });
                filteredTransactions.forEach(tx => {
                    if (tx.splits?.length > 0) {
                        let alloc = 0;
                        tx.splits.forEach(s => { if (t[s.memberId] !== undefined) { t[s.memberId] += s.amount; alloc += s.amount; } });
                        if (tx.amount - alloc > 0.02) t.unassigned += (tx.amount - alloc);
                    } else if (tx.assignedTo && t[tx.assignedTo] !== undefined) t[tx.assignedTo] += tx.amount;
                    else t.unassigned += tx.amount;
                });
                group.payments?.filter(x => x.month === selectedMonth || selectedMonth === 'Todos').forEach(x => { if (p[x.memberId] !== undefined) p[x.memberId] += x.amount; });
                return { totals: t, paid: p, sumTotal: filteredTransactions.reduce((acc, curr) => acc + curr.amount, 0) };
            }, [filteredTransactions, group]);

            return (
                <div className="pb-24">
                    <div className="bg-indigo-600 p-6 rounded-b-[2rem] shadow-lg mb-6 text-white text-center">
                        <h1 className="text-2xl font-black">Painel do Administrador</h1>
                        <p className="text-indigo-200 text-sm mt-1">Gestão Completa da Família</p>
                    </div>

                    <div className="max-w-4xl mx-auto px-4 space-y-6">
                        <div className="flex bg-gray-200/60 p-1.5 rounded-2xl overflow-x-auto hide-scroll">
                            <button onClick={() => setActiveTab('transactions')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'transactions' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Compras</button>
                            <button onClick={() => setActiveTab('summary')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Resumo & Acertos</button>
                            <button onClick={() => setActiveTab('settings')} className={`flex-1 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap ${activeTab === 'settings' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Familiares & Conf.</button>
                        </div>

                        {/* Filtros Globais */}
                        {(activeTab === 'transactions' || activeTab === 'summary') && (
                            <div className="flex gap-2">
                                <select value={selectedMonth} onChange={e => setSelectedMonth(e.target.value)} className="flex-1 bg-white border border-gray-300 text-gray-900 font-bold rounded-2xl px-4 py-3 shadow-sm outline-none text-center">
                                    {availableMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Meses (Todos)' : `Fatura ${m}`}</option>)}
                                </select>
                                <select value={selectedBankFilter} onChange={e => setSelectedBankFilter(e.target.value)} className="flex-1 bg-white border border-gray-300 text-gray-900 font-bold rounded-2xl px-4 py-3 shadow-sm outline-none text-center">
                                    <option value="Todos">Cartões (Todos)</option>
                                    <option value="Nubank">Nubank</option>
                                    <option value="Inter">Inter</option>
                                    <option value="Mercado Pago">Mercado Pago</option>
                                </select>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="fade-in space-y-4">
                                <button onClick={() => setIsParseModalOpen(true)} className="w-full bg-indigo-50 border-2 border-dashed border-indigo-300 text-indigo-700 p-6 rounded-3xl hover:bg-indigo-100 transition-colors flex flex-col items-center justify-center gap-3 font-black shadow-sm">
                                    <div className="bg-indigo-600 p-3 rounded-2xl text-white shadow-lg"><Icon name="plus" className="w-8 h-8" /></div> 
                                    Adicionar Extrato
                                </button>
                                
                                <div className="space-y-3">
                                    {filteredTransactions.length === 0 && <div className="text-center p-10 bg-white rounded-3xl border text-gray-400 font-medium">Nenhuma compra encontrada no filtro atual.</div>}
                                    {filteredTransactions.map(tx => (
                                        <div key={tx.id} className="bg-white p-4 rounded-3xl shadow-sm border border-gray-100 flex flex-col gap-3">
                                            <div className="flex justify-between items-start">
                                                <div className="flex gap-3 overflow-hidden">
                                                    <div className="w-12 h-12 bg-gray-50 border rounded-2xl flex items-center justify-center text-gray-600 text-xs font-black shrink-0">{tx.date.substring(0,5)}</div>
                                                    <div className="truncate pt-1">
                                                        <p className="font-bold text-gray-900 truncate">{tx.description}</p>
                                                        <div className="flex gap-1 mt-1">
                                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${getBankStyle(tx.bank)}`}>{tx.bank}</span>
                                                            {tx.isProjection && <span className="text-[10px] bg-gray-100 text-gray-500 font-bold px-2 py-0.5 rounded-md">FUTURO</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="text-right shrink-0 flex flex-col items-end">
                                                    <span className="font-black text-indigo-600">{formatMoney(tx.amount)}</span>
                                                    <div className="flex gap-1 mt-2">
                                                        <button onClick={() => { setEditTxData(tx); setIsEditModalOpen(true); }} className="p-1.5 text-gray-400 hover:text-indigo-600 bg-gray-50 rounded-lg"><Icon name="edit-2" className="w-4 h-4" /></button>
                                                        <button onClick={() => updateGroupData({ transactions: group.transactions.filter(t => t.id !== tx.id) })} className="p-1.5 text-gray-400 hover:text-red-500 bg-gray-50 rounded-lg"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div className="border-t border-gray-50 pt-2">
                                                {!tx.assignedTo && (!tx.splits || tx.splits.length===0) ? (
                                                    <button onClick={() => { setAssignTx(tx); setAssignSelections([]); setIsAssignModalOpen(true); }} className="w-full py-2 bg-amber-100 text-amber-800 font-bold rounded-xl text-sm flex justify-center items-center gap-2"><Icon name="user-plus" className="w-4 h-4" /> Dizer de quem é</button>
                                                ) : (
                                                    <button onClick={() => { setAssignTx(tx); setAssignSelections(tx.splits ? tx.splits.map(s=>s.memberId) : [tx.assignedTo]); setIsAssignModalOpen(true); }} className="w-full py-2 bg-gray-50 border text-gray-700 font-bold rounded-xl text-sm flex justify-center items-center gap-2 truncate">
                                                        <Icon name="check-circle" className="w-4 h-4 text-green-500 shrink-0" /> {tx.splits?.length > 0 ? `Rateio (${tx.splits.length})` : group.members?.find(m => m.id === tx.assignedTo)?.name}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'summary' && (
                            <div className="fade-in space-y-6">
                                <div className="bg-gradient-to-br from-gray-900 to-indigo-900 p-6 rounded-3xl shadow-xl text-white">
                                    <h3 className="font-black text-lg mb-4 flex items-center gap-2"><Icon name="shield-check" className="text-indigo-400" /> Prova Real</h3>
                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center bg-white/10 p-4 rounded-2xl">
                                            <span className="text-sm font-bold text-gray-300">Total Lido (Filtro)</span>
                                            <span className="text-2xl font-black">{formatMoney(sumTotal)}</span>
                                        </div>
                                        <div className="flex justify-between items-center bg-white/10 p-4 rounded-2xl">
                                            <span className="text-sm font-bold text-gray-300">Total Oficial (Digite)</span>
                                            <input type="number" placeholder="Ex: 1500.00" className="w-32 bg-transparent border-b-2 border-white/30 text-xl font-black text-white text-right focus:outline-none" value={bankTotal} onChange={e => setBankTotal(e.target.value)} />
                                        </div>
                                        {bankTotal && (
                                            <div className={`p-3 rounded-xl text-center font-black ${Math.abs(sumTotal - bankTotal) < 0.1 ? 'bg-green-500' : 'bg-red-500'}`}>
                                                {Math.abs(sumTotal - bankTotal) < 0.1 ? 'Valores Batem!' : `Diferença: ${formatMoney(bankTotal - sumTotal)}`}
                                            </div>
                                        )}
                                    </div>
                                    {totals.unassigned > 0.05 && (
                                        <div className="mt-4 p-4 bg-red-500/20 border border-red-500/50 rounded-2xl text-center">
                                            <span className="font-bold text-red-200 text-xs tracking-widest block mb-1">VALOR SEM DONO</span>
                                            <span className="font-black text-2xl text-red-400">{formatMoney(totals.unassigned)}</span>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-4">
                                    {group.members?.map(m => {
                                        const rest = totals[m.id] - paid[m.id];
                                        const zapUrl = `https://wa.me/?text=${encodeURIComponent(`Olá! Na fatura de ${selectedMonth} seu total deu ${formatMoney(totals[m.id])}. Já abati o PIX de ${formatMoney(paid[m.id])}. Resta pagar: *${formatMoney(rest)}*.`)}`;
                                        
                                        return (
                                            <div key={m.id} className="bg-white p-5 rounded-3xl shadow-sm border">
                                                <div className="flex justify-between items-center mb-4 border-b pb-4">
                                                    <div className="flex gap-3 items-center">
                                                        <div className="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-black">{m.name.charAt(0)}</div>
                                                        <h3 className="font-black text-lg">{m.name}</h3>
                                                    </div>
                                                    <a href={zapUrl} target="_blank" className="p-2 bg-green-50 text-green-600 rounded-xl font-bold text-xs flex gap-1"><Icon name="message-circle" className="w-4 h-4"/> Cobrar</a>
                                                </div>
                                                <div className="flex justify-between text-sm font-medium text-gray-500 mb-1"><span>Compras:</span> <span>{formatMoney(totals[m.id])}</span></div>
                                                <div className="flex justify-between text-sm font-medium text-gray-500 mb-3"><span>PIX Pago:</span> <span className="text-green-600">- {formatMoney(paid[m.id])}</span></div>
                                                <div className="bg-gray-50 p-3 rounded-xl flex justify-between items-center mb-3">
                                                    <span className="text-xs font-black uppercase text-gray-500">Resta</span>
                                                    <span className={`text-xl font-black ${rest <= 0 ? 'text-green-500' : 'text-orange-500'}`}>{formatMoney(rest)}</span>
                                                </div>
                                                <button onClick={() => { setPaymentData({ memberId: m.id, amount: '' }); setIsPaymentModalOpen(true); }} className="w-full py-3 bg-gray-900 text-white font-bold rounded-xl">Registrar PIX</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="fade-in space-y-6">
                                <div className="bg-white p-5 rounded-3xl border shadow-sm">
                                    <h3 className="font-black text-gray-800 mb-4">Adicionar Familiar</h3>
                                    <form onSubmit={handleAddMember} className="flex gap-2">
                                        <input name="name" placeholder="Nome..." className="flex-1 p-3 bg-gray-50 border rounded-xl font-bold outline-none" required />
                                        <button className="bg-indigo-600 text-white px-5 rounded-xl font-bold"><Icon name="plus" /></button>
                                    </form>
                                </div>
                                <div className="space-y-3">
                                    {group.members?.map(m => (
                                        <div key={m.id} className="bg-white p-4 rounded-2xl border flex justify-between items-center">
                                            <span className="font-bold">{m.name}</span>
                                            <div className="text-right">
                                                <span className="text-[10px] uppercase text-gray-400 font-bold block">CÓDIGO DE ACESSO:</span>
                                                <span className="font-mono font-black text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md">{m.accessCode}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="pt-8">
                                    <button onClick={handleClearAll} className="w-full py-4 bg-red-50 text-red-600 border border-red-200 font-black rounded-2xl flex items-center justify-center gap-2"><Icon name="alert-triangle"/> Limpar Todo o Extrato (Modo Teste)</button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modais */}
                    <Modal isOpen={isParseModalOpen} onClose={() => setIsParseModalOpen(false)} title="Importar">
                        {!parsedPreview ? (
                            <div className="space-y-4">
                                <label className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-center flex items-center justify-center gap-2 cursor-pointer shadow-md">
                                    <Icon name="file-text" /> SUBIR PDF DA FATURA
                                    <input type="file" accept="application/pdf" className="hidden" onChange={handleFileUpload} />
                                </label>
                                <div className="text-center text-xs font-bold text-gray-400 uppercase">Ou cole o texto</div>
                                <textarea className="w-full h-32 p-3 border rounded-xl text-sm font-mono bg-gray-50 outline-none" placeholder="Cole o extrato..." value={pasteText} onChange={e=>setPasteText(e.target.value)}></textarea>
                                <button onClick={() => analyzeTextCore(pasteText)} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-md">Ler Compras</button>
                            </div>
                        ) : (
                            <div className="flex flex-col h-[60vh]">
                                <div className="overflow-y-auto flex-1 divide-y border rounded-xl mb-4 bg-white">
                                    {parsedPreview.map((tx, i) => (
                                        <div key={i} className={`p-3 flex justify-between text-sm ${!tx.selected ? 'bg-gray-50 opacity-50' : ''}`} onClick={() => { const up=[...parsedPreview]; up[i].selected=!up[i].selected; setParsedPreview(up); }}>
                                            <div className="flex gap-2 items-center overflow-hidden">
                                                <input type="checkbox" checked={tx.selected} readOnly className="w-4 h-4 text-indigo-600 rounded" />
                                                <div className="truncate">
                                                    <span className="font-bold truncate text-gray-900">{tx.description}</span>
                                                    <div className="flex gap-1 mt-0.5"><span className="text-[10px] font-bold text-gray-400">{tx.date}</span><span className={`text-[10px] font-bold px-1.5 rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span></div>
                                                </div>
                                            </div>
                                            <span className="font-black shrink-0">{formatMoney(tx.amount)}</span>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={handleConfirmParse} className="w-full bg-green-600 text-white py-4 rounded-xl font-black shadow-md">Salvar Lançamentos</button>
                            </div>
                        )}
                    </Modal>

                    <Modal isOpen={isAssignModalOpen} onClose={() => setIsAssignModalOpen(false)} title="Quem é o Dono?">
                        {assignTx && (
                            <div className="space-y-4">
                                <div className="bg-gray-50 p-4 rounded-2xl border text-center">
                                    <p className="font-black text-gray-900 text-lg">{assignTx.description}</p>
                                    <div className="text-2xl font-black text-indigo-600">{formatMoney(assignTx.amount)}</div>
                                </div>
                                <div className="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto">
                                    {group.members?.map(m => {
                                        const isSel = assignSelections.includes(m.id);
                                        return (
                                            <div key={m.id} onClick={() => setAssignSelections(isSel ? assignSelections.filter(id=>id!==m.id) : [...assignSelections, m.id])} className={`p-3 border-2 rounded-xl flex items-center justify-between cursor-pointer ${isSel ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200'}`}>
                                                <span className={`font-bold ${isSel ? 'text-indigo-900' : 'text-gray-700'}`}>{m.name}</span>
                                                {isSel && <Icon name="check" className="text-indigo-600 w-5 h-5" />}
                                            </div>
                                        )
                                    })}
                                </div>
                                {/\b\d{1,2}\/\d{1,2}\b/.test(assignTx.description) && (
                                    <label className="flex items-center gap-2 p-3 bg-blue-50 text-blue-800 rounded-xl cursor-pointer font-bold text-sm">
                                        <input type="checkbox" checked={applyToFuture} onChange={e=>setApplyToFuture(e.target.checked)} className="w-5 h-5" /> Aplicar este dono para as parcelas futuras também.
                                    </label>
                                )}
                                <button onClick={handleSaveAssign} className="w-full bg-gray-900 text-white py-4 rounded-xl font-black text-lg">Salvar Dono</button>
                            </div>
                        )}
                    </Modal>

                    <Modal isOpen={isEditModalOpen} onClose={() => setIsEditModalOpen(false)} title="Editar Compra">
                        {editTxData.id && (
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-gray-500 uppercase">Descrição da Loja</label>
                                    <input type="text" className="w-full mt-1 p-3 border rounded-xl font-bold outline-none" value={editTxData.description} onChange={e=>setEditTxData({...editTxData, description: e.target.value})} />
                                </div>
                                <div className="flex gap-2">
                                    <div className="flex-1">
                                        <label className="text-xs font-bold text-gray-500 uppercase">Banco/Cartão</label>
                                        <select className="w-full mt-1 p-3 border rounded-xl font-bold outline-none bg-white" value={editTxData.bank} onChange={e=>setEditTxData({...editTxData, bank: e.target.value})}>
                                            <option value="Nubank">Nubank</option>
                                            <option value="Inter">Inter</option>
                                            <option value="Mercado Pago">Mercado Pago</option>
                                            <option value="Outros">Outros</option>
                                        </select>
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-xs font-bold text-gray-500 uppercase">Valor (R$)</label>
                                        <input type="number" step="0.01" className="w-full mt-1 p-3 border rounded-xl font-bold outline-none" value={editTxData.amount} onChange={e=>setEditTxData({...editTxData, amount: e.target.value})} />
                                    </div>
                                </div>
                                {/\b\d{1,2}\/\d{1,2}\b/.test(editTxData.description) && (
                                    <label className="flex items-center gap-2 p-3 bg-blue-50 text-blue-800 rounded-xl cursor-pointer font-bold text-sm">
                                        <input type="checkbox" checked={applyToFuture} onChange={e=>setApplyToFuture(e.target.checked)} className="w-5 h-5" /> Aplicar alteração nas parcelas futuras também.
                                    </label>
                                )}
                                <button onClick={handleSaveEdit} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-black text-lg">Salvar Edição</button>
                            </div>
                        )}
                    </Modal>

                    <Modal isOpen={isPaymentModalOpen} onClose={() => setIsPaymentModalOpen(false)} title="Registrar PIX">
                        <form onSubmit={handleAddPayment} className="space-y-4">
                            <div>
                                <label className="text-xs font-bold text-gray-500 uppercase">Valor Recebido</label>
                                <input type="number" step="0.01" className="w-full mt-1 p-4 border rounded-xl font-black text-3xl outline-none bg-gray-50 text-center" placeholder="0.00" value={paymentData.amount} onChange={(e) => setPaymentData({...paymentData, amount: e.target.value})} autoFocus required />
                            </div>
                            <button type="submit" className="w-full bg-green-600 text-white py-4 rounded-xl font-black text-lg shadow-md">Confirmar PIX</button>
                        </form>
                    </Modal>
                </div>
            );
        };

        // --- DASHBOARD DO FAMILIAR ---
        const MemberDashboard = ({ group, memberCode, onLogout }) => {
            const member = group.members.find(m => m.accessCode === memberCode);
            const myTxs = group.transactions?.filter(tx => tx.assignedTo === member.id || tx.splits?.some(s=>s.memberId === member.id)) || [];
            const myTotal = myTxs.reduce((acc, curr) => acc + (curr.splits ? curr.splits.find(s=>s.memberId===member.id).amount : curr.amount), 0);

            return (
                <div className="pb-24 min-h-screen bg-gray-50">
                    <div className="bg-gray-900 p-6 rounded-b-[2rem] shadow-xl text-white">
                        <div className="flex justify-between items-center mb-6">
                            <h1 className="font-black text-2xl">{member?.name}</h1>
                            <button onClick={onLogout} className="text-gray-400 hover:text-white"><Icon name="log-out" className="w-5 h-5" /></button>
                        </div>
                        <p className="text-gray-400 text-xs font-black uppercase tracking-widest mb-1">Previsão de Fatura</p>
                        <div className="text-5xl font-black">{formatMoney(myTotal)}</div>
                    </div>
                    <div className="p-4 space-y-3 mt-4">
                        {myTxs.length === 0 && <p className="text-center text-gray-400 font-medium py-8">Nenhuma compra atribuída a você.</p>}
                        {myTxs.map(tx => {
                            const val = tx.splits ? tx.splits.find(s=>s.memberId===member.id).amount : tx.amount;
                            return (
                                <div key={tx.id} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                                    <div className="truncate pr-2">
                                        <p className="font-bold text-gray-900 truncate text-lg">{tx.description}</p>
                                        <div className="flex gap-1 mt-1"><span className="text-[10px] font-bold text-gray-400">{tx.date}</span><span className={`text-[10px] font-bold px-1.5 rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span></div>
                                    </div>
                                    <div className="font-black text-xl shrink-0">{formatMoney(val)}</div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL E NAVEGAÇÃO ---
        const App = () => {
            const [view, setView] = useState('landing');
            const [currentGroup, setCurrentGroup] = useState(null);
            const [memberCode, setMemberCode] = useState('');
            const [adminData, setAdminData] = useState({ email: '', pass: '' });
            const [notification, setNotification] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                window.firebaseModules.initializeApp(myFirebaseConfig);
                auth = window.firebaseModules.getAuth(); db = window.firebaseModules.getFirestore();
                window.firebaseModules.onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        try {
                            const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'groups'), window.firebaseModules.where('adminUid', '==', u.uid));
                            const snap = await window.firebaseModules.getDocs(q);
                            if (!snap.empty) { setCurrentGroup({ id: snap.docs[0].id, ...snap.docs[0].data() }); setView('admin_dash'); }
                        } catch(e) { console.error(e); }
                        finally { setLoading(false); }
                    }
                });
            }, []);

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const unsub = window.firebaseModules.onSnapshot(window.firebaseModules.doc(db, 'groups', currentGroup.id), (doc) => {
                    if (doc.exists()) setCurrentGroup({ id: doc.id, ...doc.data() });
                });
                return () => unsub();
            }, [currentGroup?.id]);

            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };
            const updateGroup = async (updates) => { try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'groups', currentGroup.id), updates); } catch(e) {} };

            const handleMemberLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const cleanCode = memberCode.toUpperCase().trim();
                    const groupId = cleanCode.split('-')[0];
                    const docSnap = await window.firebaseModules.getDoc(window.firebaseModules.doc(db, 'groups', groupId));
                    if (docSnap.exists() && docSnap.data().members?.some(m => m.accessCode === cleanCode)) {
                        setCurrentGroup({ id: docSnap.id, ...docSnap.data() }); setView('member_dash');
                    } else notify("Código inválido!");
                } catch(e) { notify("Erro ao buscar código."); }
                setLoading(false);
            };

            const handleAdminLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try { 
                    await window.firebaseModules.signInWithEmailAndPassword(auth, adminData.email, adminData.pass); 
                } 
                catch(e) { notify("Email ou senha errados!"); setLoading(false); }
            };

            const handleAdminRegister = async (e) => {
                e.preventDefault(); setLoading(true);
                try {
                    const cred = await window.firebaseModules.createUserWithEmailAndPassword(auth, adminData.email, adminData.pass);
                    const newId = generatePin();
                    const groupData = { adminUid: cred.user.uid, members: [], transactions: [], payments: [] };
                    await window.firebaseModules.setDoc(window.firebaseModules.doc(db, 'groups', newId), groupData);
                    setCurrentGroup({ id: newId, ...groupData }); setView('admin_dash');
                } catch(e) { notify("Erro! Senha fraca ou email já em uso."); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen relative bg-gray-50 font-sans">
                    {notification && <div className="fixed top-6 left-4 right-4 z-50 fade-in flex justify-center"><div className="bg-gray-900 text-white px-6 py-4 rounded-2xl shadow-2xl font-bold text-sm w-full max-w-sm text-center">{notification}</div></div>}

                    {view === 'landing' && (
                        <div className="flex flex-col min-h-screen px-6 fade-in max-w-md mx-auto justify-center">
                            <div className="w-24 h-24 bg-indigo-600 text-white rounded-3xl flex items-center justify-center shadow-xl mx-auto mb-8"><Icon name="pie-chart" className="w-12 h-12" /></div>
                            <h1 className="text-4xl font-black text-gray-900 text-center mb-8">Fatura Família</h1>
                            
                            <form onSubmit={handleMemberLogin} className="bg-white p-6 rounded-3xl shadow-sm border mb-6">
                                <h2 className="font-bold text-gray-500 text-sm uppercase tracking-widest mb-4">Sou Familiar</h2>
                                <input placeholder="Seu Código (Ex: A1B2-C3)" className="w-full p-4 border rounded-2xl font-mono text-center uppercase text-xl font-black outline-none mb-3 bg-gray-50" value={memberCode} onChange={e=>setMemberCode(e.target.value)} required />
                                <button disabled={loading} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black shadow-md">Acessar Minha Fatura</button>
                            </form>
                            
                            <button onClick={() => setView('admin_login')} className="text-indigo-600 font-bold hover:underline py-4">Sou o Dono do Cartão (Entrar)</button>
                        </div>
                    )}

                    {view === 'admin_login' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in max-w-md mx-auto">
                            <button onClick={()=>setView('landing')} className="mb-8 font-bold text-gray-400 flex items-center gap-2"><Icon name="arrow-left"/> Voltar</button>
                            <h2 className="text-3xl font-black mb-6">Acesso Admin</h2>
                            <form onSubmit={handleAdminLogin} className="space-y-3 mb-6">
                                <input type="email" placeholder="Seu E-mail" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.email} onChange={e=>setAdminData({...adminData, email:e.target.value})} required />
                                <input type="password" placeholder="Sua Senha" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.pass} onChange={e=>setAdminData({...adminData, pass:e.target.value})} required />
                                <button disabled={loading} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-md">Entrar no Painel</button>
                            </form>
                            <button onClick={()=>setView('admin_register')} className="text-gray-500 font-bold hover:underline">Primeira vez? Criar meu grupo</button>
                        </div>
                    )}

                    {view === 'admin_register' && (
                        <div className="min-h-screen flex flex-col justify-center px-6 fade-in max-w-md mx-auto">
                            <button onClick={()=>setView('admin_login')} className="mb-8 font-bold text-gray-400 flex items-center gap-2"><Icon name="arrow-left"/> Voltar</button>
                            <h2 className="text-3xl font-black mb-6 text-indigo-600">Criar Conta</h2>
                            <form onSubmit={handleAdminRegister} className="space-y-3">
                                <input type="email" placeholder="Crie um E-mail" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.email} onChange={e=>setAdminData({...adminData, email:e.target.value})} required />
                                <input type="password" placeholder="Crie uma Senha (mín. 6)" className="w-full p-4 border rounded-2xl font-bold outline-none bg-gray-50" value={adminData.pass} onChange={e=>setAdminData({...adminData, pass:e.target.value})} minLength="6" required />
                                <button disabled={loading} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-md">Finalizar Cadastro</button>
                            </form>
                        </div>
                    )}

                    {view === 'admin_dash' && <AdminDashboard group={currentGroup} updateGroupData={updateGroup} notify={notify} />}
                    {view === 'member_dash' && <MemberDashboard group={currentGroup} memberCode={memberCode} onLogout={()=>setView('landing')} />}

                    {view === 'admin_dash' && (
                        <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-between items-center z-40 px-6">
                            <span className="font-black text-indigo-600">Fatura Família</span>
                            <button onClick={async()=>{await window.firebaseModules.signOut(auth); setView('landing');}} className="font-bold text-gray-400 hover:text-red-500 text-sm">Sair da Conta</button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
