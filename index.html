                });
                (group.payments?.filter(x => selectedInvoiceMonth === 'Todos' || x.month === selectedInvoiceMonth) || []).forEach(x => { if (p[x.memberId]) { if (x.type === 'emprestimo') p[x.memberId].loan += x.amount; else p[x.memberId].card += x.amount; } });
                return { totals: t, paid: p };
            }, [group, sortedMembers, selectedInvoiceMonth]);

            return (
                <ErrorBoundary>
                    <div className="pb-24">
                        <div className="bg-indigo-600 p-3 rounded-b-3xl shadow-lg mb-3 text-white text-center"><h1 className="text-[14px] font-black tracking-tight">Painel Administrador</h1></div>
                        <div className="max-w-4xl mx-auto px-2 space-y-3">
                            <div className="flex bg-gray-200 p-1 rounded-lg overflow-x-auto hide-scroll text-[9px]">
                                <button onClick={() => setActiveTab('transactions')} className={`flex-1 px-1.5 py-1.5 rounded-md font-bold whitespace-nowrap ${activeTab === 'transactions' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Extrato</button>
                                <button onClick={() => setActiveTab('loans')} className={`flex-1 px-1.5 py-1.5 rounded-md font-bold whitespace-nowrap ${activeTab === 'loans' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Empréstimos</button>
                                <button onClick={() => setActiveTab('summary')} className={`flex-1 px-1.5 py-1.5 rounded-md font-bold whitespace-nowrap ${activeTab === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Resumo</button>
                                <button onClick={() => setActiveTab('settings')} className={`flex-1 px-1.5 py-1.5 rounded-md font-bold whitespace-nowrap ${activeTab === 'settings' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Config</button>
                            </div>
                            
                            {(activeTab === 'transactions' || activeTab === 'summary' || activeTab === 'loans') && (
                                <div className="flex gap-1.5">
                                    <select value={selectedInvoiceMonth} onChange={e => setSelectedInvoiceMonth(e.target.value)} className="flex-[1.5] bg-white border font-black rounded-lg p-1.5 text-[9px] shadow-sm text-center outline-none">{availableInvoiceMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Mês (Todos)' : `Fatura ${m}`}</option>)}</select>
                                    {activeTab === 'transactions' && (
                                        <select value={selectedBankFilter} onChange={e => setSelectedBankFilter(e.target.value)} className="flex-1 bg-white border font-bold rounded-lg p-1.5 text-[9px] shadow-sm text-center outline-none"><option value="Todos">Bancos (Todos)</option>{allBanks.map(b=><option key={b.name} value={b.name}>{b.name}</option>)}</select>
                                    )}
                                </div>
                            )}

                            {activeTab === 'transactions' && (
                                <div className="fade-in space-y-1.5">
                                    <div className="bg-indigo-50 border p-2 rounded-lg flex justify-between items-center"><span className="text-indigo-900 font-bold text-[8px] uppercase">Cartão:</span><span className={`text-sm font-black ${totalFiltered < 0 ? 'text-green-600' : 'text-indigo-600'}`}>{formatMoney(totalFiltered)}</span></div>
                                    <div className="flex gap-1.5"><button onClick={() => setIsParseModalOpen(true)} className="flex-[2] bg-gray-900 text-white py-1.5 rounded-lg font-black text-[9px]"><Icon name="file-text" className="w-3 h-3 inline" /> Importar Fatura</button><button onClick={() => setIsManualModalOpen(true)} className="flex-1 bg-indigo-100 text-indigo-700 border border-indigo-200 py-1.5 rounded-lg font-black text-[9px]"><Icon name="plus" className="w-3 h-3 inline" /> Manual</button></div>
                                    <div className="flex justify-between items-center mt-1 px-1"><button onClick={() => { setIsSelectionMode(!isSelectionMode); setBulkSelections([]); }} className="text-[8px] font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded"><Icon name="check-square" className="w-2.5 h-2.5 inline" /> {isSelectionMode ? 'Ocultar Seleção' : 'Selecionar Vários'}</button>{isSelectionMode && <button onClick={() => setBulkSelections(filteredTransactions.map(tx => tx.id))} className="text-[8px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded">Selecionar Tudo</button>}</div>
                                    {isSelectionMode && bulkSelections.length > 0 && ( <div className="bg-red-50 border border-red-200 p-1.5 rounded flex justify-between items-center sticky top-2 z-10"><span className="text-red-700 text-[8px] font-bold">{bulkSelections.length} sel.</span><button onClick={handleBulkDelete} className="bg-red-600 text-white text-[8px] font-bold py-1 px-2 rounded">Excluir Selecionados</button></div> )}
                                    <div className="space-y-1">
                                        {pendingTxs.map(tx => (
                                            <div key={tx.id} onClick={() => { setAssignTx(tx); setAssignSelections([]); setIsCustomSplit(false); setIsAssignModalOpen(true); }} className="bg-white p-1 rounded-md border flex justify-between items-center cursor-pointer hover:border-indigo-300">
                                                <div className="flex gap-1 items-center overflow-hidden">{isSelectionMode && <input type="checkbox" checked={bulkSelections.includes(tx.id)} onChange={() => setBulkSelections(p=>p.includes(tx.id)?p.filter(x=>x!==tx.id):[...p, tx.id])} onClick={e=>e.stopPropagation()} className="w-3 h-3 text-indigo-600 rounded shrink-0" />}<div className="w-5 h-5 bg-gray-50 border rounded flex items-center justify-center text-gray-500 text-[6px] font-black shrink-0">{tx.date.substring(0,5)}</div><div className="truncate pr-1"><p className="font-bold text-[8px] truncate">{tx.description}</p><span className={`text-[5px] font-bold px-1 rounded border mt-0.5 inline-block ${getBankStyle(tx.bank, group.customBanks)}`}>{tx.bank}</span></div></div><span className="font-black text-[8px] shrink-0 text-indigo-600">{formatMoney(tx.amount)}</span>
                                            </div>
                                        ))}
                                        {completedTxs.map(tx => (
                                            <div key={tx.id} className="bg-gray-50 p-1 rounded-md border flex justify-between items-center cursor-pointer" onClick={() => { setAssignTx(tx); setAssignSelections(tx.splits ? tx.splits.map(s=>s.memberId) : [tx.assignedTo]); setIsCustomSplit(!!tx.splits); const vals = {}; if(tx.splits) tx.splits.forEach(s => vals[s.memberId] = s.amount); setCustomSplitsValues(vals); setIsAssignModalOpen(true); }}>
                                                <div className="flex gap-1 items-center overflow-hidden">{isSelectionMode && <input type="checkbox" checked={bulkSelections.includes(tx.id)} onChange={() => setBulkSelections(p=>p.includes(tx.id)?p.filter(x=>x!==tx.id):[...p, tx.id])} onClick={e=>e.stopPropagation()} className="w-3 h-3 text-indigo-600 rounded shrink-0" />}<div className="w-4 h-4 bg-white border rounded flex items-center justify-center text-gray-400 text-[5px] font-black shrink-0">{tx.date.substring(0,5)}</div><div className="truncate pr-1"><p className="font-bold text-[7px] text-gray-600 truncate">{tx.description}</p><span className="text-[5px] text-green-600 font-bold"><Icon name="check-circle" className="w-2 h-2 inline"/> {tx.splits?.length ? 'Rateio' : sortedMembers.find(m=>m.id===tx.assignedTo)?.name}</span></div></div><span className="font-black text-[7px] shrink-0">{formatMoney(tx.amount)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'summary' && (
                                <div className="fade-in space-y-1.5">
                                    {(totals.unassigned > 0.05 || totals.unassigned < -0.05) && <div className="p-1.5 bg-red-50 border border-red-200 rounded-lg text-center"><span className="font-bold text-red-700 text-[7px]">SEM DONO NO CARTÃO</span><div className="font-black text-sm text-red-600">{formatMoney(totals.unassigned)}</div></div>}
                                    {sortedMembers.map(m => {
                                        const cRest = totals[m.id].card - paid[m.id].card; const lRest = totals[m.id].loan - paid[m.id].loan; const gTotal = cRest + lRest; const mPays = group.payments?.filter(x => x.memberId === m.id && (selectedInvoiceMonth === 'Todos' || x.month === selectedInvoiceMonth)) || [];
                                        return (
                                            <div key={m.id} className="bg-white p-2 rounded-lg border shadow-sm">
                                                <div className="flex justify-between items-center mb-1 border-b pb-1"><div className="font-black text-[10px]">{m.name}</div><button onClick={() => { setPaymentData({ memberId: m.id, amount: '', remainingBalance: gTotal, type: 'cartao' }); setIsPaymentModalOpen(true); }} className="px-2 py-1 bg-green-50 text-green-700 rounded text-[7px] font-bold border border-green-200"><Icon name="check" className="w-2 h-2 inline"/> Receber</button></div>
                                                <div className="flex gap-1.5 mb-1"><div className="flex-1 bg-gray-50 rounded p-1 text-center"><span className="text-[6px] font-bold text-gray-500 block">Cartões</span><span className="text-[8px] font-black">{formatMoney(cRest)}</span></div><div className="flex-1 bg-gray-50 rounded p-1 text-center"><span className="text-[6px] font-bold text-gray-500 block">Empréstimos</span><span className="text-[8px] font-black">{formatMoney(lRest)}</span></div></div>
                                                <div className="bg-gray-100 p-1 rounded flex justify-between items-center border"><span className="text-[7px] font-black text-gray-600">Total Falta Pagar</span><span className={`text-[10px] font-black ${gTotal <= 0 ? 'text-green-600' : ''}`}>{formatMoney(gTotal)}</span></div>
                                                {mPays.length > 0 && <div className="mt-1 bg-green-50/50 p-1 rounded border border-green-100"><p className="text-[6px] font-bold text-green-800 uppercase mb-0.5">Pagamentos Salvos</p>{mPays.map(p => (<div key={p.id} className="flex justify-between items-center bg-white p-0.5 rounded border border-green-100 mb-0.5"><span className="text-[6px] font-bold text-gray-500">{p.date} ({p.type})</span><div className="flex items-center gap-1"><span className="text-[7px] font-black text-green-700">{formatMoney(p.amount)}</span><button onClick={()=>updateGroupData({payments: group.payments.filter(x=>x.id!==p.id)})} className="text-red-400 hover:text-red-600"><Icon name="trash-2" className="w-2 h-2"/></button></div></div>))}</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {activeTab === 'loans' && (
                                <div className="fade-in space-y-1.5">
                                    <button onClick={() => setIsLoanModalOpen(true)} className="w-full bg-gray-800 text-white p-1.5 rounded-lg font-black text-[9px]"><Icon name="plus" className="w-3 h-3 inline"/> Novo Empréstimo</button>
                                    {group.transactions?.filter(tx => tx.bank === 'Empréstimo' && (selectedInvoiceMonth === 'Todos' || tx.invoiceMonth === selectedInvoiceMonth)).map(tx => ( <div key={tx.id} className="bg-white p-1.5 rounded-lg border flex flex-col relative"><div className="absolute top-1 right-1 flex gap-1"><button onClick={() => { setAssignTx(tx); setIsAssignModalOpen(true); }} className="p-0.5 text-indigo-400"><Icon name="edit-2" className="w-2.5 h-2.5"/></button><button onClick={()=>window.confirm("Apagar?") && updateGroupData({transactions: group.transactions.filter(t=>t.id!==tx.id)})} className="p-0.5 text-red-400"><Icon name="trash-2" className="w-2.5 h-2.5"/></button></div><div className="flex items-center gap-1"><span className="font-bold text-[8px] text-gray-800">{sortedMembers.find(x=>x.id===tx.assignedTo)?.name}</span><span className="bg-gray-100 px-1 rounded text-[6px] font-bold">{tx.date}</span></div><h3 className="font-black text-[8px] text-gray-900 mt-0.5">{tx.description}</h3><span className="font-black text-[9px]">{formatMoney(tx.amount)}</span></div> ))}
                                </div>
                            )}

                            {activeTab === 'settings' && (
                                <div className="fade-in space-y-2">
                                    <div className="bg-white p-1.5 rounded-xl border">
                                        <h3 className="font-bold text-[8px] text-gray-600 uppercase mb-1">👨‍👩‍👧 Familiares</h3>
                                        <form onSubmit={async (e) => { e.preventDefault(); const n = e.target.name.value.trim(); if(n) { await updateGroupData({ members: [...(group.members || []), { id: crypto.randomUUID(), name: n, virtualCards: e.target.virtualCards.value.trim(), accessCode: generateCode() }] }); e.target.reset(); } }} className="flex flex-col gap-1 mb-1.5"><input name="name" placeholder="Nome" className="p-1.5 bg-gray-50 border rounded-lg font-bold text-[9px]" required /><input name="virtualCards" placeholder="Cartões (Ex: 3163, 6818)" className="p-1.5 bg-gray-50 border rounded-lg font-bold text-[9px]" /><button className="bg-indigo-600 text-white p-1.5 rounded-lg font-bold text-[9px]">Salvar Familiar</button></form>
                                        <div className="grid grid-cols-2 gap-1">{sortedMembers.map(m => ( <div key={m.id} className="bg-gray-50 p-1.5 rounded-lg border text-center relative"><button onClick={()=>window.confirm("Apagar?")&&updateGroupData({members:group.members.filter(x=>x.id!==m.id)})} className="absolute top-0 right-0 p-1 text-red-400"><Icon name="x" className="w-2 h-2"/></button><span className="font-black text-[9px] block truncate">{m.name}</span><span className="font-mono text-indigo-600 bg-indigo-50 px-1 rounded text-[7px] font-bold">{m.accessCode}</span></div> ))}</div>
                                    </div>
                                    <div className="bg-white p-1.5 rounded-xl border">
                                        <h3 className="font-bold text-[8px] text-gray-600 uppercase mb-1">💳 Bancos Cadastrados</h3>
                                        <form onSubmit={async (e) => { e.preventDefault(); const bName = e.target.bankName.value.trim(); if(bName && !allBanks.find(x=>x.name===bName)){ await updateGroupData({ customBanks: [...(group.customBanks||[]), {name: bName, color: e.target.bankColor.value}] }); e.target.reset(); } }} className="flex gap-1 mb-1.5"><input name="bankName" placeholder="Nome" className="flex-1 p-1 bg-gray-50 border rounded text-[8px] font-bold" required /><select name="bankColor" className="p-1 bg-gray-50 border rounded text-[8px] font-bold"><option value="red">Vermelho</option><option value="green">Verde</option><option value="blue">Azul</option><option value="pink">Rosa</option><option value="teal">Verde-Água</option><option value="gray">Cinza</option></select><button className="bg-gray-800 text-white p-1 rounded font-bold text-[8px]">Add</button></form>
                                        <div className="flex flex-wrap gap-1">{allBanks.map(b => ( <div key={b.name} className={`px-1.5 py-0.5 rounded text-[7px] font-bold border flex items-center gap-1 ${bankColors[b.color]}`}>{b.name} {!defaultBanks.find(x=>x.name===b.name) && <button onClick={()=>updateGroupData({customBanks: group.customBanks.filter(x=>x.name!==b.name)})} className="opacity-70"><Icon name="x" className="w-2 h-2"/></button>}</div> ))}</div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <Modal isOpen={isParseModalOpen} onClose={() => setIsParseModalOpen(false)} title="Importar Extrato">
                            {!parsedPreview ? (
                                <div className="space-y-1.5">
                                    <div className="flex gap-1"><select className="flex-[2] p-1.5 border rounded-lg font-black bg-indigo-50 text-[9px] outline-none" value={importBank} onChange={e=>setImportBank(e.target.value)}>{allBanks.map(b=><option key={b.name} value={b.name}>{b.name}</option>)}</select><input type="text" className="flex-1 p-1.5 border rounded-lg font-black bg-indigo-50 text-center text-[9px] outline-none" value={importInvoiceMonth} onChange={e=>setImportInvoiceMonth(e.target.value)} placeholder="Mês (ex: 10/2026)" /></div>
                                    <label className="w-full bg-gray-900 text-white py-2 rounded-lg font-black text-center flex items-center justify-center gap-1 text-[9px] cursor-pointer"><Icon name="file-text" className="w-3 h-3"/> PDF / CSV <input type="file" accept=".pdf,.csv" className="hidden" onChange={handleFileUpload} /></label>
                                    <textarea className="w-full h-16 p-1.5 border rounded-lg text-[8px] font-mono bg-gray-50 outline-none resize-none" placeholder="Ou cole o texto..." value={pasteText} onChange={e=>setPasteText(e.target.value)}></textarea>
                                    <button onClick={analyzeTextCore} className="w-full bg-indigo-600 text-white py-1.5 rounded-lg font-black text-[10px]">Analisar Leituras</button>
                                </div>
                            ) : (
                                <div className="flex flex-col max-h-[60vh]">
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-1.5 mb-1 text-center"><span className="text-[7px] font-bold text-blue-700 uppercase">Total do Mês (Ignorando Futuro)</span><div className="text-[12px] font-black text-blue-900">{formatMoney(previewCalculatedTotal)}</div></div>
                                    <div className="overflow-y-auto custom-scroll flex-1 border rounded-lg mb-1 bg-white divide-y">{parsedPreview.map((tx, i) => ( <div key={i} className={`p-1 flex justify-between items-center cursor-pointer ${!tx.selected ? 'bg-gray-100 opacity-50' : ''}`} onClick={() => { const up=[...parsedPreview]; up[i].selected=!up[i].selected; setParsedPreview(up); }}><div className="flex gap-1 items-center overflow-hidden"><input type="checkbox" checked={tx.selected} readOnly className="w-2.5 h-2.5 rounded shrink-0" /><div className="truncate"><span className="font-bold text-[7px] text-gray-900">{tx.description}</span><div className="flex gap-1 mt-0.5"><span className={`text-[5px] font-bold px-1 rounded border ${getBankStyle(tx.bank, group.customBanks)}`}>{tx.bank}</span>{tx.isProjection && <span className="text-[5px] text-blue-600 bg-blue-50 border px-1 rounded">Futuro</span>}{tx.isDuplicate && <span className="text-[5px] text-red-600 bg-red-50 border px-1 rounded">Já Salvo</span>}</div></div></div><span className="font-black text-[7px] shrink-0 ml-1">{formatMoney(tx.amount)}</span></div> ))}</div>
                                    <button onClick={handleConfirmParse} className="w-full bg-green-600 text-white py-1.5 rounded-lg font-black text-[9px] shrink-0">Salvar Selecionados</button>
                                </div>
                            )}
                        </Modal>

                        <Modal isOpen={isAssignModalOpen} onClose={() => setIsAssignModalOpen(false)} title="Editar Lançamento">
                            {assignTx && (
                                <div className="space-y-1">
                                    <div className="flex gap-1 mb-1"><button onClick={handleDeleteTransaction} className="bg-red-50 text-red-600 border border-red-200 py-1 px-2 rounded-lg font-black text-[8px] flex items-center gap-1"><Icon name="trash-2" className="w-2.5 h-2.5"/> Excluir</button><button onClick={handleSaveAssign} className="flex-1 bg-green-600 text-white py-1 px-2 rounded-lg font-black text-[8px] flex items-center justify-center gap-1"><Icon name="check-circle" className="w-2.5 h-2.5"/> SALVAR</button></div>
                                    <div className="bg-gray-50 p-1.5 rounded-lg border">
                                        <div className="flex gap-1 mb-1"><input type="text" value={assignTx.date} onChange={(e) => setAssignTx({...assignTx, date: e.target.value})} className="w-1/3 font-bold text-gray-900 bg-white border rounded p-1 text-[8px] text-center" /><input type="number" step="0.01" value={assignTx.amount} onChange={(e) => setAssignTx({...assignTx, amount: e.target.value})} className="w-2/3 font-black text-indigo-700 bg-white border rounded p-1 text-[9px] text-right" /></div>
                                        <input type="text" value={assignTx.description} onChange={(e) => setAssignTx({...assignTx, description: e.target.value})} className="font-bold text-gray-900 w-full bg-white border rounded p-1 text-[8px] mb-1" />
                                        <select value={assignTx.bank} onChange={(e) => setAssignTx({...assignTx, bank: e.target.value})} className="font-bold text-gray-900 bg-white border rounded p-0.5 text-[7px]"><option value="Empréstimo">Empréstimo</option>{allBanks.map(b=><option key={b.name} value={b.name}>{b.name}</option>)}</select>
                                    </div>
                                    <div className="flex flex-wrap gap-1 justify-center mt-1">{sortedMembers.map(m => { const isSel = assignSelections.includes(m.id); return <div key={m.id} onClick={() => setAssignSelections(isSel ? assignSelections.filter(id=>id!==m.id) : [...assignSelections, m.id])} className={`px-2 py-0.5 border-2 rounded-md cursor-pointer text-[7px] font-bold ${isSel ? 'border-indigo-600 bg-indigo-50 text-indigo-900' : 'border-gray-100 text-gray-500'}`}>{m.name}</div> })}</div>
                                    {assignSelections.length > 1 && ( <div className="p-1 bg-gray-50 border rounded-lg"><label className="flex items-center gap-1 text-[7px] font-bold"><input type="checkbox" checked={isCustomSplit} onChange={e=>setIsCustomSplit(e.target.checked)} className="w-2 h-2 rounded" /> Valores Manuais (Rateio Exato)</label>{isCustomSplit && assignSelections.map(mId => ( <div key={mId} className="flex justify-between items-center bg-white p-1 border rounded mb-0.5"><span className="text-[7px] font-bold">{sortedMembers.find(m=>m.id===mId)?.name}</span><input type="number" step="0.01" value={customSplitsValues[mId]||''} onChange={e=>setCustomSplitsValues({...customSplitsValues, [mId]:e.target.value})} className="w-12 p-0.5 border rounded text-[7px] font-bold text-right" placeholder="0.00" /></div> ))}</div> )}
                                    {/\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(assignTx.description) && <label className="flex items-center gap-1 p-1 bg-blue-50 text-blue-800 rounded-lg cursor-pointer font-bold text-[7px] border"><input type="checkbox" checked={applyToFuture} onChange={e=>setApplyToFuture(e.target.checked)} className="w-2.5 h-2.5 rounded" /> Alterar/Excluir futuras</label>}
                                </div>
                            )}
                        </Modal>

                        <Modal isOpen={isManualModalOpen} onClose={() => setIsManualModalOpen(false)} title="Manual">
                            <form onSubmit={handleAddManualTransaction} className="space-y-1"><input type="text" placeholder="Nome da Compra (Ex: Tênis 1/5)" className="w-full p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50 outline-none" value={manualData.description} onChange={e=>setManualData({...manualData, description:e.target.value})} required /><div className="flex gap-1"><input type="number" step="0.01" placeholder="Valor" className="flex-[2] p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50 outline-none" value={manualData.amount} onChange={e=>setManualData({...manualData, amount:e.target.value})} required /><input type="text" placeholder="DD/MM" className="flex-1 p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50 outline-none text-center" value={manualData.date} onChange={e=>setManualData({...manualData, date:e.target.value})} /></div><div className="flex gap-1"><select className="flex-[2] p-1.5 border rounded-lg font-bold text-[8px] bg-gray-50 outline-none" value={manualData.bank} onChange={e=>setManualData({...manualData, bank:e.target.value})}>{allBanks.map(b=><option key={b.name} value={b.name}>{b.name}</option>)}</select><input type="number" placeholder="Parcelas" className="flex-1 p-1.5 border rounded-lg font-bold text-[8px] bg-gray-50 outline-none text-center" value={manualData.installments} onChange={e=>setManualData({...manualData, installments:e.target.value})} /></div><div className="flex flex-wrap gap-1 justify-center">{sortedMembers.map(m => { const isSel = manualSelections.includes(m.id); return <div key={m.id} onClick={() => setManualSelections(isSel ? manualSelections.filter(id=>id!==m.id) : [...manualSelections, m.id])} className={`px-2 py-0.5 border-2 rounded-md cursor-pointer text-[7px] font-bold ${isSel ? 'border-indigo-600 bg-indigo-50 text-indigo-900' : 'border-gray-100 text-gray-500'}`}>{m.name}</div> })}</div>{manualSelections.length > 1 && ( <div className="p-1 bg-gray-50 border rounded-lg"><label className="flex items-center gap-1 text-[7px] font-bold"><input type="checkbox" checked={isManualCustomSplit} onChange={e=>setIsManualCustomSplit(e.target.checked)} className="w-2.5 h-2.5 rounded" /> Valores Manuais (Rateio Exato)</label>{isManualCustomSplit && manualSelections.map(mId => ( <div key={mId} className="flex justify-between items-center bg-white p-1 border rounded mb-0.5"><span className="text-[7px] font-bold">{sortedMembers.find(m=>m.id===mId)?.name}</span><input type="number" step="0.01" value={manualCustomSplitsValues[mId]||''} onChange={e=>setManualCustomSplitsValues({...manualCustomSplitsValues, [mId]:e.target.value})} className="w-12 p-0.5 border rounded text-[7px] font-bold text-right" placeholder="0.00" /></div> ))}</div> )}<button type="submit" className="w-full bg-indigo-600 text-white py-1.5 rounded-lg font-black text-[9px]">Salvar</button></form>
                        </Modal>

                        <Modal isOpen={isLoanModalOpen} onClose={() => setIsLoanModalOpen(false)} title="Adicionar Empréstimo">
                            <form onSubmit={handleAddLoan} className="space-y-1"><input type="text" placeholder="Motivo" className="w-full p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50" value={loanData.description} onChange={e=>setLoanData({...loanData, description:e.target.value})} required /><div className="flex gap-1"><input type="number" step="0.01" placeholder="Valor" className="flex-[2] p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50" value={loanData.amount} onChange={e=>setLoanData({...loanData, amount:e.target.value})} required /><input type="text" placeholder="Dia (DD)" className="flex-1 p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50 text-center" value={loanData.dueDate} onChange={e=>setLoanData({...loanData, dueDate:e.target.value})} required /></div><div className="flex gap-1"><select className="flex-[2] p-1.5 border rounded-lg font-bold text-[8px] bg-gray-50" value={loanData.memberId} onChange={e=>setLoanData({...loanData, memberId:e.target.value})} required><option value="">Para quem?</option>{sortedMembers.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select><input type="number" placeholder="Parcelas" className="flex-1 p-1.5 border rounded-lg font-bold text-[8px] bg-gray-50 text-center" value={loanData.installments} onChange={e=>setLoanData({...loanData, installments:e.target.value})} /></div><button type="submit" className="w-full bg-gray-800 text-white py-1.5 rounded-lg font-black text-[9px]">Salvar</button></form>
                        </Modal>

                        <Modal isOpen={isPaymentModalOpen} onClose={() => setIsPaymentModalOpen(false)} title="Receber">
                            <form onSubmit={handleAddPayment} className="space-y-1">
                                <div className="p-1 bg-gray-50 border rounded-lg text-center mb-1"><p className="text-[7px] text-gray-500 font-bold">De: <span className="text-[9px] font-black text-gray-900">{sortedMembers.find(m => m.id === paymentData.memberId)?.name}</span></p></div>
                                <div className="flex gap-1 mb-1"><label className={`flex-1 p-1.5 rounded border-2 cursor-pointer text-center flex flex-col items-center ${paymentData.type === 'cartao' ? 'border-indigo-600 bg-indigo-50' : 'border-gray-200 bg-white'}`}><input type="radio" name="payType" className="hidden" checked={paymentData.type === 'cartao'} onChange={() => setPaymentData({...paymentData, type: 'cartao'})}/><span className={`text-[8px] font-bold ${paymentData.type === 'cartao' ? 'text-indigo-800' : 'text-gray-500'}`}>Cartão</span></label><label className={`flex-1 p-1.5 rounded border-2 cursor-pointer text-center flex flex-col items-center ${paymentData.type === 'emprestimo' ? 'border-gray-800 bg-gray-100' : 'border-gray-200 bg-white'}`}><input type="radio" name="payType" className="hidden" checked={paymentData.type === 'emprestimo'} onChange={() => setPaymentData({...paymentData, type: 'emprestimo'})}/><span className={`text-[8px] font-bold ${paymentData.type === 'emprestimo' ? 'text-gray-900' : 'text-gray-500'}`}>Empréstimo</span></label></div>
                                {paymentData.remainingBalance > 0.02 && <button type="button" onClick={() => setPaymentData({...paymentData, amount: paymentData.remainingBalance.toFixed(2)})} className="w-full bg-purple-100 text-purple-700 py-1.5 rounded-lg text-[8px] font-bold flex items-center justify-center gap-1 border border-purple-200"><Icon name="check-circle" className="w-2.5 h-2.5"/> Quitar Restante Tudo ({formatMoney(paymentData.remainingBalance)})</button>}
                                <input type="number" step="0.01" placeholder="Digitar Outro Valor" className="w-full p-1.5 border rounded-lg font-black text-[10px] text-center bg-gray-50 outline-none" value={paymentData.amount} onChange={e=>setPaymentData({...paymentData, amount:e.target.value})} required />
                                <button type="submit" className="w-full bg-green-600 text-white py-1.5 rounded-lg font-black text-[9px]">Confirmar Recebimento</button>
                            </form>
                        </Modal>
                    </div>
                </ErrorBoundary>
            );
        };

        const MemberDashboard = ({ group, memberCode, onLogout }) => {
            const member = group.members.find(m => m.accessCode === memberCode);
            const allBanks = useMemo(() => [...defaultBanks, ...(group.customBanks||[])], [group.customBanks]);
            const myTxs = group.transactions?.filter(tx => tx.assignedTo === member.id || tx.splits?.some(s=>s.memberId === member.id)) || [];
            
            const monthSummaries = useMemo(() => {
                const available = [...new Set(myTxs.map(t => t.invoiceMonth))].sort((a,b) => parseMonthStr(a) - parseMonthStr(b));
                const currentDate = parseMonthStr(getCurrentMonthStr());
                return available.map(month => {
                    const txs = myTxs.filter(t => t.invoiceMonth === month);
                    const total = txs.reduce((acc, curr) => acc + (curr.splits ? curr.splits.find(s=>s.memberId===member.id).amount : curr.amount), 0);
                    const paid = group.payments?.filter(p => p.memberId === member.id && p.month === month).reduce((acc, curr) => acc + curr.amount, 0) || 0;
                    return { month, rest: total - paid };
                }).filter(s => !(parseMonthStr(s.month) < currentDate && s.rest <= 0.05));
            }, [myTxs, group.payments, member.id]);

            const [selectedMonth, setSelectedMonth] = useState(() => { const curr = getCurrentMonthStr(); return monthSummaries.find(m => m.month === curr) ? curr : (monthSummaries[0]?.month || ''); });
            useEffect(() => { if (monthSummaries.length > 0 && !monthSummaries.find(m => m.month === selectedMonth)) { const curr = getCurrentMonthStr(); setSelectedMonth(monthSummaries.find(m => m.month === curr) ? curr : monthSummaries[0].month); } }, [monthSummaries, selectedMonth]);

            const monthTxs = useMemo(() => myTxs.filter(t => t.invoiceMonth === selectedMonth).sort((a, b) => { if (a.bank === 'Empréstimo' && b.bank !== 'Empréstimo') return -1; if (a.bank !== 'Empréstimo' && b.bank === 'Empréstimo') return 1; return 0; }), [myTxs, selectedMonth]);
            const { grossCard, grossLoan } = useMemo(() => { let gc = 0, gl = 0; monthTxs.forEach(tx => { const val = tx.splits ? tx.splits.find(s=>s.memberId===member.id).amount : tx.amount; if (tx.bank === 'Empréstimo') gl += val; else gc += val; }); return { grossCard: gc, grossLoan: gl }; }, [monthTxs, member.id]);
            const finalRest = monthSummaries.find(m => m.month === selectedMonth)?.rest || 0;

            const handleShare = async () => {
                const text = `💰 Fatura de ${selectedMonth} - ${member.name}\n\n*Total a Pagar: ${formatMoney(finalRest)}*\n(Cartões: ${formatMoney(grossCard)} | Empréstimos: ${formatMoney(grossLoan)})\n\nResumo detalhado disponível no aplicativo Família.`;
                if (navigator.share) { try { await navigator.share({ title: 'Minha Fatura', text }); } catch(e) {} } else { navigator.clipboard.writeText(text); alert("Resumo copiado para enviar no WhatsApp!"); }
            };

            return (
                <ErrorBoundary>
                    <div className="pb-24 min-h-screen bg-gray-50">
                        <div className="bg-gray-900 pt-3 pb-3 rounded-b-[1.5rem] shadow-xl text-white">
                            <div className="flex justify-between items-center mb-3 px-3"><div className="flex items-center gap-1.5"><div className="w-7 h-7 bg-indigo-600 rounded-full flex items-center justify-center font-black text-[11px]">{member?.name.charAt(0)}</div><div><h1 className="font-black text-[11px]">{member?.name}</h1><p className="text-gray-400 text-[6px] font-bold uppercase tracking-widest">Painel</p></div></div><div className="flex gap-1.5"><button onClick={handleShare} className="bg-green-600 hover:bg-green-500 text-white p-1.5 rounded-lg flex items-center gap-1 text-[8px] font-bold"><Icon name="share-2" className="w-3 h-3"/> Copiar/Enviar</button><button onClick={onLogout} className="text-gray-400 bg-white/10 p-1.5 rounded-lg"><Icon name="log-out" className="w-3 h-3" /></button></div></div>
                            <div className="px-3 mb-2">
                                <p className="text-gray-400 text-[7px] font-black uppercase mb-0.5">Total Fatura {selectedMonth}</p>
                                <div className={`text-[20px] font-black ${finalRest <= 0 ? 'text-green-400' : 'text-white'}`}>{formatMoney(finalRest)}</div>
                                <div className="flex gap-3 mt-1.5 pt-1.5 border-t border-gray-700/50"><div><p className="text-[6px] text-gray-400 uppercase font-bold">💳 Cartões</p><p className="text-[8px] font-bold text-white">{formatMoney(grossCard)}</p></div><div><p className="text-[6px] text-gray-400 uppercase font-bold">🏦 Empréstimos</p><p className="text-[8px] font-bold text-white">{formatMoney(grossLoan)}</p></div></div>
                            </div>
                            {monthSummaries.length > 0 && ( <div className="mt-3"><p className="text-gray-400 text-[6px] font-black uppercase mb-1 px-3">Linha do Tempo</p><div className="flex gap-1 overflow-x-auto hide-scroll pb-1.5 -mx-3 px-3 custom-scroll">{monthSummaries.map(({ month, rest }) => ( <button key={month} onClick={() => setSelectedMonth(month)} className={`flex flex-col items-center justify-center p-1 rounded-lg shrink-0 border text-center w-[54px] transition-all ${selectedMonth === month ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-white border-gray-200 text-gray-600'}`}><span className={`text-[6px] font-black uppercase mb-0.5 ${selectedMonth === month ? 'text-indigo-200' : 'text-gray-400'}`}>{month}</span><span className={`font-black text-[7px] truncate w-full ${rest <= 0 ? 'text-green-500' : ''}`}>{formatMoney(rest)}</span></button> ))}</div></div> )}
                        </div>
                        <div className="px-2 mt-3 space-y-1.5">
                            <h3 className="font-black text-gray-800 text-[8px] flex items-center gap-1 mb-1 px-1 uppercase tracking-wider"><Icon name="receipt" className="text-indigo-600 w-2.5 h-2.5"/> Detalhes de {selectedMonth}</h3>
                            {monthTxs.map(tx => { 
                                const val = tx.splits ? tx.splits.find(s=>s.memberId===member.id).amount : tx.amount; const isLoan = tx.bank === 'Empréstimo';
                                return ( 
                                    <div key={tx.id} className={`bg-white p-1.5 rounded-lg shadow-sm border flex justify-between items-center ${isLoan ? 'border-l-[3px] border-l-gray-800 bg-gray-50' : ''}`}>
                                        <div className="flex gap-1.5 items-center truncate pr-2">
                                            <div className="w-6 h-6 bg-gray-100 border border-gray-200 rounded flex flex-col items-center justify-center shrink-0"><span className="text-[4px] font-bold text-gray-500 uppercase leading-none mb-0.5">Dia</span><span className="text-[7px] font-black text-gray-800 leading-none">{tx.date.substring(0,2)}</span></div>
                                            <div className="truncate"><p className="font-bold text-[8px] text-gray-900 truncate">{tx.description}</p><div className="flex gap-1 mt-0.5"><span className={`text-[5px] font-bold px-1 rounded border ${getBankStyle(tx.bank, group.customBanks)}`}>{tx.bank}</span></div></div>
                                        </div>
                                        <div className={`font-black text-[8px] shrink-0 ${val < 0 ? 'text-green-600' : 'text-gray-900'}`}>{formatMoney(val)}</div>
                                    </div> 
                                ) 
                            })}
                        </div>
                    </div>
                </ErrorBoundary>
            );
        };

        const App = () => {
            const [view, setView] = useState('landing'); const [currentGroup, setCurrentGroup] = useState(null); const [memberCode, setMemberCode] = useState(''); const [adminData, setAdminData] = useState({ email: '', pass: '' }); const [notification, setNotification] = useState(''); const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.firebaseModules.initializeApp(myFirebaseConfig); auth = window.firebaseModules.getAuth(); db = window.firebaseModules.getFirestore();
                const unsubscribe = window.firebaseModules.onAuthStateChanged(auth, async (u) => {
                    if (u) { try { const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'groups'), window.firebaseModules.where('adminUid', '==', u.uid)); const snap = await window.firebaseModules.getDocs(q); if (!snap.empty) { setCurrentGroup({ id: snap.docs[0].id, ...snap.docs[0].data() }); setView('admin_dash'); } } catch(e) {} } setLoading(false);
                }); return () => unsubscribe();
            }, []);

            useEffect(() => { if (!db || !currentGroup?.id) return; const unsub = window.firebaseModules.onSnapshot(window.firebaseModules.doc(db, 'groups', currentGroup.id), (doc) => { if (doc.exists()) setCurrentGroup({ id: doc.id, ...doc.data() }); }); return () => unsub(); }, [currentGroup?.id]);

            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };
            const updateGroup = async (updates) => { try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'groups', currentGroup.id), updates); } catch(e) { notify("Erro!");} };

            const handleMemberLogin = async (e) => { e.preventDefault(); setLoading(true); try { const cleanCode = memberCode.toUpperCase().trim(); let foundGroup = null; const snap = await window.firebaseModules.getDocs(window.firebaseModules.collection(db, 'groups')); snap.forEach((doc) => { const data = doc.data(); if(data.members?.some(m => m.accessCode === cleanCode)) foundGroup = { id: doc.id, ...data }; }); if (foundGroup) { setCurrentGroup(foundGroup); setView('member_dash'); } else notify("Código inválido!"); } catch(e) { notify("Erro."); } setLoading(false); };
            const handleAdminLogin = async (e) => { e.preventDefault(); setLoading(true); try { await window.firebaseModules.signInWithEmailAndPassword(auth, adminData.email, adminData.pass); } catch(e) { notify("Erro no login."); setLoading(false); } };

            if(loading) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen relative bg-gray-50 font-sans">
                    {notification && <div className="fixed top-2 left-0 right-0 z-[99] fade-in flex justify-center px-4"><div className="bg-gray-900 text-white px-3 py-1.5 rounded-lg shadow-xl font-bold text-[9px] text-center w-full max-w-sm">{notification}</div></div>}
                    {view === 'landing' && (
                        <div className="flex flex-col min-h-screen px-4 fade-in max-w-md mx-auto justify-center"><div className="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-lg mx-auto mb-4"><Icon name="pie-chart" className="w-6 h-6" /></div><h1 className="text-lg font-black text-gray-900 text-center mb-6">Fatura Família</h1><form onSubmit={handleMemberLogin} className="bg-white p-4 rounded-xl shadow-sm border mb-4"><h2 className="font-bold text-gray-500 text-[8px] uppercase tracking-widest mb-2 text-center">Acesso Familiar</h2><input placeholder="Código (Ex: A1B2-7X)" className="w-full p-2 border rounded-lg font-mono text-center uppercase text-[10px] font-black outline-none mb-2 bg-gray-50" value={memberCode} onChange={e=>setMemberCode(e.target.value)} required /><button className="w-full bg-gray-900 text-white py-2.5 rounded-lg font-black shadow-md text-[10px]">Ver Fatura</button></form><button onClick={() => setView('admin_login')} className="text-indigo-600 font-bold py-2 text-[9px] text-center w-full">Sou Administrador</button></div>
                    )}
                    {view === 'admin_login' && (
                        <div className="min-h-screen flex flex-col justify-center px-4 fade-in max-w-md mx-auto"><button onClick={()=>setView('landing')} className="mb-4 font-bold text-gray-400 flex items-center gap-1 text-[9px]"><Icon name="arrow-left" className="w-3 h-3"/> Voltar</button><h2 className="text-lg font-black mb-4">Acesso Admin</h2><form onSubmit={handleAdminLogin} className="space-y-2"><input type="email" placeholder="E-mail" className="w-full p-2.5 border rounded-lg font-bold text-[10px] bg-gray-50 outline-none" value={adminData.email} onChange={e=>setAdminData({...adminData, email:e.target.value})} required /><input type="password" placeholder="Senha" className="w-full p-2.5 border rounded-lg font-bold text-[10px] bg-gray-50 outline-none" value={adminData.pass} onChange={e=>setAdminData({...adminData, pass:e.target.value})} required /><button className="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-black shadow-md text-[10px]">Entrar</button></form></div>
                    )}
                    {view === 'admin_dash' && <AdminDashboard group={currentGroup} updateGroupData={updateGroup} notify={notify} />}
                    {view === 'member_dash' && <MemberDashboard group={currentGroup} memberCode={memberCode} onLogout={()=>setView('landing')} />}
                    {view === 'admin_dash' && ( <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-between items-center z-40 px-3"><span className="font-black text-indigo-600 text-[8px] uppercase tracking-widest">Fatura Família</span><button onClick={async()=>{await window.firebaseModules.signOut(auth); setView('landing');}} className="font-bold text-gray-400 text-[8px] uppercase">Sair</button></div> )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
