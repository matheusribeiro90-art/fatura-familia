<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatura Família</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PDF.js para ler extratos em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase Imports via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Expose to global scope for React
        window.firebaseModules = {
            initializeApp, getAnalytics, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs
        };
    </script>

    <script type="text/babel" data-type="module">
        const appId = 'fatura-familia'; // ID Fixo
        
        // YOUR Custom Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
            authDomain: "fatura-familia-ac61e.firebaseapp.com",
            projectId: "fatura-familia-ac61e",
            storageBucket: "fatura-familia-ac61e.firebasestorage.app",
            messagingSenderId: "300604161734",
            appId: "1:300604161734:web:d44b899f96c6428868e1c7",
            measurementId: "G-TSEHV40NG1"
        };

        let app, auth, db, analytics;
        const { useState, useEffect, useRef, useMemo } = React;

        const formatMoney = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        };

        const generateCode = (length) => {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4 fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="text-lg font-semibold text-gray-800">{title}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-red-500">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>
                        <div className="p-4 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const LoadingSpinner = () => (
            <div className="flex flex-col items-center justify-center h-screen space-y-4 p-8 bg-gray-50">
                <div className="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                <p className="text-indigo-600 font-medium">Conectando ao banco de dados...</p>
            </div>
        );

        const ToastMessage = ({ message, type, onClose }) => {
            if (!message) return null;
            const bg = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            return (
                <div className="fixed bottom-4 right-4 z-50 fade-in">
                    <div className={`${bg} text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-3`}>
                        {type === 'error' ? <i data-lucide="alert-circle" className="w-5 h-5"></i> : <i data-lucide="check-circle" className="w-5 h-5"></i>}
                        <span className="font-medium">{message}</span>
                        <button onClick={onClose} className="ml-4 text-white hover:text-gray-200">
                            <i data-lucide="x" className="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ group, updateGroupData, notify }) => {
            const [activeTab, setActiveTab] = useState('transactions');
            const [newMemberName, setNewMemberName] = useState('');
            
            // Leitor PDF e Texto
            const [pasteText, setPasteText] = useState('');
            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [parsedPreview, setParsedPreview] = useState(null);
            const [isLoadingPdf, setIsLoadingPdf] = useState(false);
            
            // Assistente (Wizard)
            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignMode, setAssignMode] = useState('wizard');
            const [assignQueue, setAssignQueue] = useState([]);
            const [assignIndex, setAssignIndex] = useState(0);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [pendingWizardTxs, setPendingWizardTxs] = useState([]);
            
            // Entrada Manual
            const [manualEntry, setManualEntry] = useState({ date: '', desc: '', amount: '' });
            
            // Modal Pagamentos
            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentData, setPaymentData] = useState({ memberId: '', amount: '' });

            useEffect(() => { 
                lucide.createIcons(); 
                if (window.pdfjsLib && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                }
            });

            const handleAddMember = async (e) => {
                e.preventDefault();
                if (!newMemberName.trim()) return;
                
                const newMember = {
                    id: crypto.randomUUID(),
                    name: newMemberName.trim(),
                    pin: Math.floor(1000 + Math.random() * 9000).toString()
                };

                const updatedMembers = [...(group.members || []), newMember];
                await updateGroupData({ members: updatedMembers });
                setNewMemberName('');
                notify('Familiar adicionado com sucesso!');
            };

            const handleRemoveMember = async (memberId) => {
                const updatedMembers = group.members.filter(m => m.id !== memberId);
                const updatedTransactions = group.transactions.map(t => {
                    let newSplits = t.splits;
                    if (newSplits) {
                        newSplits = newSplits.filter(s => s.memberId !== memberId);
                        if (newSplits.length === 0) newSplits = null;
                        else {
                            const splitAmount = t.amount / newSplits.length;
                            newSplits = newSplits.map(s => ({...s, amount: splitAmount}));
                        }
                    }
                    return t.assignedTo === memberId 
                        ? { ...t, assignedTo: null } 
                        : { ...t, splits: newSplits };
                });
                await updateGroupData({ members: updatedMembers, transactions: updatedTransactions });
                notify('Familiar removido.', 'success');
            };

            const handleAddPayment = async (e) => {
                e.preventDefault();
                if (!paymentData.memberId || !paymentData.amount) return;
                
                const newPayment = {
                    id: crypto.randomUUID(),
                    memberId: paymentData.memberId,
                    amount: parseFloat(paymentData.amount),
                    date: new Date().toLocaleDateString('pt-BR')
                };

                const updatedPayments = [...(group.payments || []), newPayment];
                await updateGroupData({ payments: updatedPayments });
                setPaymentData({ memberId: '', amount: '' });
                setIsPaymentModalOpen(false);
                notify('Pagamento registrado com sucesso!');
            };

            const handleDeletePayment = async (paymentId) => {
                const updatedPayments = group.payments.filter(p => p.id !== paymentId);
                await updateGroupData({ payments: updatedPayments });
                notify('Pagamento removido.');
            };

            const addMonths = (dateStr, num) => {
                const parts = dateStr.split('/');
                if (parts.length < 2) return dateStr;
                let day = parseInt(parts[0], 10);
                let month = parseInt(parts[1], 10);
                let year = parts.length > 2 ? parseInt(parts[2], 10) : new Date().getFullYear();

                month += num;
                while (month > 12) { month -= 12; year++; }
                const d = day.toString().padStart(2, '0');
                const m = month.toString().padStart(2, '0');
                return parts.length > 2 ? `${d}/${m}/${year}` : `${d}/${m}`;
            };

            const handlePdfUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsLoadingPdf(true);
                
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        let lastY = -1;
                        let pageText = '';
                        
                        content.items.forEach(item => {
                            if (lastY !== -1 && Math.abs(item.transform[5] - lastY) > 5) {
                                pageText += '\n';
                            }
                            pageText += item.str + ' ';
                            lastY = item.transform[5];
                        });
                        fullText += pageText + '\n';
                    }
                    
                    setPasteText(fullText);
                    handleAnalyzeText(fullText);
                    notify("PDF lido com sucesso!", "success");
                } catch (error) {
                    console.error("Erro ao processar PDF:", error);
                    notify("Erro ao ler o PDF. Ele pode ter senha ou proteção (ex: Nubank). Copie o texto e cole abaixo.", "error");
                } finally {
                    setIsLoadingPdf(false);
                    e.target.value = null; // Reset input
                }
            };

            const handleAnalyzeText = (textParam = null) => {
                const textToUse = typeof textParam === 'string' ? textParam : pasteText;
                const lines = textToUse.split('\n');
                const newTransactions = [];
                const regex = /(\d{2}\/\d{2}(?:\/\d{2,4})?)\s+(.*?)\s+(?:R\$)?\s*([\d.]*,\d{2})/i;

                lines.forEach(line => {
                    const match = line.match(regex);
                    if (match) {
                        const amountStr = match[3].replace(/\./g, '').replace(',', '.');
                        const parsedAmount = parseFloat(amountStr);
                        const parsedDate = match[1].trim();
                        const parsedDesc = match[2].trim();
                        
                        const checkDupe = (d, desc, amt) => group.transactions?.some(tx => 
                            tx.date === d && tx.description === desc && tx.amount === amt
                        );

                        const isDuplicate = checkDupe(parsedDate, parsedDesc, parsedAmount);
                        const baseDescForHistory = parsedDesc.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                        
                        let historicalAssignee = null;
                        let historicalSplits = null;
                        
                        if (group.transactions) {
                            const pastTx = group.transactions.find(t => 
                                t.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim() === baseDescForHistory && 
                                (t.assignedTo || (t.splits && t.splits.length > 0))
                            );
                            if (pastTx) {
                                historicalAssignee = pastTx.assignedTo;
                                historicalSplits = pastTx.splits ? [...pastTx.splits] : null;
                            }
                        }

                        newTransactions.push({
                            id: crypto.randomUUID(),
                            date: parsedDate,
                            description: parsedDesc,
                            amount: parsedAmount,
                            assignedTo: historicalAssignee,
                            splits: historicalSplits,
                            selected: !isDuplicate,
                            isDuplicate: isDuplicate
                        });

                        const instMatch = parsedDesc.match(/\b(\d{1,2})\/(\d{1,2})\b/);
                        if (instMatch) {
                            const currInst = parseInt(instMatch[1], 10);
                            const totInst = parseInt(instMatch[2], 10);
                            
                            if (totInst > currInst) {
                                for (let i = 1; i <= (totInst - currInst); i++) {
                                    const nextInst = currInst + i;
                                    const nextDate = addMonths(parsedDate, i);
                                    const nextDesc = parsedDesc.replace(/\b\d{1,2}\/\d{1,2}\b/, `${nextInst}/${totInst}`);
                                    const dupeProj = checkDupe(nextDate, nextDesc, parsedAmount);
                                    
                                    newTransactions.push({
                                        id: crypto.randomUUID(),
                                        date: nextDate,
                                        description: nextDesc,
                                        amount: parsedAmount,
                                        assignedTo: historicalAssignee,
                                        splits: historicalSplits,
                                        selected: !dupeProj,
                                        isDuplicate: dupeProj,
                                        isProjection: true
                                    });
                                }
                            }
                        }
                    }
                });

                if (newTransactions.length > 0) setParsedPreview(newTransactions);
                else notify("Nenhuma transação reconhecida. Verifique o formato.", "error");
            };

            const handleConfirmParse = async () => {
                const itemsToAdd = parsedPreview.filter(tx => tx.selected && !tx.isDuplicate).map(({ selected, isDuplicate, ...rest }) => rest);
                const itemsToAsk = itemsToAdd.filter(tx => !tx.assignedTo && (!tx.splits || tx.splits.length === 0) && !tx.isProjection);

                if (itemsToAsk.length > 0) {
                    setAssignMode('wizard');
                    setAssignQueue(itemsToAsk);
                    setAssignIndex(0);
                    setPendingWizardTxs(itemsToAdd); 
                    setAssignTx(itemsToAsk[0]);
                    setAssignSelections([]);
                    setIsParseModalOpen(false);
                    setIsAssignModalOpen(true);
                } else {
                    if (itemsToAdd.length > 0) {
                        const updatedTransactions = [...(group.transactions || []), ...itemsToAdd];
                        await updateGroupData({ transactions: updatedTransactions });
                        notify(`${itemsToAdd.length} compras adicionadas com sucesso!`);
                    } else {
                        notify('Nenhuma compra nova para adicionar.', 'error');
                    }
                    setPasteText('');
                    setParsedPreview(null);
                    setIsParseModalOpen(false);
                }
            };

            const handleWizardNext = async () => {
                let assignedTo = null;
                let splits = null;

                if (assignSelections.length === 1) assignedTo = assignSelections[0];
                else if (assignSelections.length > 1) {
                    const amount = assignTx.amount / assignSelections.length;
                    splits = assignSelections.map(memberId => ({ memberId, amount }));
                }

                const isInstallment = /\b\d{1,2}\/\d{1,2}\b/.test(assignTx.description);
                const baseDesc = assignTx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();

                const newPending = pendingWizardTxs.map(tx => {
                    if (tx.id === assignTx.id) return { ...tx, assignedTo, splits };
                    if (isInstallment && tx.isProjection) {
                        const txBaseDesc = tx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                        if (txBaseDesc === baseDesc && tx.amount === assignTx.amount) {
                            return { ...tx, assignedTo, splits };
                        }
                    }
                    return tx;
                });

                setPendingWizardTxs(newPending);

                if (assignIndex < assignQueue.length - 1) {
                    const nextIndex = assignIndex + 1;
                    setAssignIndex(nextIndex);
                    setAssignTx(assignQueue[nextIndex]);
                    setAssignSelections([]);
                } else {
                    const updatedTransactions = [...(group.transactions || []), ...newPending];
                    await updateGroupData({ transactions: updatedTransactions });
                    notify(`Compras atribuídas com sucesso!`);
                    setPasteText('');
                    setParsedPreview(null);
                    setIsAssignModalOpen(false);
                }
            };

            const openSingleAssign = (tx) => {
                setAssignMode('single');
                setAssignTx(tx);
                let initialSelections = [];
                if (tx.splits && tx.splits.length > 0) initialSelections = tx.splits.map(s => s.memberId);
                else if (tx.assignedTo) initialSelections = [tx.assignedTo];
                setAssignSelections(initialSelections);
                setIsAssignModalOpen(true);
            };

            const handleSaveSingleAssign = async () => {
                let assignedTo = null;
                let splits = null;

                if (assignSelections.length === 1) assignedTo = assignSelections[0];
                else if (assignSelections.length > 1) {
                    const amount = assignTx.amount / assignSelections.length;
                    splits = assignSelections.map(memberId => ({ memberId, amount }));
                }

                const isInstallment = /\b\d{1,2}\/\d{1,2}\b/.test(assignTx.description);
                const baseDesc = assignTx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();

                const updatedTransactions = group.transactions.map(tx => {
                    if (tx.id === assignTx.id) return { ...tx, assignedTo, splits };
                    if (isInstallment) {
                        const txBaseDesc = tx.description.replace(/\s*\b\d{1,2}\/\d{1,2}\b/g, '').trim();
                        if (txBaseDesc === baseDesc && tx.amount === assignTx.amount) {
                            return { ...tx, assignedTo, splits };
                        }
                    }
                    return tx;
                });

                await updateGroupData({ transactions: updatedTransactions });
                notify('Dono atualizado com sucesso.');
                setIsAssignModalOpen(false);
            };

            const handleToggleAssignMember = (memberId) => {
                if (assignSelections.includes(memberId)) setAssignSelections(assignSelections.filter(id => id !== memberId));
                else setAssignSelections([...assignSelections, memberId]);
            };

            const toggleSelection = (index) => {
                const updated = [...parsedPreview];
                updated[index].selected = !updated[index].selected;
                setParsedPreview(updated);
            };

            const handleAddManual = async (e) => {
                e.preventDefault();
                if (!manualEntry.date || !manualEntry.desc || !manualEntry.amount) return;
                const newTx = { id: crypto.randomUUID(), date: manualEntry.date, description: manualEntry.desc, amount: parseFloat(manualEntry.amount), assignedTo: null };
                const updatedTransactions = [...(group.transactions || []), newTx];
                await updateGroupData({ transactions: updatedTransactions });
                setManualEntry({ date: '', desc: '', amount: '' });
                notify('Compra lançada.');
            };

            const handleDeleteTransaction = async (txId) => {
                const updatedTransactions = group.transactions.filter(tx => tx.id !== txId);
                await updateGroupData({ transactions: updatedTransactions });
                notify('Lançamento excluído.');
            };

            const calculateTotals = () => {
                const totals = { unassigned: 0 };
                const paid = {};
                
                group.members?.forEach(m => {
                    totals[m.id] = 0;
                    paid[m.id] = 0;
                });
                
                group.transactions?.forEach(tx => {
                    if (tx.splits && tx.splits.length > 0) {
                        let allocated = 0;
                        tx.splits.forEach(s => {
                            if (totals[s.memberId] !== undefined) {
                                totals[s.memberId] += s.amount;
                                allocated += s.amount;
                            }
                        });
                        if (tx.amount - allocated > 0.02) totals.unassigned += (tx.amount - allocated);
                    } else if (tx.assignedTo && totals[tx.assignedTo] !== undefined) {
                        totals[tx.assignedTo] += tx.amount;
                    } else {
                        totals.unassigned += tx.amount;
                    }
                });

                group.payments?.forEach(p => {
                    if (paid[p.memberId] !== undefined) paid[p.memberId] += p.amount;
                });

                return { totals, paid };
            };

            const { totals, paid } = calculateTotals();
            const totalFatura = group.transactions?.reduce((acc, curr) => acc + curr.amount, 0) || 0;

            return (
                <div className="max-w-4xl mx-auto p-4 fade-in mb-20">
                    <div className="bg-indigo-600 rounded-2xl p-6 text-white mb-6 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden">
                        <div className="absolute -right-10 -top-10 opacity-10"><i data-lucide="shield-check" className="w-48 h-48"></i></div>
                        <div className="z-10 w-full md:w-auto text-center md:text-left">
                            <h1 className="text-2xl font-bold">Painel do Administrador</h1>
                            <div className="flex items-center justify-center md:justify-start gap-2 mt-2 bg-indigo-800/40 w-fit px-3 py-1.5 rounded-lg border border-indigo-500/30">
                                <span className="text-indigo-200 text-xs font-medium uppercase tracking-wider">Seu PIN Admin Secreto:</span>
                                <span className="font-mono text-lg font-bold text-white tracking-widest">{group.adminPin}</span>
                            </div>
                        </div>
                        <div className="bg-white/10 p-4 rounded-xl text-center backdrop-blur-md w-full md:w-auto z-10 border border-white/20">
                            <p className="text-xs uppercase tracking-wider font-semibold text-indigo-100 mb-1">CÓDIGO P/ CONVIDAR FAMÍLIA</p>
                            <div className="text-3xl font-mono font-black tracking-widest">{group.id}</div>
                        </div>
                    </div>

                    <div className="flex overflow-x-auto space-x-2 mb-6 pb-2 scrollbar-hide">
                        <button onClick={() => setActiveTab('transactions')} className={`px-4 py-2 rounded-lg font-bold whitespace-nowrap transition-colors flex items-center gap-2 ${activeTab === 'transactions' ? 'bg-indigo-600 text-white shadow' : 'bg-white text-gray-600 hover:bg-gray-100 border'}`}><i data-lucide="receipt" className="w-4 h-4"></i> Lançamentos</button>
                        <button onClick={() => setActiveTab('members')} className={`px-4 py-2 rounded-lg font-bold whitespace-nowrap transition-colors flex items-center gap-2 ${activeTab === 'members' ? 'bg-indigo-600 text-white shadow' : 'bg-white text-gray-600 hover:bg-gray-100 border'}`}><i data-lucide="users" className="w-4 h-4"></i> Membros & Pagamentos</button>
                        <button onClick={() => setActiveTab('summary')} className={`px-4 py-2 rounded-lg font-bold whitespace-nowrap transition-colors flex items-center gap-2 ${activeTab === 'summary' ? 'bg-indigo-600 text-white shadow' : 'bg-white text-gray-600 hover:bg-gray-100 border'}`}><i data-lucide="pie-chart" className="w-4 h-4"></i> Resumo Financeiro</button>
                    </div>

                    {activeTab === 'members' && (
                        <div className="glass-card rounded-2xl p-6 fade-in space-y-6">
                            <form onSubmit={handleAddMember} className="flex flex-col md:flex-row gap-3 p-4 bg-gray-50 rounded-xl border border-gray-100">
                                <div className="flex-1">
                                    <label className="text-xs font-bold text-gray-500 uppercase ml-1">Nome do Familiar</label>
                                    <input type="text" placeholder="Ex: Matheus" className="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" value={newMemberName} onChange={(e) => setNewMemberName(e.target.value)} />
                                </div>
                                <div className="flex items-end">
                                    <button type="submit" className="w-full md:w-auto bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2"><i data-lucide="user-plus" className="w-5 h-5"></i> Cadastrar Pessoa</button>
                                </div>
                            </form>

                        </div>
                    </div>

                    <h3 className="font-black text-gray-800 mb-4 text-lg flex items-center gap-2 ml-1"><i data-lucide="shopping-bag" className="text-indigo-600"></i> Suas Compras</h3>
                    <div className="glass-card rounded-2xl overflow-hidden divide-y divide-gray-100 border-gray-200 mb-8">
                        {myTransactions.length === 0 ? (
                            <div className="p-10 text-center text-gray-400 flex flex-col items-center gap-3"><i data-lucide="smile" className="w-12 h-12 opacity-50"></i><span className="font-medium">Nenhuma compra no seu nome.</span></div>
                        ) : (
                            myTransactions.map(tx => (
                                <div key={tx.id} className="p-4 flex justify-between items-center hover:bg-gray-50 transition-colors bg-white">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-gray-50 border border-gray-100 rounded-xl flex items-center justify-center text-gray-500 text-xs font-black">{tx.date}</div>
                                        <div>
                                            <p className="font-bold text-gray-800">{tx.description}</p>
                                            {tx.isSplit && <p className="text-[11px] text-blue-600 font-bold mt-1 bg-blue-50 px-2 py-0.5 rounded inline-block border border-blue-100">SUA PARTE DE {formatMoney(tx.amount)}</p>}
                                        </div>
                                    </div>
                                    <div className="font-black text-gray-900 text-lg">{formatMoney(tx.displayAmount)}</div>
                                </div>
                            ))
                        )}
                    </div>

                    {myPayments.length > 0 && (
                        <>
                            <h3 className="font-black text-gray-800 mb-4 text-lg flex items-center gap-2 ml-1"><i data-lucide="check-circle" className="text-green-600"></i> Histórico de Pagamentos</h3>
                            <div className="glass-card rounded-2xl overflow-hidden divide-y divide-green-100 border-green-200 bg-green-50/30">
                                {myPayments.map(p => (
                                    <div key={p.id} className="p-4 flex justify-between items-center">
                                        <div className="flex items-center gap-3">
                                            <div className="bg-green-100 text-green-600 p-2 rounded-lg"><i data-lucide="arrow-down-left" className="w-5 h-5"></i></div>
                                            <div>
                                                <p className="font-bold text-gray-800">Pagamento Confirmado</p>
                                                <p className="text-xs text-gray-500 font-medium">{p.date}</p>
                                            </div>
                                        </div>
                                        <div className="font-black text-green-600 text-lg">+ {formatMoney(p.amount)}</div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [view, setView] = useState('landing');
            const [currentGroup, setCurrentGroup] = useState(null);
            const [currentMemberId, setCurrentMemberId] = useState(null);
            
            const [joinGroupCode, setJoinGroupCode] = useState('');
            const [joinPin, setJoinPin] = useState('');
            const [loadingAction, setLoadingAction] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            const showNotification = (message, type = 'success') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4000);
            };

            useEffect(() => {
                const init = async () => {
                    if (firebaseConfig && window.firebaseModules) {
                        try {
                            app = window.firebaseModules.initializeApp(firebaseConfig);
                            if (firebaseConfig.measurementId) analytics = window.firebaseModules.getAnalytics(app);
                            auth = window.firebaseModules.getAuth(app);
                            db = window.firebaseModules.getFirestore(app);
                            
                            window.firebaseModules.onAuthStateChanged(auth, (u) => {
                                setUser(u);
                                setIsReady(true);
                            });

                            await window.firebaseModules.signInAnonymously(auth);
                        } catch (e) {
                            console.error("Firebase init error:", e);
                            setIsReady(true);
                        }
                    } else setIsReady(true);
                };
                init();
            }, []);

            // Lógica de Reconexão Automática (Memória de Login)
            useEffect(() => {
                const checkExistingAccount = async () => {
                    if (!user || !db || view !== 'landing') return;
                    
                    try {
                        // 1. Tenta ver se é o Administrador
                        const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'artifacts', appId, 'public', 'data', 'groups'), window.firebaseModules.where('adminUid', '==', user.uid));
                        const querySnapshot = await window.firebaseModules.getDocs(q);
                        if (!querySnapshot.empty) {
                            const groupDoc = querySnapshot.docs[0];
                            setCurrentGroup({ id: groupDoc.id, ...groupDoc.data() });
                            setView('admin');
                            return;
                        }

                        // 2. Tenta ver se é um Membro que salvou sessão
                        const savedMember = localStorage.getItem('faturaFamilia_member');
                        if (savedMember) {
                            const { groupId, memberId } = JSON.parse(savedMember);
                            const groupRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', groupId);
                            const docSnap = await window.firebaseModules.getDoc(groupRef);
                            if (docSnap.exists() && docSnap.data().members?.some(m => m.id === memberId)) {
                                setCurrentGroup({ id: docSnap.id, ...docSnap.data() });
                                setCurrentMemberId(memberId);
                                setView('member');
                            }
                        }
                    } catch (e) { console.error("Auto-login falhou", e); }
                };
                checkExistingAccount();
            }, [user, db, view]);

            useEffect(() => { lucide.createIcons(); });

            useEffect(() => {
                if (!db || !currentGroup?.id) return;
                const groupRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', currentGroup.id);
                const unsubscribe = window.firebaseModules.onSnapshot(groupRef, (docSnap) => {
                    if (docSnap.exists()) setCurrentGroup({ id: docSnap.id, ...docSnap.data() });
                }, (error) => console.error(error));
                return () => unsubscribe();
            }, [currentGroup?.id]);

            const handleCreateGroup = async () => {
                if (!user || !db) return showNotification("Erro de conexão.", "error");
                setLoadingAction(true);
                
                const newGroupId = generateCode(6);
                const adminPin = Math.floor(1000 + Math.random() * 9000).toString(); // PIN de 4 dígitos para o Admin
                const groupData = { adminUid: user.uid, adminPin, createdAt: new Date().toISOString(), members: [], transactions: [], payments: [] };

                try {
                    const groupRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', newGroupId);
                    await window.firebaseModules.setDoc(groupRef, groupData);
                    setCurrentGroup({ id: newGroupId, ...groupData });
                    setView('admin');
                    showNotification("Grupo Familiar criado!");
                } catch (e) {
                    showNotification("Erro ao criar grupo.", "error");
                }
                setLoadingAction(false);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!db) return;
                setLoadingAction(true);

                try {
                    const codeUpper = joinGroupCode.toUpperCase().trim();
                    const groupRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', codeUpper);
                    const docSnap = await window.firebaseModules.getDoc(groupRef);

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const member = data.members?.find(m => m.pin === joinPin.trim());
                        
                        if (member) {
                            // Login de Familiar (Salva a sessão localmente)
                            localStorage.setItem('faturaFamilia_member', JSON.stringify({ groupId: docSnap.id, memberId: member.id }));
                            setCurrentGroup({ id: docSnap.id, ...data });
                            setCurrentMemberId(member.id);
                            setView('member');
                        } else if (data.adminPin === joinPin.trim() || data.adminUid === user.uid) {
                            // Login de Admin (Via PIN ou Auto-login)
                            if (data.adminUid !== user.uid) await window.firebaseModules.updateDoc(groupRef, { adminUid: user.uid }); // Atualiza a posse se mudou de aparelho
                            setCurrentGroup({ id: docSnap.id, ...data });
                            setView('admin');
                            showNotification("Bem-vindo de volta, Admin!");
                        } else {
                            showNotification("PIN incorreto ou usuário não encontrado.", "error");
                        }
                    } else {
                        showNotification("Grupo não encontrado.", "error");
                    }
                } catch (e) { showNotification("Erro ao acessar dados.", "error"); }
                setLoadingAction(false);
            };

            const updateGroupData = async (updates) => {
                if (!db || !currentGroup) return;
                try {
                    const groupRef = window.firebaseModules.doc(db, 'artifacts', appId, 'public', 'data', 'groups', currentGroup.id);
                    await window.firebaseModules.updateDoc(groupRef, updates);
                } catch (e) { showNotification("Erro ao salvar.", "error"); }
            };

            const logout = () => {
                localStorage.removeItem('faturaFamilia_member');
                setCurrentGroup(null);
                setCurrentMemberId(null);
                setView('landing');
                setJoinGroupCode('');
                setJoinPin('');
            };

            if (!isReady) return <LoadingSpinner />;

            return (
                <div className="min-h-screen pb-12 relative bg-gray-50">
                    {toast.show && <ToastMessage message={toast.message} type={toast.type} onClose={() => setToast({ show: false, message: '', type: 'success' })} />}
                    
                    <nav className="bg-white border-b sticky top-0 z-40 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 text-gray-900 font-black text-xl cursor-pointer" onClick={logout}>
                                <div className="bg-indigo-600 text-white p-2 rounded-xl shadow-sm"><i data-lucide="pie-chart" className="w-5 h-5"></i></div>
                                FaturaFamília
                            </div>
                            {currentGroup && <button onClick={logout} className="text-gray-500 hover:text-gray-900 text-sm font-bold bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-xl transition-colors">Sair / Trocar Conta</button>}
                        </div>
                    </nav>

                    <main className="mt-8 px-4">
                        {view === 'landing' && (
                            <div className="max-w-3xl mx-auto space-y-8 fade-in">
                                <div className="text-center space-y-4 mb-12">
                                    <h1 className="text-4xl md:text-5xl font-black text-gray-900 tracking-tight leading-tight">Divida o cartão da família <span className="text-indigo-600">sem planilhas chatas.</span></h1>
                                    <p className="text-lg text-gray-600 max-w-xl mx-auto font-medium">Você importa a fatura, aponta os donos, e todo mundo acompanha a própria dívida e os pagamentos pelo celular.</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="glass-card p-8 rounded-3xl border border-gray-200 hover:border-indigo-300 hover:shadow-xl transition-all flex flex-col justify-between bg-white relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-5"><i data-lucide="crown" className="w-32 h-32"></i></div>
                                        <div>
                                            <div className="w-14 h-14 bg-indigo-50 text-indigo-600 border border-indigo-100 rounded-2xl flex items-center justify-center mb-6"><i data-lucide="shield-check" className="w-7 h-7"></i></div>
                                            <h2 className="text-2xl font-black text-gray-900 mb-2 relative z-10">Sou o Titular</h2>
                                            <p className="text-gray-500 mb-8 text-sm font-medium relative z-10">Crie o espaço do cartão da sua casa, leia o extrato inteligente e gerencie quem deve o quê.</p>
                                        </div>
                                        <button onClick={handleCreateGroup} disabled={loadingAction} className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition-colors flex justify-center items-center gap-2 disabled:opacity-70 shadow-md relative z-10">
                                            {loadingAction ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : <>Começar Novo Grupo <i data-lucide="arrow-right" className="w-4 h-4"></i></>}
                                        </button>
                                    </div>
                                    <div className="glass-card p-8 rounded-3xl border border-gray-200 hover:border-gray-400 hover:shadow-xl transition-all bg-white relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-5"><i data-lucide="users" className="w-32 h-32"></i></div>
                                        <div className="w-14 h-14 bg-gray-100 text-gray-700 border border-gray-200 rounded-2xl flex items-center justify-center mb-6 relative z-10"><i data-lucide="log-in" className="w-7 h-7"></i></div>
                                        <h2 className="text-2xl font-black text-gray-900 mb-2 relative z-10">Já tenho um código</h2>
                                        <p className="text-gray-500 mb-6 text-sm font-medium relative z-10">Entre como familiar ou recupere o acesso de Admin.</p>
                                        <form onSubmit={handleLogin} className="space-y-3 relative z-10">
                                            <input type="text" placeholder="Código do Grupo (Ex: XYZ789)" className="w-full p-4 border border-gray-300 rounded-xl font-mono text-center uppercase font-bold focus:border-gray-900 focus:ring-1 focus:ring-gray-900 outline-none bg-gray-50 focus:bg-white transition-colors" value={joinGroupCode} onChange={e => setJoinGroupCode(e.target.value)} required />
                                            <input type="text" placeholder="Seu PIN de Acesso" className="w-full p-4 border border-gray-300 rounded-xl font-mono text-center tracking-widest font-bold focus:border-gray-900 focus:ring-1 focus:ring-gray-900 outline-none bg-gray-50 focus:bg-white transition-colors" value={joinPin} onChange={e => setJoinPin(e.target.value)} required />
                                            <button type="submit" disabled={loadingAction} className="w-full bg-gray-900 text-white py-4 rounded-xl font-bold hover:bg-black transition-colors flex justify-center items-center gap-2 disabled:opacity-70 shadow-md">
                                                {loadingAction ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : 'Acessar'}
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}
                        {view === 'admin' && currentGroup && <AdminDashboard group={currentGroup} updateGroupData={updateGroupData} notify={showNotification} />}
                        {view === 'member' && currentGroup && currentMemberId && <MemberDashboard group={currentGroup} memberId={currentMemberId} onLogout={logout} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
