<body>

    <script>
        const manifest = { name: "Fatura Família", short_name: "Fatura", start_url: ".", display: "standalone", background_color: "#f8fafc", theme_color: "#4f46e5", icons: [{ src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67 0-.84.79-1.43 2.1-1.43 1.38 0 1.9.66 1.94 1.64h1.71c-.05-1.34-.87-2.57-2.49-2.97V5H10.9v1.69c-1.51.32-2.72 1.3-2.72 2.81 0 1.79 1.49 2.69 3.66 3.21 1.95.46 2.34 1.15 2.34 1.87 0 .53-.39 1.64-2.25 1.64-1.74 0-2.1-.96-2.17-1.92H8.01c.06 1.62 1.11 2.86 2.89 3.24V19h2.36v-1.67c1.73-.32 2.99-1.3 2.99-2.92 0-1.89-1.53-2.65-3.64-3.15z'/%3E%3C/svg%3E", sizes: "192x192", type: "image/svg+xml" }] };
        const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        window.firebaseModules = { initializeApp, getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, getFirestore, doc, updateDoc, onSnapshot, query, collection, where, getDocs };
    </script>
    <script type="text/babel" data-type="module">
        const myFirebaseConfig = { apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg", authDomain: "fatura-familia-ac61e.firebaseapp.com", projectId: "fatura-familia-ac61e", storageBucket: "fatura-familia-ac61e.firebasestorage.app", messagingSenderId: "300604161734", appId: "1:300604161734:web:d44b899f96c6428868e1c7" };
        const { useState, useEffect, useRef, useMemo } = React;
        let app, auth, db;
        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        const generateCode = () => Math.random().toString(36).substring(2, 6).toUpperCase() + '-' + Math.random().toString(36).substring(2, 4).toUpperCase();
        const getCurrentMonthStr = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; };
        const addInvoiceMonth = (monthStr, add) => { if (!monthStr || monthStr === 'Todos') return monthStr; const [m, y] = monthStr.split('/'); let month = parseInt(m, 10) + add; let year = parseInt(y, 10); while (month > 12) { month -= 12; year++; } while (month < 1) { month += 12; year--; } return `${month.toString().padStart(2, '0')}/${year}`; };
        const parseMonthStr = (str) => { if (str === 'Todos') return new Date(9999, 11); const [m, y] = str.split('/'); return new Date(y, m - 1); };
        const Icon = ({ name, className }) => { const spanRef = useRef(null); useEffect(() => { if (spanRef.current && window.lucide) { spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`; window.lucide.createIcons({ root: spanRef.current }); } }, [name, className]); return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0"></span>; };
        const getBankStyle = (bankName) => { if(bankName === 'Nubank') return 'bg-purple-100 text-purple-700 border-purple-200'; if(bankName === 'Inter') return 'bg-orange-100 text-orange-700 border-orange-200'; if(bankName === 'Mercado Pago') return 'bg-blue-100 text-blue-700 border-blue-200'; if(bankName === 'Empréstimo') return 'bg-emerald-100 text-emerald-700 border-emerald-200'; return 'bg-gray-100 text-gray-600 border-gray-200'; };
        const Modal = ({ isOpen, onClose, title, children }) => { if (!isOpen) return null; return ( <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-3 fade-in backdrop-blur-sm"> <div className="bg-white rounded-2xl shadow-2xl w-full sm:max-w-md overflow-hidden flex flex-col max-h-screen sm:max-h-[90vh]"> <div className="p-2 border-b flex justify-between items-center bg-gray-50/80"> <h3 className="text-[11px] font-black text-gray-800 uppercase tracking-wider pl-2">{title}</h3> <button onClick={onClose} className="p-1.5 bg-gray-200/50 hover:bg-gray-200 rounded-lg text-gray-600 transition-colors"><Icon name="x" className="w-4 h-4" /></button> </div> <div className="p-2.5 overflow-y-auto hide-scroll flex-1">{children}</div> </div> </div> ); };

        const AdminDashboard = ({ group, updateGroupData, notify }) => {
            const [activeTab, setActiveTab] = useState('transactions'); 
            const [isSelectionMode, setIsSelectionMode] = useState(false);
            const [bulkSelections, setBulkSelections] = useState([]);
            const sortedMembers = useMemo(() => { if (!group.members) return []; return [...group.members].sort((a, b) => a.name.localeCompare(b.name)); }, [group.members]);

            const availableInvoiceMonths = useMemo(() => {
                const months = new Set();
                group.transactions?.forEach(tx => { if(tx.invoiceMonth) months.add(tx.invoiceMonth); });
                const currentMonth = getCurrentMonthStr();
                months.add(currentMonth);
                const sorted = Array.from(months).sort((a, b) => parseMonthStr(a) - parseMonthStr(b));
                return [...sorted, 'Todos'];
            }, [group.transactions]);
            
            const [selectedInvoiceMonth, setSelectedInvoiceMonth] = useState(() => getCurrentMonthStr());
            const [selectedBankFilter, setSelectedBankFilter] = useState('Todos');

            const isMonthClosed = group.invoiceStatus && group.invoiceStatus[selectedInvoiceMonth];
            const toggleMonthStatus = async () => { if(selectedInvoiceMonth === 'Todos') return; const newStatus = { ...(group.invoiceStatus || {}) }; newStatus[selectedInvoiceMonth] = !isMonthClosed; await updateGroupData({ invoiceStatus: newStatus }); notify(!isMonthClosed ? "Fatura Fechada!" : "Fatura reaberta!"); };

            const filteredTransactions = useMemo(() => {
                let txs = group.transactions || [];
                if (selectedInvoiceMonth !== 'Todos') txs = txs.filter(tx => tx.invoiceMonth === selectedInvoiceMonth);
                if (selectedBankFilter !== 'Todos') txs = txs.filter(tx => tx.bank === selectedBankFilter);
                if (activeTab === 'transactions') txs = txs.filter(tx => tx.bank !== 'Empréstimo'); 
                return txs;
            }, [group.transactions, selectedInvoiceMonth, selectedBankFilter, activeTab]);

            const pendingTxs = filteredTransactions.filter(tx => !tx.assignedTo && (!tx.splits || tx.splits.length === 0));
            const completedTxs = filteredTransactions.filter(tx => tx.assignedTo || (tx.splits && tx.splits.length > 0));
            const totalFiltered = filteredTransactions.reduce((acc, curr) => acc + curr.amount, 0);

            const [isParseModalOpen, setIsParseModalOpen] = useState(false);
            const [pasteText, setPasteText] = useState('');
            const [parsedPreview, setParsedPreview] = useState(null);
            const [importInvoiceMonth, setImportInvoiceMonth] = useState(getCurrentMonthStr());
            const [importBank, setImportBank] = useState('Nubank'); 

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                try {
                    if (file.name.toLowerCase().endsWith('.csv')) {
                        notify("Lendo arquivo CSV... Aguarde.");
                        const reader = new FileReader();
                        reader.onload = (event) => { setPasteText(event.target.result); notify("CSV carregado! Verifique se o banco está certo e Analise."); };
                        reader.readAsText(file, 'ISO-8859-1');
                    } else if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        notify("Lendo PDF... Aguarde.");
                        const arrayBuffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        let fullText = '';
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i); const textContent = await page.getTextContent();
                            let lastY = -1;
                            for (let item of textContent.items) { if (lastY !== item.transform[5] && lastY !== -1) fullText += '\n'; fullText += item.str + ' '; lastY = item.transform[5]; }
                            fullText += '\n\n';
                        }
                        setPasteText(fullText); notify("PDF lido com sucesso! Pressione 'Analisar Dados'.");
                    } else { notify("Formato não suportado. Use apenas PDF ou CSV."); }
                } catch (error) { notify("Erro na leitura! Cole o texto manualmente."); }
                e.target.value = null;
            };

            const analyzeTextCore = () => {
                let lines = pasteText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                const newTransactions = [];
                
                const processMatch = (rawDate, rawDesc, rawVal) => {
                    let dMatch = rawDate.match(/^(\d{2})\/(\d{2})/);
                    let parsedDate = dMatch ? `${dMatch[1]}/${dMatch[2]}` : rawDate.trim();
                    let parsedDesc = rawDesc.replace(/^\d{4}\s+/, '').trim(); 
                    
                    let s = String(rawVal).replace(/[R$\s]/ig, '');
                    let isNegative = s.startsWith('-'); if(isNegative) s = s.substring(1);
                    
                    let parsedAmount = 0;
                    if (s.includes(',') && s.includes('.')) { parsedAmount = parseFloat(s.replace(/\./g, '').replace(',', '.')); } 
                    else if (s.includes(',')) { parsedAmount = parseFloat(s.replace(',', '.')); } 
                    else { parsedAmount = parseFloat(s); }
                    if (isNegative) parsedAmount = -parsedAmount;
                    
                    if (isNaN(parsedAmount) || parsedAmount === 0) return;

                    let assignedTo = null, splits = null;
                    const baseDesc = parsedDesc.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                    const pastTx = group.transactions?.find(t => t.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim() === baseDesc && (t.assignedTo || (t.splits && t.splits.length > 0)));
                    if (pastTx) { assignedTo = pastTx.assignedTo; splits = pastTx.splits ? [...pastTx.splits] : null; }

                    if (!assignedTo && (!splits || splits.length === 0) && sortedMembers) {
                        for (let member of sortedMembers) {
                            if (member.virtualCards) {
                                const cards = member.virtualCards.split(',').map(c => c.trim());
                                if (cards.some(card => parsedDesc.includes(card))) { assignedTo = member.id; break; }
                            }
                        }
                    }

                    const instMatch = parsedDesc.match(/\b(?:parcela\s+)?0?(\d{1,2})\s*(?:\/|de)\s*0?(\d{1,2})\b/i);
                    if (instMatch) {
                        const curr = parseInt(instMatch[1], 10); const total = parseInt(instMatch[2], 10);
                        const isDuplicate = group.transactions?.some(tx => tx.invoiceMonth === importInvoiceMonth && tx.description === parsedDesc && Math.abs(tx.amount - parsedAmount) < 0.01);
                        newTransactions.push({ id: crypto.randomUUID(), date: parsedDate, invoiceMonth: importInvoiceMonth, description: parsedDesc, amount: parsedAmount, assignedTo, splits, selected: !isDuplicate, isDuplicate, bank: importBank });

                        if (total > curr) {
                            for (let step = 1; step <= (total - curr); step++) {
                                const futureMonth = addInvoiceMonth(importInvoiceMonth, step);
                                const nextNum = curr + step;
                                const futureDesc = parsedDesc.replace(instMatch[0], `${nextNum.toString().padStart(instMatch[1].length, '0')}/${instMatch[2]}`);
                                const isFutureDupe = group.transactions?.some(tx => tx.invoiceMonth === futureMonth && tx.description === futureDesc && Math.abs(tx.amount - parsedAmount) < 0.01);
                                newTransactions.push({ id: crypto.randomUUID(), date: parsedDate, invoiceMonth: futureMonth, description: futureDesc, amount: parsedAmount, assignedTo, splits, selected: !isFutureDupe, isDuplicate: isFutureDupe, bank: importBank, isProjection: true });
                            }
                        }
                    } else {
                        const isDuplicate = group.transactions?.some(tx => tx.invoiceMonth === importInvoiceMonth && tx.description === parsedDesc && Math.abs(tx.amount - parsedAmount) < 0.01);
                        newTransactions.push({ id: crypto.randomUUID(), date: parsedDate, invoiceMonth: importInvoiceMonth, description: parsedDesc, amount: parsedAmount, assignedTo, splits, selected: !isDuplicate, isDuplicate, bank: importBank });
                    }
                };

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    if (line.includes(';') || line.includes(',')) {
                        const tokens = []; let inQuotes = false; let currentToken = '';
                        for(let char of line) { if(char === '"') { inQuotes = !inQuotes; } else if((char === ',' || char === ';') && !inQuotes) { tokens.push(currentToken.trim()); currentToken = ''; } else { currentToken += char; } }
                        tokens.push(currentToken.trim());
                        if (tokens.length >= 3) {
                            const dateMatch = line.match(/(\d{2}\/\d{2}(?:\/\d{2,4})?)/);
                            if(dateMatch) {
                                let valStr = tokens[tokens.length - 1];
                                if (!/[-0-9.,]+/.test(valStr) && tokens.length > 2) valStr = tokens[tokens.length - 2];
                                if(/[-0-9.,]+/.test(valStr)) {
                                    const dateStr = dateMatch[1];
                                    let descTokens = tokens.filter(t => t !== valStr && !t.includes(dateStr) && t.length > 1);
                                    let descStr = descTokens.join(' ').replace(/"/g, '').trim();
                                    processMatch(dateStr, descStr, valStr); continue;
                                }
                            }
                        }
                    }
                    const matchSingle = line.match(/^(\d{2}\/\d{2}(?:\/\d{2,4})?|\d{1,2}\s+(?:de\s+)?[a-zA-Z]{3}\.?\s*(?:\d{4})?)\s+(.*?)\s+(-?(?:R\$)?\s*[\d.,]+)$/i);
                    if (matchSingle) { processMatch(matchSingle[1], matchSingle[2], matchSingle[3]); continue; }
                    const tokens = line.trim().split(/\s+/);
                    if (tokens.length >= 3) {
                        const dateStr = tokens[0];
                        if (dateStr.match(/^\d{2}\/\d{2}/) || dateStr.match(/^\d{4}-\d{2}-\d{2}/)) {
                            const valStr = tokens[tokens.length - 1]; const descStr = tokens.slice(1, tokens.length - 1).join(' ');
                            if (/^[-R$\s]*[\d.,]+$/.test(valStr)) { processMatch(dateStr, descStr, valStr); continue; }
                        }
                    }
                }
                if (newTransactions.length > 0) setParsedPreview(newTransactions);
                else notify("Não reconheci compras. Verifique se escolheu o banco certo ou o formato.");
            };

            const handleConfirmParse = async () => {
                const itemsToAdd = parsedPreview.filter(tx => tx.selected && !tx.isDuplicate).map(({ selected, isDuplicate, ...rest }) => rest);
                await updateGroupData({ transactions: [...(group.transactions || []), ...itemsToAdd] });
                notify(`${itemsToAdd.length} lançamentos salvos!`);
                setPasteText(''); setParsedPreview(null); setIsParseModalOpen(false);
            };
            const previewCalculatedTotal = parsedPreview ? parsedPreview.filter(t => t.selected && !t.isProjection && t.invoiceMonth === importInvoiceMonth).reduce((acc, curr) => acc + curr.amount, 0) : 0;

            const handleToggleBulk = (id) => { setBulkSelections(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); };
            const handleSelectAll = () => { setBulkSelections(filteredTransactions.map(tx => tx.id)); };
            const handleBulkDelete = async () => {
                if(!window.confirm(`Excluir os ${bulkSelections.length} lançamentos selecionados?`)) return;
                const updated = group.transactions.filter(tx => !bulkSelections.includes(tx.id));
                await updateGroupData({ transactions: updated }); setBulkSelections([]); setIsSelectionMode(false); notify("Lançamentos excluídos!");
            };

            const [isAssignModalOpen, setIsAssignModalOpen] = useState(false);
            const [assignTx, setAssignTx] = useState(null);
            const [assignSelections, setAssignSelections] = useState([]);
            const [applyToFuture, setApplyToFuture] = useState(true);
            const [isCustomSplit, setIsCustomSplit] = useState(false);
            const [customSplitsValues, setCustomSplitsValues] = useState({});

            const applyCascadeUpdate = (txId, updates, shouldCascade) => {
                const targetTx = group.transactions.find(t => t.id === txId);
                if (!targetTx) return group.transactions;
                const baseDesc = targetTx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                const isInstallment = /\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(targetTx.description);

                return group.transactions.map(tx => {
                    if (tx.id === txId) return { ...tx, ...updates };
                    if (shouldCascade && isInstallment && tx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim() === baseDesc && Math.abs(Math.abs(tx.amount) - Math.abs(targetTx.amount)) < 0.01) {
                        let newDesc = tx.description;
                        if (updates.description) { const instMatch = tx.description.match(/\b(\d{1,2}\/\d{1,2})\b/); newDesc = updates.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim(); if (instMatch) newDesc += ` ${instMatch[1]}`; }
                        return { ...tx, ...updates, description: newDesc };
                    }
                    return tx;
                });
            };

            const handleSaveAssign = async () => {
                let assignedTo = null, splits = null;
                if (assignSelections.length === 1) { assignedTo = assignSelections[0]; } 
                else if (assignSelections.length > 1) {
                    if (isCustomSplit) { splits = assignSelections.map(memberId => ({ memberId, amount: parseFloat(customSplitsValues[memberId]) || 0 })); } 
                    else { splits = assignSelections.map(memberId => ({ memberId, amount: assignTx.amount / assignSelections.length })); }
                }
                const updated = applyCascadeUpdate(assignTx.id, { assignedTo, splits, description: assignTx.description, bank: assignTx.bank }, applyToFuture);
                await updateGroupData({ transactions: updated });
                setIsAssignModalOpen(false); notify(applyToFuture ? "Salvo em todas as parcelas!" : "Compra salva!");
            };

            const handleDeleteTransaction = async () => {
                if(!window.confirm("Deseja EXCLUIR esta compra?")) return;
                let updatedTransactions = group.transactions.filter(tx => tx.id !== assignTx.id);
                if (applyToFuture && /\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(assignTx.description)) {
                    const baseDesc = assignTx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                    updatedTransactions = updatedTransactions.filter(tx => { const isInst = /\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(tx.description); if (isInst && tx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim() === baseDesc && Math.abs(tx.amount - assignTx.amount) < 0.01) return false; return true; });
                }
                await updateGroupData({ transactions: updatedTransactions });
                setIsAssignModalOpen(false); notify("Excluído com sucesso!");
            };

            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [manualData, setManualData] = useState({ date: '', description: '', amount: '', installments: '1', bank: 'Outros' });
            const [manualSelections, setManualSelections] = useState([]);
            const [isManualCustomSplit, setIsManualCustomSplit] = useState(false);
            const [manualCustomSplitsValues, setManualCustomSplitsValues] = useState({});

            const handleAddManualTransaction = async (e) => {
                e.preventDefault(); if(!manualData.description || !manualData.amount) return;
                let assignedTo = null, splits = null;
                if (manualSelections.length === 1) { assignedTo = manualSelections[0]; } 
                else if (manualSelections.length > 1) {
                    if (isManualCustomSplit) { splits = manualSelections.map(mId => ({ memberId: mId, amount: parseFloat(manualCustomSplitsValues[mId]) || 0 })); } 
                    else { splits = manualSelections.map(mId => ({ memberId: mId, amount: parseFloat(manualData.amount) / manualSelections.length })); }
                }
                const baseDate = manualData.date || new Date().toLocaleDateString('pt-BR').substring(0,5);
                const startMonth = selectedInvoiceMonth !== 'Todos' ? selectedInvoiceMonth : getCurrentMonthStr();
                const installments = parseInt(manualData.installments) || 1;
                const newTxs = [];
                for (let i = 0; i < installments; i++) {
                    let desc = manualData.description; if (installments > 1) desc = `${desc} ${i+1}/${installments}`;
                    newTxs.push({ id: crypto.randomUUID(), date: baseDate, invoiceMonth: addInvoiceMonth(startMonth, i), description: desc, amount: parseFloat(manualData.amount), assignedTo: assignedTo, splits: splits, bank: manualData.bank });
                }
                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                setIsManualModalOpen(false); setManualData({ date: '', description: '', amount: '', installments: '1', bank: 'Outros' }); setManualSelections([]); setIsManualCustomSplit(false); setManualCustomSplitsValues({}); notify("Lançamento salvo!");
            };

            const [isLoanModalOpen, setIsLoanModalOpen] = useState(false);
            const [loanData, setLoanData] = useState({ description: '', memberId: '', amount: '', installments: '1', dueDate: '' });
            const handleAddLoan = async (e) => {
                e.preventDefault(); if(!loanData.memberId || !loanData.amount) return;
                const startMonth = selectedInvoiceMonth !== 'Todos' ? selectedInvoiceMonth : getCurrentMonthStr();
                const installments = parseInt(loanData.installments) || 1;
                const dateStr = `${loanData.dueDate.padStart(2, '0')}/${startMonth.split('/')[0]}`;
                const newTxs = [];
                for (let i = 0; i < installments; i++) {
                    let desc = loanData.description; if (installments > 1) desc += ` ${i+1}/${installments}`;
                    newTxs.push({ id: crypto.randomUUID(), date: dateStr, invoiceMonth: addInvoiceMonth(startMonth, i), description: desc, amount: parseFloat(loanData.amount), assignedTo: loanData.memberId, splits: null, bank: 'Empréstimo' });
                }
                await updateGroupData({ transactions: [...(group.transactions || []), ...newTxs] });
                setIsLoanModalOpen(false); setLoanData({ description: '', memberId: '', amount: '', installments: '1', dueDate: '' }); notify("Empréstimo salvo!");
            };

            const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
            const [paymentData, setPaymentData] = useState({ memberId: '', amount: '', remainingBalance: 0, date: '' });
            const handleAddPayment = async (e) => {
                e.preventDefault(); if(!paymentData.memberId || !paymentData.amount) return;
                const newPayment = { id: crypto.randomUUID(), memberId: paymentData.memberId, amount: parseFloat(paymentData.amount), date: new Date().toLocaleDateString('pt-BR'), month: selectedInvoiceMonth !== 'Todos' ? selectedInvoiceMonth : getCurrentMonthStr() };
                await updateGroupData({ payments: [...(group.payments || []), newPayment] });
                setIsPaymentModalOpen(false); setPaymentData({ memberId: '', amount: '', remainingBalance: 0, date: '' }); notify("Pagamento registrado!");
            };
            const handleDeletePayment = async (paymentId) => {
                if(!window.confirm("Apagar este recebimento? O valor voltará para a dívida.")) return;
                const updated = (group.payments || []).filter(p => p.id !== paymentId);
                await updateGroupData({ payments: updated }); notify("Recebimento apagado!");
            };

            const { totals, paid } = useMemo(() => {
                const t = { unassigned: 0 }, p = {};
                sortedMembers.forEach(m => { t[m.id] = 0; p[m.id] = 0; });
                const allMonthTxs = group.transactions?.filter(tx => tx.invoiceMonth === selectedInvoiceMonth) || [];
                allMonthTxs.forEach(tx => {
                    if (tx.splits?.length > 0) {
                        let alloc = 0; tx.splits.forEach(s => { if (t[s.memberId] !== undefined) { t[s.memberId] += s.amount; alloc += s.amount; } });
                        if (Math.abs(tx.amount - alloc) > 0.02) t.unassigned += (tx.amount - alloc);
                    } else if (tx.assignedTo && t[tx.assignedTo] !== undefined) t[tx.assignedTo] += tx.amount;
                    else t.unassigned += tx.amount;
                });
                group.payments?.filter(x => x.month === selectedInvoiceMonth).forEach(x => { if (p[x.memberId] !== undefined) p[x.memberId] += x.amount; });
                return { totals: t, paid: p };
            }, [group, sortedMembers, selectedInvoiceMonth]);

            const handleAnticipate = async (txsToAnticipate) => {
                if(!window.confirm(`Puxar estas ${txsToAnticipate.length} parcelas para a fatura atual?`)) return;
                const ids = txsToAnticipate.map(t => t.id);
                const updated = group.transactions.map(tx => ids.includes(tx.id) ? { ...tx, invoiceMonth: selectedInvoiceMonth } : tx);
                await updateGroupData({ transactions: updated }); notify("Parcelas antecipadas!");
            };
            
            const groupedAnticipations = useMemo(() => {
                const targetDate = parseMonthStr(selectedInvoiceMonth);
                const futureTxs = (group.transactions || []).filter(tx => { if (!tx.assignedTo && (!tx.splits || tx.splits.length === 0)) return false; if (!/\b\d{1,2}\/\d{1,2}\b/.test(tx.description)) return false; return parseMonthStr(tx.invoiceMonth) > targetDate; });
                const groups = {};
                futureTxs.forEach(tx => {
                    const baseDesc = tx.description.replace(/\s*\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/ig, '').trim();
                    const key = `${baseDesc}_${tx.assignedTo || 'split'}_${tx.amount}`;
                    if (!groups[key]) { let memberName = "Rateio"; if (tx.assignedTo) memberName = sortedMembers.find(m => m.id === tx.assignedTo)?.name || "Desconhecido"; groups[key] = { baseDesc, amount: tx.amount, memberName, txs: [], totalValue: 0 }; }
                    groups[key].txs.push(tx); groups[key].totalValue += tx.amount;
                });
                return groups;
            }, [group.transactions, selectedInvoiceMonth, sortedMembers]);

            return (
                <div className="pb-24">
                    <div className="bg-indigo-600 p-4 rounded-b-3xl shadow-lg mb-4 text-white text-center">
                        <h1 className="text-lg font-black tracking-tight">Painel Administrador</h1>
                    </div>
                    <div className="max-w-4xl mx-auto px-3 space-y-4">
                        <div className="flex bg-gray-200/60 p-1 rounded-xl overflow-x-auto hide-scroll text-[11px]">
                            <button onClick={() => setActiveTab('transactions')} className={`flex-1 px-2 py-2 rounded-lg font-bold whitespace-nowrap ${activeTab === 'transactions' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Extrato</button>
                            <button onClick={() => setActiveTab('loans')} className={`flex-1 px-2 py-2 rounded-lg font-bold whitespace-nowrap ${activeTab === 'loans' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Empréstimos</button>
                            <button onClick={() => setActiveTab('anticipations')} className={`flex-1 px-2 py-2 rounded-lg font-bold whitespace-nowrap ${activeTab === 'anticipations' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Antecipar</button>
                            <button onClick={() => setActiveTab('summary')} className={`flex-1 px-2 py-2 rounded-lg font-bold whitespace-nowrap ${activeTab === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Resumo</button>
                            <button onClick={() => setActiveTab('settings')} className={`flex-1 px-2 py-2 rounded-lg font-bold whitespace-nowrap ${activeTab === 'settings' ? 'bg-white text-indigo-700 shadow-sm' : 'text-gray-500'}`}>Config</button>
                        </div>

                        {(activeTab === 'transactions' || activeTab === 'summary' || activeTab === 'anticipations') && (
                            <div className="flex gap-1.5 flex-col sm:flex-row">
                                <div className="flex gap-1.5 flex-1">
                                    <select value={selectedInvoiceMonth} onChange={e => setSelectedInvoiceMonth(e.target.value)} className="flex-1 bg-white border border-gray-300 text-indigo-900 font-black rounded-lg px-2 py-2 text-[11px] shadow-sm outline-none text-center">
                                        {availableInvoiceMonths.map(m => <option key={m} value={m}>{m === 'Todos' ? 'Mostrar Todos' : `Fatura ${m}`}</option>)}
                                    </select>
                                    <select value={selectedBankFilter} onChange={e => setSelectedBankFilter(e.target.value)} className="flex-1 bg-white border border-gray-300 text-gray-900 font-bold rounded-lg px-2 py-2 text-[11px] shadow-sm outline-none text-center">
                                        <option value="Todos">Bancos (Todos)</option><option value="Nubank">Nubank</option><option value="Inter">Inter</option><option value="Mercado Pago">Mercado Pago</option>
                                    </select>
                                </div>
                                <button onClick={toggleMonthStatus} disabled={selectedInvoiceMonth === 'Todos'} className={`sm:w-auto w-full py-2 px-2 rounded-lg font-black text-[10px] flex items-center justify-center gap-1 transition-colors ${selectedInvoiceMonth === 'Todos' ? 'opacity-50 cursor-not-allowed bg-gray-100 text-gray-400 border-gray-200' : isMonthClosed ? 'bg-green-100 text-green-700 border border-green-300 shadow-sm' : 'bg-yellow-100 text-yellow-700 border border-yellow-300 shadow-sm'}`}>
                                    {selectedInvoiceMonth === 'Todos' ? <><Icon name="minus" className="w-3.5 h-3.5"/> Indisponível</> : isMonthClosed ? <><Icon name="lock" className="w-3.5 h-3.5"/> Fechada</> : <><Icon name="unlock" className="w-3.5 h-3.5"/> Aberta</>}
                                </button>
                            </div>
                        )}

                        {activeTab === 'transactions' && (
                            <div className="fade-in space-y-2">
                                <div className="bg-indigo-50 border border-indigo-100 p-2.5 rounded-xl flex justify-between items-center shadow-sm">
                                    <span className="text-indigo-900 font-bold text-[10px] uppercase">Cartão no Mês:</span>
                                    <span className={`text-xl font-black ${totalFiltered < 0 ? 'text-green-600' : 'text-indigo-600'}`}>{formatMoney(totalFiltered)}</span>
                                </div>
                                <div className="flex gap-1.5">
                                    <button onClick={() => setIsParseModalOpen(true)} className="flex-[2] bg-gray-900 text-white py-2 px-2 rounded-lg font-black shadow-md flex items-center justify-center gap-1.5 text-[10px] hover:bg-black"><Icon name="file-text" className="w-3.5 h-3.5" /> PDF / CSV</button>
                                    <button onClick={() => setIsManualModalOpen(true)} className="flex-1 bg-indigo-100 text-indigo-700 border border-indigo-200 py-2 px-2 rounded-lg font-black shadow-sm flex items-center justify-center gap-1 text-[10px] hover:bg-indigo-200"><Icon name="plus" className="w-3.5 h-3.5" /> Manual</button>
                                </div>
                                <div className="flex justify-between items-center mt-1 px-1">
                                    <button onClick={() => { setIsSelectionMode(!isSelectionMode); setBulkSelections([]); }} className="text-[9px] font-bold text-gray-500 bg-gray-100 px-2 py-1.5 rounded-md"><Icon name="check-square" className="w-3 h-3 inline" /> {isSelectionMode ? 'Ocultar Seleção' : 'Selecionar Vários'}</button>
                                    {isSelectionMode && <button onClick={handleSelectAll} className="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-2 py-1.5 rounded-md">Selecionar Tudo</button>}
                                </div>
                                {isSelectionMode && bulkSelections.length > 0 && (
                                    <div className="bg-red-50 border border-red-200 p-2 rounded-lg flex justify-between items-center sticky top-2 z-10 shadow-sm"><span className="text-red-700 text-[9px] font-bold px-2">{bulkSelections.length} sel.</span><button onClick={handleBulkDelete} className="bg-red-600 text-white text-[9px] font-bold py-1.5 px-2 rounded-md shadow-sm"><Icon name="trash-2" className="w-3 h-3 inline"/> Excluir</button></div>
                                )}
                                <div className="space-y-1">
                                    {pendingTxs.length > 0 && <div className="text-[9px] font-black text-red-600 uppercase mt-2 mb-1 pl-1 flex items-center gap-1"><div className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div> Pendentes ({pendingTxs.length})</div>}
                                    {pendingTxs.map(tx => (
                                        <div key={tx.id} onClick={() => { setAssignTx(tx); setAssignSelections([]); setIsCustomSplit(false); setCustomSplitsValues({}); setIsAssignModalOpen(true); }} className="bg-white p-1.5 rounded-lg shadow-sm border border-transparent hover:border-indigo-300 cursor-pointer flex justify-between items-center">
                                            <div className="flex gap-1.5 items-center overflow-hidden">
                                                {isSelectionMode && <input type="checkbox" checked={bulkSelections.includes(tx.id)} onChange={() => handleToggleBulk(tx.id)} onClick={e=>e.stopPropagation()} className="w-3.5 h-3.5 text-indigo-600 rounded shrink-0" />}
                                                <div className="w-6 h-6 bg-gray-50 border rounded-md flex items-center justify-center text-gray-500 text-[7px] font-black shrink-0">{tx.date.substring(0,5)}</div>
                                                <div className="truncate pr-1"><p className="font-bold text-gray-900 truncate text-[9px]">{tx.description}</p><div className="flex mt-0.5"><span className={`text-[6px] font-bold px-1 py-0.5 rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span></div></div>
                                            </div>
                                            <span className={`font-black text-[9px] shrink-0 ${tx.amount < 0 ? 'text-green-500' : 'text-indigo-600'}`}>{formatMoney(tx.amount)}</span>
                                        </div>
                                    ))}
                                    {completedTxs.length > 0 && <div className="text-[9px] font-black text-green-700 uppercase mt-2 mb-1 pl-1 border-t pt-2 flex items-center gap-1"><div className="w-1.5 h-1.5 rounded-full bg-green-500"></div> Prontos ({completedTxs.length})</div>}
                                    {completedTxs.map(tx => (
                                        <div key={tx.id} className="bg-gray-50 p-1.5 rounded-lg border border-gray-200 flex justify-between items-center cursor-pointer" onClick={() => { setAssignTx(tx); setAssignSelections(tx.splits ? tx.splits.map(s=>s.memberId) : [tx.assignedTo]); setIsCustomSplit(!!tx.splits); const vals = {}; if(tx.splits) tx.splits.forEach(s => vals[s.memberId] = s.amount); setCustomSplitsValues(vals); setIsAssignModalOpen(true); }}>
                                            <div className="flex gap-1.5 items-center overflow-hidden">
                                                {isSelectionMode && <input type="checkbox" checked={bulkSelections.includes(tx.id)} onChange={() => handleToggleBulk(tx.id)} onClick={e=>e.stopPropagation()} className="w-3.5 h-3.5 text-indigo-600 rounded shrink-0" />}
                                                <div className="w-5 h-5 bg-white border rounded-md flex items-center justify-center text-gray-400 text-[6px] font-black shrink-0">{tx.date.substring(0,5)}</div>
                                                <div className="truncate pr-1"><p className="font-bold text-gray-700 truncate text-[8px]">{tx.description}</p><div className="flex items-center gap-1 mt-0.5"><span className={`text-[6px] font-bold px-1 py-px rounded border ${getBankStyle(tx.bank)}`}>{tx.bank}</span><span className="text-[6px] text-gray-500 font-bold truncate"><Icon name="check-circle" className="w-2 h-2 text-green-500 inline mr-0.5" />{tx.splits?.length > 0 ? `Rateio` : sortedMembers?.find(m => m.id === tx.assignedTo)?.name}</span></div></div>
                                            </div>
                                            <span className={`font-black text-[8px] shrink-0 ${tx.amount < 0 ? 'text-green-600' : 'text-gray-900'}`}>{formatMoney(tx.amount)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'summary' && (
                            <div className="fade-in space-y-2">
                                {(totals.unassigned > 0.05 || totals.unassigned < -0.05) && (
                                    <div className="p-2 bg-red-500/10 border border-red-500/30 rounded-xl text-center"><span className="font-bold text-red-700 text-[8px] tracking-widest block">SEM DONO</span><span className="font-black text-sm text-red-600">{formatMoney(totals.unassigned)}</span></div>
                                )}
                                {sortedMembers?.map(m => {
                                    const grandTotal = totals[m.id] - paid[m.id];
                                    const zapUrl = `https://wa.me/?text=${encodeURIComponent(`Fatura ${selectedInvoiceMonth}: Total da sua parte é ${formatMoney(totals[m.id])}. Falta: *${formatMoney(grandTotal)}*.`)}`;
                                    const mPayments = group.payments?.filter(x => x.memberId === m.id && x.month === selectedInvoiceMonth) || [];
                                    return (
                                        <div key={m.id} className="bg-white p-2.5 rounded-xl shadow-sm border">
                                            <div className="flex justify-between items-center mb-2 border-b pb-1.5"><div className="flex gap-2 items-center"><div className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-black text-[8px]">{m.name.charAt(0)}</div><h3 className="font-black text-[11px]">{m.name}</h3></div><div className="flex gap-1"><button onClick={() => { setPaymentData({...paymentData, memberId: m.id, remainingBalance: grandTotal}); setIsPaymentModalOpen(true); }} className="px-2 py-1 bg-green-50 text-green-700 rounded-md font-bold text-[8px] border border-green-200"><Icon name="dollar-sign" className="w-2.5 h-2.5 inline"/> Receber</button><a href={zapUrl} target="_blank" className="px-2 py-1 bg-gray-100 text-gray-700 rounded-md font-bold text-[8px] border"><Icon name="message-circle" className="w-2.5 h-2.5 inline"/> Cobrar</a></div></div>
                                            <div className="flex justify-between text-[9px] font-medium text-gray-500 mb-1"><span>Total (Cartão+Emp):</span> <span>{formatMoney(totals[m.id])}</span></div>
                                            <div className="bg-gray-50 p-1.5 rounded-lg flex justify-between items-center mt-1 border"><span className="text-[8px] font-black uppercase text-gray-500">Falta Pagar</span><span className={`text-[11px] font-black ${grandTotal <= 0 ? 'text-green-600' : 'text-gray-900'}`}>{formatMoney(grandTotal)}</span></div>
                                            {mPayments.length > 0 && (
                                                <div className="mt-1.5 bg-green-50/50 p-1.5 rounded-lg border border-green-100"><p className="text-[7px] font-bold text-green-800 uppercase mb-1">Pagamentos Salvos</p>{mPayments.map(p => (<div key={p.id} className="flex justify-between items-center bg-white p-1 rounded border border-green-100 mb-0.5"><span className="text-[7px] text-gray-500">{p.date}</span><div className="flex items-center gap-1.5"><span className="text-[8px] font-black text-green-700">{formatMoney(p.amount)}</span><button onClick={() => handleDeletePayment(p.id)} className="text-red-400 hover:text-red-600 bg-red-50 rounded px-1"><Icon name="trash-2" className="w-2 h-2"/></button></div></div>))}</div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {activeTab === 'loans' && (
                            <div className="fade-in space-y-2">
                                <div className="bg-emerald-50 border border-emerald-200 p-2 rounded-xl"><p className="text-emerald-800 text-[9px] font-bold text-center">Soma direto no "Resumo". Não suja o Extrato.</p></div>
                                <button onClick={() => setIsLoanModalOpen(true)} className="w-full bg-emerald-600 text-white p-2 rounded-lg font-black text-[10px] shadow-sm"><Icon name="plus-circle" className="w-3.5 h-3.5 inline" /> Adicionar Empréstimo</button>
                                {group.transactions?.filter(tx => tx.bank === 'Empréstimo' && tx.invoiceMonth === selectedInvoiceMonth).map(tx => { const m = sortedMembers?.find(x => x.id === tx.assignedTo); return ( <div key={tx.id} className="bg-white p-2 rounded-lg border border-emerald-100 flex flex-col relative"><button onClick={() => { if(window.confirm("Apagar?")) updateGroupData({transactions: group.transactions.filter(t => t.id !== tx.id)}); }} className="absolute top-1 right-1 p-1 text-red-400"><Icon name="trash-2" className="w-3 h-3"/></button><div className="flex gap-1.5 items-center"><div className="w-4 h-4 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-black text-[7px]">{m?.name.charAt(0)}</div><span className="font-bold text-gray-800 text-[9px]">{m?.name}</span></div><h3 className="font-black text-[9px] text-gray-900 mt-1">{tx.description}</h3><span className="font-black text-emerald-600 text-[10px]">{formatMoney(tx.amount)}</span></div> ) })}
                            </div>
                        )}

                        {activeTab === 'anticipations' && (
                            <div className="fade-in space-y-2">
                                {Object.keys(groupedAnticipations).length === 0 ? <p className="text-center text-gray-400 text-[10px]">Sem parcelas futuras.</p> : Object.values(groupedAnticipations).map((item, idx) => ( <div key={idx} className="bg-white p-2 rounded-lg border shadow-sm"><div className="flex justify-between items-start mb-1"><div><h3 className="font-black text-gray-800 text-[10px]">{item.baseDesc}</h3><span className="text-[8px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded mt-0.5 inline-block">{item.memberName}</span></div><span className="font-black text-indigo-600 text-[11px]">{formatMoney(item.totalValue)}</span></div><p className="text-[8px] text-gray-500 mb-2">Faltam {item.txs.length} parcelas.</p><button onClick={() => handleAnticipate(item.txs)} className="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 py-1.5 rounded-md font-bold text-[9px]"><Icon name="fast-forward" className="w-2.5 h-2.5 inline"/> Antecipar Tudo</button></div> ))}
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="fade-in space-y-2">
                                <div className="bg-white p-2 rounded-xl border"><form onSubmit={async (e) => { e.preventDefault(); const n = e.target.name.value.trim(), c = e.target.virtualCards.value.trim(); if(n) { await updateGroupData({ members: [...(group.members || []), { id: crypto.randomUUID(), name: n, virtualCards: c, accessCode: generateCode() }] }); e.target.reset(); notify("Familiar salvo!"); } }} className="flex flex-col gap-1.5"><input name="name" placeholder="Nome" className="p-2 bg-gray-50 border rounded-lg font-bold text-[10px] outline-none" required /><input name="virtualCards" placeholder="Finais Cartões (Ex: 3163, 6818)" className="p-2 bg-gray-50 border rounded-lg font-bold text-[10px] outline-none" /><button className="bg-indigo-600 text-white p-2 rounded-lg font-bold text-[10px]">Salvar Familiar</button></form></div>
                                <div className="grid grid-cols-2 gap-1.5">{sortedMembers?.map(m => ( <div key={m.id} className="bg-white p-1.5 rounded-lg border flex flex-col items-center text-center relative"><button onClick={async()=>{if(window.confirm("Apagar?")) await updateGroupData({ members: group.members.filter(x => x.id !== m.id) });}} className="absolute top-0 right-0 p-1 text-red-400"><Icon name="trash-2" className="w-2.5 h-2.5" /></button><div className="w-5 h-5 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-black text-[8px] mb-0.5">{m.name.charAt(0)}</div><span className="font-bold text-gray-800 text-[8px] truncate w-full">{m.name}</span>{m.virtualCards && <span className="text-[6px] bg-gray-100 rounded px-1 mt-0.5">{m.virtualCards}</span>}<span className="font-mono font-black text-indigo-600 bg-indigo-50 px-1 py-0.5 rounded text-[7px] mt-1 border border-indigo-100">{m.accessCode || 'SEM CÓDIGO'}</span></div> ))}</div>
                            </div>
                        )}
                    </div>

                    <Modal isOpen={isParseModalOpen} onClose={() => setIsParseModalOpen(false)} title="Importar Extrato PDF/CSV">
                        {!parsedPreview ? (
                            <div className="space-y-2">
                                <div className="flex gap-1.5"><div className="flex-1"><label className="text-[8px] font-bold text-gray-500 uppercase">Fatura</label><input type="text" className="w-full p-1.5 border rounded-lg font-black bg-indigo-50 text-center text-[10px] outline-none" value={importInvoiceMonth} onChange={e=>setImportInvoiceMonth(e.target.value)} /></div><div className="flex-1"><label className="text-[8px] font-bold text-gray-500 uppercase">Qual Banco?</label><select className="w-full p-1.5 border rounded-lg font-black bg-indigo-50 text-center text-[10px] outline-none" value={importBank} onChange={e=>setImportBank(e.target.value)}><option value="Nubank">Nubank</option><option value="Inter">Inter</option><option value="Mercado Pago">Mercado Pago</option><option value="Outros">Outros</option></select></div></div>
                                <label className="w-full bg-gray-900 text-white py-2 rounded-lg font-black text-center flex items-center justify-center gap-1 cursor-pointer shadow-sm text-[10px]"><Icon name="file-text" className="w-3.5 h-3.5"/> ARQUIVO (.pdf ou .csv) <input type="file" accept=".pdf,.csv" className="hidden" onChange={handleFileUpload} /></label>
                                <textarea className="w-full h-16 p-1.5 border rounded-lg text-[8px] font-mono bg-gray-50 outline-none resize-none" placeholder="Ou cole o texto..." value={pasteText} onChange={e=>setPasteText(e.target.value)}></textarea>
                                <button onClick={analyzeTextCore} className="w-full bg-indigo-600 text-white py-2 rounded-lg font-black text-[10px]">Analisar</button>
                            </div>
                        ) : (
                            <div className="flex flex-col max-h-[60vh]">
                                <div className="bg-blue-50 border border-blue-200 rounded-lg p-1.5 mb-1.5 text-center"><span className="text-[7px] font-bold text-blue-700 uppercase">Total Lido (Só Mês Atual)</span><div className="text-[13px] font-black text-blue-900">{formatMoney(previewCalculatedTotal)}</div></div>
                                <div className="overflow-y-auto custom-scroll flex-1 divide-y border rounded-lg mb-1.5 bg-white">{parsedPreview.map((tx, i) => ( <div key={i} className={`p-1 flex justify-between items-center cursor-pointer ${!tx.selected ? 'bg-gray-100 opacity-50' : ''}`} onClick={() => { const up=[...parsedPreview]; up[i].selected=!up[i].selected; setParsedPreview(up); }}><div className="flex gap-1 items-center overflow-hidden"><input type="checkbox" checked={tx.selected} readOnly className="w-2.5 h-2.5 rounded shrink-0" /><div className="truncate"><span className="font-bold text-gray-900 text-[8px]">{tx.description}</span><div className="flex gap-1 mt-0.5"><span className="text-[6px] font-bold px-1 rounded border">{tx.bank}</span>{tx.isProjection && <span className="text-[6px] text-blue-600 bg-blue-50 border px-1 rounded">Futuro</span>}</div></div></div><span className="font-black text-[8px] shrink-0 ml-1">{formatMoney(tx.amount)}</span></div> ))}</div>
                                <button onClick={handleConfirmParse} className="w-full bg-green-600 text-white py-2 rounded-lg font-black text-[10px] shrink-0">Salvar Selecionados</button>
                            </div>
                        )}
                    </Modal>

                    <Modal isOpen={isManualModalOpen} onClose={() => setIsManualModalOpen(false)} title="Manual">
                        <form onSubmit={handleAddManualTransaction} className="space-y-1.5"><input type="text" placeholder="Nome" className="w-full p-1.5 border rounded-lg font-bold text-[10px] bg-gray-50 outline-none" value={manualData.description} onChange={e=>setManualData({...manualData, description:e.target.value})} required /><div className="flex gap-1.5"><input type="number" step="0.01" placeholder="Valor" className="flex-[2] p-1.5 border rounded-lg font-bold text-[10px] bg-gray-50 outline-none" value={manualData.amount} onChange={e=>setManualData({...manualData, amount:e.target.value})} required /><input type="text" placeholder="DD/MM" className="flex-1 p-1.5 border rounded-lg font-bold text-[10px] bg-gray-50 outline-none text-center" value={manualData.date} onChange={e=>setManualData({...manualData, date:e.target.value})} /></div><div className="flex gap-1.5"><select className="flex-1 p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50 outline-none" value={manualData.bank} onChange={e=>setManualData({...manualData, bank:e.target.value})}><option value="Outros">Qual Cartão?</option><option value="Nubank">Nubank</option><option value="Inter">Inter</option><option value="Mercado Pago">Mercado Pago</option></select><input type="number" placeholder="Parcelas" className="flex-1 p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50 outline-none" value={manualData.installments} onChange={e=>setManualData({...manualData, installments:e.target.value})} /></div><div className="flex flex-wrap gap-1 justify-center mt-1">{sortedMembers?.map(m => { const isSel = manualSelections.includes(m.id); return <div key={m.id} onClick={() => setManualSelections(isSel ? manualSelections.filter(id=>id!==m.id) : [...manualSelections, m.id])} className={`px-2 py-1 border-2 rounded-md cursor-pointer text-[7px] font-bold ${isSel ? 'border-indigo-600 bg-indigo-50 text-indigo-900' : 'border-gray-100 text-gray-500'}`}>{m.name}</div> })}</div>{manualSelections.length > 1 && ( <div className="p-1 bg-gray-50 border rounded-lg"><label className="flex items-center gap-1 text-[7px] font-bold"><input type="checkbox" checked={isManualCustomSplit} onChange={e=>setIsManualCustomSplit(e.target.checked)} className="w-2.5 h-2.5 rounded" /> Valores Manuais</label>{isManualCustomSplit && manualSelections.map(mId => ( <div key={mId} className="flex justify-between items-center bg-white p-1 border rounded mb-0.5"><span className="text-[7px] font-bold">{sortedMembers.find(m=>m.id===mId)?.name}</span><input type="number" step="0.01" value={manualCustomSplitsValues[mId]||''} onChange={e=>setManualCustomSplitsValues({...manualCustomSplitsValues, [mId]:e.target.value})} className="w-12 p-0.5 border rounded text-[7px] font-bold text-right" placeholder="0.00" /></div> ))}</div> )}<button type="submit" className="w-full bg-indigo-600 text-white py-1.5 rounded-lg font-black text-[10px]">Salvar</button></form>
                    </Modal>

                    <Modal isOpen={isAssignModalOpen} onClose={() => setIsAssignModalOpen(false)} title="Detalhes">
                        {assignTx && (
                            <div className="space-y-1.5"><div className="flex gap-1.5 mb-1"><button onClick={handleDeleteTransaction} className="bg-red-50 text-red-600 border border-red-200 py-1 px-2 rounded-lg font-black text-[8px] flex items-center gap-1"><Icon name="trash-2" className="w-2.5 h-2.5"/> Excluir</button><button onClick={handleSaveAssign} className="flex-1 bg-green-600 text-white py-1 px-2 rounded-lg font-black text-[8px] flex items-center justify-center gap-1"><Icon name="check-circle" className="w-2.5 h-2.5"/> SALVAR DONO</button></div><div className="bg-gray-50 p-1.5 rounded-lg border shadow-inner"><input type="text" value={assignTx.description} onChange={(e) => setAssignTx({...assignTx, description: e.target.value})} className="font-bold text-gray-900 w-full bg-white border border-gray-200 rounded p-1 outline-none text-[8px] mb-1" /><div className="flex justify-between items-center"><select value={assignTx.bank||'Outros'} onChange={(e) => setAssignTx({...assignTx, bank: e.target.value})} className="font-bold text-gray-900 bg-white border rounded p-0.5 outline-none text-[7px]"><option value="Outros">Outros</option><option value="Nubank">Nubank</option><option value="Inter">Inter</option></select><div className={`text-[9px] font-black ${assignTx.amount < 0 ? 'text-green-600' : 'text-indigo-600'}`}>{formatMoney(assignTx.amount)}</div></div></div><div className="flex flex-wrap gap-1 justify-center mt-1">{sortedMembers?.map(m => { const isSel = assignSelections.includes(m.id); return <div key={m.id} onClick={() => setAssignSelections(isSel ? assignSelections.filter(id=>id!==m.id) : [...assignSelections, m.id])} className={`px-2 py-0.5 border-2 rounded-md cursor-pointer text-[7px] font-bold ${isSel ? 'border-indigo-600 bg-indigo-50 text-indigo-900' : 'border-gray-100 text-gray-500'}`}>{m.name}</div> })}</div>{assignSelections.length > 1 && ( <div className="p-1 bg-gray-50 border rounded-lg"><label className="flex items-center gap-1 text-[7px] font-bold"><input type="checkbox" checked={isCustomSplit} onChange={e=>setIsCustomSplit(e.target.checked)} className="w-2 h-2 rounded" /> Rateio Personalizado</label>{isCustomSplit && assignSelections.map(mId => ( <div key={mId} className="flex justify-between items-center bg-white p-1 border rounded mb-0.5"><span className="text-[7px] font-bold">{sortedMembers.find(m=>m.id===mId)?.name}</span><input type="number" step="0.01" value={customSplitsValues[mId]||''} onChange={e=>setCustomSplitsValues({...customSplitsValues, [mId]:e.target.value})} className="w-12 p-0.5 border rounded text-[7px] font-bold text-right" placeholder="0.00" /></div> ))}</div> )}{/\b(?:parcela\s+)?\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b/i.test(assignTx.description) && ( <label className="flex items-center gap-1 p-1 bg-blue-50 text-blue-800 rounded-lg cursor-pointer font-bold text-[7px] border"><input type="checkbox" checked={applyToFuture} onChange={e=>setApplyToFuture(e.target.checked)} className="w-2.5 h-2.5 rounded" /> Alterar futuras</label> )}</div>
                        )}
                    </Modal>

                    <Modal isOpen={isLoanModalOpen} onClose={() => setIsLoanModalOpen(false)} title="Adicionar Empréstimo">
                        <form onSubmit={handleAddLoan} className="space-y-1.5"><input type="text" placeholder="Motivo" className="w-full p-1.5 border rounded-lg font-bold text-[10px] bg-gray-50" value={loanData.description} onChange={e=>setLoanData({...loanData, description:e.target.value})} required /><div className="flex gap-1.5"><input type="number" step="0.01" placeholder="Valor" className="flex-[2] p-1.5 border rounded-lg font-bold text-[10px] bg-gray-50" value={loanData.amount} onChange={e=>setLoanData({...loanData, amount:e.target.value})} required /><input type="text" placeholder="DD" className="flex-1 p-1.5 border rounded-lg font-bold text-[10px] bg-gray-50 text-center" value={loanData.dueDate} onChange={e=>setLoanData({...loanData, dueDate:e.target.value})} required /></div><div className="flex gap-1.5"><select className="flex-[2] p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50" value={loanData.memberId} onChange={e=>setLoanData({...loanData, memberId:e.target.value})} required><option value="">Quem pegou?</option>{sortedMembers?.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}</select><input type="number" placeholder="Parcelas" className="flex-1 p-1.5 border rounded-lg font-bold text-[9px] bg-gray-50" value={loanData.installments} onChange={e=>setLoanData({...loanData, installments:e.target.value})} /></div><button type="submit" className="w-full bg-emerald-600 text-white py-1.5 rounded-lg font-black text-[10px]">Salvar</button></form>
                    </Modal>
                    
                    <Modal isOpen={isPaymentModalOpen} onClose={() => setIsPaymentModalOpen(false)} title="Receber">
                        <form onSubmit={handleAddPayment} className="space-y-1.5"><div className="p-1.5 bg-green-50 border border-green-200 rounded-lg text-center"><p className="text-[8px] text-green-800 font-bold">De: <span className="text-[10px] font-black">{sortedMembers?.find(m => m.id === paymentData.memberId)?.name}</span></p></div>{paymentData.remainingBalance > 0.02 && ( <button type="button" onClick={() => setPaymentData({...paymentData, amount: paymentData.remainingBalance.toFixed(2)})} className="w-full bg-indigo-600 text-white py-1.5 rounded-lg text-[9px] font-bold flex items-center justify-center gap-1"><Icon name="check-circle" className="w-2.5 h-2.5"/> Quitar Restante ({formatMoney(paymentData.remainingBalance)})</button> )}<input type="number" step="0.01" placeholder="Outro Valor" className="w-full p-1.5 border rounded-lg font-black text-[11px] text-center bg-gray-50 outline-none" value={paymentData.amount} onChange={e=>setPaymentData({...paymentData, amount:e.target.value})} required /><button type="submit" className="w-full bg-green-600 text-white py-1.5 rounded-lg font-black text-[10px]">Confirmar Recebimento</button></form>
                    </Modal>
                </div>
            );
        };

        const MemberDashboard = ({ group, memberCode, onLogout }) => {
            const member = group.members.find(m => m.accessCode === memberCode);
            const myTxs = group.transactions?.filter(tx => tx.assignedTo === member.id || tx.splits?.some(s=>s.memberId === member.id)) || [];
            
            const monthSummaries = useMemo(() => {
                const available = [...new Set(myTxs.map(t => t.invoiceMonth))].sort((a,b) => parseMonthStr(a) - parseMonthStr(b));
                const currentMonthDate = parseMonthStr(getCurrentMonthStr());
                return available.map(month => {
                    const txs = myTxs.filter(t => t.invoiceMonth === month);
                    const total = txs.reduce((acc, curr) => acc + (curr.splits ? curr.splits.find(s=>s.memberId===member.id).amount : curr.amount), 0);
                    const paid = group.payments?.filter(p => p.memberId === member.id && p.month === month).reduce((acc, curr) => acc + curr.amount, 0) || 0;
                    return { month, rest: total - paid };
                }).filter(summary => { const isPast = parseMonthStr(summary.month) < currentMonthDate; return !isPast || summary.rest > 0.05; });
            }, [myTxs, group.payments, member.id]);

            const [selectedMonth, setSelectedMonth] = useState(() => { const curr = getCurrentMonthStr(); return monthSummaries.find(m => m.month === curr) ? curr : (monthSummaries[0]?.month || ''); });
            useEffect(() => { if (monthSummaries.length > 0 && !monthSummaries.find(m => m.month === selectedMonth)) { const curr = getCurrentMonthStr(); setSelectedMonth(monthSummaries.find(m => m.month === curr) ? curr : monthSummaries[0].month); } }, [monthSummaries, selectedMonth]);

            const monthTxs = useMemo(() => {
                let txs = myTxs.filter(t => t.invoiceMonth === selectedMonth);
                return txs.sort((a, b) => { if (a.bank === 'Empréstimo' && b.bank !== 'Empréstimo') return -1; if (a.bank !== 'Empréstimo' && b.bank === 'Empréstimo') return 1; return 0; });
            }, [myTxs, selectedMonth]);

            const summaryForSelected = monthSummaries.find(m => m.month === selectedMonth);
            const finalRest = summaryForSelected ? summaryForSelected.rest : 0;
            const myPaid = group.payments?.filter(p => p.memberId === member.id && p.month === selectedMonth).reduce((acc, curr) => acc + curr.amount, 0) || 0;
            const isMonthClosed = group.invoiceStatus && group.invoiceStatus[selectedMonth];

            return (
                <div className="pb-24 min-h-screen bg-gray-50">
                    <div className="bg-gray-900 pt-4 pb-5 rounded-b-[2rem] shadow-xl text-white">
                        <div className="flex justify-between items-center mb-4 px-4"><div className="flex items-center gap-2"><div className="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center font-black text-sm">{member?.name.charAt(0)}</div><div><h1 className="font-black text-sm">{member?.name}</h1><p className="text-gray-400 text-[8px] font-bold uppercase tracking-widest">Painel</p></div></div><button onClick={onLogout} className="text-gray-400 hover:text-white bg-white/10 p-1.5 rounded-lg"><Icon name="log-out" className="w-3.5 h-3.5" /></button></div>
                        <div className="px-4 mb-2"><p className="text-gray-400 text-[8px] font-black uppercase tracking-widest mb-0.5">Total Fatura {selectedMonth}</p><div className={`text-2xl font-black ${finalRest <= 0 ? 'text-green-400' : ''}`}>{formatMoney(finalRest)}</div>{myPaid > 0 && <p className="text-green-400 font-bold text-[8px] mt-1 bg-green-900/30 inline-block px-1.5 py-0.5 rounded">Abatido: {formatMoney(myPaid)}</p>}</div>
                        {monthSummaries.length > 0 && ( <div className="mt-4"><p className="text-gray-400 text-[8px] font-black uppercase tracking-widest mb-1.5 px-4">Linha do Tempo</p><div className="flex gap-1.5 overflow-x-auto hide-scroll pb-2 -mx-4 px-4 custom-scroll">{monthSummaries.map(({ month, rest }) => ( <button key={month} onClick={() => setSelectedMonth(month)} className={`flex flex-col items-center justify-center p-1.5 rounded-xl shrink-0 border text-center w-[64px] transition-all ${selectedMonth === month ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-300'}`}><span className={`text-[8px] font-black uppercase mb-0.5 ${selectedMonth === month ? 'text-indigo-200' : 'text-gray-500'}`}>{month}</span><span className={`font-black text-[9px] truncate w-full ${rest <= 0 ? 'text-green-400' : ''}`}>{formatMoney(rest)}</span></button> ))}</div></div> )}
                        <div className="px-4">{selectedMonth && ( <div className={`mt-2 p-1.5 rounded-lg border flex items-center gap-1 text-[9px] font-bold fade-in ${isMonthClosed ? 'bg-green-500/20 border-green-500/50 text-green-300' : 'bg-yellow-500/20 border-yellow-500/50 text-yellow-300'}`}>{isMonthClosed ? <><Icon name="lock" className="w-3 h-3"/> Fatura Fechada!</> : <><Icon name="unlock" className="w-3 h-3"/> Aberta. Pode alterar.</>}</div> )}</div>
                    </div>
                    <div className="px-2 mt-4 space-y-2">
                        <h3 className="font-black text-gray-800 text-[10px] flex items-center gap-1 mb-1.5 px-1"><Icon name="receipt" className="text-indigo-600 w-3 h-3"/> Detalhes de {selectedMonth}</h3>
                        {monthTxs.length === 0 && <p className="text-center text-gray-400 text-[10px] py-4 bg-gray-100 rounded-xl border border-dashed">Nenhuma cobrança.</p>}
                        <div className="space-y-1">
                            {monthTxs.map(tx => { const val = tx.splits ? tx.splits.find(s=>s.memberId===member.id).amount : tx.amount; const isLoan = tx.bank === 'Empréstimo'; return ( <div key={tx.id} className={`bg-white p-1.5 rounded-xl shadow-sm border flex justify-between items-center ${isLoan ? 'border-emerald-200 bg-emerald-50' : 'border-gray-100'}`}><div className="truncate pr-1"><p className={`font-bold truncate text-[9px] ${isLoan ? 'text-emerald-900' : 'text-gray-900'}`}>{tx.description}</p><div className="flex gap-1 mt-0.5"><span className={`text-[6px] font-bold px-1 py-0.5 rounded border ${isLoan ? 'bg-emerald-100 text-emerald-700' : getBankStyle(tx.bank)}`}>{tx.bank}</span><span className="text-[6px] text-gray-400">{tx.date}</span></div></div><div className={`font-black text-[9px] shrink-0 ${val < 0 ? 'text-green-600' : (isLoan ? 'text-emerald-700' : 'text-gray-900')}`}>{formatMoney(val)}</div></div> ) })}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('landing');
            const [currentGroup, setCurrentGroup] = useState(null);
            const [memberCode, setMemberCode] = useState('');
            const [adminData, setAdminData] = useState({ email: '', pass: '' });
            const [notification, setNotification] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                window.firebaseModules.initializeApp(myFirebaseConfig);
                auth = window.firebaseModules.getAuth(); db = window.firebaseModules.getFirestore();
                const unsubscribe = window.firebaseModules.onAuthStateChanged(auth, async (u) => {
                    if (u) { try { const q = window.firebaseModules.query(window.firebaseModules.collection(db, 'groups'), window.firebaseModules.where('adminUid', '==', u.uid)); const snap = await window.firebaseModules.getDocs(q); if (!snap.empty) { setCurrentGroup({ id: snap.docs[0].id, ...snap.docs[0].data() }); setView('admin_dash'); } } catch(e) {} }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => { if (!db || !currentGroup?.id) return; const unsub = window.firebaseModules.onSnapshot(window.firebaseModules.doc(db, 'groups', currentGroup.id), (doc) => { if (doc.exists()) setCurrentGroup({ id: doc.id, ...doc.data() }); }); return () => unsub(); }, [currentGroup?.id]);

            const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 4000); };
            const updateGroup = async (updates) => { try { await window.firebaseModules.updateDoc(window.firebaseModules.doc(db, 'groups', currentGroup.id), updates); } catch(e) { notify("Erro!");} };

            const handleMemberLogin = async (e) => {
                e.preventDefault(); setLoading(true);
                try { const cleanCode = memberCode.toUpperCase().trim(); let foundGroup = null; const snap = await window.firebaseModules.getDocs(window.firebaseModules.collection(db, 'groups')); snap.forEach((doc) => { const data = doc.data(); if(data.members?.some(m => m.accessCode === cleanCode)) foundGroup = { id: doc.id, ...data }; }); if (foundGroup) { setCurrentGroup(foundGroup); setView('member_dash'); } else notify("Código inválido!"); } catch(e) { notify("Erro."); }
                setLoading(false);
            };
            const handleAdminLogin = async (e) => { e.preventDefault(); setLoading(true); try { await window.firebaseModules.signInWithEmailAndPassword(auth, adminData.email, adminData.pass); } catch(e) { notify("Erro no login."); setLoading(false); } };

            if(loading) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;

            return (
                <div className="min-h-screen relative bg-gray-50 font-sans">
                    {notification && <div className="fixed top-2 left-2 right-2 z-[99] fade-in flex justify-center"><div className="bg-gray-900 text-white px-3 py-2 rounded-lg shadow-xl font-bold text-[10px] w-full max-w-sm text-center">{notification}</div></div>}
                    {view === 'landing' && (
                        <div className="flex flex-col min-h-screen px-4 fade-in max-w-md mx-auto justify-center">
                            <div className="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center shadow-xl mx-auto mb-4"><Icon name="pie-chart" className="w-8 h-8" /></div>
                            <h1 className="text-2xl font-black text-gray-900 text-center mb-6">Fatura Família</h1>
                            <form onSubmit={handleMemberLogin} className="bg-white p-4 rounded-2xl shadow-sm border mb-4">
                                <h2 className="font-bold text-gray-500 text-[10px] uppercase tracking-widest mb-2 text-center">Acesso Familiar</h2>
                                <input placeholder="Código (Ex: A1B2-7X)" className="w-full p-3 border rounded-xl font-mono text-center uppercase text-sm font-black outline-none mb-2 bg-gray-50" value={memberCode} onChange={e=>setMemberCode(e.target.value)} required />
                                <button className="w-full bg-gray-900 text-white py-3 rounded-xl font-black shadow-md text-[11px]">Ver Fatura</button>
                            </form>
                            <button onClick={() => setView('admin_login')} className="text-indigo-600 font-bold py-2 text-[11px] text-center w-full">Sou Administrador</button>
                        </div>
                    )}
                    {view === 'admin_login' && (
                        <div className="min-h-screen flex flex-col justify-center px-4 fade-in max-w-md mx-auto">
                            <button onClick={()=>setView('landing')} className="mb-4 font-bold text-gray-400 flex items-center gap-1 text-[11px]"><Icon name="arrow-left" className="w-3.5 h-3.5"/> Voltar</button>
                            <h2 className="text-xl font-black mb-4">Acesso Admin</h2>
                            <form onSubmit={handleAdminLogin} className="space-y-2">
                                <input type="email" placeholder="E-mail" className="w-full p-3 border rounded-xl font-bold text-[11px] bg-gray-50 outline-none" value={adminData.email} onChange={e=>setAdminData({...adminData, email:e.target.value})} required />
                                <input type="password" placeholder="Senha" className="w-full p-3 border rounded-xl font-bold text-[11px] bg-gray-50 outline-none" value={adminData.pass} onChange={e=>setAdminData({...adminData, pass:e.target.value})} required />
                                <button className="w-full bg-indigo-600 text-white py-3 rounded-xl font-black shadow-md text-[11px]">Entrar</button>
                            </form>
                        </div>
                    )}
                    {view === 'admin_dash' && <AdminDashboard group={currentGroup} updateGroupData={updateGroup} notify={notify} />}
                    {view === 'member_dash' && <MemberDashboard group={currentGroup} memberCode={memberCode} onLogout={()=>setView('landing')} />}
                    {view === 'admin_dash' && ( <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-between items-center z-40 px-4"><span className="font-black text-indigo-600 text-[9px] uppercase tracking-widest">Fatura Família</span><button onClick={async()=>{await window.firebaseModules.signOut(auth); setView('landing');}} className="font-bold text-gray-400 text-[9px] uppercase">Sair</button></div> )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
