<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gestor Familiar de Cartões & Empréstimos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f1f5f9; }

</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc,
      collection, query, where, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const defaultfirebaseConfig = {
  apiKey: "AIzaSyDgp7rt37Ird69lNPjgVTef80004-caZjg",
  authDomain: "fatura-familia-ac61e.firebaseapp.com",
  projectId: "fatura-familia-ac61e",
  storageBucket: "fatura-familia-ac61e.firebasestorage.app",
  messagingSenderId: "300604161734",
  appId: "1:300604161734:web:d44b899f96c6428868e1c7",
  measurementId: "G-TSEHV40NG1"
};

    const app = initializeApp(defaultFirebaseConfig);
    const db = getFirestore(app);

    window.__FIREBASE_DB__ = db;
    window.__FIREBASE_FNS__ = { doc, setDoc, getDoc, onSnapshot, updateDoc, collection, query, where, getDocs };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Cores padrões vibrantes para cada banco
    const DEFAULT_BANK_COLORS = {
      'NUBANK': '#820ad1',
      'INTER': '#ea580c',
      'MERCADO PAGO': '#0284c7',
      'BRADESCO': '#dc2626',
      'ITAU': '#d97706',
      'SANTANDER': '#b91c1c',
      'C6': '#1e293b',
      'CAIXA': '#1d4ed8'
    };

    const PRESET_COLORS = [
      '#820ad1', '#ea580c', '#0284c7', '#16a34a', '#dc2626',
      '#d97706', '#db2777', '#4f46e5', '#0d9488', '#334155'
    ];

    function formatBRL(val) {
      const n = Number(val) || 0;
      return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function parseNum(val) {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const clean = String(val).replace(/[^\d.,-]/g, '').replace(',', '.');
      const num = parseFloat(clean);
      return isNaN(num) ? 0 : num;
    }

    // Gera lista de meses: 12 meses para trás até 18 meses para frente
    function generateMonthsList() {
      const list = [];
      const base = new Date(2026, 10, 1); // Nov/2026 âncora
      for (let offset = -12; offset <= 18; offset++) {
        const d = new Date(base.getFullYear(), base.getMonth() + offset, 1);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        list.push(`${mm}/${yyyy}`);
      }
      return list;
    }

    function addMonthsToMMYYYY(mmyyyy, add) {
      const [m, y] = (mmyyyy || '11/2026').split('/').map(Number);
      const d = new Date(y, (m - 1) + add, 1);
      return `${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function compareMMYYYY(a, b) {
      const [ma, ya] = (a || '11/2026').split('/').map(Number);
      const [mb, yb] = (b || '11/2026').split('/').map(Number);
      return (ya * 12 + ma) - (yb * 12 + mb);
    }

    // Extrai informação de parcela (ex: "2/10", "02/10", "Parcela 2 de 10")
    function extractInstallmentInfo(desc) {
      if (!desc) return null;
      const m1 = desc.match(/(?:parcela\s*)?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})\b/i);
      if (!m1) return null;
      const cur = parseInt(m1[1], 10);
      const tot = parseInt(m1[2], 10);
      if (cur < 1 || tot < 2 || cur > tot || tot > 72) return null;
      const baseName = desc
        .replace(/(?:-\s*)?(?:\(\s*)?parcela\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}(?:\s*\))?/ig, '')
        .replace(/\b\d{1,2}\/\d{1,2}\b/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .toUpperCase();
      return { cur, tot, baseName };
    }

    function replaceInstallmentTag(desc, newCur, tot) {
      const padCur = String(newCur).padStart(2, '0');
      const padTot = String(tot).padStart(2, '0');
      if (/parcela\s*\d{1,2}\s*de\s*\d{1,2}/i.test(desc)) {
        return desc.replace(/parcela\s*\d{1,2}\s*de\s*\d{1,2}/i, `Parcela ${padCur}/${padTot}`);
      }
      if (/\b\d{1,2}\/\d{1,2}\b/.test(desc)) {
        return desc.replace(/\b\d{1,2}\/\d{1,2}\b/, `${padCur}/${padTot}`);
      }
      return `${desc} (${padCur}/${padTot})`;
    }

    // =========================================================================
    // LEITOR DE PDF CALIBRADO PARA NUBANK, BANCO INTER E MERCADO PAGO
    // =========================================================================
    async function parseBankPDF(file, members = []) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullLines = [];

      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const items = content.items.map(it => ({
          str: it.str.trim(),
          x: it.transform[4],
          y: it.transform[5]
        })).filter(it => it.str.length > 0);

        items.sort((a, b) => b.y - a.y || a.x - b.x);
        const rows = [];
        for (const it of items) {
          let row = rows.find(r => Math.abs(r.y - it.y) <= 2.2);
          if (!row) {
            row = { y: it.y, items: [] };
            rows.push(row);
          }
          row.items.push(it);
        }
        rows.forEach(r => {
          r.items.sort((a, b) => a.x - b.x);
          fullLines.push({
            page: p,
            text: r.items.map(i => i.str).join(' ')
          });
        });
      }

      const allText = fullLines.map(l => l.text).join('\n');
      let detectedBank = 'NUBANK';
      if (/mercado\s*pago/i.test(allText)) detectedBank = 'MERCADO PAGO';
      else if (/banco\s*inter|\binter\b.*super\s*app|5555\*\*\*\*/i.test(allText)) detectedBank = 'INTER';

      const parsedItems = [];
      let currentCardDigits = '';
      let stopInterFuturePage = false;

      const findOwnerByCard = (digits) => {
        if (!digits) return '';
        const found = members.find(m =>
          (m.cards || []).some(c => String(c).trim().endsWith(digits))
        );
        return found ? found.id : '';
      };

      for (let i = 0; i < fullLines.length; i++) {
        const line = fullLines[i].text.replace(/\s+/g, ' ').trim();

        if (detectedBank === 'INTER' && /pr[óo]xima\s+fatura|data\s+de\s+corte/i.test(line)) {
          stopInterFuturePage = true;
        }
        if (stopInterFuturePage && detectedBank === 'INTER') continue;

        const cardHeaderMatch = line.match(/cart[ãa]o.*?(?:\*{4,}|\.\.\.\.)\s*(\d{4})\b/i);
        if (cardHeaderMatch) {
          currentCardDigits = cardHeaderMatch[1];
          continue;
        }

        if (detectedBank === 'INTER' && /^valor\s+pendente\s+do\s+m[êe]s\s+anterior\s+R\$\s*([\d.,]+)/i.test(line)) {
          const m = line.match(/R\$\s*([\d.,]+)/i);
          if (m) {
            const val = parseFloat(m[1].replace(/\./g, '').replace(',', '.'));
            if (val > 0 && !parsedItems.some(it => it.description.includes('SALDO PENDENTE MÊS ANTERIOR'))) {
              parsedItems.push({
                id: 'pdf_' + Math.random().toString(36).slice(2, 9),
                date: 'ANTERIOR',
                description: 'SALDO PENDENTE MÊS ANTERIOR (INTER)',
                amount: val,
                cardDigits: currentCardDigits,
                ownerId: findOwnerByCard(currentCardDigits),
                selected: true,
                isRefund: false,
                isIgnoredPayment: false
              });
            }
          }
          continue;
        }

        if (/^(total\s+cart[ãa]o|total\s+da\s+fatura|despesas\s+do\s+m[êe]s|pagamento\s+m[íi]nimo|limite\s+de|encargos\s+rotativos|taxa\s+efetiva)/i.test(line)) {
          continue;
        }

        // Padrão 1: Data do Banco Inter
        const interMatch = line.match(/^(\d{2}\s*\.?\s*de\s+[a-zç]{3}\.?\s+\d{4})\s+(.+?)\s+([+-]?\s*R\$\s*[\d.,]+)$/i);
        if (interMatch) {
          const dateStr = interMatch[1];
          let desc = interMatch[2].replace(/Principal\s*\(R\$.*?\)\s*\+\s*Juros\s*\(R\$.*?\)/ig, '').trim();
          const rawValStr = interMatch[3];
          const numVal = parseFloat(rawValStr.replace(/[^\d,]/g, '').replace(',', '.'));
          if (!numVal) continue;

          const isPrevPayment = /pgto\s+fatura|pagamento\s+da\s+fatura/i.test(desc) || /\+\s*R\$/i.test(rawValStr);
          const isRefund = !isPrevPayment && (/estorno|cr[ée]dito|devolu[çc][ãa]o/i.test(desc));

          desc = desc.replace(/\(?\s*Parcela\s+(\d{1,2})\s+de\s+(\d{1,2})\s*\)?/ig, 'Parcela $1/$2');

          parsedItems.push({
            id: 'pdf_' + Math.random().toString(36).slice(2, 9),
            date: dateStr,
            description: desc,
            amount: isRefund ? -Math.abs(numVal) : Math.abs(numVal),
            cardDigits: currentCardDigits,
            ownerId: findOwnerByCard(currentCardDigits),
            selected: !isPrevPayment,
            isRefund,
            isIgnoredPayment: isPrevPayment
          });
          continue;
        }

        // Padrão 2: Mercado Pago
        const mpMatch = line.match(/^(\d{2}\/\d{2})\s+(.+?)\s+R\$\s*([\d.,]+)$/i);
        if (mpMatch) {
          const dateStr = mpMatch[1];
          let desc = mpMatch[2].trim();
          const numVal = parseFloat(mpMatch[3].replace(/\./g, '').replace(',', '.'));
          if (!numVal) continue;

          const isPrevPayment = /pagamento\s+da\s+fatura/i.test(desc);
          const isRefund = !isPrevPayment && (/estorno|devolu[çc][ãa]o/i.test(desc));
          desc = desc.replace(/Parcela\s+(\d{1,2})\s+de\s+(\d{1,2})/ig, 'Parcela $1/$2');

          parsedItems.push({
            id: 'pdf_' + Math.random().toString(36).slice(2, 9),
            date: dateStr,
            description: desc,
            amount: isRefund ? -Math.abs(numVal) : Math.abs(numVal),
            cardDigits: currentCardDigits,
            ownerId: findOwnerByCard(currentCardDigits),
            selected: !isPrevPayment,
            isRefund,
            isIgnoredPayment: isPrevPayment
          });
          continue;
        }

        // Padrão 3: Nubank
        const nuMatch = line.match(/^([0O\d]{2}[\s-]+[A-Z]{3})\s+(.+?)\s+(-?\s*R\$\s*[\d.,]+)$/i);
        if (nuMatch) {
          const dateStr = nuMatch[1].replace(/^OS/i, '03').replace('-', ' ');
          let middle = nuMatch[2].trim();
          const rawVal = nuMatch[3];
          const numVal = parseFloat(rawVal.replace(/[^\d,]/g, '').replace(',', '.'));
          if (!numVal) continue;

          let digits = currentCardDigits;
          const dMatch = middle.match(/^(?:\.{2,4})?(\d{4})\b\s*(.*)$/);
          if (dMatch) {
            digits = dMatch[1];
            middle = dMatch[2].trim();
          } else {
            const trailMatch = middle.match(/^(.*?)\s+\b(\d{4})$/);
            if (trailMatch) {
              middle = trailMatch[1].trim();
              digits = trailMatch[2];
            }
          }

          const isPrevPayment = /^pagamento\s+em\b|pagamentos\s+e\s+financiamentos/i.test(middle);
          const isRefund = !isPrevPayment && (/^estorno\b/i.test(middle) || rawVal.includes('-'));

          parsedItems.push({
            id: 'pdf_' + Math.random().toString(36).slice(2, 9),
            date: dateStr,
            description: middle,
            amount: isRefund ? -Math.abs(numVal) : Math.abs(numVal),
            cardDigits: digits,
            ownerId: findOwnerByCard(digits),
            selected: !isPrevPayment,
            isRefund,
            isIgnoredPayment: isPrevPayment
          });
        }
      }

      return { detectedBank, items: parsedItems };
    }

    // =========================================================================
    // COMPONENTE PRINCIPAL DO APP
    // =========================================================================
    function App() {
      const [dbInstance] = useState(() => window.__FIREBASE_DB__);
      const [mode, setMode] = useState('login'); // 'login' | 'admin' | 'memberSelect' | 'memberView'
      const [groupCodeInput, setGroupCodeInput] = useState('');
      const [adminCodeInput, setAdminCodeInput] = useState('');
      const [adminPassInput, setAdminPassInput] = useState('');
      const [currentGroup, setCurrentGroup] = useState(null);
      const [selectedMemberId, setSelectedMemberId] = useState(null);
      const [selectedMonth, setSelectedMonth] = useState('11/2026');
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const monthsList = useMemo(() => generateMonthsList(), []);

      useEffect(() => {
        if (!dbInstance || !currentGroup?.id) return;
        const { doc, onSnapshot } = window.__FIREBASE_FNS__;
        const unsub = onSnapshot(doc(dbInstance, 'groups', currentGroup.id), (snap) => {
          if (snap.exists()) {
            setCurrentGroup({ id: snap.id, ...snap.data() });
          }
        });
        return () => unsub();
      }, [dbInstance, currentGroup?.id]);

      const saveGroupData = async (updatedFields) => {
        if (!dbInstance || !currentGroup?.id) return;
        const { doc, updateDoc } = window.__FIREBASE_FNS__;
        const nextGroup = { ...currentGroup, ...updatedFields };
        setCurrentGroup(nextGroup);
        await updateDoc(doc(dbInstance, 'groups', currentGroup.id), updatedFields);
      };

      const getBankColor = (bankName) => {
        const key = String(bankName || 'OUTROS').trim().toUpperCase();
        if (currentGroup?.bankColors && currentGroup.bankColors[key]) {
          return currentGroup.bankColors[key];
        }
        for (const [defName, defColor] of Object.entries(DEFAULT_BANK_COLORS)) {
          if (key.includes(defName)) return defColor;
        }
        return '#475569';
      };

      const updateBankColor = async (bankName, newColor) => {
        const key = String(bankName || '').trim().toUpperCase();
        if (!key) return;
        const nextColors = { ...(currentGroup?.bankColors || {}), [key]: newColor };
        const existingBanks = currentGroup?.banks || ['NUBANK', 'INTER', 'MERCADO PAGO'];
        const nextBanks = existingBanks.includes(key) ? existingBanks : [...existingBanks, key];
        await saveGroupData({ bankColors: nextColors, banks: nextBanks });
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        const code = adminCodeInput.trim().toUpperCase();
        if (!code) return;
        setLoading(true);
        try {
          const { doc, getDoc, setDoc, collection, query, where, getDocs } = window.__FIREBASE_FNS__;
          let snap = await getDoc(doc(dbInstance, 'groups', code));
          let foundData = snap.exists() ? { id: snap.id, ...snap.data() } : null;

          if (!foundData) {
            const q = query(collection(dbInstance, 'groups'), where('code', '==', code));
            const qSnap = await getDocs(q);
            if (!qSnap.empty) {
              const d = qSnap.docs[0];
              foundData = { id: d.id, ...d.data() };
            }
          }

          if (foundData) {
            if (foundData.adminPass && foundData.adminPass !== adminPassInput) {
              setErrorMsg('Senha de administrador incorreta.');
              setLoading(false);
              return;
            }
            setCurrentGroup(foundData);
            setMode('admin');
          } else {
            const newGroup = {
              code,
              adminPass: adminPassInput || '1234',
              banks: ['NUBANK', 'INTER', 'MERCADO PAGO'],
              bankColors: { ...DEFAULT_BANK_COLORS },
              members: [
                { id: 'm1', name: 'Matheus', cards: ['4379'] },
                { id: 'm2', name: 'Leandro', cards: ['3163'] },
                { id: 'm3', name: 'Leonardo', cards: ['9663'] }
              ],
              transactions: [],
              loans: [],
              lockedMonths: {}
            };
            await setDoc(doc(dbInstance, 'groups', code), newGroup);
            setCurrentGroup({ id: code, ...newGroup });
            setMode('admin');
          }
        } catch (err) {
          setErrorMsg('Erro ao acessar banco: ' + err.message);
        }
        setLoading(false);
      };

      const handleFamilyLogin = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        const code = groupCodeInput.trim().toUpperCase();
        if (!code) return;
        setLoading(true);
        try {
          const { doc, getDoc, collection, query, where, getDocs } = window.__FIREBASE_FNS__;
          let snap = await getDoc(doc(dbInstance, 'groups', code));
          let foundData = snap.exists() ? { id: snap.id, ...snap.data() } : null;

          if (!foundData) {
            const q = query(collection(dbInstance, 'groups'), where('code', '==', code));
            const qSnap = await getDocs(q);
            if (!qSnap.empty) {
              const d = qSnap.docs[0];
              foundData = { id: d.id, ...d.data() };
            }
          }

          if (!foundData) {
            setErrorMsg('Código de grupo não encontrado.');
          } else {
            setCurrentGroup(foundData);
            setMode('memberSelect');
          }
        } catch (err) {
          setErrorMsg('Erro no acesso: ' + err.message);
        }
        setLoading(false);
      };

      if (mode === 'login') {
        return (
          <div className="min-h-screen flex items-center justify-center p-3 bg-slate-900">
            <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl p-4 space-y-3">
              <div className="text-center">
                <h1 className="text-lg font-extrabold text-slate-800 tracking-tight">💳 Gestor Familiar</h1>
                <p className="text-xs text-slate-500">Cartões, Parcelas e Empréstimos</p>
              </div>

              {errorMsg && (
                <div className="bg-red-50 border border-red-200 text-red-700 text-xs font-semibold p-2 rounded-lg text-center">
                  {errorMsg}
                </div>
              )}

              <form onSubmit={handleFamilyLogin} className="bg-indigo-50/70 border border-indigo-100 rounded-xl p-3 space-y-2">
                <div className="text-xs font-bold text-indigo-900 uppercase">👨‍👩‍👦 Acesso da Família (Fatura)</div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Código do Grupo"
                    value={groupCodeInput}
                    onChange={e => setGroupCodeInput(e.target.value)}
                    className="flex-1 px-2.5 py-1.5 text-xs border border-indigo-200 rounded-lg uppercase font-bold"
                  />
                  <button
                    type="submit"
                    disabled={loading}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg"
                  >
                    Entrar
                  </button>
                </div>
              </form>

              <form onSubmit={handleAdminLogin} className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
                <div className="text-xs font-bold text-slate-700 uppercase">🔒 Painel do Administrador</div>
                <div className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Código Grupo"
                    value={adminCodeInput}
                    onChange={e => setAdminCodeInput(e.target.value)}
                    className="px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg uppercase font-semibold"
                  />
                  <input
                    type="password"
                    placeholder="Senha Admin"
                    value={adminPassInput}
                    onChange={e => setAdminPassInput(e.target.value)}
                    className="px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg"
                  />
                </div>
                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2 rounded-lg"
                >
                  {loading ? 'Carregando...' : 'Acessar Admin'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (mode === 'memberSelect' && currentGroup) {
        return (
          <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-4">
            <h2 className="text-xl font-extrabold mb-1">Quem está acessando?</h2>
            <p className="text-xs text-slate-400 mb-6">Toque no seu nome para ver sua fatura e empréstimos</p>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 w-full max-w-md">
              {(currentGroup.members || []).map((m, idx) => {
                const colors = ['bg-indigo-600', 'bg-emerald-600', 'bg-amber-600', 'bg-rose-600', 'bg-sky-600', 'bg-purple-600'];
                return (
                  <button
                    key={m.id}
                    onClick={() => { setSelectedMemberId(m.id); setMode('memberView'); }}
                    className="bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-2xl p-4 flex flex-col items-center gap-2 transition"
                  >
                    <div className={`w-12 h-12 rounded-full ${colors[idx % colors.length]} flex items-center justify-center text-lg font-black`}>
                      {m.name.slice(0, 2).toUpperCase()}
                    </div>
                    <span className="text-sm font-bold truncate max-w-full">{m.name}</span>
                  </button>
                );
              })}
            </div>
            <button
              onClick={() => setMode('login')}
              className="mt-8 text-xs text-slate-400 underline"
            >
              Voltar ao início
            </button>
          </div>
        );
      }

      if (mode === 'memberView' && currentGroup) {
        return (
          <MemberDashboard
            currentGroup={currentGroup}
            memberId={selectedMemberId}
            selectedMonth={selectedMonth}
            setSelectedMonth={setSelectedMonth}
            monthsList={monthsList}
            getBankColor={getBankColor}
            onBack={() => setMode('memberSelect')}
          />
        );
      }

      return (
        <AdminDashboard
          currentGroup={currentGroup}
          saveGroupData={saveGroupData}
          selectedMonth={selectedMonth}
          setSelectedMonth={setSelectedMonth}
          monthsList={monthsList}
          getBankColor={getBankColor}
          updateBankColor={updateBankColor}
          onLogout={() => setMode('login')}
        />
      );
    }

    // =========================================================================
    // PAINEL DE VISUALIZAÇÃO DA FAMÍLIA (EMPRÉSTIMOS SEPARADOS + CALCULADORA)
    // =========================================================================
    function MemberDashboard({
      currentGroup, memberId, selectedMonth, setSelectedMonth, monthsList, getBankColor, onBack
    }) {
      const member = (currentGroup.members || []).find(m => m.id === memberId);

      const memberCardTxs = useMemo(() => {
        return (currentGroup.transactions || []).filter(tx => {
          if (tx.month !== selectedMonth) return false;
          if (tx.ownerId === memberId) return true;
          if (tx.ownerId === 'SPLIT' && (tx.splitIds || []).includes(memberId)) return true;
          return false;
        }).map(tx => {
          const shareCount = tx.ownerId === 'SPLIT' ? Math.max(1, (tx.splitIds || []).length) : 1;
          return { ...tx, memberAmount: (Number(tx.amount) || 0) / shareCount };
        });
      }, [currentGroup.transactions, selectedMonth, memberId]);

      const memberLoans = useMemo(() => {
        return (currentGroup.loans || []).filter(ln => ln.month === selectedMonth && ln.ownerId === memberId);
      }, [currentGroup.loans, selectedMonth, memberId]);

      const totalCardInvoice = useMemo(
        () => memberCardTxs.filter(t => !t.paid).reduce((acc, t) => acc + t.memberAmount, 0),
        [memberCardTxs]
      );

      const [includeCardsInCalc, setIncludeCardsInCalc] = useState(true);
      const [selectedLoanIds, setSelectedLoanIds] = useState([]);

      useEffect(() => {
        setIncludeCardsInCalc(true);
        setSelectedLoanIds(memberLoans.filter(l => !l.paid).map(l => l.id));
      }, [selectedMonth, memberId, memberLoans.length]);

      const toggleLoanInCalc = (id) => {
        setSelectedLoanIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectedCalculatorTotal = useMemo(() => {
        let sum = includeCardsInCalc ? totalCardInvoice : 0;
        memberLoans.forEach(ln => {
          if (!ln.paid && selectedLoanIds.includes(ln.id)) {
            sum += Number(ln.amount) || 0;
          }
        });
        return sum;
      }, [includeCardsInCalc, selectedLoanIds, totalCardInvoice, memberLoans]);

      if (!member) return null;

      return (
        <div className="min-h-screen bg-slate-100 pb-12">
          <div className="bg-slate-900 text-white p-4 rounded-b-3xl shadow-lg space-y-3">
            <div className="flex items-center justify-between">
              <button onClick={onBack} className="text-xs bg-slate-800 px-3 py-1.5 rounded-lg font-bold">
                ← Trocar Pessoa
              </button>
              <select
                value={selectedMonth}
                onChange={e => setSelectedMonth(e.target.value)}
                className="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-700"
              >
                {monthsList.map(m => <option key={m} value={m}>Fatura {m}</option>)}
              </select>
            </div>

            <div>
              <p className="text-xs text-slate-400">Resumo de</p>
              <h1 className="text-xl font-black">{member.name}</h1>
            </div>

            <div className="space-y-2 pt-1">
              <div className="text-[11px] text-slate-400 font-semibold">
                Toque nos blocos abaixo para somar os pagamentos do dia:
              </div>

              <div
                onClick={() => setIncludeCardsInCalc(!includeCardsInCalc)}
                className={`cursor-pointer p-3 rounded-xl border transition flex items-center justify-between ${
                  includeCardsInCalc
                    ? 'bg-indigo-950/90 border-indigo-400'
                    : 'bg-slate-800/60 border-slate-700 opacity-60'
                }`}
              >
                <div className="flex items-center gap-2.5">
                  <input
                    type="checkbox"
                    checked={includeCardsInCalc}
                    onChange={() => {}}
                    className="w-4 h-4 accent-indigo-500"
                  />
                  <div>
                    <div className="text-xs font-bold uppercase text-indigo-300">💳 Fatura dos Cartões</div>
                    <div className="text-[11px] text-slate-400">{memberCardTxs.length} lançamentos no mês</div>
                  </div>
                </div>
                <div className="text-base font-black text-white">{formatBRL(totalCardInvoice)}</div>
              </div>

              {memberLoans.map(ln => {
                const checked = selectedLoanIds.includes(ln.id) && !ln.paid;
                return (
                  <div
                    key={ln.id}
                    onClick={() => !ln.paid && toggleLoanInCalc(ln.id)}
                    className={`cursor-pointer p-3 rounded-xl border transition flex items-center justify-between ${
                      ln.paid
                        ? 'bg-emerald-950/40 border-emerald-700/50 opacity-60'
                        : checked
                        ? 'bg-amber-950/80 border-amber-400'
                        : 'bg-slate-800/60 border-slate-700 opacity-60'
                    }`}
                  >
                    <div className="flex items-center gap-2.5">
                      <input
                        type="checkbox"
                        checked={checked}
                        disabled={ln.paid}
                        onChange={() => {}}
                        className="w-4 h-4 accent-amber-500"
                      />
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md uppercase">
                            DIA {ln.dueDay || '10'}
                          </span>
                          <span className="text-xs font-bold text-amber-200">🏦 Empréstimo</span>
                        </div>
                        <div className="text-xs text-slate-200 font-semibold mt-0.5">{ln.description}</div>
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="text-base font-black text-amber-300">{formatBRL(ln.amount)}</div>
                      {ln.paid && <span className="text-[10px] text-emerald-400 font-bold">PAGO</span>}
                    </div>
                  </div>
                );
              })}

              <div className="bg-emerald-600 text-white p-3 rounded-xl flex items-center justify-between shadow">
                <div>
                  <div className="text-[11px] font-bold uppercase text-emerald-100">🧮 Soma para Pagamento (Selecionados)</div>
                  <div className="text-[10px] text-emerald-200">Marque ou desmarque acima para simular</div>
                </div>
                <div className="text-lg font-black">{formatBRL(selectedCalculatorTotal)}</div>
              </div>
            </div>
          </div>

          <div className="max-w-lg mx-auto p-3 space-y-4">
            <div className="bg-white rounded-2xl shadow p-3 space-y-2">
              <h3 className="text-xs font-black uppercase text-slate-700 border-b pb-2">
                💳 Detalhamento dos Cartões ({memberCardTxs.length})
              </h3>
              {memberCardTxs.length === 0 ? (
                <p className="text-xs text-slate-400 py-4 text-center">Nenhuma compra registrada neste mês.</p>
              ) : (
                memberCardTxs.map(tx => {
                  const bankColor = getBankColor(tx.bank);
                  return (
                    <div
                      key={tx.id}
                      style={{ borderLeft: `5px solid ${bankColor}`, backgroundColor: `${bankColor}0D` }}
                      className="p-2.5 rounded-xl flex items-center justify-between gap-2 border border-slate-200/70"
                    >
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-1.5 flex-wrap">
                          <span
                            style={{ backgroundColor: bankColor }}
                            className="text-[10px] text-white font-extrabold px-2 py-0.5 rounded uppercase"
                          >
                            {tx.bank || 'CARTÃO'}
                          </span>
                          <span className="text-[10px] text-slate-500 font-semibold">{tx.date}</span>
                          {tx.ownerId === 'SPLIT' && (
                            <span className="text-[10px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.5 rounded">
                              RATEIO
                            </span>
                          )}
                        </div>
                        <div
                          style={{ color: bankColor }}
                          className="text-xs font-extrabold truncate mt-1"
                        >
                          {tx.description}
                        </div>
                      </div>
                      <div className="text-right">
                        <div className={`text-xs font-black ${tx.memberAmount < 0 ? 'text-emerald-600' : 'text-slate-900'}`}>
                          {formatBRL(tx.memberAmount)}
                        </div>
                        {tx.paid && <span className="text-[10px] text-emerald-600 font-bold">Baixado</span>}
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {memberLoans.length > 0 && (
              <div className="bg-slate-900 text-white rounded-2xl shadow p-3 space-y-2">
                <h3 className="text-xs font-black uppercase text-amber-400 border-b border-slate-800 pb-2">
                  🏦 Empréstimos do Mês ({memberLoans.length})
                </h3>
                {memberLoans.map(ln => (
                  <div key={ln.id} className="p-3 bg-slate-800 rounded-xl flex items-center justify-between">
                    <div>
                      <span className="inline-block bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded mb-1">
                        VENCIMENTO: DIA {ln.dueDay || '10'}
                      </span>
                      <div className="text-xs font-bold text-white">{ln.description}</div>
                    </div>
                    <div className="text-sm font-black text-amber-400">{formatBRL(ln.amount)}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // PAINEL DO ADMINISTRADOR
    // =========================================================================
    function AdminDashboard({
      currentGroup, saveGroupData, selectedMonth, setSelectedMonth,
      monthsList, getBankColor, updateBankColor, onLogout
    }) {
      const [activeTab, setActiveTab] = useState('extrato');

      const [showManualModal, setShowManualModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [showRenegotiationModal, setShowRenegotiationModal] = useState(false);
      const [showBankColorModal, setShowBankColorModal] = useState(false);

      const [manDesc, setManDesc] = useState('');
      const [manAmount, setManAmount] = useState('');
      const [manBank, setManBank] = useState('NUBANK');
      const [manInstallments, setManInstallments] = useState('1');
      const [manOwnerId, setManOwnerId] = useState('');
      const [manMonth, setManMonth] = useState(selectedMonth);
      const [manIsRefund, setManIsRefund] = useState(false);

      useEffect(() => { setManMonth(selectedMonth); }, [selectedMonth]);

      const [importBank, setImportBank] = useState('NUBANK');
      const [importTargetMonth, setImportTargetMonth] = useState(selectedMonth);
      const [importedPreview, setImportedPreview] = useState([]);
      const [importLoading, setImportLoading] = useState(false);

      useEffect(() => { setImportTargetMonth(selectedMonth); }, [selectedMonth]);

      const [loanDesc, setLoanDesc] = useState('');
      const [loanAmount, setLoanAmount] = useState('');
      const [loanInstallments, setLoanInstallments] = useState('1');
      const [loanDueDay, setLoanDueDay] = useState('10');
      const [loanOwnerId, setLoanOwnerId] = useState('');
      const [selectedLoansToDelete, setSelectedLoansToDelete] = useState([]);

      const [newBankName, setNewBankName] = useState('');
      const [newBankColor, setNewBankColor] = useState('#820ad1');

      const banksList = useMemo(() => {
        const set = new Set(currentGroup?.banks || ['NUBANK', 'INTER', 'MERCADO PAGO']);
        (currentGroup?.transactions || []).forEach(t => {
          if (t.bank) set.add(String(t.bank).trim().toUpperCase());
        });
        return Array.from(set);
      }, [currentGroup?.banks, currentGroup?.transactions]);

      const monthTransactions = useMemo(
        () => (currentGroup?.transactions || []).filter(t => t.month === selectedMonth),
        [currentGroup?.transactions, selectedMonth]
      );

      const pendingTransactions = useMemo(
        () => monthTransactions.filter(t => !t.ownerId),
        [monthTransactions]
      );

      const identifiedTransactions = useMemo(
        () => monthTransactions.filter(t => !!t.ownerId),
        [monthTransactions]
      );

      const totalsByBank = useMemo(() => {
        const map = {};
        monthTransactions.forEach(t => {
          const b = String(t.bank || 'OUTROS').toUpperCase();
          map[b] = (map[b] || 0) + (Number(t.amount) || 0);
        });
        return map;
      }, [monthTransactions]);

      const assignTransactionOwner = async (tx, ownerId, splitIds = []) => {
        const allTxs = [...(currentGroup.transactions || [])];
        const info = extractInstallmentInfo(tx.description);

        const updated = allTxs.map(item => {
          if (item.id === tx.id) {
            return { ...item, ownerId, splitIds };
          }
          if (info && item.bank === tx.bank && compareMMYYYY(item.month, tx.month) > 0) {
            const otherInfo = extractInstallmentInfo(item.description);
            if (otherInfo && otherInfo.tot === info.tot && otherInfo.baseName === info.baseName && otherInfo.cur > info.cur) {
              return { ...item, ownerId, splitIds };
            }
          }
          return item;
        });

        await saveGroupData({ transactions: updated });
      };

      const handleSaveManual = async (e) => {
        e.preventDefault();
        const rawVal = parseNum(manAmount);
        if (!manDesc.trim() || !rawVal) return;

        const totalInst = Math.max(1, parseInt(manInstallments, 10) || 1);
        const signedVal = manIsRefund ? -Math.abs(rawVal) : Math.abs(rawVal);
        const newItems = [];

        for (let i = 1; i <= totalInst; i++) {
          const targetM = addMonthsToMMYYYY(manMonth, i - 1);
          const descText = totalInst > 1
            ? `${manDesc.trim()} - Parcela ${String(i).padStart(2, '0')}/${String(totalInst).padStart(2, '0')}`
            : manDesc.trim();

          newItems.push({
            id: 'man_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 6),
            date: 'MANUAL',
            description: descText,
            amount: signedVal,
            bank: manBank.toUpperCase(),
            month: targetM,
            ownerId: manOwnerId || '',
            splitIds: [],
            paid: false
          });
        }

        await saveGroupData({
          transactions: [...(currentGroup.transactions || []), ...newItems]
        });
        setManDesc('');
        setManAmount('');
        setManInstallments('1');
        setShowManualModal(false);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setImportLoading(true);
        try {
          const { detectedBank, items } = await parseBankPDF(file, currentGroup.members || []);
          setImportBank(detectedBank);
          setImportedPreview(items);
        } catch (err) {
          alert('Erro ao ler PDF: ' + err.message);
        }
        setImportLoading(false);
      };

      const confirmImportTransactions = async () => {
        const selectedItems = importedPreview.filter(i => i.selected);
        if (selectedItems.length === 0) return;

        const existingTxs = [...(currentGroup.transactions || [])];
        const newTxs = [];

        for (const item of selectedItems) {
          const info = extractInstallmentInfo(item.description);

          let autoOwnerId = item.ownerId || '';
          let autoSplitIds = [];
          if (!autoOwnerId && info) {
            const prevMatch = existingTxs.find(ex => {
              if (ex.bank !== importBank || !ex.ownerId) return false;
              const exInfo = extractInstallmentInfo(ex.description);
              return exInfo && exInfo.tot === info.tot && exInfo.baseName === info.baseName;
            });
            if (prevMatch) {
              autoOwnerId = prevMatch.ownerId;
              autoSplitIds = prevMatch.splitIds || [];
            }
          }

          const duplicateInTarget = existingTxs.find(ex =>
            ex.month === importTargetMonth &&
            ex.bank === importBank &&
            Math.abs((Number(ex.amount) || 0) - item.amount) < 0.02 &&
            info && extractInstallmentInfo(ex.description)?.baseName === info.baseName &&
            extractInstallmentInfo(ex.description)?.cur === info.cur
          );

          if (!duplicateInTarget) {
            newTxs.push({
              id: 'imp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
              date: item.date,
              description: item.description,
              amount: item.amount,
              bank: importBank,
              month: importTargetMonth,
              ownerId: autoOwnerId,
              splitIds: autoSplitIds,
              paid: false
            });
          }

          if (info && info.cur < info.tot) {
            for (let nextP = info.cur + 1; nextP <= info.tot; nextP++) {
              const futureM = addMonthsToMMYYYY(importTargetMonth, nextP - info.cur);
              const futureDesc = replaceInstallmentTag(item.description, nextP, info.tot);

              const alreadyInFuture = [...existingTxs, ...newTxs].some(ex => {
                if (ex.month !== futureM || ex.bank !== importBank) return false;
                const exInfo = extractInstallmentInfo(ex.description);
                return exInfo && exInfo.tot === info.tot && exInfo.cur === nextP && exInfo.baseName === info.baseName;
              });

              if (!alreadyInFuture) {
                newTxs.push({
                  id: 'fut_' + Date.now() + '_' + nextP + '_' + Math.random().toString(36).slice(2, 7),
                  date: item.date,
                  description: futureDesc,
                  amount: item.amount,
                  bank: importBank,
                  month: futureM,
                  ownerId: autoOwnerId,
                  splitIds: autoSplitIds,
                  paid: false
                });
              }
            }
          }
        }

        await saveGroupData({ transactions: [...existingTxs, ...newTxs] });
        setImportedPreview([]);
        setShowImportModal(false);
        setSelectedMonth(importTargetMonth);
      };

      const handleSaveLoan = async (e) => {
        e.preventDefault();
        const val = parseNum(loanAmount);
        if (!loanDesc.trim() || !val || !loanOwnerId) return;
        const count = Math.max(1, parseInt(loanInstallments, 10) || 1);
        const perInstallment = val / count;
        const created = [];

        for (let i = 1; i <= count; i++) {
          const m = addMonthsToMMYYYY(selectedMonth, i - 1);
          const desc = count > 1 ? `${loanDesc.trim()} (${i}/${count})` : loanDesc.trim();
          created.push({
            id: 'ln_' + Date.now() + '_' + i + '_' + Math.random().toString(36).slice(2, 6),
            description: desc,
            amount: Number(perInstallment.toFixed(2)),
            dueDay: loanDueDay || '10',
            ownerId: loanOwnerId,
            month: m,
            paid: false
          });
        }

        await saveGroupData({ loans: [...(currentGroup.loans || []), ...created] });
        setLoanDesc('');
        setLoanAmount('');
        setLoanInstallments('1');
      };

      return (
        <div className="min-h-screen bg-slate-100 pb-16">
          <div className="bg-slate-900 text-white p-3 shadow-md sticky top-0 z-20">
            <div className="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="font-black text-sm tracking-tight">⚙️ ADMIN ({currentGroup?.code})</span>
                <select
                  value={selectedMonth}
                  onChange={e => setSelectedMonth(e.target.value)}
                  className="bg-indigo-600 text-white text-xs font-extrabold px-2.5 py-1.5 rounded-lg"
                >
                  {monthsList.map(m => <option key={m} value={m}>Fatura {m}</option>)}
                </select>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setShowBankColorModal(true)}
                  className="bg-slate-800 hover:bg-slate-700 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-700"
                >
                  🎨 Cores dos Bancos
                </button>
                <button
                  onClick={onLogout}
                  className="bg-red-600/20 hover:bg-red-600/40 text-red-300 text-xs font-bold px-2.5 py-1.5 rounded-lg"
                >
                  Sair
                </button>
              </div>
            </div>

            <div className="max-w-4xl mx-auto grid grid-cols-4 gap-1.5 mt-3">
              {[
                { id: 'extrato', label: '📄 Extrato' },
                { id: 'resumo', label: '📊 Resumo / Negociar' },
                { id: 'emprestimos', label: '🏦 Empréstimos' },
                { id: 'membros', label: '👥 Família' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`py-2 rounded-xl text-xs font-extrabold transition ${
                    activeTab === t.id
                      ? 'bg-white text-slate-900 shadow'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          <div className="max-w-4xl mx-auto p-3 space-y-4">
            {activeTab === 'extrato' && (
              <div className="space-y-3">
                <div className="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-black uppercase text-slate-500">
                      Totais por Cartão em {selectedMonth} (Toque na bolinha para mudar a cor)
                    </span>
                    <span className="text-xs font-black text-slate-800">
                      Total Geral: {formatBRL(Object.values(totalsByBank).reduce((a, b) => a + b, 0))}
                    </span>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {banksList.map(bName => {
                      const bColor = getBankColor(bName);
                      const bTotal = totalsByBank[bName] || 0;
                      return (
                        <div
                          key={bName}
                          style={{ backgroundColor: `${bColor}15`, borderColor: bColor }}
                          className="flex items-center gap-2 px-3 py-1.5 rounded-xl border-2"
                        >
                          <input
                            type="color"
                            value={bColor}
                            title={`Mudar cor do ${bName}`}
                            onChange={e => updateBankColor(bName, e.target.value)}
                            className="w-5 h-5 rounded-full"
                          />
                          <div>
                            <div style={{ color: bColor }} className="text-[10px] font-black uppercase leading-none">
                              {bName}
                            </div>
                            <div className="text-xs font-black text-slate-900">
                              {formatBRL(bTotal)}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setShowImportModal(true)}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-xs py-3 px-4 rounded-2xl shadow flex items-center justify-center gap-2"
                  >
                    📥 Importar PDF da Fatura
                  </button>
                  <button
                    onClick={() => setShowManualModal(true)}
                    className="bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-xs py-3 px-4 rounded-2xl shadow flex items-center justify-center gap-2"
                  >
                    ➕ Novo Lançamento Manual
                  </button>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 space-y-2">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="text-xs font-black uppercase text-amber-600">
                      ⏳ Pendentes de Identificação ({pendingTransactions.length})
                    </h3>
                  </div>

                  {pendingTransactions.length === 0 ? (
                    <p className="text-xs text-slate-400 text-center py-3">
                      Tudo identificado neste mês! 🎉
                    </p>
                  ) : (
                    pendingTransactions.map(tx => {
                      const bankColor = getBankColor(tx.bank);
                      return (
                        <TransactionRow
                          key={tx.id}
                          tx={tx}
                          bankColor={bankColor}
                          members={currentGroup.members || []}
                          onAssign={assignTransactionOwner}
                          onDelete={async (id) => {
                            await saveGroupData({
                              transactions: (currentGroup.transactions || []).filter(t => t.id !== id)
                            });
                          }}
                        />
                      );
                    })
                  )}
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 space-y-2">

      const [showSplit, setShowSplit] = useState(false);
      const [splitSelection, setSplitSelection] = useState(tx.splitIds || []);

      return (
        <div
          style={{ borderLeft: `6px solid ${bankColor}`, backgroundColor: `${bankColor}0A` }}
